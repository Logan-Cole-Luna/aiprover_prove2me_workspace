# AIProver harness configuration for the orchestration solvers.
# Read by ../PartitionAndProve/AIProver_plugin (bin/aiprover) through $AIPROVER_CONFIG.
# The model is the local vLLM server of scripts/serve_local.sh; replace api_base and
# model to drive the harness with another OpenAI-compatible endpoint.

[endpoint]
mode = "direct"
api_base = "http://127.0.0.1:8000/v1"
api_key = "EMPTY"
model = "qwen3-4b-instruct"
# Unused in direct mode; present because the CLI reads every endpoint key.
ssh_host = ""
ssh_user = ""
ssh_port = 22
remote_host = "127.0.0.1"
remote_port = 8000
server_handoff = ""
control_socket = ""
ssh_options = []
local_port = 18555

[runtime]
work_root = "~/workspace/orchestration/aiprover/work"
# Concurrent harness rollouts; each holds a Lean server (~1.5 GB) and one model session.
max_parallel = 2
timeout_sec = 1800
max_turns = 100

[paths]
# Lean v4.23.0 + Mathlib v4.23.0 + REPL (the JiatuBook evaluation environment).
lean_project = "~/workspace/autoformalization-jtemb/tmpFolder/8d9a729d-dec6-452d-bb90-d63be139ee52/TmpProjDir"
elan_home = "~/.elan"
vibe_venv = "~/workspace/orchestration/aiprover/venv_vibe"
mcp_venv = "~/workspace/orchestration/aiprover/venv_mcp"
rg_dir = "~/workspace/orchestration/aiprover/bin"
