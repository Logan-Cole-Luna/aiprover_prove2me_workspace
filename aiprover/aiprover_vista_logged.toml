# AIProver harness configuration: AIProver model on TACC Vista, reached through
# the reasoning proxy (server/reasoning_proxy.py, 127.0.0.1:18565), which
# forwards to the SSH tunnel of aiprover_vista.toml and records the model's
# reasoning per session. The tunnel itself is opened with aiprover_vista.toml
# (`aiprover tunnel up`); this file only directs the harness to the proxy.

[endpoint]
mode = "direct"
ssh_host = "vista.tacc.utexas.edu"
ssh_user = "loganluna"
ssh_port = 22
control_socket = "~/.ssh/vista.sock"
ssh_options = []
server_handoff = "/scratch/11757/loganluna/servers/aiprover_server.txt"
# Fallback address when the handoff file is unreadable (empty = none).
remote_host = ""
remote_port = 8060
local_port = 18555
# The proxy; ssh_* and port keys above are unused in direct mode.
api_base = "http://127.0.0.1:18565/v1"
api_key = "EMPTY"
# Served model id; empty = the first id /v1/models reports.
model = "aiprover"

[runtime]
work_root = "~/workspace/aiprover_prove2me_workspace/aiprover/work"
# Concurrent rollouts on this machine, across all runs; each holds a Lean
# server (~1.5 GB) and peaks near 5 GB while compiling (VM: 32 cores, 125 GB).
max_parallel = 16
# Champion measurement settings (100 turns / 5400 s); the harness derives its
# time fences from timeout_sec.
timeout_sec = 5400
max_turns = 100

[paths]
# Lean v4.23.0 + Mathlib v4.23.0 (37df177) + REPL + cslib.
lean_project = "~/workspace/lean_projects/TmpProjDir"
elan_home = "~/.elan"
vibe_venv = "~/workspace/aiprover_prove2me_workspace/aiprover/venv_vibe"
mcp_venv = "~/workspace/aiprover_prove2me_workspace/aiprover/venv_mcp"
rg_dir = "~/workspace/aiprover_prove2me_workspace/aiprover/bin"

[helpers]
# expand / backtranslate / ask: "auto" uses claude -p inside Claude Code and
# the AIProver server otherwise.
backend = "auto"
claude_model = ""
codex_sandbox = "read-only"
timeout_sec = 900
