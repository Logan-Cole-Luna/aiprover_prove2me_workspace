<title>bounding_ite_base proof run</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eceef3;
  --ink: #161b26;
  --muted: #586176;
  --line: #d8dce4;
  --accent: #3a46b8;
  --accent-soft: #e4e6f7;
  --captain: #3a46b8;
  --auditor: #9b3f7e;
  --solver: #0b7a70;
  --lean: #8a6a1f;
  --ok: #1e7b45;
  --ok-soft: #dcefe3;
  --fail: #b4322b;
  --fail-soft: #f6dedc;
  --warn: #9a6200;
  --warn-soft: #f5e8cf;
  --code-bg: #f7f8fb;
  --err-line: #fbe6e4;
  --kw: #3a46b8;
  --cm: #6f7788;
  --str: #0b7a70;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-prose: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --font-mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1218; --surface: #171b24; --surface-2: #202533; --ink: #e5e8ef;
    --muted: #9aa3b5; --line: #2d3342; --accent: #939cf3; --accent-soft: #252a4a;
    --captain: #939cf3; --auditor: #da8cc1; --solver: #4fc7b8; --lean: #d4b366;
    --ok: #5cc98a; --ok-soft: #173325; --fail: #f07b71; --fail-soft: #3a1c1b;
    --warn: #e2ab44; --warn-soft: #3a2c12; --code-bg: #12151c; --err-line: #3a1c1b;
    --kw: #a5adf6; --cm: #7d8698; --str: #62cfc1;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1218; --surface: #171b24; --surface-2: #202533; --ink: #e5e8ef;
  --muted: #9aa3b5; --line: #2d3342; --accent: #939cf3; --accent-soft: #252a4a;
  --captain: #939cf3; --auditor: #da8cc1; --solver: #4fc7b8; --lean: #d4b366;
  --ok: #5cc98a; --ok-soft: #173325; --fail: #f07b71; --fail-soft: #3a1c1b;
  --warn: #e2ab44; --warn-soft: #3a2c12; --code-bg: #12151c; --err-line: #3a1c1b;
  --kw: #a5adf6; --cm: #7d8698; --str: #62cfc1;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  margin: 0;
}
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; }
h2 { font-size: 1.6rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
code, pre, .mono { font-family: var(--font-mono); font-size: 0.84em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; }

/* Page frame ---------------------------------------------------------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
}
.topbar .run { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }
.topbar .thm { font-weight: 600; font-family: var(--font-mono); font-size: 0.95rem; }
.topbar .spacer { flex: 1; }
.frame {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  gap: 32px;
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 28px 96px;
}
nav.chapters {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 2px;
  counter-reset: chapter;
}
nav.chapters button {
  display: grid;
  grid-template-columns: 26px 1fr;
  align-items: baseline;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 6px;
  padding: 7px 10px;
  cursor: pointer;
  color: var(--muted);
}
nav.chapters button .n { font-family: var(--font-mono); font-size: 0.78rem; }
nav.chapters button:hover { background: var(--surface-2); color: var(--ink); }
nav.chapters button[aria-current="step"] {
  background: var(--accent-soft);
  color: var(--ink);
  font-weight: 600;
}
main { min-width: 0; }
.chapter { display: flex; flex-direction: column; gap: 22px; max-width: 900px; }
.eyebrow {
  font-size: 0.74rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
.lead { font-size: 1.05rem; color: var(--ink); }
.muted { color: var(--muted); }
.stepper {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 15;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.stepper .where { font-size: 0.85rem; color: var(--muted); min-width: 12ch; text-align: center; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }

/* Building blocks ----------------------------------------------------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 2px 9px;
  border-radius: 999px;
  white-space: nowrap;
}
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.fail { background: var(--fail-soft); color: var(--fail); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.role { font-weight: 600; }
.role.captain { color: var(--captain); }
.role.auditor { color: var(--auditor); }
.role.solver { color: var(--solver); }
.role.lean { color: var(--lean); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.captain { background: var(--captain); }
.dot.auditor { background: var(--auditor); }
.dot.solver { background: var(--solver); }
.dot.lean { background: var(--lean); }
.dot.decision { background: var(--muted); }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.stat { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 0.78rem; color: var(--muted); }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.algo { display: grid; grid-template-columns: minmax(0, 620px) minmax(220px, 1fr); gap: 16px; align-items: start; }
.prose { font-family: var(--font-prose); font-size: 1.02rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.prose math[display="block"] { margin: 0.5em 0; overflow-x: auto; }
.prose code { font-size: 0.8em; background: var(--surface-2); padding: 0 4px; border-radius: 3px; }
.prose .intertext { display: block; }
.prose ul { margin: 0.25em 0; padding-left: 1.4em; white-space: normal; }
.prose li { white-space: pre-wrap; }
.prose pre.tex { margin: 0.5em 0; white-space: pre-wrap; font-size: 0.85rem; }

pre.lean {
  margin: 0;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 0;
  overflow: auto;
  max-height: 460px;
  font-size: 0.8rem;
  line-height: 1.5;
}
pre.lean.tall { max-height: 640px; }
pre.lean .line { display: block; padding-inline: 12px 16px; white-space: pre; }
pre.lean .line .no {
  display: inline-block;
  width: 3.2ch;
  margin-right: 12px;
  text-align: right;
  color: var(--cm);
  user-select: none;
  opacity: 0.7;
}
pre.lean .line.err { background: var(--err-line); }
pre.lean .kw { color: var(--kw); font-weight: 600; }
pre.lean .cm { color: var(--cm); font-style: italic; }
pre.lean .st { color: var(--str); }
pre.lean .sorry { color: var(--warn); font-weight: 600; background: var(--warn-soft); border-radius: 3px; }
pre.plain {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 0.8rem;
  max-height: 460px;
  overflow: auto;
}
pre.plain.errors { border-color: var(--fail); color: var(--fail); }
.placeholder { color: var(--accent); font-weight: 600; }

.tagblock { display: flex; flex-direction: column; gap: 4px; }
.tagname { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }

details.fold { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.fold > summary {
  cursor: pointer;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  align-items: baseline;
  list-style: none;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; color: var(--muted); width: 1ch; }
details.fold[open] > summary::before { content: "▾"; }
details.fold > .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }

.md h1, .md h2, .md h3, .md h4 { font-size: 1rem; margin-top: 0.6em; }
.md p, .md li { max-width: 72ch; }
.md ul { margin: 0; padding-left: 1.3em; }
.md code { background: var(--surface-2); padding: 0 4px; border-radius: 3px; }
.md { display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; }

/* Step list ------------------------------------------------------------ */
.steps { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.steprow {
  display: grid;
  grid-template-columns: 44px 58px 18px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 8px 12px;
  border: 0;
  border-top: 1px solid var(--line);
  background: none;
  text-align: left;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.steprow:first-child { border-top: 0; }
.steprow:hover { background: var(--surface-2); }
.steprow .idx { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.steprow .t { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.steprow .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steprow .what .lbl { font-family: var(--font-mono); font-size: 0.82rem; }
.steplink {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 4px;
  padding: 0 5px;
  cursor: pointer;
  color: var(--accent);
}
.steplink:hover { border-color: var(--accent); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 3px 11px;
  font-size: 0.82rem;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Algorithm diagram ----------------------------------------------------- */
.diagram-wrap { overflow-x: auto; }
svg.flow { width: 100%; max-width: 620px; min-width: 520px; height: auto; display: block; }
svg.flow .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
svg.flow .node { cursor: pointer; }
svg.flow .node:hover rect, svg.flow .node:focus-visible rect { stroke: var(--accent); }
svg.flow .node.sel rect { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
svg.flow .node:focus { outline: none; }
svg.flow text { fill: var(--ink); font-family: var(--font-ui); }
svg.flow .title { font-size: 14px; font-weight: 600; }
svg.flow .actor { font-size: 11.5px; }
svg.flow .count { font-size: 11px; fill: var(--muted); font-family: var(--font-mono); }
svg.flow .edge { stroke: var(--muted); stroke-width: 1.3; fill: none; }
svg.flow .edge.loop { stroke-dasharray: 4 3; }
svg.flow .elabel { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
svg.flow .elabel.hot { cursor: pointer; fill: var(--accent); text-decoration: underline; }
svg.flow .arrowhead { fill: var(--muted); }
svg.flow .c-captain { fill: var(--captain); }
svg.flow .c-auditor { fill: var(--auditor); }
svg.flow .c-solver { fill: var(--solver); }
svg.flow .c-lean { fill: var(--lean); }
svg.flow .c-data { fill: var(--muted); }

table.kv { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.kv th, table.kv td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
table.kv th { font-weight: 500; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; border-top: 0; }
table.kv td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.phasebar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.phasebar div {
  display: flex; align-items: center; justify-content: center;
  font-size: 0.74rem; font-weight: 500; white-space: nowrap; overflow: hidden;
  color: var(--surface); min-width: 2px;
}
.ph-formalize { background: var(--captain); }
.ph-sketch { background: var(--auditor); }
.ph-prove { background: var(--solver); }
.ph-assemble { background: var(--lean); }
.phaselegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--muted); }
.phaselegend span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.phaselegend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

dl.gloss { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
dl.gloss dt { font-weight: 600; font-family: var(--font-mono); font-size: 0.86rem; }
dl.gloss dd { margin: 0; max-width: 64ch; }

.lemma { display: flex; flex-direction: column; gap: 8px; }
.lemma .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.lemma .head .name { font-family: var(--font-mono); font-weight: 600; }

.checks { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.check { display: grid; grid-template-columns: 22px 170px 1fr; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.check:first-child { border-top: 0; }
.check .mark { font-weight: 700; }
.check .mark.ok { color: var(--ok); }
.check .mark.fail { color: var(--fail); }
.check .name { font-family: var(--font-mono); font-size: 0.85rem; }

/* Solver timeline -------------------------------------------------------- */
.gantt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.gantt { min-width: 680px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 10px; }
.g-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; }
.g-row .lab { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }
.g-track { position: relative; height: 26px; }
.g-track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line); }
.g-group { display: flex; flex-direction: column; gap: 2px; }
.g-group .gh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-bottom: 2px; }
.g-group .gh .name { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; }
.bar {
  position: absolute;
  top: 4px;
  height: 18px;
  border-radius: 3px;
  border: 1px solid transparent;
  padding: 0 4px;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  line-height: 16px;
  color: var(--surface);
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  min-width: 6px;
}
.bar.ok { background: var(--ok); }
.bar.fail { background: var(--fail); }
.bar.rejected { background: var(--warn); }
.bar.pending { background: var(--muted); }
.bar.win { background: var(--ok); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ok); }
.bar.late {
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 4px, var(--surface) 4px 8px);
  border: 1px dashed var(--muted);
  color: var(--muted);
}
.bar:hover, .bar:focus-visible { filter: brightness(1.12); z-index: 2; }
.winline { position: absolute; top: -2px; bottom: -2px; border-left: 2px solid var(--ok); pointer-events: none; }
.g-axis { position: relative; height: 18px; }
.g-axis span {
  position: absolute; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend .sw { width: 18px; height: 10px; border-radius: 2px; display: inline-block; position: relative; }

/* Step drawer ------------------------------------------------------------ */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 18, 0.35); z-index: 40; }
aside.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(780px, 100%);
  z-index: 50;
  background: var(--bg);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  transition: transform 180ms ease;
}
aside.drawer[hidden] { display: none !important; }
.drawer-head {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.drawer-head .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.drawer-head .row .spacer { flex: 1; }
.drawer-head h3 { font-family: var(--font-mono); font-size: 0.98rem; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 500; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.tabs button {
  background: none; border: 0; padding: 7px 12px; cursor: pointer;
  border-bottom: 2px solid transparent; color: var(--muted); font-size: 0.9rem;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.note { font-size: 0.86rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; max-width: 70ch; }

@media (max-width: 900px) {
  .frame { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 14px 96px; }
  nav.chapters {
    position: static;
    flex-direction: row;
    overflow-x: auto;
    gap: 4px;
    padding-bottom: 4px;
  }
  nav.chapters button { grid-template-columns: auto auto; gap: 6px; white-space: nowrap; }
  .two, .algo { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .topbar { padding: 8px 16px; }
  .frame { padding-inline: 16px; }
  .check { grid-template-columns: 22px 1fr; }
  .check .desc { grid-column: 2; }
  .steprow { grid-template-columns: 38px 18px minmax(0, 1fr) auto; }

const TRACE = {"run_id": "aiprover_000004_haiku_qwen", "problem": {"uuid": "JiatuBook_BoundedArithmetic_000004", "source_name": "JiatuBook", "source_subset": "BoundedArithmetic", "raw_source_path": "JiatuBook/Jiatu_s_Book_on_Bounded_Arithmetic/02-PV.tex", "informal_statement": "Setting: Working in Cook's equational theory $\\PV$ (a polynomial-time equational theory). The base sort is finite Boolean strings $\\zo^* = \\{0,1\\}^*$ with constant $\\eps$ (empty string), unary successors $s_0, s_1$ (append a 0 or a 1 to the right), binary concatenation $\\circ$, smash $\\#$, trim-right $\\TR$, and iterated trim $\\ITR$. The defining axioms are $x \\circ \\eps = x$, $x \\circ s_i(y) = s_i(x \\circ y)$, $\\TR(\\eps) = \\eps$, $\\TR(s_i(x)) = x$, $\\ITR(x, \\eps) = x$, $\\ITR(x, s_i(y)) = \\TR(\\ITR(x, y))$, $x \\# \\eps = \\eps$, $x \\# s_i(y) = x \\circ (x \\# y)$ ($i \\in \\{0,1\\}$). New functions are introduced by composition or by limited recursion on notation, the latter requiring an order-$(i-1)$ $\\PV$ proof of $\\ITR(h_i(\\vec x, y, z), z \\circ k_i(\\vec x, y)) = \\eps$. Equations are derived using (L0) reflexivity, (L1) symmetry, (L2) transitivity, (L3) congruence, (L4) substitution, the definition axioms, and the structural-induction rule: from $f_j(\\vec x, \\eps) = g(\\vec x)$ and $f_j(\\vec x, s_i(y)) = h_i(\\vec x, y, f_j(\\vec x, y))$ ($i \\in \\{0,1\\}$, $j \\in \\{1,2\\}$) infer $f_1(\\vec x, y) = f_2(\\vec x, y)$. The standard model is denoted $\\M$; $t^\\M$ is the interpretation of term $t$ in $\\M$. $\\FP$ is the class of polynomial-time computable functions. $\\calF, \\calF'$ are Cobham's class and its variant (with the modified bound $|h_i(\\vec x, y, z)| \\le |z \\circ k_i(\\vec x, y)|$).\n\nProposition (book label `prop: bounding ite base`).\n\n$\\PV\\vdash f_1(z,\\eps) = \\eps$.", "informal_proof": "We need to prove in $\\PV$ that $\\ITR(\\eps,z\\circ \\eps) = \\eps$. Notice that $z\\circ \\eps = z$, and thus by applying (L3) on the function $w\\mapsto \\ITR(\\eps,w\\circ\\eps)$ we know that $\\ITR(\\eps, z\\circ\\eps)=\\ITR(\\eps,z)$. By transitivity, we only need to prove in $\\PV$ that  \n    \\begin{equation}\n        \\ITR(\\eps,x) = \\eps. \n    \\end{equation}\n    It can be proved using the rule of structural induction. Concretely, we will define functions $f_3(x) = \\ITR(\\eps, x)$ and $f_4(x) = \\eps$, and prove that both of them can be constructed by recursion from $g = \\eps$, $h_i(x,z)=\\TR(z)$. The details are omitted and left as an exercise."}, "theorem_name": "bounding_ite_base", "models": {"orchestrator": "claude-haiku-4-5-20251001", "worker": "qwen3-4b-instruct"}, "agents": {"captain": {"backend": "claude_cli", "model": "claude-haiku-4-5-20251001", "effort": "", "timeout": 2400}, "auditor": {"backend": "openai_compatible", "model": "qwen3-4b-instruct", "base_url": "http://127.0.0.1:8000/v1", "api_key_env": "", "temperature": 0.7, "top_p": 0.8, "max_tokens": 4096, "timeout": 900, "extra_body": {}}, "solver": {"backend": "aiprover", "model": "qwen3-4b-instruct", "config": "aiprover/aiprover.toml", "cli": "../PartitionAndProve/AIProver_plugin/bin/aiprover", "timeout": 1200, "max_turns": 100, "env": {"AGENT_THINKING": "off", "AGENT_TEMPERATURE": "0.7", "VIBE_MODELS": "{\"leanstral\": {\"name\": \"qwen3-4b-instruct\", \"provider\": \"local-vllm\", \"alias\": \"leanstral\", \"thinking\": \"off\", \"temperature\": 0.7, \"auto_compact_threshold\": 18000}}"}}}, "config": {"agents": {"captain": {"backend": "claude_cli", "model": "claude-haiku-4-5-20251001", "timeout": 2400}, "auditor": {"backend": "openai_compatible", "model": "qwen3-4b-instruct", "base_url": "http://127.0.0.1:8000/v1", "temperature": 0.7, "top_p": 0.8, "max_tokens": 4096}, "solver": {"backend": "aiprover", "model": "qwen3-4b-instruct", "config": "aiprover/aiprover.toml", "cli": "../PartitionAndProve/AIProver_plugin/bin/aiprover", "timeout": 1200, "max_turns": 100, "env": {"AGENT_THINKING": "off", "AGENT_TEMPERATURE": "0.7", "VIBE_MODELS": "{\"leanstral\": {\"name\": \"qwen3-4b-instruct\", \"provider\": \"local-vllm\", \"alias\": \"leanstral\", \"thinking\": \"off\", \"temperature\": 0.7, \"auto_compact_threshold\": 18000}}"}}}, "workers": 2, "max_repairs": 4, "max_replans": 1, "max_audit_rounds": 2, "lean_parallel": 4, "lean_timeout": 300}, "algorithm": [{"stage": "formalize", "actor": "captain (orchestrator model)", "description": "Translate the informal statement into Lean 4 definitions and a theorem statement ending in `sorry`. The file is compiled; Lean errors are returned to the captain for repair."}, {"stage": "formalize", "actor": "auditor (worker model)", "description": "Write a blind read-back of the Lean code, seeing only the code and the prove2me auditor playbook, never the source."}, {"stage": "formalize", "actor": "captain (orchestrator model)", "description": "Compare the read-back with the source statement and proof; verdict FAITHFUL continues, REVISE returns to formalization."}, {"stage": "sketch", "actor": "captain (orchestrator model)", "description": "Decompose the proof: lemmas stated in full and left as `sorry`, plus a sorry-free proof of `solution` from them. The sketch must compile."}, {"stage": "prove", "actor": "solvers (worker model, parallel)", "description": "Each lemma is attacked by several independent solver chains. A chain proposes a proof, receives Lean errors, and repairs; the first proof that compiles is kept and the other chains stop."}, {"stage": "sketch", "actor": "captain (orchestrator model)", "description": "If a lemma is not proved within budget, the captain revises the sketch; proved lemmas with unchanged statements are reused."}, {"stage": "assemble", "actor": "Lean", "description": "Splice proofs into the sketch and verify: compiles, no `sorry`, only standard axioms, and the solution's type equals the target theorem's type (checked in a module importing both)."}], "lean_environment": {"toolchain": "leanprover/lean4:v4.23.0", "mathlib": "37df177aaa770670452312393d4e84aaad56e7b6", "file_header": "import Mathlib\nset_option autoImplicit false\n\n"}, "system_prompts": {"captain": "You are the captain of a Lean 4 formalization mission. You formalize mathematics faithfully, audit formalizations against their source, and decompose proofs into lemmas that are delegated to solver agents.\n\nLean environment: Lean 4 v4.23.0 with Mathlib (v4.23.0), `import Mathlib` and `set_option autoImplicit false` are already in the file header. Do not write `import` lines.\n\nFaithfulness principles (from the prove2me captain playbook):\n1. Read the whole setting, not just the theorem. Every standing assumption of the setting is part of the statement or of the definitions.\n2. Match hypotheses and conclusions in both directions. A fact the source proves is never a hypothesis.\n3. Quantify over exactly the source's objects.\n4. Evaluate the statement at edge inputs; a statement that holds only vacuously is wrong even though it is provable.\n5. Definitions first: a wrong definition makes every theorem using it wrong.\n6. Proof difficulty is not your concern when stating a theorem; never weaken a statement to make it easier to prove.\n7. When the source asserts derivability in a formal theory (T ⊢ φ), formalize the theory's proof system as an inductive derivability relation over a syntax of terms or formulas. Proving that φ holds in a model is a different, weaker theorem.\n\nReply only in the tagged format requested by each message. Put Lean code inside the tags without Markdown fences.", "auditor": "# Role: Mission Auditor — Writing Read-backs\n\nA **read-back** is a natural-language rendering of what a Lean 4 declaration *literally asserts* — the artifact's own testimony. A read-back is not a summary and not an explanation. Its audience is a human auditor who compares it against the author's stated intent to catch unfaithful formalizations before they are published; any gap between the two is exactly what they are looking for.\n\nRead-backs are attached to draft theorem/definition items in a mission proposal (see [mission_captain.md](mission_captain.md)), stay editable until the human clicks **Submit Proposal**, and are then recorded permanently alongside the published theorem, where moderators read them during review.\n\n## Independence is the point\n\nA read-back is only useful if it is written blind. If you are the mission captain, do not write your own read-backs — launch an **independent sub-agent** with a fresh context, and give it *only*:\n\n- the Lean code of the declaration: its `formal_statement` (or the definition's code), plus the `preamble` it depends on;\n- this file.\n\nNever give the auditor the informal statement, the source material, the mission pitch, or your own intent. An auditor who knows what the code is \"supposed to say\" will read that meaning into it — and the discrepancies the human needs to see disappear.\n\n## The principles\n\nYou are writing a **read-back** for a Lean 4 declaration: a natural-language rendering of what the code literally asserts. Follow these principles:\n\n1. **Translate the code, not the intent.** State only what the Lean statement actually says. Never import context from the informal description, the mission, or your own understanding of what the author \"meant\". If the code says less than the intent, your read-back must say less.\n\n2. **Account for every binder and hypothesis.** Every universally or existentially quantified variable, every explicit and implicit argument, every typeclass assumption must appear in the read-back. Omitting a hypothesis is the worst failure mode.\n\n3. **Expand non-standard definitions.** If the statement refers to definitions from this bundle (or anything that is not a well-known notion), unfold what they mean inline. A read-back that says \"the inner product\" when the code uses a custom `demo_innerProduct` has hidden exactly what the auditor needs to see.\n\n4. **Surface degenerate and edge cases.** Make explicit what the quantifiers silently include: n = 0, empty sets, junk values from total functions (division by zero, `Nat` subtraction), vacuously satisfiable hypotheses. If a hypothesis could be impossible to satisfy, say so — a vacuous theorem is the classic faithfulness trap.\n\n5. **Preserve logical precision.** Keep the exact strength of every connective: ≤ vs <, ∃ vs ∃!, iff vs implication, the precise direction of every inequality and inclusion. Do not round to the \"morally equivalent\" claim.\n\n6. **Write for a mathematician who does not read Lean.** Plain mathematical English, standard notation where it helps. Try not to mention Lean syntax. Write in **Markdown+KaTex**; use lists and display blocks to make it clear. Avoid using sem-Lean ASCII. More importantly, use real math notation instead of Lean syntax. For example, write $P_i$ instead of P i; write $A^{m, n}$ instead of A m n.\n\n7. **No judgment, no advocacy.** Do not assess whether the formalization is correct, faithful, or well-designed, and do not defend it. Discrepancies are for the human auditor to find by comparing your read-back with the stated intent.\n\n\n## Format of read-back\n\nYour read-back should adhere to the following standard.\n\n1. **One self-contained paragraph per declaration.** The read-back must be understandable without opening the source file. Prefer completeness over elegance; this is fine print, not prose.\n\n2. **Escape every LaTeX backslash in the JSON payload.** JSON forbids a raw backslash in a string, so write `\\\\mu`, `\\\\frac`, `\\\\ge` in the request body; the platform stores and renders them as `\\mu`, `\\frac`, `\\ge`. A single raw backslash (e.g. `\"$\\mu$\"` typed literally) makes the whole request fail with a JSON parse error like `Bad escaped character in JSON`. Every example in this file is written in this payload form (`\\\\ge`, `\\\\nu`); the platform renders them with single backslashes.\n\n3. Use standard mathematical notation and KaTeX. Replace unreadable Lean expressions such as `banditMeasure ν π n` with conventional notation `$B_{\\\\nu,\\\\pi}^n$` and explain their meaning.\n\n4. Give context for every variable and symbol in the theorem.\n\n5. Use display-math block properly to increase readability.\n\n6. Use paragraph breaks properly for readability.\n\n## Attaching the read-back\n\nThe captain attaches the auditor's output to the draft item via the `readback` field, with `readback_model` naming the model that wrote it (e.g. `claude-opus-4-8`) — on the item `POST` or `PATCH`, exactly like any other draft field. See **Read-backs** in [mission_captain.md](mission_captain.md) for the endpoint mechanics. Read-backs apply to draft `theorem`/`definition` items only — `reference` items point at already-published content and take none.\n\nRe-run the auditor after any edit to the Lean statement: a read-back of an older version of the code is worse than none, because it testifies about the wrong artifact.\n", "solver": "You are a Lean 4 proof engineer on a formalization mission. You prove one lemma at a time.\n\nLean environment: Lean 4 v4.23.0 with Mathlib (v4.23.0), `import Mathlib` and `set_option autoImplicit false` are already in the file header. Do not write `import` lines.\n\nRules that gate every submission:\n1. Do not change the lemma statement; you write only its proof.\n2. No `sorry`, `admit`, `axiom`, `opaque`, `native_decide`, macros or other ways of bypassing the kernel.\n3. Helper lemmas are allowed; each helper name must start with the target lemma name followed by `_`.\n\nReply only in the tagged format requested. Put Lean code inside the tags without Markdown fences."}, "prompt_templates": {"AIPROVER_LEMMA_TEMPLATE": "Prove the lemma `{lemma_name}`, whose Lean statement is fixed below. It is one step in the proof of the following result; the Lean definitions in the Setting encode that result's objects and rules, and the earlier lemmas given there may be used as facts.\n\n{informal_statement}", "AUDITO \TR(\\ITR(x, y))$, $x \\# \\eps = \\eps$, $x \\# s_i(y) = x \\circ (x \\# y)$ ($i \\in \\{0,1\\}$). New functions are introduced by composition or by limited recursion on notation, the latter requiring an order-$(i-1)$ $\\PV$ proof of $\\ITR(h_i(\\vec x, y, z), z \\circ k_i(\\vec x, y)) = \\eps$. Equations are derived using (L0) reflexivity, (L1) symmetry, (L2) transitivity, (L3) congruence, (L4) substitution, the definition axioms, and the structural-induction rule: from $f_j(\\vec x, \\eps) = g(\\vec x)$ and $f_j(\\vec x, s_i(y)) = h_i(\\vec x, y, f_j(\\vec x, y))$ ($i \\in \\{0,1\\}$, $j \\in \\{1,2\\}$) infer $f_1(\\vec x, y) = f_2(\\vec x, y)$. The standard model is denoted $\\M$; $t^\\M$ is the interpretation of term $t$ in $\\M$. $\\FP$ is the class of polynomial-time computable functions. $\\calF, \\calF'$ are Cobham's class and its variant (with the modified bound $|h_i(\\vec x, y, z)| \\le |z \\circ k_i(\\vec x, y)|$).\n\nProposition (book label `prop: bounding ite base`).\n\n$\\PV\\vdash f_1(z,\\eps) = \\eps$.\n<\/informal_statement>\n\n<informal_proof>\nWe need to prove in $\\PV$ that $\\ITR(\\eps,z\\circ \\eps) = \\eps$. Notice that $z\\circ \\eps = z$, and thus by applying (L3) on the function $w\\mapsto \\ITR(\\eps,w\\circ\\eps)$ we know that $\\ITR(\\eps, z\\circ\\eps)=\\ITR(\\eps,z)$. By transitivity, we only need to prove in $\\PV$ that  \n    \\begin{equation}\n        \\ITR(\\eps,x) = \\eps. \n    \\end{equation}\n    It can be proved using the rule of structural induction. Concretely, we will define functions $f_3(x) = \\ITR(\\eps, x)$ and $f_4(x) = \\eps$, and prove that both of them can be constructed by recursion from $g = \\eps$, $h_i(x,z)=\\TR(z)$. The details are omitted and left as an exercise.\n<\/informal_proof>\n\nProduce:\n- <definitions>: every definition the statement needs (syntax, axioms, inference rules, auxiliary functions). Only `inductive`, `structure`, `def`, `abbrev`, `namespace`/`end`, `open` and `notation` declarations; no     return `<span class="line${errorLines.has(n) ? " err" : ""}" data-line="${n}"><span class="no">${n}</span>${parts.join("")}</span>`;
  }).join("");
  return `<pre class="lean ${extraClass}"><code>${body}</code></pre>`;
}

const errorLinesOf = errors => new Set((errors || []).flatMap(e =>
  [...String(e).matchAll(/\.lean:(\d+):\d+:/g)].map(m => Number(m[1]))));

const TEX_MACROS = {
  "\\PV": "\\mathsf{PV}", "\\eps": "\\varepsilon", "\\zo": "\\{0,1\\}",
  "\\TR": "\\mathrm{TR}", "\\ITR": "\\mathrm{ITR}", "\\M": "\\mathcal{M}",
  "\\FP": "\\mathsf{FP}", "\\calF": "\\mathcal{F}",
};
// Display environments come first, so that inline math inside them (e.g. in
// \intertext) is rendered as part of the environment.
const MATH_SPAN = new RegExp([
  String.raw`\\begin\{(equation|align|gather|alignat|multline|eqnarray|prooftree)(\*?)\}([\s\S]+?)\\end\{\1\2\}`,
  String.raw`\$\$([\s\S]+?)\$\$`, String.raw`\\\[([\s\S]+?)\\\]`, String.raw`\$((?:[^$\n]|\n(?![ \t]*\n))+?)\$`,
].join("|"));
// KaTeX lacks these environments; each is rendered as the closest one it has.
const KATEX_ENVIRONMENT = { multline: "gather", eqnarray: "align" };

function texHTML(tex, display) {
  if (!window.katex) return `<code>${escapeHTML(display ? tex : "$" + tex + "$")}</code>`;
  try {
    return katex.renderToString(tex.trim(), {
      displayMode: display, output: "mathml", throwOnError: false,
      macros: { ...TEX_MACROS },
    });
  } catch (error) {
    return `<code>${escapeHTML(tex)}</code>`;
  }
}

// Index just past the group that opens at `text[open]` ("{"), or -1.
function closingBrace(text, open) {
  let depth = 0;
  for (let i = open; i < text.length; i++) {
    if (text[i] === "\\") { i++; continue; }
    if (text[i] === "{") depth++;
    else if (text[i] === "}" && --depth === 0) return i + 1;
  }
  return -1;
}

// A display environment; \intertext{...}, which KaTeX lacks, splits it into
// separate environments with the text between them.
function environmentHTML(name, star, body) {
  if (name === "prooftree") return `<pre class="tex"><code>${escapeHTML(body.trim())}</code></pre>`;
  const environment = (KATEX_ENVIRONMENT[name] || name) + star;
  const render = rows => rows.trim()
    ? texHTML(`\\begin{${environment}}${rows.replace(/\\label\{[^}]*\}/g, "")}\\end{${environment}}`, true)
    : "";
  let out = "", start = 0, at;
  while ((at = body.indexOf("\\intertext{", start)) !== -1) {
    const end = closingBrace(body, at + "\\intertext".length);
    if (end === -1) break;
    out += render(body.slice(start, at).replace(/\\\\\s*$/, ""))
      + `<span class="intertext">${mathHTML(body.slice(at + "\\intertext{".length, end - 1))}</span>`;
    start = end;
  }
  return out + render(body.slice(start));
}

function inlineCode(text) {
  return escapeHTML(text).replace(/`([^`\n]+)`/g, "<code>$1</code>");
}

// Text-mode LaTeX of an informal statement (already HTML-escaped), as HTML:
// emphasis, sectioning, lists, theorem environments and spacing commands.
const THEOREM_ENVIRONMENTS = "theorem|lemma|proposition|corollary|definition|remark|example|claim|conjecture";
function textModeHTML(html) {
  const replaceGroups = (text, command, wrap) => {
    let out = "", start = 0, at;
    while ((at = text.indexOf(command + "{", start)) !== -1) {
      const end = closingBrace(text, at + command.length);
      if (end === -1) break;
      out += text.slice(start, at) + wrap(textModeHTML(text.slice(at + command.length + 1, end - 1)));
      start = end;
    }
    return out + text.slice(start);
  };
  for (const [command, wrap] of [
    ["\\textbf", s => `<strong>${s}</strong>`], ["\\emph", s => `<em>${s}</em>`],
    ["\\textit", s => `<em>${s}</em>`], ["\\texttt", s => `<code>${s}</code>`],
    ["\\paragraph", s => `<strong>${s}</strong>`], ["\\subparagraph", s => `<strong>${s}</strong>`],
    ["\\marginnote", s => ` (${s})`],
  ]) html = replaceGroups(html, command, wrap);
  return html
    .replace(/\\label\{[^{}]*\}\s*/g, "")
    .replace(/\\(eq)?ref\{([^{}]*)\}/g, (_, eq, label) => eq ? `(${label})` : label)
    .replace(/\\textcolor\{[^{}]*\}\{([^{}]*)\}/g, "$1")
    .replace(/\{\\(it|em|sl)\s+([^{}]*)\}/g, "<em>$2</em>")
    .replace(/\{\\bf\s+([^{}]*)\}/g, "<strong>$1</strong>")
    .replace(/\\(begingroup|endgroup|allowdisplaybreaks|noindent|medskip|smallskip|bigskip|newline)\b\s*/g, "")
    .replace(/\s*\\begin\{(itemize|compactitem|enumerate|compactenum)\}\s*/g, "<ul>")
    .replace(/\s*\\end\{(itemize|compactitem|enumerate|compactenum)\}\s*/g, "</ul>")
    .replace(/\s*\\item\s*/g, "<li>")
    .replace(new RegExp(String.raw`\\begin\{(${THEOREM_ENVIRONMENTS})\}(?:\[([^\]]*)\])?\s*`, "g"),
             (_, name, note) => `<strong>${name[0].toUpperCase() + name.slice(1)}${note ? ` (${note})` : ""}.</strong> `)
    .replace(new RegExp(String.raw`\s*\\end\{(${THEOREM_ENVIRONMENTS})\}`, "g"), "")
    .replace(/\\begin\{proof\}\s*/g, "<em>Proof.</em> ")
    .replace(/\s*\\end\{proof\}/g, " ∎")
    .replace(/\\\\(\[[^\]]*\])?[ \t]*(\n?)/g, (_, skip, newline) => newline || "\n")
    .replace(/(\S)~(?=\S)/g, "$1&nbsp;");
}

// Prose containing LaTeX math (inline, display and align-like environments),
// text-mode LaTeX and `code`. Math and code are set aside while the text-mode
// commands, which may span them, are converted.
function mathHTML(text) {
  const pieces = [];
  const keep = html => `\u0000${pieces.push(html) - 1}\u0000`;
  // A fresh pattern per call: \intertext renders its text with a nested call.
  const span = new RegExp(MATH_SPAN.source, "g");
  let prose = "", last = 0, match;
  while ((match = span.exec(text))) {
    prose += text.slice(last, match.index);
    prose += keep(match[1] ? environmentHTML(match[1], match[2], match[3])
                           : texHTML(match[4] ?? match[5] ?? match[6], match[6] === undefined));
    last = span.lastIndex;
  }
  prose += text.slice(last);
  const html = escapeHTML(prose.replace(/`([^`\n]+)`/g, (_, code) => keep(`<code>${escapeHTML(code)}</code>`)));
  return textModeHTML(html).replace(/\u0000(\d+)\u0000/g, (_, index) => pieces[index]);
}

// Minimal Markdown for the playbook-derived system prompts.
function markdownHTML(text) {
  const blocks = [];
  let list = null, para = [];
  const inline = s => inlineCode(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<em>$2</em>");
  const flushPara = () => { if (para.length) blocks.push(`<p>${inline(para.join(" "))}</p>`); para = []; };
  const flushList = () => { if (list) blocks.push(`<ul>${list.map(li => `<li>${inline(li)}</li>`).join("")}</ul>`); list = null; };
  for (const line of text.split("\n")) {
    const heading = line.match(/^(#{1,4})\s+(.*)/);
    const item = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (heading) { flushPara(); flushList(); blocks.push(`<h4>${inline(heading[2])}</h4>`); }
    else if (item) { flushPara(); (list ||= []).push(item[1]); }
    else if (!line.trim()) { flushPara(); flushList(); }
    else if (list) { list[list.length - 1] += " " + line.trim(); }
    else para.push(line.trim());
  }
  flushPara(); flushList();
  return `<div class="md">${blocks.join("")}</div>`;
}

const LEAN_TAGS = new Set(["definitions", "preamble", "statement", "lemmas", "main_proof",
  "proof", "helpers", "available_lemmas", "target_lemma", "previous_helpers",
  "previous_proof", "solution", "lean_code", "formal_statement", "previous_definitions",
  "previous_statement", "previous_lemmas", "previous_main_proof"]);
const PLAIN_TAGS = new Set(["lean_errors", "errors", "problems"]);

// A prompt or reply split into free text and <tag>...</tag> blocks.
function taggedHTML(text) {
  const parts = [];
  const pattern = /<([a-z_]+)>([\s\S]*?)<\/\1>/g;
  let last = 0, match;
  while ((match = pattern.exec(text))) {
    if (text.slice(last, match.index).trim()) parts.push({ prose: text.slice(last, match.index).trim() });
    parts.push({ tag: match[1], body: match[2].replace(/^\n+/, "").replace(/\s+$/, "") });
    last = pattern.lastIndex;
  }
  if (text.slice(last).trim()) parts.push({ prose: text.slice(last).trim() });
  return parts.map(part => {
    if (part.prose) return `<div class="prose">${mathHTML(part.prose)}</div>`;
    let body;
    if (!part.body) body = `<div class="muted">(empty)</div>`;
    else if (LEAN_TAGS.has(part.tag)) body = leanHTML(part.body);
    else if (PLAIN_TAGS.has(part.tag)) body = `<pre class="plain errors">${escapeHTML(part.body)}</pre>`;
    else body = `<div class="prose">${mathHTML(part.body)}</div>`;
    return `<div class="tagblock"><span class="tagname">&lt;${part.tag}&gt;</span>${body}</div>`;
  }).join("");
}

function templateHTML(text) {
  return `<pre class="plain">${escapeHTML(text).replace(/\{([a-z_]+)\}/g, '<span class="placeholder">{$1}</span>')}</pre>`;
}

// Step summaries ----------------------------------------------------------------

const EVENT_TEXT = {
  formalization_compiled: "Formalization compiles",
  formalization_rejected: "Formalization rejected",
  audit_verdict: "Audit verdict",
  sketch_accepted: "Sketch accepted",
  sketch_rejected: "Sketch rejected",
  lemma_proved: "Lemma proved",
  solver_attempt_rejected: "Attempt rejected before Lean",
  solver_budget_exhausted: "Solver chain exhausted its budget",
  replan: "Sketch revision requested",
  lemma_reused: "Proved lemma reused",
  lemma_handback: "Lemma handed back to the captain",
  final_verification: "Final verification",
};

function stepTitle(step) {
  if (step.kind === "model_call") {
    if (isJob(step)) return `AIProver job ${jobNumber(step)} · ${step.lemma}`;
    if (step.lemma != null) return `solver ${step.worker} · ${step.lemma} · round ${step.round}`;
    return `${step.role} · ${step.label}`;
  }
  if (step.kind === "lean_check") return `Lean check · ${step.file}`;
  return EVENT_TEXT[step.event] || step.event;
}

function stepResult(step) {
  if (step.kind === "model_call") {
    if (step.error) return `<span class="pill fail">error</span>`;
    if (step.lemma != null) {
      const { state } = solverOutcome(step);
      const label = state === "pending" && isJob(step) ? jobSummary(step)
        : { win: "proof kept", ok: "compiles", fail: "Lean errors",
            late: "after lemma proved", rejected: "rejected", pending: "no proof returned" }[state];
      const tone = { win: "ok", ok: "ok", fail: "fail", late: "neutral", rejected: "warn", pending: "neutral" }[state];
      return `<span class="pill ${tone}">${label}</span>`;
    }
    return `<span class="muted mono">${formatDuration(step.seconds || 0)}</span>`;
  }
  if (step.kind === "lean_check") {
    if (!step.ok) return `<span class="pill fail">${plural((step.errors || []).length, "error")}</span>`;
    return step.sorry_warning
      ? `<span class="pill warn">compiles · sorry</span>`
      : `<span class="pill ok">compiles</span>`;
  }
  if (step.event === "audit_verdict") {
    return `<span class="pill ${step.verdict === "FAITHFUL" ? "ok" : "fail"}">${escapeHTML(step.verdict)}</span>`;
  }
  if (step.event === "final_verification") {
    return `<span class="pill ${step.checks?.verified ? "ok" : "fail"}">${step.checks?.verified ? "verified" : "not verified"}</span>`;
  }
  if (step.event === "lemma_proved") return `<span class="pill ok">${escapeHTML(step.lemma)}</span>`;
  return "";
}

function stepRow(step) {
  const role = roleOf(step);
  return `<button class="steprow" type="button" data-step="${step.index}">
    <span class="idx">#${step.index}</span>
    <span class="t">${formatClock(step.elapsed_seconds)}</span>
    <span class="dot ${role}" title="${role}"></span>
    <span class="what"><span class="lbl">${escapeHTML(stepTitle(step))}</span></span>
    <span>${stepResult(step)}</span>
  </button>`;
}
const stepList = list => list.length
  ? `<div class="steps">${list.map(stepRow).join("")}</div>`
  : `<p class="muted">No steps of this kind in this run.</p>`;
const stepLink = step => step ? `<button class="steplink" type="button" data-step="${step.index}">#${step.index}</button>` : "";

const cfg = TRACE.config || {};
const outcome = TRACE.outcome || {};
const problem = TRACE.problem || {};
const totalCost = sum(calls.map(c => c.cost_usd));
const callsByRole = role => calls.filter(c => c.role === role);

// The proposition itself, without the shared setting paragraph.
function propositionText() {
  const paragraphs = (problem.informal_statement || "").split(/\n\s*\n/);
  return (paragraphs.length > 1 ? paragraphs.slice(1) : paragraphs).join("\n\n");
}

function lemmaUses(text, self) {
  return lemmaOrder.filter(name => name !== self && new RegExp(`(^|[^\\w'.])${name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![\\w'])`).test(text || ""));
}

// Step drawer --------------------------------------------------------------------------

let openStep = null;
let drawerOpen = false;
let drawerTab = "response";

// Tabs of the step drawer: `panels` is a list of [id, name, html]. The tab
// last chosen stays selected when the next drawer has it.
function tabsHTML(panels) {
  const active = panels.some(([id]) => id === drawerTab) ? drawerTab : panels[0][0];
  return `<div class="tabs" role="tablist">${panels.map(([id, name]) =>
      `<button type="button" role="tab" data-tab="${id}" aria-selected="${active === id}">${name}</button>`).join("")}</div>
    ${panels.map(([id, , html]) => `<div data-panel="${id}" ${active === id ? "" : "hidden"}>${html}</div>`).join("")}`;
}

// Lean output, one message per `file:line:col: severity:` header.
function diagnosticsHTML(text) {
  if (!text) return `<p class="muted">No diagnostics: Lean reported nothing for this file.</p>`;
  const html = escapeHTML(text).replace(/^(\S+\.lean:\d+:\d+: )(error|warning)(:.*)$/gm,
    (_, where, severity, rest) => `${where}<span class="${severity}">${severity}${rest}</span>`);
  return `<pre class="diag">${html}</pre>`;
}
const diagnosticErrorLines = text => new Set([...String(text || "").matchAll(/\.lean:(\d+):\d+: error/g)]
  .map(m => Number(m[1])));
const flagPill = (value, yes, no) => value == null ? ""
  : `<span class="pill ${value ? "ok" : "fail"}">${value ? yes : no}</span>`;

// The harness's Lean check of a sample's whole final file.
function harnessCheckHTML(check) {
  if (!check || !Object.keys(check).length) {
    return `<p class="muted">The harness's check of this sample is not recorded.</p>`;
  }
  return `
    <div class="checkline"><span class="k">AIProver harness · Lean check of the final file</span>
      ${check.verdict ? `<span class="pill ${check.verdict === "PASS" ? "ok" : "fail"}">${escapeHTML(check.verdict)}</span>` : ""}
      ${flagPill(check.compiles, "compiles", "does not compile")}
      ${flagPill(check.complete, "no sorry", "contains sorry")}
      ${check.axioms_used ? `<span class="pill neutral">axioms: ${escapeHTML(check.axioms_used.join(", ") || "none")}</span>` : ""}</div>
    ${(check.problems || []).length ? `<ul class="problems">${check.problems.map(p => `<li>${escapeHTML(p)}</li>`).join("")}</ul>` : ""}
    ${diagnosticsHTML(check.diagnostics)}`;
}

// The pipeline's Lean check of the lemma proof extracted from a sample.
function extractedCheckHTML(outcome) {
  const { check, state } = outcome;
  if (!check) {
    return `<div class="checkline"><span class="k">Pipeline · Lean check of the extracted lemma proof</span>
      <span class="pill neutral">not run</span></div>
      <p class="muted">${state === "late" ? "The lemma was already proved when this sample finished."
        : "The final file holds no sorry-free proof of the lemma, so nothing was extracted to check."}</p>`;
  }
  const errors = check.errors || [];
  return `
    <div class="checkline"><span class="k">Pipeline · Lean check of the extracted lemma proof</span>
      <span class="pill ${check.ok ? "ok" : "fail"}">${check.ok ? (check.sorry_warning ? "compiles · sorry" : "compiles") : plural(errors.length, "error")}</span>
      ${state === "win" ? `<span class="pill ok">proof kept</span>` : ""} ${stepLink(check)}</div>
    ${errors.length ? diagnosticsHTML(errors.join("\n")) : ""}`;
}

// A Lean check of a chat model's code (captain or chat solver).
function chatCheckHTML(check) {
  if (!check) return `<p class="muted">Lean did not check this reply.</p>`;
  const errors = check.errors || [];
  return `<div class="checkline"><span class="k">Lean check ${stepLink(check)}</span>${stepResult(check)}</div>
    ${errors.length ? diagnosticsHTML(errors.join("\n")) : `<p class="muted">No errors.</p>`}
    <div class="tagblock"><span class="tagname">${escapeHTML(check.file || "")}</span>${leanHTML(check.source || "", errorLinesOf(errors), "tall")}</div>`;
}

// The model's reasoning before assistant turn `turn`, from the logging proxy.
const reasoningOfTurn = (sample, turn) => (sample.reasoning || []).filter(r => r.turn === turn);

function reasoningBlock(text, open = false) {
  return `<details class="fold reasoning" ${open ? "open" : ""}><summary><b>Reasoning</b>
    <span class="muted">${plural(text.split(/\s+/).filter(Boolean).length, "word")}</span></summary>
    <div class="body"><pre class="plain wrap">${escapeHTML(text)}</pre></div></details>`;
}

// One tool call: Lean written to a file is shown as Lean, other arguments as JSON.
function toolCallHTML(call) {
  let args = call.arguments || "";
  let lean = "";
  try {
    const parsed = JSON.parse(args);
    if (typeof parsed.content === "string" && /\.lean$/.test(parsed.file_path || parsed.path || "")) {
      lean = parsed.content;
      delete parsed.content;
    }
    args = JSON.stringify(parsed, null, 1);
  } catch { /* arguments cut at the trace limit stay as text */ }
  return `<div class="toolcall"><span class="pill neutral mono">${escapeHTML(call.name || "tool")}</span>
    <pre class="plain wrap">${escapeHTML(args)}</pre>${lean ? leanHTML(lean, new Set(), "tall") : ""}</div>`;
}

// The agent's session: its messages, tool calls, tool results and, where the
// proxy recorded it, its reasoning before each turn.
function sessionHTML(sample) {
  const session = sample.session || [];
  if (!session.length) return `<p class="muted">The session transcript is not recorded for this sample.</p>`;
  let turn = 0;
  return `<div class="session">${session.map(entry => {
    if (entry.role === "tool") {
      return `<details class="fold toolresult"><summary><span class="mono muted">result of ${escapeHTML(entry.name || "tool")}</span>
        <span class="muted">${plural(entry.text.split("\n").length, "line")}</span></summary>
        <div class="body">${/\.lean:\d+:\d+:/.test(entry.text) ? diagnosticsHTML(entry.text) : `<pre class="plain wrap">${escapeHTML(entry.text)}</pre>`}</div></details>`;
    }
    if (entry.role === "assistant") {
      turn += 1;
      const thoughts = reasoningOfTurn(sample, turn).map(r => reasoningBlock(r.reasoning || "")).join("");
      return `<div class="turn"><div class="turnhead"><span class="mono">turn ${turn}</span></div>${thoughts}
        ${entry.text ? `<div class="prose">${mathHTML(entry.text)}</div>` : ""}
        ${(entry.tool_calls || []).map(toolCallHTML).join("")}</div>`;
    }
    return `<details class="fold"><summary><b>${entry.injected ? "Harness message" : turn ? "User message" : "Task"}</b>
      <span class="muted">${plural(entry.text.split("\n").length, "line")}</span></summary>
      <div class="body"><pre class="plain wrap">${escapeHTML(entry.text)}</pre></div></details>`;
  }).join("")}</div>`;
}

function reasoningHTML(sample) {
  const records = sample.reasoning || [];
  if (!records.length) {
    return `<p class="muted">The model's reasoning is not recorded for this sample. The AIProver harness
      discards it; runs started after the reasoning proxy was installed record it per turn.</p>`;
  }
  return records.map(r => `<div class="turn"><div class="turnhead"><span class="mono">turn ${r.turn}</span>
    <span class="muted">${escapeHTML(r.time || "")}</span>${r.truncated ? ` <span class="pill fail">stopped at the reply token cap</span>` : ""}</div>${reasoningBlock(r.reasoning || "", true)}</div>`).join("");
}

// Drawer panels of an AIProver job, for one sample (a solver lane) or all.
function jobPanels(job, sampleIndex) {
  const lanes = sampleIndex == null ? jobLanes(job) : [sampleIndex];
  const per = render => lanes.map(k => {
    const outcome = sampleOutcome(job, k);
    const head = lanes.length > 1 ? `<h4 class="lanehead">solver ${k}</h4>` : "";
    return head + render(outcome.sample || {}, outcome, k);
  }).join("");
  return [
    ["response", "Reply", per(sample => sample.lean
      ? leanHTML(sample.lean, diagnosticErrorLines(sample.check?.diagnostics), "tall")
      : `<p class="muted">The final Lean file is not recorded.</p>`)],
    ["prompt", "Prompt", taggedHTML(job.prompt || "")],
    ["system", "System prompt", job.system_prompt
      ? markdownHTML(TRACE.system_prompts?.[job.system_prompt] || job.system_prompt)
      : `<p class="muted">AIProver composes its own system prompt inside the harness; the task above is
         what the pipeline sends.</p>`],
    ["lean", "Lean returns", per((sample, outcome) => harnessCheckHTML(sample.check) + extractedCheckHTML(outcome))],
    ["session", "Session", per(sample => sessionHTML(sample))],
    ["reasoning", "Reasoning", per(sample => reasoningHTML(sample))],
  ];
}

function stepDetail(step, sampleIndex = null) {
  const meta = [`<span>at <b>${formatClock(step.elapsed_seconds)}</b></span>`, `<span>stage <b>${escapeHTML(step.stage)}</b></span>`];
  let body = "";
  if (isJob(step)) {
    const job = step;
    meta.push(`<span>AIProver job <b>${jobNumber(job)}</b> on <b>${escapeHTML(job.lemma)}</b></span>`);
    if (sampleIndex != null) {
      const o = sampleOutcome(job, sampleIndex);
      meta.push(`<span>solver <b>${sampleIndex}</b></span>`,
        `<span>duration <b>${formatDuration(o.end - o.start)}</b></span>`,
        o.turns != null ? `<span>turns <b>${o.turns}</b></span>` : "",
        o.sample?.ending ? `<span>ended <b>${escapeHTML(o.sample.ending)}</b></span>` : "",
        `<span>result <b>${escapeHTML({ win: "proof kept", ok: "compiles", fail: "Lean errors" }[o.state] || o.text)}</b></span>`);
    } else {
      meta.push(`<span>duration <b>${formatDuration(job.seconds || 0)}</b></span>`, `<span>samples <b>${jobSummary(job)}</b></span>`);
    }
    const previous = (jobsByLemma.get(job.lemma) || [])[jobNumber(job) - 2];
    const note = `<p class="note">${previous ? `Started after a ${escapeHTML(transitionText(previous, job))} (previous job ${stepLink(previous)}).`
      : "First AIProver job on this lemma."} Each job runs ${plural(jobSamples(job), "independent session")}.</p>`;
    body = note + tabsHTML(jobPanels(job, sampleIndex));
  } else if (step.kind === "model_call") {
    meta.push(`<span>model <b>${escapeHTML(step.model)}</b></span>`,
      `<span>duration <b>${formatDuration(step.seconds || 0)}</b></span>`,
      `<span>output tokens <b>${(step.usage?.outputTokens ?? 0).toLocaleString()}</b></span>`,
      `<span>cost <b>${formatUSD(step.cost_usd)}</b></span>`);
    const check = checkOfCall.get(step.index);
    const note = step.role === "auditor"
      ? `<p class="note">The auditor's message contains only Lean code. Its system prompt is the auditor playbook.</p>` : "";
    const linked = check ? `<p class="note">The code in this reply was compiled in ${stepLink(check)}: ${stepResult(check)}</p>` : "";
    const panels = [
      ["response", "Reply", step.error ? `<pre class="plain errors">${escapeHTML(step.error)}</pre>` : taggedHTML(step.response || "")],
      ["prompt", "Prompt", taggedHTML(step.prompt || "")],
      ["system", "System prompt", markdownHTML(TRACE.system_prompts?.[step.system_prompt] || step.system_prompt || "")],
    ];
    if (check) panels.push(["lean", "Lean returns", chatCheckHTML(check)]);
    body = `${note}${linked}${tabsHTML(panels)}`;
  } else if (step.kind === "lean_check") {
    meta.push(`<span>duration <b>${formatDuration(step.seconds || 0)}</b></span>`);
    const call = callOfCheck.get(step.index);
    const axioms = Object.entries(step.axioms || {});
    body = `
      ${call ? `<p class="note">Compiles the code from ${stepLink(call)} (${escapeHTML(stepTitle(call))}).</p>` : ""}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${stepResult(step)}
        ${step.sorry_warning ? `<span class="muted">The file still contains <code>sorry</code>${step.lemma != null ? " (earlier lemmas are included unproved)" : ""}.</span>` : ""}</div>
      ${(step.errors || []).length ? `<div class="tagblock"><span class="tagname">compiler errors</span><pre class="plain errors">${escapeHTML(step.errors.join("\n\n"))}</pre></div>` : ""}
      ${axioms.length ? `<p>Axioms: ${axioms.map(([name, list]) => `<code>${escapeHTML(name)}</code> → ${list.map(a => `<code>${escapeHTML(a)}</code>`).join(", ")}`).join("; ")}</p>` : ""}
      <div class="tagblock"><span class="tagname">${escapeHTML(step.file)}</span>${leanHTML(step.source || "", errorLinesOf(step.errors), "tall")}</div>`;
  } else {
    body = Object.entries(step).filter(([k]) => !["index", "kind", "stage", "elapsed_seconds", "event"].includes(k)).map(([key, value]) => {
      let inner;
      if (typeof value === "string" && (LEAN_TAGS.has(key) || key === "solution")) inner = value ? leanHTML(value, new Set(), "tall") : `<span class="muted">(empty)</span>`;
      else if (Array.isArray(value) && value.every(v => typeof v === "string") && key === "lemmas") inner = leanHTML(value.join("\n\n"));
      else if (typeof value === "string") inner = `<div class="prose">${mathHTML(value)}</div>`;
      else inner = `<pre class="plain">${escapeHTML(JSON.stringify(value, null, 1))}</pre>`;
      return `<div class="tagblock"><span class="tagname">${escapeHTML(key)}</span>${inner}</div>`;
    }).join("");
  }
  const role = roleOf(step);
  return {
    head: `<div class="row"><span class="dot ${role}"></span><span class="mono muted">#${step.index} of ${steps.length - 1}</span>
        <span class="spacer"></span>
        <button class="btn" type="button" data-drawer="prev" ${step.index === 0 ? "disabled" : ""} aria-label="Previous step">←</button>
        <button class="btn" type="button" data-drawer="next" ${step.index === steps.length - 1 ? "disabled" : ""} aria-label="Next step">→</button>
        <button class="btn" type="button" data-drawer="close">Close</button></div>
      <h3>${escapeHTML(stepTitle(step))}</h3>
      <div class="meta">${meta.join("")}</div>`,
    body,
  };
}

// Opens the drawer with arbitrary content; `index` is set for step records only.
function showDrawer(head, body, index = null) {
  openStep = index;
  drawerOpen = true;
  document.getElementById("drawer-head").innerHTML = head;
  const bodyEl = document.getElementById("drawer-body");
  bodyEl.innerHTML = body;
  bodyEl.scrollTop = 0;
  document.getElementById("drawer").hidden = false;
  document.getElementById("scrim").hidden = false;
  // Bring the first compiler error into view inside the Lean listing.
  const errorLine = bodyEl.querySelector(".line.err");
  if (errorLine) {
    const pre = errorLine.closest("pre");
    pre.scrollTop = Math.max(0, errorLine.offsetTop - pre.clientHeight / 3);
  }
  document.querySelector('#drawer [data-drawer="close"]').focus({ preventScroll: true });
}

// Drawer header for content that is not a single step.
function summaryHead(title, meta = "", dotClass = "") {
  return `<div class="row">${dotClass ? `<span class="dot ${dotClass}"></span>` : ""}
      <span class="spacer"></span><button class="btn" type="button" data-drawer="close">Close</button></div>
    <h3>${title}</h3>${meta ? `<div class="meta">${meta}</div>` : ""}`;
}

function showStep(index, sampleIndex = null) {
  const step = steps[index];
  if (!step) return;
  const { head, body } = stepDetail(step, sampleIndex);
  showDrawer(head, body, index);
}

function closeStep() {
  openStep = null;
  drawerOpen = false;
  document.getElementById("drawer").hidden = true;
  document.getElementById("scrim").hidden = true;
}

// Clicks on step links and drawer controls, and keys while the drawer is open.
// Page handlers should ignore keys when `drawerOpen` is true.
function installDrawerHandlers() {
  document.addEventListener("click", event => {
    if (event.target.id === "scrim") return closeStep();
    const target = event.target.closest("[data-step],[data-drawer],[data-tab]");
    if (!target) return;
    const d = target.dataset;
    if (d.step !== undefined) showStep(Number(d.step));
    else if (d.drawer === "close") closeStep();
    else if (d.drawer === "prev") showStep(openStep - 1);
    else if (d.drawer === "next") showStep(openStep + 1);
    else if (d.tab) {
      drawerTab = d.tab;
      document.querySelectorAll("#drawer [data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === d.tab));
      document.querySelectorAll("#drawer [data-panel]").forEach(p => { p.hidden = p.dataset.panel !== d.tab; });
    }
  });
  document.addEventListener("keydown", event => {
    if (!drawerOpen || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === "Escape") closeStep();
    else if (openStep !== null && event.key === "ArrowRight") showStep(Math.min(steps.length - 1, openStep + 1));
    else if (openStep !== null && event.key === "ArrowLeft") showStep(Math.max(0, openStep - 1));
  });
}

  An orchestrator model, the <span class="role captain">captain</span>, translates an informal
  mathematical result into Lean, has the translation checked by a blind
  <span class="role auditor">auditor</span>, splits the proof into lemmas, and delegates each
  lemma to several parallel <span class="role solver">solver</span> models. The
  <span class="role lean">Lean</span> compiler checks every piece of code; a result is accepted

  <div class="stats">
    <div class="stat"><span class="v">${verified ? "Proved" : escapeHTML(outcome.status || "running")}</span><span class="k">${verified ? "all final checks pass" : "final status"}</span></div>
    <div class="stat"><span class="v">${formatDuration(outcome.wall_seconds || steps.at(-1)?.elapsed_seconds || 0)}</span><span class="k">wall-clock time</span></div>
    <div class="stat"><span class="v">${calls.length}</span><span class="k">model calls (${roles.map(r => callsByRole(r).length).join(" / ")} captain / auditor / solver)</span></div>
    <div class="stat"><span class="v">${checks.length}</span><span class="k">Lean checks</span></div>
    <div class="stat"><span class="v">${formatUSD(totalCost)}</span><span class="k">notional API cost</span></div>
  </div>
  ${phaseNames.length ? `
  <div class="panel">
    <h3>Time per phase</h3>
    <div class="phasebar">${phaseNames.map(p => `<div class="ph-${p}" style="width:${(phases[p] / phaseTotal * 100).toFixed(2)}%">${phases[p] / phaseTotal > 0.12 ? p : ""}</div>`).join("")}</div>
    <div class="phaselegend">${phaseNames.map(p => `<span><i class="ph-${p}"></i>${p} ${formatDuration(phases[p])}</span>`).join("")}</div>
  </div>` : ""}
  <div class="panel">
    <h3>Models</h3>
    <table class="kv">
      <tr><th>Role</th><th>Model</th><th>Calls</th><th>Output tokens</th><th>Cost</th></tr>
      ${roles.map(r => {
        const list = callsByRole(r);
        return `<tr><td><span class="role ${r}">${r}</span></td><td class="num">${escapeHTML(list[0]?.model || (r === "captain" ? TRACE.models?.orchestrator : TRACE.models?.worker))}</td>
          <td class="num">${list.length}</td><td class="num">${sum(list.map(c => c.usage?.outputTokens)).toLocaleString()}</td><td class="num">${formatUSD(sum(list.map(c => c.cost_usd)))}</td></tr>`;
      }).join("")}
    </table>
  </div>
  <div class="panel">
    <h3>Reading this page</h3>
    <p>The chapters follow the pipeline in order. Use <b>Next</b>, the chapter list, or the
    <kbd>←</kbd>/<kbd>→</kbd> keys. Every item marked with a step number such as ${stepLink(steps[0])}
    opens the complete record of that step: the exact prompt, the model's reply, the Lean source and
    compiler output. Inside a step record, <kbd>←</kbd>/<kbd>→</kbd> move through the run one step at a time.</p>
  </div>
  <div class="panel">
    <h3>Terms</h3>
    <dl class="gloss">
      <dt>Lean 4</dt><dd>A programming language and proof assistant. A proof written in Lean is checked mechanically by its kernel; if it compiles, it is correct relative to the stated theorem.</dd>
      <dt>Mathlib</dt><dd>The community library of formalized mathematics for Lean.</dd>
      <dt>sorry</dt><dd>A placeholder that closes any goal without proof. Lean accepts it with a warning. The pipeline uses it for statements whose proofs are pending, and the final solution must contain none.</dd>
      <dt>axioms</dt><dd>Foundational assumptions a proof depends on. Only <code>propext</code>, <code>Classical.choice</code> and <code>Quot.sound</code> are admitted.</dd>
      <dt>read-back</dt><dd>A natural-language account of what a piece of Lean code literally asserts, written without knowledge of what it was meant to assert.</dd>
      <dt>faithful</dt><dd>A formal statement is faithful when it asserts exactly the source result: neither weaker, stronger, nor vacuous.</dd>

// Vertical flow chart of the pipeline; nodes open the matching algorithm entry.
const FLOW_NODES = [
  { id: "problem", title: "Informal problem", actor: "dataset", tone: "data", algorithm: null, chapter: "problem" },
  { id: "formalize", title: "Formalize", actor: "captain", tone: "captain", algorithm: 0, chapter: "formalize" },
  { id: "audit", title: "Blind read-back", actor: "auditor", tone: "auditor", algorithm: 1, chapter: "audit" },
  { id: "judge", title: "Faithfulness verdict", actor: "captain", tone: "captain", algorithm: 2, chapter: "audit" },
  { id: "sketch", title: "Proof sketch", actor: "captain", tone: "captain", algorithm: 3, chapter: "sketch" },
  { id: "prove", title: "Prove lemmas", actor: "solvers, in parallel", tone: "solver", algorithm: 4, chapter: "prove" },
  { id: "assemble", title: "Assemble and verify", actor: "Lean", tone: "lean", algorithm: 6, chapter: "assemble" },

function flowCounts(id) {
  const n = {
    formalize: [callsByRole("captain").filter(c => /^formalize/.test(c.label)).length, checks.filter(k => k.label === "formalize").length],
    audit: [callsByRole("auditor").length, 0],
    judge: [callsByRole("captain").filter(c => /^judge/.test(c.label)).length, 0],
    sketch: [callsByRole("captain").filter(c => /^sketch/.test(c.label)).length, checks.filter(k => k.label === "sketch").length],
    prove: [callsByRole("solver").length, checks.filter(k => k.lemma != null).length],
    assemble: [0, checks.filter(k => k.stage === "assemble").length],
  }[id];
  if (!n) return "";
  return [n[0] ? plural(n[0], "call") : "", n[1] ? plural(n[1], "check") : ""].filter(Boolean).join(" · ");
}

function flowSVG() {
  const x = 190, w = 260, h = 74, gap = 30, cx = x + w / 2;
  const y = i => 12 + i * (h + gap);
  const nodes = FLOW_NODES.map((node, i) => `
    <g class="node" tabindex="0" role="button" data-flow="${node.id}" aria-label="${node.title}">
      <rect x="${x}" y="${y(i)}" width="${w}" height="${h}" rx="7"></rect>
      <circle cx="${x + 16}" cy="${y(i) + 20}" r="4.5" class="c-${node.tone}"></circle>
      <text x="${x + 28}" y="${y(i) + 24}" class="title">${node.title}</text>
      <text x="${x + 28}" y="${y(i) + 43}" class="actor c-${node.tone}">${node.actor}${node.id === "prove" ? ` ×${cfg.workers ?? "N"} per lemma` : ""}</text>
      <text x="${x + 28}" y="${y(i) + 61}" class="count">${flowCounts(node.id)}</text>
    </g>`).join("");
  const down = FLOW_NODES.slice(0, -1).map((node, i) =>
    `<path class="edge" d="M${cx},${y(i) + h} V${y(i + 1) - 3}" marker-end="url(#arrow)"></path>`).join("");
  const selfLoop = (i, label) => `
    <path class="edge loop" d="M${x},${y(i) + 22} C${x - 52},${y(i) + 22} ${x - 52},${y(i) + 52} ${x - 3},${y(i) + 52}" marker-end="url(#arrow)"></path>
    <text x="${x - 50}" y="${y(i) + 41}" text-anchor="end" class="elabel">${label}</text>`;
  const backEdge = (from, to, label, id) => `
    <path class="edge loop" d="M${x + w},${y(from) + h / 2} H${x + w + 70} V${y(to) + h / 2} H${x + w + 3}" marker-end="url(#arrow)"></path>
    <text x="${x + w + 76}" y="${(y(from) + y(to)) / 2 + h / 2 + 4}" class="elabel${id ? " hot" : ""}"${id ? ` data-flow="${id}" tabindex="0" role="button"` : ""}>${label}</text>`;
  const height = y(FLOW_NODES.length) - gap + 14;
  return `<svg class="flow" viewBox="0 0 640 ${height}" role="img" aria-label="Pipeline flow chart">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"></path></marker></defs>
    ${down}
    ${selfLoop(1, "Lean errors")}
    ${selfLoop(4, "Lean errors")}
    ${selfLoop(5, "Lean errors, per chain")}
    ${backEdge(3, 1, "REVISE")}
    ${backEdge(5, 4, "replan", "replan")}
    <text x="${cx + 8}" y="${y(4) - 10}" class="elabel">FAITHFUL</text>
    ${nodes}
  </svg>`;
}

function chapterFormalize() {

  const compiled = eventsOf("formalization_compiled");

  return `
