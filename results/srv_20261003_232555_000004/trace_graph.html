    if (!part.body) body = `<div class="muted">(empty)</div>`;
    else if (LEAN_TAGS.has(part.tag)) body = leanHTML(part.body);
    else if (PLAIN_TAGS.has(part.tag)) body = `<pre class="plain errors">${escapeHTML(part.body)}</pre>`;
    else body = `<div class="prose">${mathHTML(part.body)}</div>`;
    return `<div class="tagblock"><span class="tagname">&lt;${part.tag}&gt;</span>${body}</div>`;
  }).join("");
}

function templateHTML(text) {
  return `<pre class="plain">${escapeHTML(text).replace(/\{([a-z_]+)\}/g, '<span class="placeholder">{$1}</span>')}</pre>`;
}

// Step summaries ----------------------------------------------------------------

const EVENT_TEXT = {
  formalization_compiled: "Formalization compiles",
  formalization_rejected: "Formalization rejected",
  audit_verdict: "Audit verdict",
  sketch_accepted: "Sketch accepted",
  sketch_rejected: "Sketch rejected",
  lemma_proved: "Lemma proved",
  solver_attempt_rejected: "Attempt rejected before Lean",
  solver_budget_exhausted: "Solver chain exhausted its budget",
  replan: "Sketch revision requested",
  lemma_reused: "Proved lemma reused",
  final_verification: "Final verification",
};

function stepTitle(step) {
  if (step.kind === "model_call") {
    if (isJob(step)) return `AIProver job ${jobNumber(step)} · ${step.lemma}`;
    if (step.lemma != null) return `solver ${step.worker} · ${step.lemma} · round ${step.round}`;
    return `${step.role} · ${step.label}`;
  }
  if (step.kind === "lean_check") return `Lean check · ${step.file}`;
  return EVENT_TEXT[step.event] || step.event;
}

function stepResult(step) {
  if (step.kind === "model_call") {
    if (step.error) return `<span class="pill fail">error</span>`;
    if (step.lemma != null) {
      const { state } = solverOutcome(step);
      const label = state === "pending" && isJob(step) ? jobSummary(step)
        : { win: "proof kept", ok: "compiles", fail: "Lean errors",
            late: "after lemma proved", rejected: "rejected", pending: "no proof returned" }[state];
      const tone = { win: "ok", ok: "ok", fail: "fail", late: "neutral", rejected: "warn", pending: "neutral" }[state];
      return `<span class="pill ${tone}">${label}</span>`;
    }
    return `<span class="muted mono">${formatDuration(step.seconds || 0)}</span>`;
  }
  if (step.kind === "lean_check") {
    if (!step.ok) return `<span class="pill fail">${plural((step.errors || []).length, "error")}</span>`;
    return step.sorry_warning
      ? `<span class="pill warn">compiles · sorry</span>`
      : `<span class="pill ok">compiles</span>`;
  }
  if (step.event === "audit_verdict") {
    return `<span class="pill ${step.verdict === "FAITHFUL" ? "ok" : "fail"}">${escapeHTML(step.verdict)}</span>`;
  }
  if (step.event === "final_verification") {
    return `<span class="pill ${step.checks?.verified ? "ok" : "fail"}">${step.checks?.verified ? "verified" : "not verified"}</span>`;
  }
  if (step.event === "lemma_proved") return `<span class="pill ok">${escapeHTML(step.lemma)}</span>`;
  return "";
}

function stepRow(step) {
  const role = roleOf(step);
  return `<button class="steprow" type="button" data-step="${step.index}">
    <span class="idx">#${step.index}</span>
    <span class="t">${formatClock(step.elapsed_seconds)}</span>
    <span class="dot ${role}" title="${role}"></span>
    <span class="what"><span class="lbl">${escapeHTML(stepTitle(step))}</span></span>
    <span>${stepResult(step)}</span>
  </button>`;
}
const stepList = list => list.length
  ? `<div class="steps">${list.map(stepRow).join("")}</div>`
  : `<p class="muted">No steps of this kind in this run.</p>`;
const stepLink = step => step ? `<button class="steplink" type="button" data-step="${step.index}">#${step.index}</button>` : "";

const cfg = TRACE.config || {};
const outcome = TRACE.outcome || {};
const problem = TRACE.problem || {};
const totalCost = sum(calls.map(c => c.cost_usd));
const callsByRole = role => calls.filter(c => c.role === role);

// The proposition itself, without the shared setting paragraph.
function propositionText() {
  const paragraphs = (problem.informal_statement || "").split(/\n\s*\n/);
  return (paragraphs.length > 1 ? paragraphs.slice(1) : paragraphs).join("\n\n");
}

function lemmaUses(text, self) {
  return lemmaOrder.filter(name => name !== self && new RegExp(`(^|[^\\w'.])${name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![\\w'])`).test(text || ""));
}

// Step drawer --------------------------------------------------------------------------

let openStep = null;
let drawerOpen = false;
let drawerTab = "response";

// Tabs of the step drawer: `panels` is a list of [id, name, html]. The tab
// last chosen stays selected when the next drawer has it.
function tabsHTML(panels) {
  const active = panels.some(([id]) => id === drawerTab) ? drawerTab : panels[0][0];
  return `<div class="tabs" role="tablist">${panels.map(([id, name]) =>
      `<button type="button" role="tab" data-tab="${id}" aria-selected="${active === id}">${name}</button>`).join("")}</div>
    ${panels.map(([id, , html]) => `<div data-panel="${id}" ${active === id ? "" : "hidden"}>${html}</div>`).join("")}`;
}

// Lean output, one message per `file:line:col: severity:` header.
function diagnosticsHTML(text) {
  if (!text) return `<p class="muted">No diagnostics: Lean reported nothing for this file.</p>`;
  const html = escapeHTML(text).replace(/^(\S+\.lean:\d+:\d+: )(error|warning)(:.*)$/gm,
    (_, where, severity, rest) => `${where}<span class="${severity}">${severity}${rest}</span>`);
  return `<pre class="diag">${html}</pre>`;
}
const diagnosticErrorLines = text => new Set([...String(text || "").matchAll(/\.lean:(\d+):\d+: error/g)]
  .map(m => Number(m[1])));
const flagPill = (value, yes, no) => value == null ? ""
  : `<span class="pill ${value ? "ok" : "fail"}">${value ? yes : no}</span>`;

// The harness's Lean check of a sample's whole final file.
function harnessCheckHTML(check) {
  if (!check || !Object.keys(check).length) {
    return `<p class="muted">The harness's check of this sample is not recorded.</p>`;
  }
  return `
    <div class="checkline"><span class="k">AIProver harness · Lean check of the final file</span>
      ${check.verdict ? `<span class="pill ${check.verdict === "PASS" ? "ok" : "fail"}">${escapeHTML(check.verdict)}</span>` : ""}
      ${flagPill(check.compiles, "compiles", "does not compile")}
      ${flagPill(check.complete, "no sorry", "contains sorry")}
      ${check.axioms_used ? `<span class="pill neutral">axioms: ${escapeHTML(check.axioms_used.join(", ") || "none")}</span>` : ""}</div>
    ${(check.problems || []).length ? `<ul class="problems">${check.problems.map(p => `<li>${escapeHTML(p)}</li>`).join("")}</ul>` : ""}
    ${diagnosticsHTML(check.diagnostics)}`;
}

// The pipeline's Lean check of the lemma proof extracted from a sample.
function extractedCheckHTML(outcome) {
  const { check, state } = outcome;
  if (!check) {
    return `<div class="checkline"><span class="k">Pipeline · Lean check of the extracted lemma proof</span>
      <span class="pill neutral">not run</span></div>
      <p class="muted">${state === "late" ? "The lemma was already proved when this sample finished."
        : "The final file holds no sorry-free proof of the lemma, so nothing was extracted to check."}</p>`;
  }
  const errors = check.errors || [];
  return `
    <div class="checkline"><span class="k">Pipeline · Lean check of the extracted lemma proof</span>
      <span class="pill ${check.ok ? "ok" : "fail"}">${check.ok ? (check.sorry_warning ? "compiles · sorry" : "compiles") : plural(errors.length, "error")}</span>
      ${state === "win" ? `<span class="pill ok">proof kept</span>` : ""} ${stepLink(check)}</div>
    ${errors.length ? diagnosticsHTML(errors.join("\n")) : ""}`;
}

// A Lean check of a chat model's code (captain or chat solver).
function chatCheckHTML(check) {
  if (!check) return `<p class="muted">Lean did not check this reply.</p>`;
  const errors = check.errors || [];
  return `<div class="checkline"><span class="k">Lean check ${stepLink(check)}</span>${stepResult(check)}</div>
    ${errors.length ? diagnosticsHTML(errors.join("\n")) : `<p class="muted">No errors.</p>`}
    <div class="tagblock"><span class="tagname">${escapeHTML(check.file || "")}</span>${leanHTML(check.source || "", errorLinesOf(errors), "tall")}</div>`;
}

// The model's reasoning before assistant turn `turn`, from the logging proxy.
const reasoningOfTurn = (sample, turn) => (sample.reasoning || []).filter(r => r.turn === turn);

function reasoningBlock(text, open = false) {
  return `<details class="fold reasoning" ${open ? "open" : ""}><summary><b>Reasoning</b>
    <span class="muted">${plural(text.split(/\s+/).filter(Boolean).length, "word")}</span></summary>
    <div class="body"><pre class="plain wrap">${escapeHTML(text)}</pre></div></details>`;
}

// One tool call: Lean written to a file is shown as Lean, other arguments as JSON.
function toolCallHTML(call) {
  let args = call.arguments || "";
  let lean = "";
  try {
    const parsed = JSON.parse(args);
    if (typeof parsed.content === "string" && /\.lean$/.test(parsed.file_path || parsed.path || "")) {
      lean = parsed.content;
      delete parsed.content;
    }
    args = JSON.stringify(parsed, null, 1);
  } catch { /* arguments cut at the trace limit stay as text */ }
  return `<div class="toolcall"><span class="pill neutral mono">${escapeHTML(call.name || "tool")}</span>
    <pre class="plain wrap">${escapeHTML(args)}</pre>${lean ? leanHTML(lean, new Set(), "tall") : ""}</div>`;
}

// The agent's session: its messages, tool calls, tool results and, where the
// proxy recorded it, its reasoning before each turn.
function sessionHTML(sample) {
  const session = sample.session || [];
  if (!session.length) return `<p class="muted">The session transcript is not recorded for this sample.</p>`;
  let turn = 0;
  return `<div class="session">${session.map(entry => {
    if (entry.role === "tool") {
      return `<details class="fold toolresult"><summary><span class="mono muted">result of ${escapeHTML(entry.name || "tool")}</span>
        <span class="muted">${plural(entry.text.split("\n").length, "line")}</span></summary>
        <div class="body">${/\.lean:\d+:\d+:/.test(entry.text) ? diagnosticsHTML(entry.text) : `<pre class="plain wrap">${escapeHTML(entry.text)}</pre>`}</div></details>`;
    }
    if (entry.role === "assistant") {
      turn += 1;
      const thoughts = reasoningOfTurn(sample, turn).map(r => reasoningBlock(r.reasoning || "")).join("");
      return `<div class="turn"><div class="turnhead"><span class="mono">turn ${turn}</span></div>${thoughts}
        ${entry.text ? `<div class="prose">${mathHTML(entry.text)}</div>` : ""}
        ${(entry.tool_calls || []).map(toolCallHTML).join("")}</div>`;
    }
    return `<details class="fold"><summary><b>${entry.injected ? "Harness message" : turn ? "User message" : "Task"}</b>
      <span class="muted">${plural(entry.text.split("\n").length, "line")}</span></summary>
      <div class="body"><pre class="plain wrap">${escapeHTML(entry.text)}</pre></div></details>`;
  }).join("")}</div>`;
}

function reasoningHTML(sample) {
  const records = sample.reasoning || [];
  if (!records.length) {
    return `<p class="muted">The model's reasoning is not recorded for this sample. The AIProver harness
      discards it; runs started after the reasoning proxy was installed record it per turn.</p>`;
  }
  return records.map(r => `<div class="turn"><div class="turnhead"><span class="mono">turn ${r.turn}</span>
    <span class="muted">${escapeHTML(r.time || "")}</span></div>${reasoningBlock(r.reasoning || "", true)}</div>`).join("");
}

// Drawer panels of an AIProver job, for one sample (a solver lane) or all.
function jobPanels(job, sampleIndex) {
  const lanes = sampleIndex == null ? sampleLanes() : [sampleIndex];
  const per = render => lanes.map(k => {
    const outcome = sampleOutcome(job, k);
    const head = lanes.length > 1 ? `<h4 class="lanehead">solver ${k}</h4>` : "";
    return head + render(outcome.sample || {}, outcome, k);
  }).join("");
  return [
    ["response", "Reply", per(sample => sample.lean
      ? leanHTML(sample.lean, diagnosticErrorLines(sample.check?.diagnostics), "tall")
      : `<p class="muted">The final Lean file is not recorded.</p>`)],
    ["prompt", "Prompt", taggedHTML(job.prompt || "")],
    ["system", "System prompt", job.system_prompt
      ? markdownHTML(TRACE.system_prompts?.[job.system_prompt] || job.system_prompt)
      : `<p class="muted">AIProver composes its own system prompt inside the harness; the task above is
         what the pipeline sends.</p>`],
    ["lean", "Lean returns", per((sample, outcome) => harnessCheckHTML(sample.check) + extractedCheckHTML(outcome))],
    ["session", "Session", per(sample => sessionHTML(sample))],
    ["reasoning", "Reasoning", per(sample => reasoningHTML(sample))],
  ];
}

function stepDetail(step, sampleIndex = null) {
  const meta = [`<span>at <b>${formatClock(step.elapsed_seconds)}</b></span>`, `<span>stage <b>${escapeHTML(step.stage)}</b></span>`];
  let body = "";
  if (isJob(step)) {
    const job = step;
    meta.push(`<span>AIProver job <b>${jobNumber(job)}</b> on <b>${escapeHTML(job.lemma)}</b></span>`);
    if (sampleIndex != null) {
      const o = sampleOutcome(job, sampleIndex);
      meta.push(`<span>solver <b>${sampleIndex}</b></span>`,
        `<span>duration <b>${formatDuration(o.end - o.start)}</b></span>`,
        o.turns != null ? `<span>turns <b>${o.turns}</b></span>` : "",
        o.sample?.ending ? `<span>ended <b>${escapeHTML(o.sample.ending)}</b></span>` : "",
        `<span>result <b>${escapeHTML({ win: "proof kept", ok: "compiles", fail: "Lean errors" }[o.state] || o.text)}</b></span>`);
    } else {
      meta.push(`<span>duration <b>${formatDuration(job.seconds || 0)}</b></span>`, `<span>samples <b>${jobSummary(job)}</b></span>`);
    }
    const previous = (jobsByLemma.get(job.lemma) || [])[jobNumber(job) - 2];
    const note = `<p class="note">${previous ? `Started after a ${escapeHTML(transitionText(previous, job))} (previous job ${stepLink(previous)}).`
      : "First AIProver job on this lemma."} Each job runs ${plural(jobSamples(job), "independent session")}.</p>`;
    body = note + tabsHTML(jobPanels(job, sampleIndex));
  } else if (step.kind === "model_call") {
    meta.push(`<span>model <b>${escapeHTML(step.model)}</b></span>`,
      `<span>duration <b>${formatDuration(step.seconds || 0)}</b></span>`,
      `<span>output tokens <b>${(step.usage?.outputTokens ?? 0).toLocaleString()}</b></span>`,
      `<span>cost <b>${formatUSD(step.cost_usd)}</b></span>`);
    const check = checkOfCall.get(step.index);
    const note = step.role === "auditor"
      ? `<p class="note">The auditor's message contains only Lean code. Its system prompt is the auditor playbook.</p>` : "";
    const linked = check ? `<p class="note">The code in this reply was compiled in ${stepLink(check)}: ${stepResult(check)}</p>` : "";
    const panels = [
      ["response", "Reply", step.error ? `<pre class="plain errors">${escapeHTML(step.error)}</pre>` : taggedHTML(step.response || "")],
      ["prompt", "Prompt", taggedHTML(step.prompt || "")],
      ["system", "System prompt", markdownHTML(TRACE.system_prompts?.[step.system_prompt] || step.system_prompt || "")],
    ];
    if (check) panels.push(["lean", "Lean returns", chatCheckHTML(check)]);
    body = `${note}${linked}${tabsHTML(panels)}`;
  } else if (step.kind === "lean_check") {
    meta.push(`<span>duration <b>${formatDuration(step.seconds || 0)}</b></span>`);
    const call = callOfCheck.get(step.index);
    const axioms = Object.entries(step.axioms || {});
    body = `
      ${call ? `<p class="note">Compiles the code from ${stepLink(call)} (${escapeHTML(stepTitle(call))}).</p>` : ""}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${stepResult(step)}
        ${step.sorry_warning ? `<span class="muted">The file still contains <code>sorry</code>${step.lemma != null ? " (earlier lemmas are included unproved)" : ""}.</span>` : ""}</div>
      ${(step.errors || []).length ? `<div class="tagblock"><span class="tagname">compiler errors</span><pre class="plain errors">${escapeHTML(step.errors.join("\n\n"))}</pre></div>` : ""}
      ${axioms.length ? `<p>Axioms: ${axioms.map(([name, list]) => `<code>${escapeHTML(name)}</code> → ${list.map(a => `<code>${escapeHTML(a)}</code>`).join(", ")}`).join("; ")}</p>` : ""}
      <div class="tagblock"><span class="tagname">${escapeHTML(step.file)}</span>${leanHTML(step.source || "", errorLinesOf(step.errors), "tall")}</div>`;
  } else {
    body = Object.entries(step).filter(([k]) => !["index", "kind", "stage", "elapsed_seconds", "event"].includes(k)).map(([key, value]) => {
      let inner;
      if (typeof value === "string" && (LEAN_TAGS.has(key) || key === "solution")) inner = value ? leanHTML(value, new Set(), "tall") : `<span class="muted">(empty)</span>`;
      else if (Array.isArray(value) && value.every(v => typeof v === "string") && key === "lemmas") inner = leanHTML(value.join("\n\n"));
      else if (typeof value === "string") inner = `<div class="prose">${mathHTML(value)}</div>`;
      else inner = `<pre class="plain">${escapeHTML(JSON.stringify(value, null, 1))}</pre>`;
      return `<div class="tagblock"><span class="tagname">${escapeHTML(key)}</span>${inner}</div>`;
    }).join("");
  }
  const role = roleOf(step);
  return {
    head: `<div class="row"><span class="dot ${role}"></span><span class="mono muted">#${step.index} of ${steps.length - 1}</span>
        <span class="spacer"></span>
        <button class="btn" type="button" data-drawer="prev" ${step.index === 0 ? "disabled" : ""} aria-label="Previous step">←</button>
        <button class="btn" type="button" data-drawer="next" ${step.index === steps.length - 1 ? "disabled" : ""} aria-label="Next step">→</button>
        <button class="btn" type="button" data-drawer="close">Close</button></div>
      <h3>${escapeHTML(stepTitle(step))}</h3>
      <div class="meta">${meta.join("")}</div>`,
    body,
  };
}

// Opens the drawer with arbitrary content; `index` is set for step records only.
function showDrawer(head, body, index = null) {
  openStep = index;
  drawerOpen = true;
  document.getElementById("drawer-head").innerHTML = head;
  const bodyEl = document.getElementById("drawer-body");
  bodyEl.innerHTML = body;
  bodyEl.scrollTop = 0;
  document.getElementById("drawer").hidden = false;
  document.getElementById("scrim").hidden = false;
  // Bring the first compiler error into view inside the Lean listing.
  const errorLine = bodyEl.querySelector(".line.err");
  if (errorLine) {
    const pre = errorLine.closest("pre");
    pre.scrollTop = Math.max(0, errorLine.offsetTop - pre.clientHeight / 3);
  }
  document.querySelector('#drawer [data-drawer="close"]').focus({ preventScroll: true });
}

// Drawer header for content that is not a single step.
function summaryHead(title, meta = "", dotClass = "") {
  return `<div class="row">${dotClass ? `<span class="dot ${dotClass}"></span>` : ""}
      <span class="spacer"></span><button class="btn" type="button" data-drawer="close">Close</button></div>
    <h3>${title}</h3>${meta ? `<div class="meta">${meta}</div>` : ""}`;
}

function showStep(index, sampleIndex = null) {
  const step = steps[index];
  if (!step) return;
  const { head, body } = stepDetail(step, sampleIndex);
  showDrawer(head, body, index);
}

function closeStep() {
  openStep = null;
  drawerOpen = false;
  document.getElementById("drawer").hidden = true;
  document.getElementById("scrim").hidden = true;
}

// Clicks on step links and drawer controls, and keys while the drawer is open.
// Page handlers should ignore keys when `drawerOpen` is true.
function installDrawerHandlers() {
  document.addEventListener("click", event => {
    if (event.target.id === "scrim") return closeStep();
    const target = event.target.closest("[data-step],[data-drawer],[data-tab]");
    if (!target) return;
    const d = target.dataset;
    if (d.step !== undefined) showStep(Number(d.step));
    else if (d.drawer === "close") closeStep();
    else if (d.drawer === "prev") showStep(openStep - 1);
    else if (d.drawer === "next") showStep(openStep + 1);
    else if (d.tab) {
      drawerTab = d.tab;
      document.querySelectorAll("#drawer [data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === d.tab));
      document.querySelectorAll("#drawer [data-panel]").forEach(p => { p.hidden = p.dataset.panel !== d.tab; });
    }
  });
  document.addEventListener("keydown", event => {
    if (!drawerOpen || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === "Escape") closeStep();
    else if (openStep !== null && event.key === "ArrowRight") showStep(Math.min(steps.length - 1, openStep + 1));
    else if (openStep !== null && event.key === "ArrowLeft") showStep(Math.max(0, openStep - 1));
  });
}

function renderHeader() {
  document.getElementById("thm").textContent = TRACE.theorem_name;
  document.getElementById("run").textContent = TRACE.run_id;
  document.getElementById("models").textContent = `${TRACE.models?.orchestrator} + ${TRACE.models?.worker}`;
  const verified = outcome.checks?.verified;
  document.getElementById("status").innerHTML = `<span class="pill ${verified ? "ok" : outcome.status ? "fail" : "neutral"}">${verified ? "proved · verified" : escapeHTML(outcome.status || "in progress")}</span>`;
}


// Graph model ------------------------------------------------------------------------
// captain → subtasks → agents (who performs them) → attempts, in time order.

const algorithm = TRACE.algorithm || [];
const captainCalls = callsByRole("captain");

function attemptStatus(step) {
  if (step.kind === "model_call" && step.lemma != null) return solverOutcome(step).state;
  if (step.kind === "model_call") {
    const check = checkOfCall.get(step.index);
    if (step.error) return "fail";
    return check ? (check.ok ? "ok" : "fail") : "done";
  }
  if (step.kind === "lean_check") return step.ok ? "ok" : "fail";
  if (step.event === "audit_verdict") return step.verdict === "FAITHFUL" ? "ok" : "fail";
  if (step.event === "final_verification") return step.checks?.verified ? "ok" : "fail";
  return "done";
}

const STATUS_TEXT = { win: "proof kept", ok: "compiles", fail: "Lean errors", late: "discarded",
  rejected: "rejected", pending: "no proof returned", done: "reply received" };

function attemptNode(step, id) {
  const status = attemptStatus(step);
  const check = step.kind === "model_call" ? checkOfCall.get(step.index) : null;
  let title, detail;
  if (isJob(step)) {
    title = `job ${jobNumber(step)} · ${plural(jobSamples(step), "sample")}`;
    detail = status === "pending" ? jobSummary(step) : STATUS_TEXT[status];
  } else if (step.kind === "model_call" && step.lemma != null) {
    title = `round ${step.round}`;
    detail = STATUS_TEXT[status];
  } else if (step.kind === "model_call") {
    title = step.label;
    detail = step.role === "auditor" ? "read-back"
      : /^judge/.test(step.label) ? "comparison"
      : check ? (check.ok ? (check.sorry_warning ? "compiles · sorry" : "compiles") : "Lean errors") : STATUS_TEXT[status];
  } else if (step.kind === "lean_check") {
    title = step.label;
    detail = step.ok ? (step.sorry_warning ? "compiles · sorry" : "compiles, no sorry") : "Lean errors";
  } else {
    title = step.event === "audit_verdict" ? step.verdict : EVENT_TEXT[step.event] || step.event;
    detail = step.event === "audit_verdict" ? "verdict" : step.event === "final_verification"
      ? (step.checks?.verified ? "all checks pass" : "checks fail") : "";
  }
  const start = step.kind === "model_call" ? step.elapsed_seconds - (step.seconds || 0) : step.elapsed_seconds;
  const end = check ? check.elapsed_seconds : step.elapsed_seconds;
  const time = start === end ? formatClock(end) : `${formatClock(start)}–${formatClock(end)}`;
  const mono = step.kind !== "decision";
  return { id, type: "attempt", step, status, title, detail, time, mono, children: [] };
}

const agentNode = (id, title, role, sequence) =>
  ({ id, type: "agent", role, title, sequence: sequence.map((s, i) => attemptNode(s, `${id}/${i}`)) });

// Sample `k` of an AIProver job, as one attempt in the lane of solver k.
function sampleNode(job, k, id) {
  const outcome = sampleOutcome(job, k);
  const status = { win: "win", ok: "ok", fail: "fail", late: "late" }[outcome.state] || "pending";
  const detail = { win: "proof kept", ok: "compiles", fail: "Lean errors",
    late: `${outcome.text} · after lemma proved` }[outcome.state] || outcome.text;
  const end = outcome.check ? outcome.check.elapsed_seconds : outcome.end;
  const turns = outcome.turns != null ? ` · ${outcome.turns}t` : "";
  return { id, type: "attempt", step: job, status, title: `job ${jobNumber(job)}`, detail,
    time: `${formatClock(outcome.start)} · ${formatDuration(outcome.end - outcome.start)}${turns}`, mono: true, children: [] };
}

function buildTree() {
  const tasks = [];
  const pick = (predicate) => steps.filter(predicate).sort((a, b) => a.index - b.index);
  const formalizeCalls = pick(s => s.kind === "model_call" && s.role === "captain" && /^formalize/.test(s.label));
  tasks.push({ id: "formalize", key: "formalize", role: "captain", title: "Formalize",
    subtitle: "captain writes Lean statement", algorithm: algorithm[0],
    agents: [agentNode("formalize/a", "captain", "captain", formalizeCalls)] });
  tasks.push({ id: "audit", key: "audit", role: "auditor", title: "Blind read-back",
    subtitle: "delegated to auditor", algorithm: algorithm[1],
    agents: [agentNode("audit/a", "auditor", "auditor", pick(s => s.kind === "model_call" && s.role === "auditor"))] });
  tasks.push({ id: "judge", key: "judge", role: "captain", title: "Faithfulness verdict",
    subtitle: "captain compares with source", algorithm: algorithm[2],
    agents: [agentNode("judge/a", "captain", "captain",
      pick(s => (s.kind === "model_call" && /^judge/.test(s.label)) || s.event === "audit_verdict"))] });
  tasks.push({ id: "sketch", key: "sketch", role: "captain", title: "Proof sketch",
    subtitle: `captain splits proof into ${plural(finalSketch?.lemmas?.length ?? 0, "lemma")}`, algorithm: algorithm[3],
    agents: [agentNode("sketch/a", "captain", "captain", pick(s => s.kind === "model_call" && /^sketch/.test(s.label)))] });
  for (const name of lemmaOrder) {
    const lemmaCalls = calls.filter(c => c.lemma === name);
    const workers = [...new Set(lemmaCalls.map(c => c.worker))].sort((a, b) => a - b);
    const win = lemmaWins.get(name);
    tasks.push({ id: `lemma:${name}`, key: "lemma", lemma: name, role: "solver", title: name, mono: true,
      subtitle: win ? `proved by ${winnerText(win)}` : "not proved",
      status: win ? "ok" : "fail", algorithm: algorithm[4],
      agents: jobsByLemma.has(name)
        ? sampleLanes().map(k => ({ id: `lemma:${name}/s${k}`, type: "agent", role: "solver", title: `solver ${k}`,
            sequence: jobsByLemma.get(name).map((job, i) => sampleNode(job, k, `lemma:${name}/s${k}/${i}`)) }))
        : workers.map(w => agentNode(`lemma:${name}/w${w}`, `solver ${w}`, "solver",
            lemmaCalls.filter(c => c.worker === w).sort((a, b) => a.index - b.index))) });
  }
  const assembleSteps = pick(s => s.stage === "assemble");
  if (assembleSteps.length) {
    tasks.push({ id: "assemble", key: "assemble", role: "lean", title: "Assemble and verify",
      subtitle: "Lean checks the full solution", algorithm: algorithm[6],
      agents: [agentNode("assemble/a", "Lean", "lean", assembleSteps)] });
  }
  return tasks;
}

const tasks = buildTree();
const collapsed = new Set();
let showDeps = true;

// Layout ------------------------------------------------------------------------------

const SIZE = {
  problem: [190, 66], captain: [210, 84], task: [236, 62], agent: [118, 42], attempt: [150, 54],
};
const COLUMN = { problem: 0, captain: 250, task: 560, agent: 870, sequence: 1030 };
const SEQUENCE_GAP = 200, ROW = 66, TASK_GAP = 22;

function layout() {
  const nodes = [], edges = [];
  let cursor = 0;
  for (const task of tasks) {
    const open = !collapsed.has(task.id);
    if (open && task.agents.length) {
      for (const agent of task.agents) {
        agent.x = COLUMN.agent;
        agent.y = cursor + ROW / 2;
        agent.sequence.forEach((a, i) => { a.x = COLUMN.sequence + i * SEQUENCE_GAP; a.y = agent.y; });
        cursor += ROW;
      }
      task.y = (task.agents[0].y + task.agents.at(-1).y) / 2;
    } else {
      task.y = cursor + ROW / 2;
      cursor += ROW;
    }
    task.x = COLUMN.task;
    cursor += TASK_GAP;
  }
  const captain = { id: "captain", type: "captain", x: COLUMN.captain, y: (tasks[0].y + tasks.at(-1).y) / 2 };
  const problemNode = { id: "problem", type: "problem", x: COLUMN.problem, y: captain.y };
  nodes.push(problemNode, captain);
  edges.push({ from: problemNode, to: captain, cls: "", label: "", path: ["problem", "captain"] });

  for (const task of tasks) {
    nodes.push({ ...task, type: "task", ref: task });
    edges.push({ from: captain, to: task, cls: `r-${task.role}`, label: task.role === "captain" ? "" : task.role === "solver" ? "delegates" : task.role === "auditor" ? "delegates" : "", path: ["captain", task.id] });
    if (collapsed.has(task.id)) continue;
    for (const agent of task.agents) {
      nodes.push({ ...agent, type: "agent", parent: task.id });
      edges.push({ from: task, to: agent, cls: `r-${agent.role}`, path: [task.id, agent.id] });
      agent.sequence.forEach((a, i) => {
        nodes.push({ ...a, parent: agent.id, task: task.id });
        const previous = i === 0 ? agent : agent.sequence[i - 1];
        const label = i > 0 && previous.step.kind === "model_call" && previous.step.lemma != null
          ? transitionText(previous.step, a.step) : i > 0 && previous.status === "fail" ? "errors" : "";
        const repair = label === "errors";
        edges.push({ from: previous, to: a, cls: repair ? "repair" : `r-${agent.role}`,
          label, path: [previous.id, a.id] });
      });
    }
  }
  if (showDeps) {
    for (const task of tasks.filter(t => t.key === "lemma")) {
      const proof = lemmaWins.get(task.lemma)?.proof;
      for (const used of lemmaUses(proof, task.lemma)) {
        const target = tasks.find(t => t.lemma === used);
        if (target) edges.push({ from: task, to: target, cls: "dep", label: "uses", dep: true, path: [task.id, target.id] });
      }
    }
  }
  return { nodes, edges };
}

// Rendering ---------------------------------------------------------------------------

const clip = (text, max) => text.length > max ? text.slice(0, max - 1) + "…" : text;
let current = { nodes: [], edges: [] };
let selected = null;

function edgePath(edge) {
  const [fw] = SIZE[edge.from.type || "task"] || SIZE.task;
  const [, th] = SIZE[edge.to.type || "task"] || SIZE.task;
  if (edge.dep) {
    // Lemma dependencies run down the left side of the subtask column.
    const x = edge.from.x, y1 = edge.from.y, y2 = edge.to.y;
    const bend = x - 46 - Math.min(60, Math.abs(y2 - y1) / 6);
    return { d: `M${x},${y1} C${bend},${y1} ${bend},${y2} ${x - 3},${y2}`, lx: bend - 4, ly: (y1 + y2) / 2, anchor: "end" };
  }
  const x1 = edge.from.x + fw, y1 = edge.from.y, x2 = edge.to.x - 3, y2 = edge.to.y;
  const mid = (x1 + x2) / 2;
  if (Math.abs(y1 - y2) < 1) return { d: `M${x1},${y1} H${x2}`, lx: mid, ly: y1 - 8, anchor: "middle" };
  return { d: `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`, lx: mid, ly: (y1 + y2) / 2 - 6, anchor: "middle" };
}

function nodeSVG(node) {
  const [w, h] = SIZE[node.type];
  const top = -h / 2;
  let inner = "", cls = `gnode ${node.type}`;
  if (node.type === "problem") {
    inner = `<text x="14" y="${top + 22}" class="t2">INPUT PROBLEM</text>
      <text x="14" y="${top + 41}" class="t1 mono">${escapeHTML(clip(TRACE.theorem_name || "", 22))}</text>
      <text x="14" y="${top + 57}" class="t3">${escapeHTML(clip(`${problem.source_name} · ${problem.source_subset}`, 26))}</text>`;
  } else if (node.type === "captain") {
    inner = `<text x="16" y="${top + 26}" class="t2">ORCHESTRATOR</text>
      <text x="16" y="${top + 48}" class="t1">Captain</text>
      <text x="16" y="${top + 66}" class="t3">${escapeHTML(clip(`${TRACE.models?.orchestrator} · ${plural(captainCalls.length, "call")}`, 30))}</text>`;
  } else if (node.type === "task") {
    const task = node.ref;
    const attempts = sum(task.agents.map(a => a.sequence.length));
    cls += ` r-${task.role}`;
    inner = `<rect class="stripe r-${task.role}" x="0" y="${top}" width="6" height="${h}" rx="0"></rect>
      <text x="16" y="${top + 24}" class="t1${task.mono ? " mono" : ""}">${escapeHTML(clip(task.title, task.mono ? 27 : 26))}</text>
      <text x="16" y="${top + 42}" class="t2">${escapeHTML(clip(task.subtitle, 36))}</text>
      <text x="16" y="${top + 56}" class="t3">${plural(task.agents.length, "agent")} · ${plural(attempts, "step")}</text>`;
    if (task.agents.length) {
      const folded = collapsed.has(task.id);
      inner += `<g class="toggle" data-toggle="${escapeHTML(task.id)}" transform="translate(${w},0)" role="button" aria-label="${folded ? "Expand" : "Collapse"} ${escapeHTML(task.title)}">
        <circle r="10"></circle><text text-anchor="middle" y="4.5">${folded ? "+" : "−"}</text></g>`;
    }
  } else if (node.type === "agent") {
    inner = `<circle cx="15" cy="0" r="4.5" class="stripe r-${node.role}"></circle>
      <text x="27" y="4.5" class="t1 mono">${escapeHTML(node.title)}</text>`;
  } else {
    cls += ` s-${node.status}`;
    const tone = { win: "s-win", ok: "s-ok", fail: "s-fail", rejected: "s-warn" }[node.status] || "";
    inner = `<text x="12" y="${top + 20}" class="t1${node.mono ? " mono" : ""}">${escapeHTML(clip(node.title, 18))}</text>
      <text x="12" y="${top + 35}" class="t2 status ${tone}">${escapeHTML(node.detail)}</text>
      <text x="12" y="${top + 48}" class="t3">#${node.step.index} · ${node.time}</text>`;
  }
  if (node.id === selected) cls += " sel";
  return `<g class="${cls}" data-node="${escapeHTML(node.id)}" transform="translate(${node.x},${node.y})" tabindex="0" role="button" aria-label="${escapeHTML(node.title || node.type)}">
    <rect class="body" x="0" y="${top}" width="${w}" height="${h}" rx="${node.type === "agent" ? 21 : 8}"></rect>${inner}</g>`;
}

function render() {
  current = layout();
  const edgesSVG = current.edges.map(edge => {
    const { d, lx, ly, anchor } = edgePath(edge);
    const key = edge.path.join("→");
    return `<path class="edge ${edge.cls}" data-edge="${escapeHTML(key)}" d="${d}" marker-end="url(#arrow)"></path>`
      + (edge.label ? `<text class="elabel ${edge.cls}" data-edge="${escapeHTML(key)}" x="${lx}" y="${ly}" text-anchor="${anchor}">${edge.label}</text>` : "");
  }).join("");
  document.getElementById("viewport").innerHTML = `<g>${edgesSVG}</g><g>${current.nodes.map(nodeSVG).join("")}</g>`;
  highlight();
  applyView();
}

// Emphasises the selected node, its ancestors, and its descendants.
function highlight() {
  const svg = document.getElementById("graph");
  svg.classList.toggle("focusing", !!selected);
  if (!selected) return;
  const lit = new Set([selected]);
  const byId = new Map(current.nodes.map(n => [n.id, n]));
  const node = byId.get(selected);
  if (!node) return;
  // Ancestors.
  let cursor = node;
  while (cursor) {
    lit.add(cursor.id);
    const parentId = cursor.type === "attempt" ? cursor.parent : cursor.type === "agent" ? cursor.parent
      : cursor.type === "task" ? "captain" : cursor.type === "captain" ? "problem" : null;
    cursor = parentId ? byId.get(parentId) : null;
  }
  // Descendants, and for an attempt the earlier rounds of its chain.
  for (const n of current.nodes) {
    if (n.id.startsWith(selected + "/")) lit.add(n.id);
    if (node.type === "attempt" && n.parent === node.parent && n.x <= node.x) lit.add(n.id);
    if (node.type === "captain") lit.add(n.id);
  }
  document.querySelectorAll("#viewport .gnode").forEach(g => g.classList.toggle("lit", lit.has(g.dataset.node)));
  document.querySelectorAll("#viewport [data-edge]").forEach(e => {
    const [a, b] = e.dataset.edge.split("→");
    e.classList.toggle("lit", lit.has(a) && lit.has(b));
  });
}

// Pan and zoom ------------------------------------------------------------------------

const view = { x: 40, y: 40, k: 1 };

function applyView() {
  document.getElementById("viewport").setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
}

function zoomAt(factor, px, py) {
  const k = Math.min(2.5, Math.max(0.15, view.k * factor));
  view.x = px - (px - view.x) * (k / view.k);
  view.y = py - (py - view.y) * (k / view.k);
  view.k = k;
  applyView();
}

function fit() {
  const stage = document.getElementById("stage").getBoundingClientRect();
  const xs = current.nodes.flatMap(n => [n.x, n.x + SIZE[n.type][0]]);
  const ys = current.nodes.flatMap(n => [n.y - SIZE[n.type][1] / 2, n.y + SIZE[n.type][1] / 2]);
  const minX = Math.min(...xs) - 80, maxX = Math.max(...xs) + 30;
  const minY = Math.min(...ys) - 20, maxY = Math.max(...ys) + 20;
  const top = 64, bottom = 64;
  const k = Math.min(1.1, stage.width / (maxX - minX), (stage.height - top - bottom) / (maxY - minY));
  view.k = Math.max(0.15, k);
  view.x = (stage.width - (maxX - minX) * view.k) / 2 - minX * view.k;
  view.y = top + (stage.height - top - bottom - (maxY - minY) * view.k) / 2 - minY * view.k;
  applyView();
}

function installPanZoom() {
  const stage = document.getElementById("stage");
  const pointers = new Map();
  let drag = null, pinch = null;
  const local = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

  stage.addEventListener("wheel", event => {
    event.preventDefault();
    const [px, py] = local(event);
    zoomAt(Math.exp(-event.deltaY * (event.ctrlKey ? 0.01 : 0.0015)), px, py);
  }, { passive: false });

  stage.addEventListener("pointerdown", event => {
    if (event.target.closest(".overlay")) return;
    pointers.set(event.pointerId, local(event));
    if (pointers.size === 1) {
      drag = { start: local(event), origin: { x: view.x, y: view.y }, moved: false, target: event.target };
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { distance: Math.hypot(a[0] - b[0], a[1] - b[1]), k: view.k };
      drag = null;
    }
  });
  stage.addEventListener("pointermove", event => {
    if (!pointers.has(event.pointerId)) return;
    pointers.set(event.pointerId, local(event));
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const distance = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt(pinch.k * distance / pinch.distance / view.k, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      return;
    }
    if (!drag) return;
    const [x, y] = local(event);
    const dx = x - drag.start[0], dy = y - drag.start[1];
    if (!drag.moved && Math.hypot(dx, dy) > 4) {
      drag.moved = true;
      stage.classList.add("dragging");
      stage.setPointerCapture(event.pointerId);
    }
    if (drag.moved) {
      view.x = drag.origin.x + dx;
      view.y = drag.origin.y + dy;
      applyView();
    }
  });
  const end = event => {
    if (!pointers.has(event.pointerId)) return;
    pointers.delete(event.pointerId);
    if (pointers.size < 2) pinch = null;
    if (drag && !drag.moved && event.type === "pointerup") activate(drag.target);
    if (pointers.size === 0) { drag = null; stage.classList.remove("dragging"); }
  };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);
}

// A click that was not a drag: fold a subtask, or open a node's record.
function activate(target) {
  const toggle = target.closest?.("[data-toggle]");
  if (toggle) {
    const id = toggle.dataset.toggle;
    collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    render();
    return;
  }
  const g = target.closest?.("[data-node]");
  if (!g) {
    selected = null;
    render();
    return;
  }
  selected = g.dataset.node;
  render();
  openNode(current.nodes.find(n => n.id === selected));
}

// Node records ------------------------------------------------------------------------

function sequenceSteps(agents) {
  return agents.flatMap(a => a.sequence.flatMap(n => {
    const check = n.step.kind === "model_call" ? checkOfCall.get(n.step.index) : null;
    return check ? [n.step, check] : [n.step];
  })).sort((a, b) => a.index - b.index);
}

function taskBody(task) {
  const parts = [];
  if (task.algorithm) parts.push(`<p>${inlineCode(task.algorithm.description)}</p>`);
  const form = eventsOf("formalization_compiled").at(-1);
  const verdict = eventsOf("audit_verdict").at(-1);
  if (task.key === "formalize" && form) {
    parts.push(`<div class="tagblock"><span class="tagname">theorem statement</span>${leanHTML(form.statement || "")}</div>`,
      `<details class="fold"><summary><b>Definitions</b></summary><div class="body">${leanHTML(form.definitions || "", new Set(), "tall")}</div></details>`);
  }
  if (task.key === "audit" && verdict) {
    parts.push(`<p class="note">The auditor received only the Lean code, not the source.</p>`,
      `<div class="tagblock"><span class="tagname">read-back</span><div class="prose">${mathHTML(verdict.readback || "")}</div></div>`);
  }
  if (task.key === "judge" && verdict) {
    parts.push(`<div class="two"><div class="panel"><span class="eyebrow">Source statement</span><div class="prose">${mathHTML(propositionText())}</div></div>
      <div class="panel"><span class="eyebrow">Read-back</span><div class="prose">${mathHTML(verdict.readback || "")}</div></div></div>`,
      `<div style="display:flex;gap:8px;align-items:center">${stepResult(verdict)}</div><div class="prose">${mathHTML(verdict.issues || "")}</div>`);
  }
  if (task.key === "sketch" && finalSketch) {
    parts.push(`<div class="tagblock"><span class="tagname">lemmas, delegated to solvers</span>${leanHTML((finalSketch.lemmas || []).map(l => l + " := by sorry").join("\n\n"))}</div>`,
      `<div class="tagblock"><span class="tagname">main proof from the lemmas</span>${leanHTML(finalSketch.main_proof || "")}</div>`);
  }
  if (task.key === "lemma") {
    const statement = (finalSketch?.lemmas || []).find(l => lemmaName(l) === task.lemma);
    const win = lemmaWins.get(task.lemma);
    const lemmaCalls = calls.filter(c => c.lemma === task.lemma);
    const states = lemmaCalls.map(c => solverOutcome(c).state);
    parts.push(`<div class="stats">
        <div class="stat"><span class="v">${lemmaCalls.length}</span><span class="k">solver calls</span></div>
        <div class="stat"><span class="v">${states.filter(s => s === "fail").length}</span><span class="k">with Lean errors</span></div>
        <div class="stat"><span class="v">${states.filter(s => s === "late").length}</span><span class="k">discarded</span></div>
        <div class="stat"><span class="v">${formatUSD(sum(lemmaCalls.map(c => c.cost_usd)))}</span><span class="k">cost</span></div></div>`);
    if (statement) parts.push(`<div class="tagblock"><span class="tagname">statement</span>${leanHTML(statement)}</div>`);
    if (win) parts.push(`<div class="tagblock"><span class="tagname">kept proof · ${winnerText(win)} ${stepLink(win)}</span>${leanHTML(win.proof || "")}</div>`);
    const uses = lemmaUses(win?.proof, task.lemma);
    if (uses.length) parts.push(`<p class="muted">The proof uses ${uses.map(u => `<code>${escapeHTML(u)}</code>`).join(", ")}.</p>`);
  }
  if (task.key === "assemble") {
    const checksResult = eventsOf("final_verification").at(-1)?.checks || {};
    parts.push(`<table class="kv">${Object.entries(checksResult).filter(([, v]) => typeof v === "boolean")
      .map(([k, v]) => `<tr><td class="num">${k}</td><td>${v ? `<span class="pill ok">pass</span>` : `<span class="pill fail">fail</span>`}</td></tr>`).join("")}</table>`);
  }
  parts.push(`<h3>Steps</h3>${stepList(sequenceSteps(task.agents))}`);
  return parts.join("");
}

function openNode(node) {
  if (!node) return;
  if (node.type === "attempt") return showStep(node.step.index);
  if (node.type === "problem") {
    return showDrawer(summaryHead("Input problem", `<span><b>${escapeHTML(problem.uuid)}</b></span>`, "decision"),
      `<div class="tagblock"><span class="tagname">informal statement</span><div class="prose">${mathHTML(problem.informal_statement || "")}</div></div>
       <div class="tagblock"><span class="tagname">informal proof</span><div class="prose">${mathHTML(problem.informal_proof || "")}</div></div>`);
  }
  if (node.type === "captain") {
    const delegated = tasks.filter(t => t.role !== "captain");
    return showDrawer(summaryHead("Captain", `<span>model <b>${escapeHTML(TRACE.models?.orchestrator)}</b></span><span>calls <b>${captainCalls.length}</b></span><span>cost <b>${formatUSD(sum(captainCalls.map(c => c.cost_usd)))}</b></span>`, "captain"),
      `<p>The captain is the orchestrating model. It performs the steps whose errors would propagate
       to everything downstream (the formal statement, the faithfulness verdict, the proof plan) and
       delegates ${plural(delegated.length, "subtask")} to cheaper worker models: the blind read-back
       to the auditor and each lemma to ${cfg.workers ?? "N"} parallel solvers.</p>
       <h3>Captain calls</h3>${stepList(captainCalls)}
       <details class="fold"><summary><b>System prompt</b></summary><div class="body">${markdownHTML(TRACE.system_prompts?.captain || "")}</div></details>`);
  }
  if (node.type === "task") {
    const task = node.ref;
    return showDrawer(summaryHead(`${task.mono ? `<code>${escapeHTML(task.title)}</code>` : escapeHTML(task.title)}`,
      `<span>${escapeHTML(task.subtitle)}</span>`, task.role), taskBody(task));
  }
  if (node.type === "agent") {
    const task = tasks.find(t => t.id === node.parent);
    const agent = task.agents.find(a => a.id === node.id);
    const agentCalls = agent.sequence.map(a => a.step).filter(s => s.kind === "model_call");
    return showDrawer(summaryHead(`${escapeHTML(agent.title)} · ${escapeHTML(task.title)}`,
      `<span>${plural(agentCalls.length, "call")}</span><span>cost <b>${formatUSD(sum(agentCalls.map(c => c.cost_usd)))}</b></span>`, agent.role),
      `${agent.role === "solver" ? `<p>One solver chain. Each round sends the lemma and, after a failure, the previous proof with Lean's error messages.</p>` : ""}
       ${stepList(sequenceSteps([agent]))}`);
  }
}

// Start -------------------------------------------------------------------------------

function init() {
  renderHeader();
  installDrawerHandlers();
  installPanZoom();
  render();
  fit();
  const zoomCenter = factor => {
    const r = document.getElementById("stage").getBoundingClientRect();
    zoomAt(factor, r.width / 2, r.height / 2);
  };
  document.getElementById("zoom-in").addEventListener("click", () => zoomCenter(1.25));
  document.getElementById("zoom-out").addEventListener("click", () => zoomCenter(0.8));
  document.getElementById("fit").addEventListener("click", fit);
  const collapseButton = document.getElementById("collapse");
  collapseButton.addEventListener("click", () => {
    const lemmaIds = tasks.filter(t => t.key === "lemma").map(t => t.id);
    const allFolded = lemmaIds.every(id => collapsed.has(id));
    lemmaIds.forEach(id => allFolded ? collapsed.delete(id) : collapsed.add(id));
    collapseButton.textContent = allFolded ? "Collapse solvers" : "Expand solvers";
    render();
    fit();
  });
  const depsButton = document.getElementById("deps");
  depsButton.addEventListener("click", () => {
    showDeps = !showDeps;
    depsButton.setAttribute("aria-pressed", showDeps);
    render();
  });
  document.addEventListener("keydown", event => {
    if (drawerOpen || event.metaKey || event.ctrlKey || event.altKey) return;
    const node = event.target.closest?.("[data-node]");
    if (node && (event.key === "Enter" || event.key === " ")) {
      event.preventDefault();
      activate(node);
      document.querySelector(`[data-node="${CSS.escape(node.dataset.node)}"]`)?.focus();
    } else if (event.key === "+" || event.key === "=") zoomCenter(1.25);
    else if (event.key === "-") zoomCenter(0.8);
    else if (event.key === "0") fit();
    else if (event.key === "Escape" && selected) { selected = null; render(); }
  });
  window.addEventListener("resize", () => fit());
}

init();
</script>
