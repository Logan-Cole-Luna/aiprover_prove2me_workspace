<title>gsimple_x_inverse proof run</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eceef3;
  --ink: #161b26;
  --muted: #586176;
  --line: #d8dce4;
  --accent: #3a46b8;
  --accent-soft: #e4e6f7;
  --captain: #3a46b8;
  --auditor: #9b3f7e;
  --solver: #0b7a70;
  --lean: #8a6a1f;
  --ok: #1e7b45;
  --ok-soft: #dcefe3;
  --fail: #b4322b;
  --fail-soft: #f6dedc;
  --warn: #9a6200;
  --warn-soft: #f5e8cf;
  --code-bg: #f7f8fb;
  --err-line: #fbe6e4;
  --kw: #3a46b8;
  --cm: #6f7788;
  --str: #0b7a70;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-prose: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --font-mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1218; --surface: #171b24; --surface-2: #202533; --ink: #e5e8ef;
    --muted: #9aa3b5; --line: #2d3342; --accent: #939cf3; --accent-soft: #252a4a;
    --captain: #939cf3; --auditor: #da8cc1; --solver: #4fc7b8; --lean: #d4b366;
    --ok: #5cc98a; --ok-soft: #173325; --fail: #f07b71; --fail-soft: #3a1c1b;
    --warn: #e2ab44; --warn-soft: #3a2c12; --code-bg: #12151c; --err-line: #3a1c1b;
    --kw: #a5adf6; --cm: #7d8698; --str: #62cfc1;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1218; --surface: #171b24; --surface-2: #202533; --ink: #e5e8ef;
  --muted: #9aa3b5; --line: #2d3342; --accent: #939cf3; --accent-soft: #252a4a;
  --captain: #939cf3; --auditor: #da8cc1; --solver: #4fc7b8; --lean: #d4b366;
  --ok: #5cc98a; --ok-soft: #173325; --fail: #f07b71; --fail-soft: #3a1c1b;
  --warn: #e2ab44; --warn-soft: #3a2c12; --code-bg: #12151c; --err-line: #3a1c1b;
  --kw: #a5adf6; --cm: #7d8698; --str: #62cfc1;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  margin: 0;
}
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; }
h2 { font-size: 1.6rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
code, pre, .mono { font-family: var(--font-mono); font-size: 0.84em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; }

/* Page frame ---------------------------------------------------------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
}
.topbar .run { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }
.topbar .thm { font-weight: 600; font-family: var(--font-mono); font-size: 0.95rem; }
.topbar .spacer { flex: 1; }
.frame {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  gap: 32px;
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 28px 96px;
}
nav.chapters {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 2px;
  counter-reset: chapter;
}
nav.chapters button {
  display: grid;
  grid-template-columns: 26px 1fr;
  align-items: baseline;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 6px;
  padding: 7px 10px;
  cursor: pointer;
  color: var(--muted);
}
nav.chapters button .n { font-family: var(--font-mono); font-size: 0.78rem; }
nav.chapters button:hover { background: var(--surface-2); color: var(--ink); }
nav.chapters button[aria-current="step"] {
  background: var(--accent-soft);
  color: var(--ink);
  font-weight: 600;
}
main { min-width: 0; }
.chapter { display: flex; flex-direction: column; gap: 22px; max-width: 900px; }
.eyebrow {
  font-size: 0.74rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
.lead { font-size: 1.05rem; color: var(--ink); }
.muted { color: var(--muted); }
.stepper {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 15;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.stepper .where { font-size: 0.85rem; color: var(--muted); min-width: 12ch; text-align: center; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }

/* Building blocks ----------------------------------------------------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 2px 9px;
  border-radius: 999px;
  white-space: nowrap;
}
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.fail { background: var(--fail-soft); color: var(--fail); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.role { font-weight: 600; }
.role.captain { color: var(--captain); }
.role.auditor, .role.reviewer { color: var(--auditor); }
.role.solver { color: var(--solver); }
.role.lean { color: var(--lean); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.captain { background: var(--captain); }
.dot.auditor, .dot.reviewer { background: var(--auditor); }
.dot.solver { background: var(--solver); }
.dot.lean { background: var(--lean); }
.dot.decision { background: var(--muted); }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.stat { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 0.78rem; color: var(--muted); }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.algo { display: grid; grid-template-columns: minmax(0, 620px) minmax(220px, 1fr); gap: 16px; align-items: start; }
.prose { font-family: var(--font-prose); font-size: 1.02rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.prose math[display="block"] { margin: 0.5em 0; overflow-x: auto; }
.prose code { font-size: 0.8em; background: var(--surface-2); padding: 0 4px; border-radius: 3px; }
.prose .intertext { display: block; }
.prose ul { margin: 0.25em 0; padding-left: 1.4em; white-space: normal; }
.prose li { white-space: pre-wrap; }
.prose pre.tex { margin: 0.5em 0; white-space: pre-wrap; font-size: 0.85rem; }

pre.lean {
  margin: 0;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 0;
  overflow: auto;
  max-height: 460px;
  font-size: 0.8rem;
  line-height: 1.5;
}
pre.lean.tall { max-height: 640px; }
pre.lean .line { display: block; padding-inline: 12px 16px; white-space: pre; }
pre.lean .line .no {
  display: inline-block;
  width: 3.2ch;
  margin-right: 12px;
  text-align: right;
  color: var(--cm);
  user-select: none;
  opacity: 0.7;
}
pre.lean .line.err { background: var(--err-line); }
pre.lean .kw { color: var(--kw); font-weight: 600; }
pre.lean .cm { color: var(--cm); font-style: italic; }
pre.lean .st { color: var(--str); }
pre.lean .sorry { color: var(--warn); font-weight: 600; background: var(--warn-soft); border-radius: 3px; }
pre.plain {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 0.8rem;
  max-height: 460px;
  overflow: auto;
}
pre.plain.errors { border-color: var(--fail); color: var(--fail); }
.placeholder { color: var(--accent); font-weight: 600; }

.tagblock { display: flex; flex-direction: column; gap: 4px; }
.tagname { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }

details.fold { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.fold > summary {
  cursor: pointer;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  align-items: baseline;
  list-style: none;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; color: var(--muted); width: 1ch; }
details.fold[open] > summary::before { content: "▾"; }
details.fold > .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }

.md h1, .md h2, .md h3, .md h4 { font-size: 1rem; margin-top: 0.6em; }
.md p, .md li { max-width: 72ch; }
.md ul { margin: 0; padding-left: 1.3em; }
.md code { background: var(--surface-2); padding: 0 4px; border-radius: 3px; }
.md { display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; }

/* Step list ------------------------------------------------------------ */
.steps { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.steprow {
  display: grid;
  grid-template-columns: 44px 58px 18px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 8px 12px;
  border: 0;
  border-top: 1px solid var(--line);
  background: none;
  text-align: left;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.steprow:first-child { border-top: 0; }
.steprow:hover { background: var(--surface-2); }
.steprow .idx { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.steprow .t { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.steprow .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steprow .what .lbl { font-family: var(--font-mono); font-size: 0.82rem; }
.steplink {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 4px;
  padding: 0 5px;
  cursor: pointer;
  color: var(--accent);
}
.steplink:hover { border-color: var(--accent); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 3px 11px;
  font-size: 0.82rem;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Algorithm diagram ----------------------------------------------------- */
.diagram-wrap { overflow-x: auto; }
svg.flow { width: 100%; max-width: 620px; min-width: 520px; height: auto; display: block; }
svg.flow .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
svg.flow .node { cursor: pointer; }
svg.flow .node:hover rect, svg.flow .node:focus-visible rect { stroke: var(--accent); }
svg.flow .node.sel rect { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
svg.flow .node:focus { outline: none; }
svg.flow text { fill: var(--ink); font-family: var(--font-ui); }
svg.flow .title { font-size: 14px; font-weight: 600; }
svg.flow .actor { font-size: 11.5px; }
svg.flow .count { font-size: 11px; fill: var(--muted); font-family: var(--font-mono); }
svg.flow .edge { stroke: var(--muted); stroke-width: 1.3; fill: none; }
svg.flow .edge.loop { stroke-dasharray: 4 3; }
svg.flow .elabel { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
svg.flow .elabel.hot { cursor: pointer; fill: var(--accent); text-decoration: underline; }
svg.flow .arrowhead { fill: var(--muted); }
svg.flow .c-captain { fill: var(--captain); }
svg.flow .c-auditor, svg.flow .c-reviewer { fill: var(--auditor); }
svg.flow .c-solver { fill: var(--solver); }
svg.flow .c-lean { fill: var(--lean); }
svg.flow .c-data { fill: var(--muted); }

table.kv { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.kv th, table.kv td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
table.kv th { font-weight: 500; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; border-top: 0; }
table.kv td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.phasebar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.phasebar div {
  display: flex; align-items: center; justify-content: center;
  font-size: 0.74rem; font-weight: 500; white-space: nowrap; overflow: hidden;
  color: var(--surface); min-width: 2px;
}
.ph-formalize { background: var(--captain); }
.ph-sketch { background: var(--auditor); }
.ph-prove { background: var(--solver); }
.ph-assemble { background: var(--lean); }
.phaselegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--muted); }
.phaselegend span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.phaselegend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

dl.gloss { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
dl.gloss dt { font-weight: 600; font-family: var(--font-mono); font-size: 0.86rem; }
dl.gloss dd { margin: 0; max-width: 64ch; }

.lemma { display: flex; flex-direction: column; gap: 8px; }
.lemma .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.lemma .head .name { font-family: var(--font-mono); font-weight: 600; }

.checks { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.check { display: grid; grid-template-columns: 22px 170px 1fr; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.check:first-child { border-top: 0; }
.check .mark { font-weight: 700; }
.check .mark.ok { color: var(--ok); }
.check .mark.fail { color: var(--fail); }
.check .name { font-family: var(--font-mono); font-size: 0.85rem; }

/* Solver timeline -------------------------------------------------------- */
.gantt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.gantt { min-width: 680px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 10px; }
.g-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; }
.g-row .lab { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }
.g-track { position: relative; height: 26px; }
.g-track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line); }
.g-group { display: flex; flex-direction: column; gap: 2px; }
.g-group .gh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-bottom: 2px; }
.g-group .gh .name { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; }
.bar {
  position: absolute;
  top: 4px;
  height: 18px;
  border-radius: 3px;
  border: 1px solid transparent;
  padding: 0 4px;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  line-height: 16px;
  color: var(--surface);
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  min-width: 6px;
}
.bar.ok { background: var(--ok); }
.bar.fail { background: var(--fail); }
.bar.rejected { background: var(--warn); }
.bar.pending { background: var(--muted); }
.bar.win { background: var(--ok); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ok); }
.bar.late {
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 4px, var(--surface) 4px 8px);
  border: 1px dashed var(--muted);
  color: var(--muted);
}
.bar:hover, .bar:focus-visible { filter: brightness(1.12); z-index: 2; }
.winline { position: absolute; top: -2px; bottom: -2px; border-left: 2px solid var(--ok); pointer-events: none; }
.g-axis { position: relative; height: 18px; }
.g-axis span {
  position: absolute; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend .sw { width: 18px; height: 10px; border-radius: 2px; display: inline-block; position: relative; }

/* Step drawer ------------------------------------------------------------ */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 18, 0.35); z-index: 40; }
aside.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(780px, 100%);
  z-index: 50;
  background: var(--bg);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  transition: transform 180ms ease;
}
aside.drawer[hidden] { display: none !important; }
.drawer-head {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.drawer-head .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.drawer-head .row .spacer { flex: 1; }
.drawer-head h3 { font-family: var(--font-mono); font-size: 0.98rem; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 500; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.tabs button {
  background: none; border: 0; padding: 7px 12px; cursor: pointer;
  border-bottom: 2px solid transparent; color: var(--muted); font-size: 0.9rem;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.note { font-size: 0.86rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; max-width: 70ch; }

@media (max-width: 900px) {
  .frame { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 14px 96px; }
  nav.chapters {
    position: static;
    flex-direction: row;
    overflow-x: auto;
    gap: 4px;
    padding-bottom: 4px;
  }
  nav.chapters button { grid-template-columns: auto auto; gap: 6px; white-space: nowrap; }
  .two, .algo { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .topbar { padding: 8px 16px; }
  .frame { padding-inline: 16px; }
  .check { grid-template-columns: 22px 1fr; }
  .check .desc { grid-column: 2; }
  .steprow { grid-template-columns: 38px 18px minmax(0, 1fr) auto; }
  .steprow .t { display: none; }

or subgroup of a group $G$. Relations are referred to by their tags, e.g. (Re:1a).\n\n[Formalization note from the problem set: the statements and proofs use $c$ only through the index set $E$, and Theorem 3.3 uses $(0,2,k),(1,2,k)\\in E$ for some $k$, i.e. $c(2)\\geq 1$ (indeed $c(2)=21493760$). A formalization may take $c:\\mathbb{N}\\to\\mathbb{N}$ as a parameter, with the hypothesis $c(2)\\geq 1$ where it is needed, instead of defining the coefficients of $J$.]\n\nCorollary 3.2 (book label `cor: gsimple x inverse`).\n\n\\begin{corollary} For all $u\\in\\mathbb{C}$, $X_{-1}(u)^{-1}=X_{-1}(-u)$.\n\\end{corollary}", "informal_proof": "\\begin{proof} By (Re:1a)\n  $$X_{-1}(u+v)^{-1}\\,X_{-1}(u)\\,X_{-1}(v)=1$$\n  or \n  $$X_{-1}(u)\\,X_{-1}(v)=X_{-1}(u+v)$$\n    Setting $v=-u$ and applying Lemma 3.1, we obtain \n $$X_{-1}(u)\\,X_{-1}(-u)=X_{-1}(0)=1.$$\n Thus $X_{-1}(u)^{-1}=X_{-1}(-u)$.\n\\end{proof}"}, "theorem_name": "gsimple_x_inverse", "models": {"orchestrator": "claude-sonnet-5-5", "worker": "aiprover"}, "agents": {"reviewer": {"backend": "claude_cli", "model": "claude-opus-5-5", "effort": "high", "timeout": 2400, "max_output_tokens": 128000}, "writer": {"backend": "claude_cli", "model": "claude-opus-5-5", "effort": "high", "timeout": 2400, "max_output_tokens": 128000}, "captain": {"backend": "claude_cli", "model": "claude-sonnet-5-5", "effort": "", "timeout": 2400, "max_output_tokens": 0}, "auditor": {"backend": "claude_cli", "model": "claude-sonnet-5-5", "effort": "", "timeout": 900, "max_output_tokens": 0}, "solver": {"backend": "aiprover", "model": "aiprover", "config": "aiprover/aiprover_vista_logged.toml", "cli": "AIProver/AIProver_plugin/bin/aiprover", "timeout": 5400, "max_turns": 200, "env": {}}}, "config": {"agents": {"captain": {"backend": "claude_cli", "model": "claude-sonnet-5-5", "timeout": 2400}, "auditor": {"backend": "claude_cli", "model": "claude-sonnet-5-5"}, "reviewer": {"backend": "claude_cli", "model": "claude-opus-5-5", "timeout": 2400, are reused."}, {"stage": "assemble", "actor": "Lean", "description": "Splice proofs into the sketch and verify: compiles, no `sorry`, only standard axioms, and the solution's type equals the target theorem's type (checked in a module importing both)."}, {"stage": "review", "actor": "reviewer (independent model)", "description": "Referee the verified file against the source: definitions, statement, and the proof's correspondence with the source proof. A run is proved only with verdict FAITHFUL."}, {"stage": "report", "actor": "writer, reviewer", "description": "LaTeX report and PDF: the writer states the mathematics, the Lean code is inserted verbatim, the reviewer checks each statement against its Lean code, and the writer corrects the discrepancies."}], "lean_environment": {"toolchain": "leanprover/lean4:v4.23.0", "mathlib": "37df177aaa770670452312393d4e84aaad56e7b6", "file_header": "import Mathlib\nset_option autoImplicit false\n\n"}, "system_prompts": {"captain": "You are the captain of a Lean 4 formalization mission. You formalize mathematics faithfully, audit formalizations against their source, and decompose proofs into lemmas that are delegated to solver agents.\n\nLean environment: Lean 4 v4.23.0 with Mathlib (v4.23.0), `import Mathlib` and `set_option autoImplicit false` are already in the file header. Do not write `import` lines.\n\nFaithfulness principles (from the prove2me captain playbook):\n1. Read the whole setting, not just the theorem. Every standing assumption of the setting is part of the statement or of the definitions.\n2. Match hypotheses and conclusions in both directions. A fact the source proves is never a hypothesis.\n3. Quantify over exactly the source's objects.\n4. Evaluate the statement at edge inputs; a statement that holds only vacuously is wrong even though it is provable.\n5. Definitions first: a wrong definition makes every theorem using it wrong.\n6. Proof difficulty is not your concern when stating a theorem; never weaken a statement to make it easier to prove.\n7. When the source asserts derivability in a formal theory (T ⊢ φ), formalize the theory's proof system as an inductive derivability relation over a syntax of terms or formulas. Proving that φ holds in a model is a different, weaker theorem.\n\nReply only in the tagged format requested by each message. Put Lean code inside the tags without Markdown fences.", "auditor": "# Role: Mission Auditor — Writing Read-backs\n\nA **read-back** is a natural-language rendering of what a Lean 4 declaration *literally asserts* — the artifact's own testimony. A read-back is not a summary and not an explanation. Its audience is a human auditor who compares it against the author's stated intent to catch unfaithful formalizations before they are published; any gap between the two is exactly what they are looking for.\n\nRead-backs are attached to draft theorem/definition items in a mission proposal (see [mission_captain.md](mission_captain.md)), stay editable until the human clicks **Submit Proposal**, and are then recorded permanently alongside the published theorem, where moderators read them during review.\n\n## Independence is the point\n\nA read-back is only useful if it is written blind. If you are the mission captain, do not write your own read-backs — launch an **independent sub-agent** with a fresh context, and give it *only*:\n\n- the Lean code of the declaration: its `formal_statement` (or the definition's code), plus the `preamble` it depends on;\n- this file.\n\nNever give the auditor the informal statement, the source material, the mission pitch, or your own intent. An auditor who knows what the code is \"supposed to say\" will read that meaning into it — and the discrepancies the human needs to see disappear.\n\n## The principles\n\nYou are writing a **read-back** for a Lean 4 declaration: a natural-language rendering of what the code literally asserts. Follow these principles:\n\n1. **Translate the code, not the intent.** State only what the Lean statement actually says. Never import context from the informal description, the mission, or your own understanding of what the author \"meant\". If the code says less than the intent, your read-back must say less.\n\n2. **Account for every binder and hypothesis.** Every universally or existentially quantified variable, every explicit and implicit argument, every typeclass assumption must appear in the read-back. Omitting a hypothesis is the worst failure mode.\n\n3. **Expand non-standard definitions.** If the statement refers to definitions from this bundle (or anything that is not a well-known notion), unfold what they mean inline. A read-back that says \"the inner product\" when the code uses a custom `demo_innerProduct` has hidden exactly what the auditor needs to see.\n\n4. **Surface degenerate and edge cases.** Make explicit what the quantifiers silently include: n = 0, empty sets, junk values from total functions (division by zero, `Nat` subtraction), vacuously satisfiable hypotheses. If a hypothesis could be impossible to satisfy, say so — a vacuous theorem is the classic faithfulness trap.\n\n5. **Preserve logical precision.** Keep the exact strength of every connective: ≤ vs <, ∃ vs ∃!, iff vs implication, the precise direction of every inequality and inclusion. Do not round to the \"morally equivalent\" claim.\n\n6. **Write for a mathematician who does not read Lean.** Plain mathematical English, standard notation where it helps. Try not to mention Lean syntax. Write in **Markdown+KaTex**; use lists and display blocks to make it clear. Avoid using sem-Lean ASCII. More importantly, use real math notation instead of Lean syntax. For example, write $P_i$ instead of P i; write $A^{m, n}$ instead of A m n.\n\n7. **No judgment, no advocacy.** Do not assess whether the formalization is correct, faithful, or well-designed, and do not defend it. Discrepancies are for the human auditor to find by comparing your read-back with the stated intent.\n\n\n## Format of read-back\n\nYour read-back should adhere to the following standard.\n\n1. **One self-contained paragraph per declaration.** The read-back must be understandable without opening the source file. Prefer completeness over elegance; this is fine print, not prose.\n\n2. **Escape every LaTeX backslash in the JSON payload.** JSON forbids a raw backslash in a string, so write `\\\\mu`, `\\\\frac`, `\\\\ge` in the request body; the platform stores and renders them as `\\mu`, `\\frac`, `\\ge`. A single raw backslash (e.g. `\"$\\mu$\"` typed literally) makes the whole request fail with a JSON parse error like `Bad escaped character in JSON`. Every example in this file is written in this payload form (`\\\\ge`, `\\\\nu`); the platform renders them with single backslashes.\n\n3. Use standard mathematical notation and KaTeX. Replace unreadable Lean expressions such as `banditMeasure ν π n` with conventional notation `$B_{\\\\nu,\\\\pi}^n$` and explain their meaning.\n\n4. Give context for every variable and symbol in the theorem.\n\n5. Use display-math block properly to increase readability.\n\n6. Use paragraph breaks properly for readability.\n\n## Attaching the read-back\n\nThe captain attaches the auditor's output to the draft item via the `readback` field, with `readback_model` naming the model that wrote it (e.g. `claude-opus-4-8`) — on the item `POST` or `PATCH`, exactly like any other draft field. See **Read-backs** in [mission_captain.md](mission_captain.md) for the endpoint mechanics. Read-backs apply to draft `theorem`/`definition` items only — `reference` items point at already-published content and take none.\n\nRe-run the auditor after any edit to the Lean statement: a read-back of an older version of the code is worse than none, because it testifies about the wrong artifact.\n", "solver": "You are a Lean 4 proof engineer on a formalization mission. You prove one lemma at a time.\n\nLean environment: Lean 4 v4.23.0 with Mathlib (v4.23.0), `import Mathlib` and `set_option autoImplicit false` are already in the file header. Do not write `import` lines.\n\nRules that gate every submission:\n1. Do not change the lemma statement; you write only its proof.\n2. No `sorry`, `admit`, `axiom`, `opaque`, `native_decide`, macros or other ways of bypassing the kernel.\n3. Helper lemmas are allowed; each helper name must start with the target lemma name followed by `_`.\n\nReply only in the tagged format requested. Put Lean code inside the tags without Markdown fences.", "reviewer": "You are an independent referee of a machine-checked formal proof. You did not write it and have no stake in its acceptance. Lean has already verified that the file compiles, contains no `sorry`, uses only the standard axioms, and that `solution` has exactly the type of the target theorem. You judge what Lean cannot: whether the target theorem and the definitions it depends on state the source result faithfully, and whether the proof establishes it by legitimate means.\n\nLean environment: Lean 4 v4.23.0 with Mathlib (v4.23.0), `import Mathlib` and `set_option autoImplicit false` are already in the file header. Do not write `import` lines.\n\nPrinciples:\n1. Read the whole setting. Every standing assumption of the source is part of the statement or the definitions; nothing the source proves is a hypothesis.\n2. Compare hypotheses and conclusions in both directions; quantification is over exactly the source's objects.\n3. Evaluate definitions at edge inputs. A statement that holds vacuously, or because a definition is degenerate (an empty relation set, a trivial group, a predicate that is always false), is unfaithful even though it is proved.\n4. A parameter or hypothesis that replaces a concrete object of the source (for example, a sequence given by a formula) is acceptable only if the theorem then implies the source's statement; say exactly what must be supplied to recover it.\n5. Report what you checked and what you found; do not speculate beyond the code. Be precise and brief.", "writer": "You write the mathematical exposition of machine-checked proofs for research mathematicians. You state exactly what the formal code states, in standard notation, and give each proof at the level of a careful paper proof. You never claim more than the code establishes, and you write LaTeX that compiles with pdfLaTeX.\n\nLean environment: Lean 4 v4.23.0 with Mathlib (v4.23.0), `import Mathlib` and `set_option autoImplicit false` are already in the file header. Do not write `import` lines."}, "prompt_templates": {"AIPROVER_LEMMA_TEMPLATE": "Prove the lemma `{lemma_name}`, whose Lean statement is fixed below. It is one step in the proof of the following result; the Lean definitions in the Setting encode that result's objects and rules, and the earlier lemmas given there may be used as facts.\n\n{informal_statement}", "AUDITOR_TEMPLATE": "Write the read-back for the declaration `{theorem_name}` in the Lean code below. The definitions it depends on are included; expand them inline as the principles require. Reply with the read-back only.\n\n<lean_code>\n{lean_code}\n<\/lean_code>", "FINAL_REVIEW_TEMPLATE": "Referee the formal proof below against its source.\n\n<informal_statement>\n{informal_statement}\n<\/informal_statement>\n\n<informal_proof>\n{informal_proof}\n<\/informal_proof>\n\n<target_statement>\n{target_statement}\n<\/target_statement>\n\n<lean_solution>\n{lean_solution}\n<\/lean_solution>\n\nWrite each section in LaTeX text mode, ready to be typeset: mathematics in $...$ or \\[...\\], Lean identifiers as \\leanname{{name}}, no Unicode mathematical symbols, no Markdown, no other macros or packages.\n\nReply with:\n<definitions_review>\nEach Lean definition and the source object it encodes; any discrepancy.\n<\/definitions_review>\n<statement_review>\nThe target theorem against the source statement: hypotheses, quantifiers, conclusion, edge cases; what must be supplied to recover the source's statement, if anything.\n<\/statement_review>\n<proof_review>\nHow the formal proof is organised, which step of the source proof each part carries out, and where it deviates from the source proof. Note any lemma whose statement is stronger or weaker than the step it represents.\n<\/proof_review>\n<concerns>\nAn itemize list of points a mathematician should know before relying on the result, or the single word None.\n<\/concerns>\n<verdict>FAITHFUL, UNFAITHFUL or UNCERTAIN<\/verdict>", "FORMALIZE_FEEDBACK_TEMPLATE": "\nYour previous formalization is below, followed by the problems found with it. Fix every problem.\n\n<previous_definitions>\n{definitions}\n<\/previous_definitions>\n<previous_statement>\n{statement}\n<\/previous_statement>\n<problems>\n{problems}\n<\/problems>\n", "FORMALIZE_TEMPLATE": "Formalize the following result in Lean 4.\n\n<informal_statement>\n{informal_statement}\n<\/informal_statement>\n\n<informal_proof>\n{informal_proof}\n<\/informal_proof>\n{feedback}\nProduce:\n- <definitions>: every definition the statement needs (syntax, axioms, inference rules, auxiliary functions). Only `inductive`, `structure`, `def`, `abbrev`, `namespace`/`end`, `open` and `notation` declarations; no theorems, no `sorry`, no `axiom`.\n- <statement>: optional `open` lines, then exactly one declaration `theorem {theorem_name} <binders> : <type> := by sorry`, at top level (not inside a namespace).\n- <notes>: one short paragraph mapping each part of the source statement to the Lean encoding.\n\n<definitions>\n...\n<\/definitions>\n<statement>\n...\n<\/statement>\n<notes>\n...\n<\/notes>", "HANDBACK_REPAIR_TEMPLATE": "\nYour previous reply did not compile. Fix it, keeping the same action, or choose another.\n\n<previous_reply>\n{reply}\n<\/previous_reply>\n<lean_errors>\n{errors}\n<\/lean_errors>\n", "HANDBACK_TEMPLATE": "Solver agents have failed {attempts} times to prove the lemma `{lemma_name}` of your proof sketch. The other lemmas are still being proved. Diagnose the failure from the attempts below and choose one action.\n\n<definitions>\n{definitions}\n<\/definitions>\n\n<preamble>\n{preamble}\n<\/preamble>\n\n<sketch_lemmas>\n{lemmas}\n<\/sketch_lemmas>\n<main_proof>\n{main_proof}\n<\/main_proof>\n\n<informal_proof>\n{informal_proof}\n<\/informal_proof>\n\n<failed_lemma>\n{failed}\n<\/failed_lemma>\n\nActions:\n1. Prove it yourself, when the attempts show the missing step or the lemma is routine: <proof>tactic proof of `{lemma_name}` as stated (the text after `:= by`)<\/proof>, optionally with <helpers>helper declarations, each named `{lemma_name}_...`<\/helpers>. The proof may use the lemmas listed before `{lemma_name}`.\n2. Split it, when one step is hard on its own: <split>new lemma statements `theorem name <binders> : <type> := by sorry`, one per declaration, with new names<\/split> and <proof>a proof of `{lemma_name}` from them and the earlier lemmas<\/proof>. The new lemmas are placed before `{lemma_name}` and handed to solvers.\n3. Restate it, when the statement is false or lacks a hypothesis that the main proof can supply: <restate>theorem {lemma_name} <binders> : <type> := by sorry<\/restate>. The main proof must still compile with the new statement; lemmas whose proofs use `{lemma_name}` are not restated.\n4. Retry unchanged, when the failures come from the solver setup (time limits, sessions without an answer) rather than the lemma: <retry/>.\n\nBegin with <diagnosis>one or two sentences<\/diagnosis>, then the tags of one action. Lean code goes inside the tags without Markdown fences.", "JUDGE_READBACK_TEMPLATE": "An independent auditor, who saw only the Lean code below and never the source, wrote a read-back of what the code literally asserts. Compare the read-back with the source and decide whether the formalization is faithful. The source statement may use notation that is defined only in the source proof; the proof is included for that purpose. Check both directions: every hypothesis and conclusion of the source appears in the Lean statement, and nothing extra, weaker or vacuous was introduced. Check that the definitions encode the source's objects and rules, not a simplified substitute.\n\n<informal_statement>\n{informal_statement}\n<\/informal_statement>\n\n<informal_proof>\n{informal_proof}\n<\/informal_proof>\n\n<lean_code>\n{lean_code}\n<\/lean_code>\n\n<readback>\n{readback}\n<\/readback>\n\nReply with:\n<verdict>FAITHFUL or REVISE<\/verdict>\n<issues>\nIf REVISE: each discrepancy, and how to fix it. If FAITHFUL: none.\n<\/issues>", "REPLAN_FEEDBACK_TEMPLATE": "\nA previous sketch was attempted. Solvers proved some lemmas and failed on others. Revise the sketch: keep proved lemmas verbatim if they are still useful (they will not be re-proved), and replace or split the failed ones into easier steps. Each failed lemma lists the solvers' last attempts, most complete first, with Lean's errors: they show where the proof stalled. A step left as `sorry` or a `have` that does not compile can become a lemma of its own, and a statement that resists proof may need to be restated.\n\n<previous_lemmas>\n{lemmas}\n<\/previous_lemmas>\n<previous_main_proof>\n{main_proof}\n<\/previous_main_proof>\n<proved_lemmas>\n{proved}\n<\/proved_lemmas>\n<failed_lemmas>\n{failed}\n<\/failed_lemmas>\n", "REPORT_CHECK_TEMPLATE": "Below is the text of a report on a machine-checked proof; each Lean declaration is shown where the report places it. Check every lemma, definition and theorem statement in the text against the Lean code beside it: hypotheses, quantifiers, types, and the strength of the conclusion. Check that each written proof is a correct account of the mathematics, cites only earlier results, and claims nothing the Lean code does not establish. Check that the Statement section matches the source.\n\n<informal_statement>\n{informal_statement}\n<\/informal_statement>\n\n<report>\n{report}\n<\/report>\n\nReply with:\n<discrepancies>\nEach discrepancy as an item: where it is, what is wrong, and the correction. Or the single word None.\n<\/discrepancies>", "REPORT_REPAIR_TEMPLATE": "The report text below does not compile with pdfLaTeX. Fix the errors and return the full corrected text in the same format (<title>, <abstract>, <macros>, <body>). Change nothing else.\n\n<title>{title}<\/title>\n<abstract>{abstract}<\/abstract>\n<macros>{macros}<\/macros>\n<body>\n{body}\n<\/body>\n\n<latex_errors>\n{errors}\n<\/latex_errors>", "REPORT_REVISE_TEMPLATE": "A referee compared the report text below with the Lean code and found the discrepancies listed. Correct each of them and return the full text in the same format (<title>, <abstract>, <macros>, <body>). Change nothing else.\n\n<title>{title}<\/title>\n<abstract>{abstract}<\/abstract>\n<macros>{macros}<\/macros>\n<body>\n{body}\n<\/body>\n\n<discrepancies>\n{discrepancies}\n<\/discrepancies>", "REPORT_TEMPLATE": "Write the mathematical text of a report that presents a machine-checked proof to a mathematician. The reader knows the source result and wants to check, without reading Lean, what was proved and how.\n\n<informal_statement>\n{informal_statement}\n<\/informal_statement>\n\n<informal_proof>\n{informal_proof}\n<\/informal_proof>\n\n<lean_solution>\n{lean_solution}\n<\/lean_solution>\n\n<declarations>\n{declarations}\n<\/declarations>\n\nThe Lean code is inserted by the report generator: write \\LeanDecl{{name}} where the code of a declaration listed above belongs, and never write Lean code yourself. \\LeanDecl{{{theorem_name}}} inserts the target statement.\n\nStructure of <body>:\n\\section{{Statement}}: the setting and the result as in the source, in clean LaTeX, with the same content.\n\\section{{Formalization}}: each definition in mathematical terms, followed by its \\LeanDecl; then the target statement, \\LeanDecl{{{theorem_name}}}, and how it relates to the source statement, including any parameter or hypothesis that stands for an object of the source.\n\\section{{Proof}}: \\subsection{{Overview}} relating the lemmas to the steps of the source proof and stating where the formal proof deviates from it; then every remaining declaration in the listed order, each as\n  \\begin{{lemma}}[\\leanname{{name}}]\\label{{lem:name}} statement \\end{{lemma}}\n  \\LeanDecl{{name}}\n  \\begin{{proof}} argument \\end{{proof}}\nand finally \\subsection{{Proof of the theorem}} with \\LeanDecl{{solution}} and its argument.\n\nRequirements:\n- Each lemma statement says exactly what its Lean statement says: all hypotheses, quantifiers and types (for example, $s \\in \\mathbb{{C}}^\\times$ for a unit), with the same strength; not the source's informal version.\n- Each proof gives the mathematical argument the Lean proof carries out, at the level of a careful paper proof: which earlier lemmas (\\cref{{lem:...}}) and which defining relations it uses, and the key computation. Do not narrate tactics.\n- Every listed declaration appears exactly once via \\LeanDecl.\n- Use only amsmath, amssymb, mathtools, amsthm environments (theorem, lemma, definition, remark, proof), itemize and enumerate, \\cref, \\leanname and \\LeanDecl. Put any \\newcommand or \\DeclareMathOperator lines in <macros>. No Unicode mathematical symbols; no \\usepackage, \\input or document environment.\n\nReply with:\n<title>Title of the report<\/title>\n<abstract>Three to five sentences: the result, its source, and what was formally verified.<\/abstract>\n<macros>\\newcommand lines, or empty<\/macros>\n<body>\nThe sections above.\n<\/body>", "SKETCH_REPAIR_TEMPLATE": "\nYour previous sketch did not compile (lemmas are allowed to be `sorry`, the main proof is not). Fix it.\n\n<previous_lemmas>\n{lemmas}\n<\/previous_lemmas>\n<previous_main_proof>\n{main_proof}\n<\/previous_main_proof>\n<lean_errors>\n{errors}\n<\/lean_errors>\n", "SKETCH_TEMPLATE": "Write a proof sketch for the theorem below. The sketch consists of lemmas, each stated in full and left as `sorry`, plus a proof of the main theorem from those lemmas. Each lemma will be proved e-sonnet-5-5"], "system_prompt": "captain", "prompt": "Formalize the following result in Lean 4.\n\n<informal_statement>\nSetting:\nLet $\\mathbb{C}$ denote the set of complex numbers, let $\\mathbb{N}$ denote the set of natural numbers.\nLet $c(j)$ denote  the coefficient of $q^j$ in the  modular function\n\n$$J(q)=\\sum_{j\\geq -1}c(j)q^j= {1 \\over q}  + 196884 q + 21493760 q^2 + 864299970 q^3  + \\cdots$$\n\nso that $c(-1) = 1,\\ c(0) = 0,\\ c(1) = 196884, \\dots$\n\nDefine an index set:\n\n$$E=  \\left\\{(\\ell,j,k)\\mid j\\in\\mathbb{N},\\, 1 \\leq k\\leq c(j),\\, 0\\leq \\ell<j \\right\\}$$\n\nDefine a complex number: $$c_{\\ell j} := (-1)^{\\ell+1} \\binom{j-1}{\\ell} \\, (\\ell+1)(j-\\ell)$$\n\nLet $\\mathcal{X}$ be the set of symbols\n$$\\mathcal{X} :=\\{H_1(s), H_2(s), X_{-1}(u),  Y_{-1}(u), X_{\\ell,jk}(u), Y_{\\ell,jk}(u) \\mid$$ \n$$\\qquad \\qquad \\qquad \\qquad\\qquad \\qquad \\qquad \\qquad s\\in \\mathbb{C}^\\times, u\\in \\mathbb{C}, (\\ell,j,k)\\in E\\}.$$\nLet $F(\\mathcal{X})$ denote the free group on~$\\mathcal{X}$.\n\nWe  call  $X_{-1}(u)$, $Y_{-1}(u)$, $X_{\\ell,jk}(u)$ and $Y_{\\ell,jk}(u)$ {\\it unipotent generators}.\n\nWe define $\\mathcal{R}\\subseteq F(\\mathcal{X})$  and additional symbols $ \\widetilde{w}_{-1}(s)$ and   $\\widetilde{w}_{\\ell,jk}(s)$ as follows, for all $s,t\\in \\mathbb{C}^\\times$, $u,v\\in \\mathbb{C}$, $(\\ell,j,k),(m,p,q) \\in E$.\\\\\n\n\\begingroup\\allowdisplaybreaks\n\\begin{align*}\n\\tag{Re:0} \n  \\widetilde{w}_{-1}(s) &:= X_{-1}(s) Y_{-1}\\left(-s^{-1} \\right) X_{-1}(s), \\\\ \\widetilde{w}_{-1} &:= \\widetilde{w}_{-1}(1),\\\\\n\\tag{Im:0}\n  \\widetilde{w}_{\\ell,jk}(s) &:= X_{\\ell,jk}\\left({s}\\right) Y_{\\ell,jk}\\left(\\frac{-s^{-1}}{{c_{\\ell j}}}\\right) \n  X_{\\ell,jk}\\left({s}\\right),\\\\  \\widetilde{w}_{\\ell,jk} &:= \\widetilde{w}_{\\ell,jk}(1),\\\\\n\\intertext{Relations that define a subgroup $\\mathrm{GL}_2(-1)$:}\n\\tag{H:1a}\n   H_1(s)H_1(t)&=H_1(st),\\\\\n\\tag{H:1b}\n   H_2(s)H_2 ean code yourself. \\LeanDecl{gsimple_x_inverse} inserts the target statement.\n\nStructure of <body>:\n\\section{Statement}: the setting and the result as in the source, in clean LaTeX, with the same content.\n\\section{Formalization}: each definition in mathematical terms, followed by its \\LeanDecl; then the target statement, \\LeanDecl{gsimple_x_inverse}, and how it relates to the source statement, including any parameter or hypothesis that stands for an object of the source.\n\\section{Proof}: \\subsection{Overview} relating the lemmas to the steps of the source proof and stating where the formal proof deviates from it; then every remaining declaration in the listed order, each as\n  \\begin{lemma}[\\leanname{name}]\\label{lem:name} statement \\end{lemma}\n  \\LeanDecl{name}\n  \\begin{proof} argument \\end{proof}\nand finally \\subsection{Proof of the theorem} with \\LeanDecl{solution} and its argument.\n\nRequirements:\n- Each lemma statement says exactly what its Lean statement says: all hypotheses, quantifiers and types (for example, $s \\in \\mathbb{C}^\\times$ for a unit), with the same strength; not the source's informal version.\n- Each proof gives the mathematical argument the Lean proof carries out, at the level of a careful paper proof: which earlier lemmas (\\cref{lem:...}) and which defining relations it uses, and the key computation. Do not narrate tactics.\n- Every listed declaration appears exactly once via \\LeanDecl.\n- Use only amsmath, amssymb, mathtools, amsthm environments (theorem, lemma, definition, remark, proof), itemize and enumerate, \\cref, \\leanname and \\LeanDecl. Put any \\newcommand or \\DeclareMathOperator lines in <macros>. No Unicode mathematical symbols; no \\usepackage, \\input or document environment.\n\nReply with:\n<title>Title of the report<\/title>\n<abstract>Three to five sentences: the result, its source, and what was formally verified.<\/abstract>\n<macros>\\newcommand lines, or empty<\/macros>\n<body>\nThe sections above.\n<\/body>", "response": "<title>The inverse of $X_{-1}(u)$ in the group $G(\\mathfrak{m})$: a machine-checked proof<\/title>\n\n<abstract>We present a formal verification of Corollary 3.2 (label \\texttt{cor: gsimple x inverse}) from a text on the Monster Lie algebra group $G(\\mathfrak{m})$. The group is defined by generators and relations, and the corollary states that $X_{-1}(u)^{-1}=X_{-1}(-u)$ for every $u\\in\\mathbb{C}$. In the formalization the group is the presented group on the generating symbols $\\mathcal{X}$ modulo the full list of defining relations. The index set $E$ is built from an arbitrary function $c:\\mathbb{N}\\to\\mathbb{N}$ in place of the coefficients of the modular function $J$. The identity is proved in Lean 4 with Mathlib for every such $c$, using only the relation (Re:1a).<\/abstract>\n\n<macros>\n\\newcommand{\\Cx}{\\mathbb{C}^\\times}\n\\newcommand{\\wt}{\\widetilde{w}}\n\\newcommand{\\cX}{\\mathcal{X}}\n\\newcommand{\\cR}{\\mathcal{R}}\n<\/macros>\n\n<body>\n\\section{Statement}\n\nLet $\\mathbb{C}$ denote the complex numbers and $\\mathbb{N}$ the natural numbers. Let $c(j)$ denote the coefficient of $q^j$ in the modular function\n\\[\nJ(q)=\\sum_{j\\geq -1}c(j)q^j=\\frac{1}{q}+196884\\,q+21493760\\,q^2+864299970\\,q^3+\\cdots,\n\\]\nso that $c(-1)=1$, $c(0)=0$, $c(1)=196884,\\dots$.\n\n\\paragraph{Index set and constants.} The index set is\n\\[\nE=\\{(\\ell,j,k)\\mid j\\in\\mathbb{N},\\ 1\\leq k\\leq c(j),\\ 0\\leq \\ell<j\\}.\n\\]\nFor $(\\ell,j,k)\\in E$ we set\n\\[\nc_{\\ell j}:=(-1)^{\\ell+1}\\binom{j-1}{\\ell}(\\ell+1)(j-\\ell)\\in\\mathbb{C}.\n\\]\n\n\\paragraph{Generators.} Let $\\cX$ be the set of symbols\n\\[\n\\{H_1(s),H_2(s),X_{-1}(u),Y_{-1}(u),X_{\\ell,jk}(u),Y_{\\ell,jk}(u)\\mid s\\in\\Cx,\\ u\\in\\mathbb{C},\\ (\\ell,j,k)\\in E\\},\n\\]\nand let $F(\\cX)$ be the free group on $\\cX$.\n\n\\paragraph{Relations.} The commutator is $(a,b):=aba^{-1}b^{-1}$. The set $\\cR\\subseteq F(\\cX)$ and the auxiliary elements $\\wt_{-1}(s)$, $\\wt_{\\ell,jk}(s)$ are given as follows, for all $s,t\\in\\Cx$, $u,v\\in\\mathbb{C}$ and $(\\ell,j,k),(m,p,q)\\in E$.\n\\begingroup\\allowdisplaybreaks\n\\begin{align*}\n\\tag{Re:0}\n  \\wt_{-1}(s) &:= X_{-1}(s)\\,Y_{-1}(-s^{-1})\\,X_{-1}(s), \\qquad \\wt_{-1}:=\\wt_{-1}(1),\\\\\n\\tag{Im:0}\n  \\wt_{\\ell,jk}(s) &:= X_{\\ell,jk}(s)\\,Y_{\\ell,jk}\\Bigl(\\frac{-s^{-1}}{c_{\\ell j}}\\Bigr)\\,X_{\\ell,jk}(s), \\qquad \\wt_{\\ell,jk}:=\\wt_{\\ell,jk}(1),\\\\\n\\intertext{Relations defining a subgroup $\\mathrm{GL}_2(-1)$:}\n\\tag{H:1a} H_1(s)H_1(t)&=H_1(st),\\\\\n\\tag{H:1b} H_2(s)H_2(t)&=H_2(st),\\\\\n\\tag{H:2} H_1(s)H_2(t)&=H_2(t)H_1(s),\\\\\n\\tag{Re:1a} X_{-1}(u)X_{-1}(v)&=X_{-1}(u+v),\\\\\n\\tag{Re:1b} Y_{-1}(u)Y_{-1}(v)&=Y_{-1}(u+v),\\\\\n\\tag{Re:2} Y_{-1}(-t)X_{-1}(s)Y_{-1}(t)&=X_{-1}(-t^{-1})\\,Y_{-1}(-t^{2}s)\\,X_{-1}(t^{-1}),\\\\\n\\tag{Re:3} \\wt_{-1}(s)\\wt_{-1}&=H_1(-s)H_2(-s^{-1}),\\\\\n\\tag{Re:4a} \\wt_{-1}X_{-1}(u)\\wt_{-1}^{-1}&=Y_{-1}(-u),\\\\\n\\tag{Re:4b} \\wt_{-1}Y_{-1}(u)\\wt_{-1}^{-1}&=X_{-1}(-u),\\\\\n\\tag{Re:5a} \\wt_{-1}H_1(s)\\wt_{-1}^{-1}&=H_2(s),\\\\\n\\tag{Re:5b} \\wt_{-1}H_2(s)\\wt_{-1}^{-1}&=H_1(s),\\\\\n\\tag{Re:6a} H_1(s)X_{-1}(u)H_1(s)^{-1}&=X_{-1}(su),\\\\\n\\tag{Re:6b} H_2(s)X_{-1}(u)H_2(s)^{-1}&=X_{-1}(s^{-1}u),\\\\\n\\tag{Re:6c} H_1(s)Y_{-1}(u)H_1(s)^{-1}&=Y_{-1}(s^{-1}u),\\\\\n\\tag{Re:6d} H_2(s)Y_{-1}(u)H_2(s)^{-1}&=Y_{-1}(su),\\\\\n\\intertext{Relations defining subgroups $\\mathrm{GL}_2(\\ell,j,k)$:}\n\\tag{Im:1a} X_{\\ell,jk}(u)X_{\\ell,jk}(v)&=X_{\\ell,jk}(u+v),\\\\\n\\tag{Im:1b} Y_{\\ell,jk}(u)Y_{\\ell,jk}(v)&=Y_{\\ell,jk}(u+v),\\\\\n\\tag{Im:2} Y_{\\ell,jk}(-t)X_{\\ell,jk}(s)Y_{\\ell,jk}(t)&=X_{\\ell,jk}\\Bigl(\\frac{-t^{-1}}{c_{\\ell j}}\\Bigr)\\,Y_{\\ell,jk}(-c_{\\ell j}t^2s)\\,X_{\\ell,jk}\\Bigl(\\frac{t^{-1}}{c_{\\ell j}}\\Bigr),\\\\\n\\tag{Im:3} \\wt_{\\ell,jk}\\bigl(s^{(\\ell+1)(j-\\ell)}\\bigr)\\wt_{\\ell,jk}&=H_1\\bigl((-s)^{j-\\ell}\\bigr)H_2\\bigl((-s)^{\\ell+1}\\bigr),\\\\\n\\tag{Im:4a} \\wt_{\\ell,jk}X_{\\ell,jk}(u)\\wt_{\\ell,jk}^{-1}&=Y_{\\ell,jk}\\Bigl(\\frac{-u}{c_{\\ell j}}\\Bigr),\\\\\n\\tag{Im:4b} \\wt_{\\ell,jk}Y_{\\ell,jk}(u)\\wt_{\\ell,jk}^{-1}&=X_{\\ell,jk}(-c_{\\ell j}u),\\\\\n\\tag{Im:5a} \\wt_{\\ell,jk}H_1\\bigl(s^{j-\\ell}\\bigr)\\wt_{\\ell,jk}^{-1}&=H_2\\bigl(s^{-(\\ell+1)}\\bigr),\\\\\n\\tag{Im:5b} \\wt_{\\ell,jk}H_2\\bigl(s^{\\ell+1}\\bigr)\\wt_{\\ell,jk}^{-1}&=H_1\\bigl(s^{-(j-\\ell)}\\bigr),\\\\\n\\tag{Im:6a} H_1(s)X_{\\ell,jk}(u)H_1(s)^{-1}&=X_{\\ell,jk}(s^{\\ell+1}u),\\\\\n\\tag{Im:6b} H_2(s)X_{\\ell,jk}(u)H_2(s)^{-1}&=X_{\\ell,jk}(s^{j-\\ell}u),\\\\\n\\tag{Im:6c} H_1(s)Y_{\\ell,jk}(u)H_1(s)^{-1}&=Y_{\\ell,jk}(s^{-(\\ell+1)}u),\\\\\n\\tag{Im:6d} H_2(s)Y_{\\ell,jk}(u)H_2(s)^{-1}&=Y_{\\ell,jk}(s^{-(j-\\ell)}u),\\\\\n\\intertext{Relations between the unipotent generators:}\n\\tag{U:1a} (X_{-1}(u),X_{j-1,jk}(v))&=1,\\\\\n\\tag{U:1b} (Y_{-1}(u),Y_{j-1,jk}(v))&=1,\\\\\n\\tag{U:1c} (Y_{-1}(u),X_{0,jk}(v))&=1,\\\\\n\\tag{U:1d} (X_{-1}(u),Y_{0,jk}(v))&=1,\\\\\n\\tag{U:2} (X_{\\ell,jk}(u),Y_{m,pq}(v))&=1\\quad\\text{for } j\\neq p,\\text{ or } k\\neq q,\\text{ or } |\\ell-m|>1,\\\\\n\\tag{U:3a} (X_{1,2k}(u),Y_{0,2k}(v))&=X_{-1}(uv),\\\\\n\\tag{U:3b} (X_{0,2k}(u),Y_{1,2k}(v))&=Y_{-1}(uv),\\\\\n\\intertext{Action of $\\wt_{-1}$ on the unipotent generators:}\n\\tag{U:4a} \\wt_{-1}X_{\\ell,jk}(u)\\wt_{-1}^{-1}&=X_{j-1-\\ell,jk}\\bigl((-1)^{j-\\ell-1}u\\bigr),\\\\\n\\tag{U:4b} \\wt_{-1}Y_{\\ell,jk}(u)\\wt_{-1}^{-1}&=Y_{j-1-\\ell,jk}\\bigl((-1)^{j-\\ell-1}u\\bigr).\n\\end{align*}\n\\endgroup\n\n\\paragraph{The group.} The group is\n\\[\nG(\\mathfrak{m})=\\langle\\cX\\mid\\cR\\rangle=F(\\cX)/N_\\cR,\n\\]\nwhere $N_\\cR$ is the normal closure of $\\cR$.\n\n\\begin{theorem}[Corollary 3.2]\nFor all $u\\in\\mathbb{C}$, $X_{-1}(u)^{-1}=X_{-1}(-u)$ in $G(\\mathfrak{m})$.\n\\end{theorem}\n\n\\section{Formalization}\n\nThroughout, $c:\\mathbb{N}\\to\\mathbb{N}$ is an arbitrary function. It is a parameter of every definition, and it replaces the coefficient function of $J$; see the discussion after the target statement.\n\n\\paragraph{The index set.} The index set $E_c$ is the set of triples $(\\ell,j,k)\\in\\mathbb{N}^3$ with\n\\[\n\\ell<j \\quad\\text{and}\\quad 1\\leq k\\leq c(j).\n\\]\nThis is the source's $E$ with $c$ in place of the coefficients of $J$.\n\n\\LeanDecl{Idx}\n\nFor $e=(\\ell,j,k)\\in E_c$ we write $\\ell_e=\\ell$, $j_e=j$ and $k_e=k$ for the three coordinates.\n\n\\LeanDecl{Idx.l}\n\\LeanDecl{Idx.j}\n\\LeanDecl{Idx.k}\n\n\\paragraph{The generating symbols.} The set of symbols $\\cX_c$ is the disjoint union of the following families:\n\\begin{itemize}\n\\item $H_1(s)$ and $H_2(s)$ for $s\\in\\Cx$;\n\\item $X_{-1}(u)$ and $Y_{-1}(u)$ for $u\\in\\mathbb{C}$;\n\\item $X_e(u)$ and $Y_e(u)$ for $e\\in E_c$ and $u\\in\\mathbb{C}$.\n\\end{itemize}\nHere $X_e(u)$ stands for the source's $X_{\\ell,jk}(u)$ when $e=(\\ell,j,k)$, and similarly for $Y_e(u)$.\n\n\\LeanDecl{Gen}\n\nThe next six definitions are the images of these symbols in the free group $F(\\cX_c)$, that is, the corresponding words of length one. We denote them by the same letters $H_1(s)$, $H_2(s)$, $X_{-1}(u)$, $Y_{-1}(u)$, $X_e(u)$, $Y_e(u)$.\n\n\\LeanDecl{fH1}\n\\LeanDecl{fH2}\n\\LeanDecl{fXm}\n\\LeanDecl{fYm}\n\\LeanDecl{fX}\n\\LeanDecl{fY}\n\n\\paragraph{The constants $c_{\\ell j}$.} For $e=(\\ell,j,k)\\in E_c$,\n\\[\nc_e:=(-1)^{\\ell+1}\\binom{j-1}{\\ell}(\\ell+1)(j-\\ell)\\in\\mathbb{C}.\n\\]\nThe differences $j-1$ and $j-\\ell$ are computed in $\\mathbb{N}$ by truncated subtraction. Since $\\ell<j$ forces $j\\geq 1$, both are the true differences. Hence $c_e=c_{\\ell j}$.\n\n\\LeanDecl{cc}\n\n\\paragraph{The elements $\\wt$.} For $s\\in\\Cx$ and $e\\in E_c$, define the words in $F(\\cX_c)$\n\\[\n\\wt_{-1}(s):=X_{-1}(s)\\,Y_{-1}(-s^{-1})\\,X_{-1}(s)\n\\]\nand\n\\[\n\\wt_e(s):=X_e(s)\\,Y_e(-s^{-1}/c_e)\\,X_e(s).\n\\]\nThese are (Re:0) and (Im:0). The source's $\\wt_{-1}$ and $\\wt_{\\ell,jk}$ are $\\wt_{-1}(1)$ and $\\wt_e(1)$.\n\n\\LeanDecl{wm}\n\\LeanDecl{wt}\n\n\\paragraph{Commutator and conjugation.} For $a,b\\in F(\\cX_c)$, the commutator is $(a,b):=aba^{-1}b^{-1}$ and the conjugate is $a\\,b\\,a^{-1}$.\n\n\\LeanDecl{comm}\n\\LeanDecl{conj}\n\n\\paragraph{The relators.} The set $\\cR_c\\subseteq F(\\cX_c)$ consists of the words $L\\,R^{-1}$, one for each source relation $L=R$. For relations of the form $(a,b)=1$ the word is the commutator $(a,b)$ itself. The families are listed below. Here $s,t$ range over $\\Cx$, $u,v$ over $\\mathbb{C}$, and $e,f,e'$ over $E_c$. Powers of $s$ with exponent in $\\mathbb{N}$ or $\\mathbb{Z}$ are taken in $\\Cx$ when they are arguments of $H_i$, and in $\\mathbb{C}$ otherwise. Abbreviate $\\ell=\\ell_e$, $j=j_e$, $k=k_e$.\n\\begin{itemize}\n\\item (H:1a), (H:1b): $H_1(s)H_1(t)H_1(st)^{-1}$ and $H_2(s)H_2(t)H_2(st)^{-1}$.\n\\item (H:2): $H_1(s)H_2(t)\\bigl(H_2(t)H_1(s)\\bigr)^{-1}$.\n\\item (Re:1a), (Re:1b): $X_{-1}(u)X_{-1}(v)X_{-1}(u+v)^{-1}$ and $Y_{-1}(u)Y_{-1}(v)Y_{-1}(u+v)^{-1}$.\n\\item (Re:2): $Y_{-1}(-t)X_{-1}(s)Y_{-1}(t)\\bigl(X_{-1}(-t^{-1})Y_{-1}(-t^2s)X_{-1}(t^{-1})\\bigr)^{-1}$.\n\\item (Re:3): $\\wt_{-1}(s)\\wt_{-1}(1)\\bigl(H_1(-s)H_2(-s^{-1})\\bigr)^{-1}$.\n\\item (Re:4a)--(Re:5b): $\\wt_{-1}(1)\\,g\\,\\wt_{-1}(1)^{-1}\\,h^{-1}$ for the pairs $(g,h)$ equal to $(X_{-1}(u),Y_{-1}(-u))$, $(Y_{-1}(u),X_{-1}(-u))$, $(H_1(s),H_2(s))$ and $(H_2(s),H_1(s))$.\n\\item (Re:6a)--(Re:6d): $H_1(s)X_{-1}(u)H_1(s)^{-1}X_{-1}(su)^{-1}$, together with the analogous words for $X_{-1}(s^{-1}u)$ under $H_2$, for $Y_{-1}(s^{-1}u)$ under $H_1$, and for $Y_{-1}(su)$ under $H_2$.\n\\item (Im:1a), (Im:1b): $X_e(u)X_e(v)X_e(u+v)^{-1}$ and $Y_e(u)Y_e(v)Y_e(u+v)^{-1}$.\n\\item (Im:2): $Y_e(-t)X_e(s)Y_e(t)\\bigl(X_e(-t^{-1}/c_e)\\,Y_e(-c_et^2s)\\,X_e(t^{-1}/c_e)\\bigr)^{-1}$.\n\\item (Im:3): $\\wt_e\\bigl(s^{(\\ell+1)(j-\\ell)}\\bigr)\\wt_e(1)\\bigl(H_1((-s)^{j-\\ell})H_2((-s)^{\\ell+1})\\bigr)^{-1}$.\n\\item (Im:4a), (Im:4b): $\\wt_e(1)X_e(u)\\wt_e(1)^{-1}Y_e(-u/c_e)^{-1}$ and $\\wt_e(1)Y_e(u)\\wt_e(1)^{-1}X_e(-c_eu)^{-1}$.\n\\item (Im:5a), (Im:5b): $\\wt_e(1)H_1(s^{j-\\ell})\\wt_e(1)^{-1}H_2(s^{-(\\ell+1)})^{-1}$ and $\\wt_e(1)H_2(s^{\\ell+1})\\wt_e(1)^{-1}H_1(s^{-(j-\\ell)})^{-1}$. The negative exponents are integer powers in $\\Cx$.\n\\item (Im:6a)--(Im:6d): $H_1(s)X_e(u)H_1(s)^{-1}X_e(s^{\\ell+1}u)^{-1}$, together with the analogous words for $X_e(s^{j-\\ell}u)$ under $H_2$, for $Y_e(s^{-(\\ell+1)}u)$ under $H_1$, and for $Y_e(s^{-(j-\\ell)}u)$ under $H_2$.\n\\item (U:1a), (U:1b): $(X_{-1}(u),X_e(v))$ and $(Y_{-1}(u),Y_e(v))$ for all $e$ with $\\ell_e+1=j_e$, that is, $\\ell_e=j_e-1$.\n\\item (U:1c), (U:1d): $(Y_{-1}(u),X_e(v))$ and $(X_{-1}(u),Y_e(v))$ for all $e$ with $\\ell_e=0$.\n\\item (U:2): $(X_e(u),Y_f(v))$ for all $e,f$ with $j_e\\neq j_f$, or $k_e\\neq k_f$, or $|\\ell_e-\\ell_f|>1$.\n\\item (U:3a): $(X_e(u),Y_f(v))\\,X_{-1}(uv)^{-1}$ for all $e,f\\in E_c$ such that $e=(1,2,k)$ and $f=(0,2,k)$ for some $k\\in\\mathbb{N}$.\n\\item (U:3b): $(X_e(u),Y_f(v))\\,Y_{-1}(uv)^{-1}$ for all $e,f\\in E_c$ such that $e=(0,2,k)$ and $f=(1,2,k)$ for some $k$.\n\\item (U:4a), (U:4b): $\\wt_{-1}(1)X_e(u)\\wt_{-1}(1)^{-1}X_{e'}\\bigl((-1)^{j-\\ell-1}u\\bigr)^{-1}$ and the same word with $Y$ in place of $X$, for all $e,e'$ with $e'=(j-1-\\ell,j,k)$. Because $\\ell<j$, the subtraction $j-1-\\ell$ in $\\mathbb{N}$ is exact, and this triple always lies in $E_c$.\n\\end{itemize}\nThis list is exactly the source's $\\cR$, with $E$ replaced by $E_c$.\n\n\\LeanDecl{Rl}\n\n\\paragraph{The group.} The group $G_c$ is the presented group $\\langle\\cX_c\\mid\\cR_c\\rangle=F(\\cX_c)/N_{\\cR_c}$, where $N_{\\cR_c}$ is the normal closure of $\\cR_c$. We write $\\pi:F(\\cX_c)\\to G_c$ for the quotient map.\n\n\\LeanDecl{G}\n\n\\paragraph{The target statement.}\n\n\\LeanDecl{gsimple_x_inverse}\n\nThe statement reads: for every function $c:\\mathbb{N}\\to\\mathbb{N}$ and every $u\\in\\mathbb{C}$,\n\\[\n\\pi\\bigl(X_{-1}(u)\\bigr)^{-1}=\\pi\\bigl(X_{-1}(-u)\\bigr)\\quad\\text{in } G_c.\n\\]\n\n\\paragraph{Relation to the source.} The source's group $G(\\mathfrak{m})$ is the instance of $G_c$ in which $c(j)$ is the coefficient of $q^j$ in $J$ for $j\\in\\mathbb{N}$.\n\\begin{itemize}\n\\item The values $c(-1)$ and $c(0)$ never enter $E$. For $c(-1)$ this is because $j\\in\\mathbb{N}$. For $c(0)$ it is because no $\\ell$ satisfies $\\ell<0$.\n\\item The formal theorem is stated for every $c$, with no hypothesis. In particular it holds for the coefficient function of $J$, and so it contains the source's corollary.\n\\item The hypothesis $c(2)\\geq 1$ mentioned in the problem set is not needed here.\n\\item The corollary does not depend on $c$ at all, since its proof uses only (Re:1a).\n\\end{itemize}\n\n\\section{Proof}\n\n\\subsection{Overview}\n\nThe source proof has two steps. It reads (Re:1a) as $X_{-1}(u)X_{-1}(v)=X_{-1}(u+v)$ in $G(\\mathfrak{m})$, and it sets $v=-u$ and uses $X_{-1}(0)=1$, which it takes from Lemma 3.1. The formal proof follows the same two steps.\n\\begin{itemize}\n\\item \\cref{lem:Xm_add_in_G} is the reading of (Re:1a) as an identity in $G_c$.\n\\item \\cref{lem:Xm_zero_in_G} is the fact $X_{-1}(0)=1$.\n\\end{itemize}\nThe only deviation is that Lemma 3.1 of the source is not imported. The fact $X_{-1}(0)=1$ is instead derived directly from the instance $u=v=0$ of (Re:1a). \\Cref{lem:mk_rel_eq_one_in_G} records the general fact that every relator becomes trivial in $G_c$. It is not used by the later declarations, which invoke the same fact directly for the specific relators they need.\n\n\\begin{lemma}[\\leanname{mk_rel_eq_one_in_G}]\\label{lem:mk_rel_eq_one_in_G}\nLet $c:\\mathbb{N}\\to\\mathbb{N}$ and let $r\\in F(\\cX_c)$ with $r\\in\\cR_c$. Then $\\pi(r)=1$ in $G_c$.\n\\end{lemma}\n\n\\LeanDecl{mk_rel_eq_one_in_G}\n\n\\begin{proof}\nWe have $r\\in\\cR_c\\subseteq N_{\\cR_c}=\\ker\\pi$.\n\\end{proof}\n\n\\begin{lemma}[\\leanname{Xm_add_in_G}]\\label{lem:Xm_add_in_G}\nLet $c:\\mathbb{N}\\to\\mathbb{N}$ and $u,v\\in\\mathbb{C}$. Then in $G_c$\n\\[\n\\pi(X_{-1}(u))\\,\\pi(X_{-1}(v))=\\pi(X_{-1}(u+v)).\n\\]\n\\end{lemma}\n\n\\LeanDecl{Xm_add_in_G}\n\n\\begin{proof}\nPut $a=X_{-1}(u)X_{-1}(v)$ and $b=X_{-1}(u+v)$ in $F(\\cX_c)$. By (Re:1a), the word $ab^{-1}$ belongs to $\\cR_c$, hence to $N_{\\cR_c}$. Two words whose quotient $ab^{-1}$ lies in $N_{\\cR_c}$ have the same image under $\\pi$, so $\\pi(a)=\\pi(b)$. Since $\\pi$ is a homomorphism, $\\pi(a)=\\pi(X_{-1}(u))\\pi(X_{-1}(v))$, which is the claim.\n\\end{proof}\n\n\\begin{lemma}[\\leanname{Xm_zero_in_G}]\\label{lem:Xm_zero_in_G}\nLet $c:\\mathbb{N}\\to\\mathbb{N}$. Then $\\pi(X_{-1}(0))=1$ in $G_c$.\n\\end{lemma}\n\n\\LeanDecl{Xm_zero_in_G}\n\n\\begin{proof}\nThe instance $u=v=0$ of (Re:1a) is the relator $X_{-1}(0)X_{-1}(0)X_{-1}(0+0)^{-1}\\in\\cR_c$, so its image under $\\pi$ is $1$. Since $0+0=0$, this word equals $X_{-1}(0)X_{-1}(0)X_{-1}(0)^{-1}=X_{-1}(0)$ in $F(\\cX_c)$. Hence $\\pi(X_{-1}(0))=1$.\n\\end{proof}\n\n\\subsection{Proof of the theorem}\n\n\\LeanDecl{solution}\n\n\\begin{theorem}\nFor every $c:\\mathbb{N}\\to\\mathbb{N}$ and every $u\\in\\mathbb{C}$, $\\pi(X_{-1}(u))^{-1}=\\pi(X_{-1}(-u))$ in $G_c$.\n\\end{theorem}\n\n\\begin{proof}\nIn any group, if $xy=1$ then $x^{-1}=y$. So it suffices to show that $\\pi(X_{-1}(u))\\,\\pi(X_{-1}(-u))=1$. By \\cref{lem:Xm_add_in_G} with $v=-u$, then $u+(-u)=0$, then \\cref{lem:Xm_zero_in_G},\n\\[\n\\pi(X_{-1}(u))\\,\\pi(X_{-1}(-u))=\\pi(X_{-1}(u+(-u)))=\\pi(X_{-1}(0))=1.\n\\]\n\\end{proof}\n<\/body>", "error": null, "seconds": 112.3, "cost_usd": 0.386033, "usage": {"inputTokens": 2, "outputTokens": 14284, "costUSD": 0.375912}}, {"index": 41, "kind": "model_call", "stage": "report", "elapsed_seconds": 3146.8, "label": "report_check", "role": "reviewer", "backend": "claude_cli", "model": "claude-opus-5-5", "resolved_models": ["claude-haiku-4-5-20251001", "claude-opus-5-5"], "system_prompt": "reviewer", "prompt": "Below is the text of a report on
