ight) H_2\\left((-s)^{\\ell+1}\\right), \\\\\n\\tag{Im:4a}\n  \\widetilde{w}_{\\ell,jk} X_{\\ell,jk}(u) {\\widetilde{w}_{\\ell,jk}}^{-1}&= Y_{\\ell,jk}\\left(\\frac{-u}{c_{\\ell j}}\\right),\\\\\n\\tag{Im:4b}\n  \\widetilde{w}_{\\ell,jk} Y_{\\ell,jk}(u) {\\widetilde{w}_{\\ell,jk}}^{-1}&= X_{\\ell,jk}\\left(-c_{\\ell j}u \\right),\\\\\n\\tag{Im:5a}\n  \\widetilde{w}_{\\ell,jk} H_1\\left(s^{j-\\ell} \\right) {\\widetilde{w}_{\\ell,jk}}^{-1}&=  H_2\\left(s^{-(\\ell+1)}\\right),\\\\\n\\tag{Im:5b}\n  \\widetilde{w}_{\\ell,jk} H_2\\left(s^{\\ell+1} \\right) {\\widetilde{w}_{\\ell,jk}}^{-1}&=  H_1\\left(s^{-(j-\\ell)}\\right),\\\\\n\\tag{Im:6a}\n  H_1(s) X_{\\ell,jk}(u) H_1(s)^{-1}&=X_{\\ell,jk}\\left(s^{\\ell+1}u \\right),\\\\\n\\tag{Im:6b}\n  H_2(s) X_{\\ell,jk}(u) H_2(s)^{-1}&=X_{\\ell,jk}\\left(s^{j-\\ell}u \\right),\\\\\n\\tag{Im:6c}\n  H_1(s) Y_{\\ell,jk}(u) H_1(s)^{-1}&=Y_{\\ell,jk}\\left(s^{-(\\ell+1)}u \\right),\\\\\n\\tag{Im:6d}\n  H_2(s) Y_{\\ell,jk}(u) H_2(s)^{-1}&=Y_{\\ell,jk}\\left(s^{-(j-\\ell)}u \\right),\\\\\n\\intertext{Relations between the unipotent generators:}\n\\tag{U:1a}\n  (X_{-1}(u), X_{j-1,jk}(v))&=1,\\\\\n\\tag{U:1b} \n  (Y_{-1}(u), Y_{j-1,jk}(v))&=1.\\\\\n\\tag{U:1c}\n  (Y_{-1}(u), X_{0,jk}(v))&=1,\\\\\n\\tag{U:1d}\n  (X_{-1}(u), Y_{0,jk}(v))&=1,\\\\\n\\tag{U:2}\n  (X_{\\ell,jk}(u), Y_{m,pq}(v))&=1\\qquad\\text{for $j\\neq p$, or $k\\neq q$, or $|\\ell-m|>1$,}\\\\\n\\tag{U:3a} (X_{1,2k}(u),Y_{0,2k}(v))&=X_{-1}(uv),\\\\\n\\tag{U:3b}(X_{0,2k}(u),Y_{1,2k}(v))&=Y_{-1}(uv),\\\\\n\\intertext{Action of $\\widetilde{w}_{-1}$ on the unipotent generators:}\n\\tag{U:4a}\n  \\widetilde{w}_{-1}X_{\\ell,jk}(u)\\widetilde{w}_{-1}^{-1}&=X_{j-1-\\ell,jk}\\left((-1)^{j-\\ell-1} u \\right), \\\\\n\\tag{U:4b}\n  \\widetilde{w}_{-1}Y_{\\ell,jk}(u)\\widetilde{w}_{-1}^{-1}&=Y_{j-1-\\ell,jk}\\left((-1)^{j-\\ell-1} u \\right), \n \\end{align*}\n\nWe now define $G(\\mathfrak{m})$ as the group given by this presentation, that is,\n$${G}(\\mathfrak{m})= \\left\\langle \\mathcal{X}\\mid \\mathcal{R}\\right\\rangle={F}(\\mathcal{X})/N_\\mathcal{R},$$\nwhere $N_\\mathcal{R}$ is the normal closure of the relations $\\mathcal{R}$.\n\nThe commutator is $(a,b) := aba^{-1}b^{-1}$, and $(G,G)$ denotes the commutator subgroup of a group $G$. Relations are referred to by their tags, e.g. (Re:1a).\n\n[Formalization note from the problem set: the statements and proofs use $c$ only through the index set $E$, and Theorem 3.3 uses $(0,2,k),(1,2,k)\\in E$ for some $k$, i.e. $c(2)\\geq 1$ (indeed $c(2)=21493760$). A formalization may take $c:\\mathbb{N}\\to\\mathbb{N}$ as a parameter, with the hypothesis $c(2)\\geq 1$ where it is needed, instead of defining the coefficients of $J$.]\n\nCorollary 3.2 (book label `cor: gsimple x inverse`).\n\n\\begin{corollary} For all $u\\in\\mathbb{C}$, $X_{-1}(u)^{-1}=X_{-1}(-u)$.\n\\end{corollary}\n<\/informal_statement>\n\n<report>\n\\section{Statement}\n\nLet $\\mathbb{C}$ denote the complex numbers and $\\mathbb{N}$ the natural numbers. Let $c(j)$ denote the coefficient of $q^j$ in the modular function\n\\[\nJ(q)=\\sum_{j\\geq -1}c(j)q^j=\\frac{1}{q}+196884\\,q+21493760\\,q^2+864299970\\,q^3+\\cdots,\n\\]\nso that $c(-1)=1$, $c(0)=0$, $c(1)=196884,\\dots$.\n\n\\paragraph{Index set and constants.} The index set is\n\\[\nE=\\{(\\ell,j,k)\\mid j\\in\\mathbb{N},\\ 1\\leq k\\leq c(j),\\ 0\\leq \\ell<j\\}.\n\\]\nFor $(\\ell,j,k)\\in E$ we set\n\\[\nc_{\\ell j}:=(-1)^{\\ell+1}\\binom{j-1}{\\ell}(\\ell+1)(j-\\ell)\\in\\mathbb{C}.\n\\]\n\n\\paragraph{Generators.} Let $\\cX$ be the set of symbols\n\\[\n\\{H_1(s),H_2(s),X_{-1}(u),Y_{-1}(u),X_{\\ell,jk}(u),Y_{\\ell,jk}(u)\\mid s\\in\\Cx,\\ u\\in\\mathbb{C},\\ (\\ell,j,k)\\in E\\},\n\\]\nand let $F(\\cX)$ be the free group on $\\cX$.\n\n\\paragraph{Relations.} The commutator is $(a,b):=aba^{-1}b^{-1}$. The set $\\cR\\subseteq F(\\cX)$ and the auxiliary elements $\\wt_{-1}(s)$, $\\wt_{\\ell,jk}(s)$ are given as follows, for all $s,t\\in\\Cx$, $u,v\\in\\mathbb{C}$ and $(\\ell,j,k),(m,p,q)\\in E$.\n\\begingroup\\allowdisplaybreaks\n\\begin{align*}\n\\tag{Re:0}\n  \\wt_{-1}(s) &:= X_{-1}(s)\\,Y_{-1}(-s^{-1})\\,X_{-1}(s), \\qquad \\wt_{-1}:=\\wt_{-1}(1),\\\\\n\\tag{Im:0}\n  \\wt_{\\ell,jk}(s) &:= X_{\\ell,jk}(s)\\,Y_{\\ell,jk}\\Bigl(\\frac{-s^{-1}}{c_{\\ell j}}\\Bigr)\\,X_{\\ell,jk}(s), \\qquad \\wt_{\\ell,jk}:=\\wt_{\\ell,jk}(1),\\\\\n\\intertext{Relations defining a subgroup $\\mathrm{GL}_2(-1)$:}\n\\tag{H:1a} H_1(s)H_1(t)&=H_1(st),\\\\\n\\tag{H:1b} H_2(s)H_2(t)&=H_2(st),\\\\\n\\tag{H:2} H_1(s)H_2(t)&=H_2(t)H_1(s),\\\\\n\\tag{Re:1a} X_{-1}(u)X_{-1}(v)&=X_{-1}(u+v),\\\\\n\\tag{Re:1b} Y_{-1}(u)Y_{-1}(v)&=Y_{-1}(u+v),\\\\\n\\tag{Re:2} Y_{-1}(-t)X_{-1}(s)Y_{-1}(t)&=X_{-1}(-t^{-1})\\,Y_{-1}(-t^{2}s)\\,X_{-1}(t^{-1}),\\\\\n\\tag{Re:3} \\wt_{-1}(s)\\wt_{-1}&=H_1(-s)H_2(-s^{-1}),\\\\\n\\tag{Re:4a} \\wt_{-1}X_{-1}(u)\\wt_{-1}^{-1}&=Y_{-1}(-u),\\\\\n\\tag{Re:4b} \\wt_{-1}Y_{-1}(u)\\wt_{-1}^{-1}&=X_{-1}(-u),\\\\\n\\tag{Re:5a} \\wt_{-1}H_1(s)\\wt_{-1}^{-1}&=H_2(s),\\\\\n\\tag{Re:5b} \\wt_{-1}H_2(s)\\wt_{-1}^{-1}&=H_1(s),\\\\\n\\tag{Re:6a} H_1(s)X_{-1}(u)H_1(s)^{-1}&=X_{-1}(su),\\\\\n\\tag{Re:6b} H_2(s)X_{-1}(u)H_2(s)^{-1}&=X_{-1}(s^{-1}u),\\\\\n\\tag{Re:6c} H_1(s)Y_{-1}(u)H_1(s)^{-1}&=Y_{-1}(s^{-1}u),\\\\\n\\tag{Re:6d} H_2(s)Y_{-1}(u)H_2(s)^{-1}&=Y_{-1}(su),\\\\\n\\intertext{Relations defining subgroups $\\mathrm{GL}_2(\\ell,j,k)$:}\n\\tag{Im:1a} X_{\\ell,jk}(u)X_{\\ell,jk}(v)&=X_{\\ell,jk}(u+v),\\\\\n\\tag{Im:1b} Y_{\\ell,jk}(u)Y_{\\ell,jk}(v)&=Y_{\\ell,jk}(u+v),\\\\\n\\tag{Im:2} Y_{\\ell,jk}(-t)X_{\\ell,jk}(s)Y_{\\ell,jk}(t)&=X_{\\ell,jk}\\Bigl(\\frac{-t^{-1}}{c_{\\ell j}}\\Bigr)\\,Y_{\\ell,jk}(-c_{\\ell j}t^2s)\\,X_{\\ell,jk}\\Bigl(\\frac{t^{-1}}{c_{\\ell j}}\\Bigr),\\\\\n\\tag{Im:3} \\wt_{\\ell,jk}\\bigl(s^{(\\ell+1)(j-\\ell)}\\bigr)\\wt_{\\ell,jk}&=H_1\\bigl((-s)^{j-\\ell}\\bigr)H_2\\bigl((-s)^{\\ell+1}\\bigr),\\\\\n\\tag{Im:4a} \\wt_{\\ell,jk}X_{\\ell,jk}(u)\\wt_{\\ell,jk}^{-1}&=Y_{\\ell,jk}\\Bigl(\\frac{-u}{c_{\\ell j}}\\Bigr),\\\\\n\\tag{Im:4b} \\wt_{\\ell,jk}Y_{\\ell,jk}(u)\\wt_{\\ell,jk}^{-1}&=X_{\\ell,jk}(-c_{\\ell j}u),\\\\\n\\tag{Im:5a} \\wt_{\\ell,jk}H_1\\bigl(s^{j-\\ell}\\bigr)\\wt_{\\ell,jk}^{-1}&=H_2\\bigl(s^{-(\\ell+1)}\\bigr),\\\\\n\\tag{Im:5b} \\wt_{\\ell,jk}H_2\\bigl(s^{\\ell+1}\\bigr)\\wt_{\\ell,jk}^{-1}&=H_1\\bigl(s^{-(j-\\ell)}\\bigr),\\\\\n\\tag{Im:6a} H_1(s)X_{\\ell,jk}(u)H_1(s)^{-1}&=X_{\\ell,jk}(s^{\\ell+1}u),\\\\\n\\tag{Im:6b} H_2(s)X_{\\ell,jk}(u)H_2(s)^{-1}&=X_{\\ell,jk}(s^{j-\\ell}u),\\\\\n\\tag{Im:6c} H_1(s)Y_{\\ell,jk}(u)H_1(s)^{-1}&=Y_{\\ell,jk}(s^{-(\\ell+1)}u),\\\\\n\\tag{Im:6d} H_2(s)Y_{\\ell,jk}(u)H_2(s)^{-1}&=Y_{\\ell,jk}(s^{-(j-\\ell)}u),\\\\\n\\intertext{Relations between the unipotent generators:}\n\\tag{U:1a} (X_{-1}(u),X_{j-1,jk}(v))&=1,\\\\\n\\tag{U:1b} (Y_{-1}(u),Y_{j-1,jk}(v))&=1,\\\\\n\\tag{U:1c} (Y_{-1}(u),X_{0,jk}(v))&=1,\\\\\n\\tag{U:1d} (X_{-1}(u),Y_{0,jk}(v))&=1,\\\\\n\\tag{U:2} (X_{\\ell,jk}(u),Y_{m,pq}(v))&=1\\quad\\text{for } j\\neq p,\\text{ or } k\\neq q,\\text{ or } |\\ell-m|>1,\\\\\n\\tag{U:3a} (X_{1,2k}(u),Y_{0,2k}(v))&=X_{-1}(uv),\\\\\n\\tag{U:3b} (X_{0,2k}(u),Y_{1,2k}(v))&=Y_{-1}(uv),\\\\\n\\intertext{Action of $\\wt_{-1}$ on the unipotent generators:}\n\\tag{U:4a} \\wt_{-1}X_{\\ell,jk}(u)\\wt_{-1}^{-1}&=X_{j-1-\\ell,jk}\\bigl((-1)^{j-\\ell-1}u\\bigr),\\\\\n\\tag{U:4b} \\wt_{-1}Y_{\\ell,jk}(u)\\wt_{-1}^{-1}&=Y_{j-1-\\ell,jk}\\bigl((-1)^{j-\\ell-1}u\\bigr).\n\\end{align*}\n\\endgroup\n\n\\paragraph{The group.} The group is\n\\[\nG(\\mathfrak{m})=\\langle\\cX\\mid\\cR\\rangle=F(\\cX)/N_\\cR,\n\\]\nwhere $N_\\cR$ is the normal closure of $\\cR$.\n\n\\begin{theorem}[Corollary 3.2]\nFor all $u\\in\\mathbb{C}$, $X_{-1}(u)^{-1}=X_{-1}(-u)$ in $G(\\mathfrak{m})$.\n\\end{theorem}\n\n\\section{Formalization}\n\nThroughout, $c:\\mathbb{N}\\to\\mathbb{N}$ is an arbitrary function. It is a parameter of every definition, and it replaces the coefficient function of $J$; see the discussion after the target statement.\n\n\\paragraph{The index set.} The index set $E_c$ is the set of triples $(\\ell,j,k)\\in\\mathbb{N}^3$ with\n\\[\n\\ell<j \\quad\\text{and}\\quad 1\\leq k\\leq c(j).\n\\]\nThis is the source's $E$ with $c$ in place of the coefficients of $J$.\n\n[Lean code of Idx]\n```lean\n/-- Index set E = {(ℓ,j,k) | 1 ≤ k ≤ c(j), 0 ≤ ℓ < j}, encoded as triples (ℓ,j,k). -/\ndef Idx (c : ℕ → ℕ) : Type := {t : ℕ × ℕ × ℕ // t.1 < t.2.1 ∧ 1 ≤ t.2.2 ∧ t.2.2 ≤ c t.2.1}\n```\n\nFor $e=(\\ell,j,k)\\in E_c$ we write $\\ell_e=\\ell$, $j_e=j$ and $k_e=k$ for the three coordinates.\n\n[Lean code of Idx.l]\n```lean\ndef Idx.l (e : Idx c) : ℕ := e.1.1\n```\n[Lean code of Idx.j]\n```lean\ndef Idx.j (e : Idx c) : ℕ := e.1.2.1\n```\n[Lean code of Idx.k]\n```lean\ndef Idx.k (e : Idx c) : ℕ := e.1.2.2\n```\n\n\\paragraph{The generating symbols.} The set of symbols $\\cX_c$ is the disjoint union of the following families:\n\\begin{itemize}\n\\item $H_1(s)$ and $H_2(s)$ for $s\\in\\Cx$;\n\\item $X_{-1}(u)$ and $Y_{-1}(u)$ for $u\\in\\mathbb{C}$;\n\\item $X_e(u)$ and $Y_e(u)$ for $e\\in E_c$ and $u\\in\\mathbb{C}$.\n\\end{itemize}\nHere $X_e(u)$ stands for the source's $X_{\\ell,jk}(u)$ when $e=(\\ell,j,k)$, and similarly for $Y_e(u)$.\n\n[Lean code of Gen]\n```lean\n/-- The generating symbols 𝒳. -/\ninductive Gen (c : ℕ → ℕ) : Type\n  | H1 (s : ℂˣ) : Gen c\n  | H2 (s : ℂˣ) : Gen c\n  | Xm (u : ℂ) : Gen c\n  | Ym (u : ℂ) : Gen c\n  | X (e : Idx c) (u : ℂ) : Gen c\n  | Y (e : Idx c) (u : ℂ) : Gen c\n```\n\nThe next six definitions are the images of these symbols in the free group $F(\\cX_c)$, that is, the corresponding words of length one. We denote them by the same letters $H_1(s)$, $H_2(s)$, $X_{-1}(u)$, $Y_{-1}(u)$, $X_e(u)$, $Y_e(u)$.\n\n[Lean code of fH1]\n```lean\ndef fH1 (s : ℂˣ) : FreeGroup (Gen c) := FreeGroup.of (Gen.H1 s)\n```\n[Lean code of fH2]\n```lean\ndef fH2 (s : ℂˣ) : FreeGroup (Gen c) := FreeGroup.of (Gen.H2 s)\n```\n[Lean code of fXm]\n```lean\ndef fXm (u : ℂ) : FreeGroup (Gen c) := FreeGroup.of (Gen.Xm u)\n```\n[Lean code of fYm]\n```lean\ndef fYm (u : ℂ) : FreeGroup (Gen c) := FreeGroup.of (Gen.Ym u)\n```\n[Lean code of fX]\n```lean\ndef fX (e : Idx c) (u : ℂ) : FreeGroup (Gen c) := FreeGroup.of (Gen.X e u)\n```\n[Lean code of fY]\n```lean\ndef fY (e : Idx c) (u : ℂ) : FreeGroup (Gen c) := FreeGroup.of (Gen.Y e u)\n```\n\n\\paragraph{The constants $c_{\\ell j}$.} For $e=(\\ell,j,k)\\in E_c$,\n\\[\nc_e:=(-1)^{\\ell+1}\\binom{j-1}{\\ell}(\\ell+1)(j-\\ell)\\in\\mathbb{C}.\n\\]\nThe differences $j-1$ and $j-\\ell$ are computed in $\\mathbb{N}$ by truncated subtraction. Since $\\ell<j$ forces $j\\geq 1$, both are the true differences. Hence $c_e=c_{\\ell j}$.\n\n[Lean code of cc]\n```lean\n/-- c_{ℓ j} = (-1)^{ℓ+1} C(j-1,ℓ) (ℓ+1)(j-ℓ). -/\ndef cc (e : Idx c) : ℂ :=\n  ((-1 : ℂ) ^ (e.l + 1)) * (((e.j - 1).choose e.l : ℕ) : ℂ) * ((e.l : ℂ) + 1) * ((e.j - e.l : ℕ) : ℂ)\n```\n\n\\paragraph{The elements $\\wt$.} For $s\\in\\Cx$ and $e\\in E_c$, define the words in $F(\\cX_c)$\n\\[\n\\wt_{-1}(s):=X_{-1}(s)\\,Y_{-1}(-s^{-1})\\,X_{-1}(s)\n\\]\nand\n\\[\n\\wt_e(s):=X_e(s)\\,Y_e(-s^{-1}/c_e)\\,X_e(s).\n\\]\nThese are (Re:0) and (Im:0). The source's $\\wt_{-1}$ and $\\wt_{\\ell,jk}$ are $\\wt_{-1}(1)$ and $\\wt_e(1)$.\n\n[Lean code of wm]\n```lean\n/-- (Re:0) -/\ndef wm (s : ℂˣ) : FreeGroup (Gen c) := fXm (s : ℂ) * fYm (-((s : ℂ)⁻¹)) * fXm (s : ℂ)\n```\n[Lean code of wt]\n```lean\n/-- (Im:0) -/\ndef wt (e : Idx c) (s : ℂˣ) : FreeGroup (Gen c) :=\n  fX e (s : ℂ) * fY e (-((s : ℂ)⁻¹) / cc e) * fX e (s : ℂ)\n```\n\n\\paragraph{Commutator and conjugation.} For $a,b\\in F(\\cX_c)$, the commutator is $(a,b):=aba^{-1}b^{-1}$ and the conjugate is $a\\,b\\,a^{-1}$.\n\n[Lean code of comm]\n```lean\n/-- commutator (a,b) = a b a⁻¹ b⁻¹ -/\ndef comm (a b : FreeGroup (Gen c)) : FreeGroup (Gen c) := a * b * a⁻¹ * b⁻¹\n```\n[Lean code of conj]\n```lean\n/-- conjugation a b a⁻¹ -/\ndef conj (a b : FreeGroup (Gen c)) : FreeGroup (Gen c) := a * b * a⁻¹\n```\n\n\\paragraph{The relators.} The set $\\cR_c\\subseteq F(\\cX_c)$ consists of the words $L\\,R^{-1}$, one for each source relation $L=R$. For relations of the form $(a,b)=1$ the word is the commutator $(a,b)$ itself. The families are listed below. Here $s,t$ range over $\\Cx$, $u,v$ over $\\mathbb{C}$, and $e,f,e'$ over $E_c$. Powers of $s$ with exponent in $\\mathbb{N}$ or $\\mathbb{Z}$ are taken in $\\Cx$ when they are arguments of $H_i$, and in $\\mathbb{C}$ otherwise. Abbreviate $\\ell=\\ell_e$, $j=j_e$, $k=k_e$.\n\\begin{itemize}\n\\item (H:1a), (H:1b): $H_1(s)H_1(t)H_1(st)^{-1}$ and $H_2(s)H_2(t)H_2(st)^{-1}$.\n\\item (H:2): $H_1(s)H_2(t)\\bigl(H_2(t)H_1(s)\\bigr)^{-1}$.\n\\item (Re:1a), (Re:1b): $X_{-1}(u)X_{-1}(v)X_{-1}(u+v)^{-1}$ and $Y_{-1}(u)Y_{-1}(v)Y_{-1}(u+v)^{-1}$.\n\\item (Re:2): $Y_{-1}(-t)X_{-1}(s)Y_{-1}(t)\\bigl(X_{-1}(-t^{-1})Y_{-1}(-t^2s)X_{-1}(t^{-1})\\bigr)^{-1}$.\n\\item (Re:3): $\\wt_{-1}(s)\\wt_{-1}(1)\\bigl(H_1(-s)H_2(-s^{-1})\\bigr)^{-1}$.\n\\item (Re:4a)--(Re:5b): $\\wt_{-1}(1)\\,g\\,\\wt_{-1}(1)^{-1}\\,h^{-1}$ for the pairs $(g,h)$ equal to $(X_{-1}(u),Y_{-1}(-u))$, $(Y_{-1}(u),X_{-1}(-u))$, $(H_1(s),H_2(s))$ and $(H_2(s),H_1(s))$.\n\\item (Re:6a)--(Re:6d): $H_1(s)X_{-1}(u)H_1(s)^{-1}X_{-1}(su)^{-1}$, together with the analogous words for $X_{-1}(s^{-1}u)$ under $H_2$, for $Y_{-1}(s^{-1}u)$ under $H_1$, and for $Y_{-1}(su)$ under $H_2$.\n\\item (Im:1a), (Im:1b): $X_e(u)X_e(v)X_e(u+v)^{-1}$ and $Y_e(u)Y_e(v)Y_e(u+v)^{-1}$.\n\\item (Im:2): $Y_e(-t)X_e(s)Y_e(t)\\bigl(X_e(-t^{-1}/c_e)\\,Y_e(-c_et^2s)\\,X_e(t^{-1}/c_e)\\bigr)^{-1}$.\n\\item (Im:3): $\\wt_e\\bigl(s^{(\\ell+1)(j-\\ell)}\\bigr)\\wt_e(1)\\bigl(H_1((-s)^{j-\\ell})H_2((-s)^{\\ell+1})\\bigr)^{-1}$.\n\\item (Im:4a), (Im:4b): $\\wt_e(1)X_e(u)\\wt_e(1)^{-1}Y_e(-u/c_e)^{-1}$ and $\\wt_e(1)Y_e(u)\\wt_e(1)^{-1}X_e(-c_eu)^{-1}$.\n\\item (Im:5a), (Im:5b): $\\wt_e(1)H_1(s^{j-\\ell})\\wt_e(1)^{-1}H_2(s^{-(\\ell+1)})^{-1}$ and $\\wt_e(1)H_2(s^{\\ell+1})\\wt_e(1)^{-1}H_1(s^{-(j-\\ell)})^{-1}$. The negative exponents are integer powers in $\\Cx$.\n\\item (Im:6a)--(Im:6d): $H_1(s)X_e(u)H_1(s)^{-1}X_e(s^{\\ell+1}u)^{-1}$, together with the analogous words for $X_e(s^{j-\\ell}u)$ under $H_2$, for $Y_e(s^{-(\\ell+1)}u)$ under $H_1$, and for $Y_e(s^{-(j-\\ell)}u)$ under $H_2$.\n\\item (U:1a), (U:1b): $(X_{-1}(u),X_e(v))$ and $(Y_{-1}(u),Y_e(v))$ for all $e$ with $\\ell_e+1=j_e$, that is, $\\ell_e=j_e-1$.\n\\item (U:1c), (U:1d): $(Y_{-1}(u),X_e(v))$ and $(X_{-1}(u),Y_e(v))$ for all $e$ with $\\ell_e=0$.\n\\item (U:2): $(X_e(u),Y_f(v))$ for all $e,f$ with $j_e\\neq j_f$, or $k_e\\neq k_f$, or $|\\ell_e-\\ell_f|>1$.\n\\item (U:3a): $(X_e(u),Y_f(v))\\,X_{-1}(uv)^{-1}$ for all $e,f\\in E_c$ such that $e=(1,2,k)$ and $f=(0,2,k)$ for some $k\\in\\mathbb{N}$.\n\\item (U:3b): $(X_e(u),Y_f(v))\\,Y_{-1}(uv)^{-1}$ for all $e,f\\in E_c$ such that $e=(0,2,k)$ and $f=(1,2,k)$ for some $k$.\n\\item (U:4a), (U:4b): $\\wt_{-1}(1)X_e(u)\\wt_{-1}(1)^{-1}X_{e'}\\bigl((-1)^{j-\\ell-1}u\\bigr)^{-1}$ and the same word with $Y$ in place of $X$, for all $e,e'$ with $e'=(j-1-\\ell,j,k)$. Because $\\ell<j$, the subtraction $j-1-\\ell$ in $\\mathbb{N}$ is exact, and this triple always lies in $E_c$.\n\\end{itemize}\nThis list is exactly the source's $\\cR$, with $E$ replaced by $E_c$.\n\n[Lean code of Rl]\n```lean\n/-- The set of defining relators; each constructor says `lhs = rhs` via the word `lhs * rhs⁻¹`. -/\ninductive Rl (c : ℕ → ℕ) : FreeGroup (Gen c) → Prop\n  | h1a (s t : ℂˣ) : Rl c (fH1 s * fH1 t * (fH1 (s * t))⁻¹)\n  | h1b (s t : ℂˣ) : Rl c (fH2 s * fH2 t * (fH2 (s * t))⁻¹)\n  | h2 (s t : ℂˣ) : Rl c (fH1 s * fH2 t * (fH2 t * fH1 s)⁻¹)\n  | re1a (u v : ℂ) : Rl c (fXm u * fXm v * (fXm (u + v))⁻¹)\n  | re1b (u v : ℂ) : Rl c (fYm u * fYm v * (fYm (u + v))⁻¹)\n  | re2 (s t : ℂˣ) :\n      Rl c (fYm (-(t : ℂ)) * fXm (s : ℂ) * fYm (t : ℂ) *\n        (fXm (-((t : ℂ)⁻¹)) * fYm (-((t : ℂ) ^ 2 * (s : ℂ))) * fXm ((t : ℂ)⁻¹))⁻¹)\n  | re3 (s : ℂˣ) : Rl c (wm s * wm 1 * (fH1 (-s) * fH2 (-s⁻¹))⁻¹)\n  | re4a (u : ℂ) : Rl c (conj (wm 1) (fXm u) * (fYm (-u))⁻¹)\n {align*}\n\\endgroup\n\n\\paragraph{The group.} The group is\n\\[\nG(\\mathfrak{m})=\\langle\\cX\\mid\\cR\\rangle=F(\\cX)/N_\\cR,\n\\]\nwhere $N_\\cR$ is the normal closure of $\\cR$.\n\n\\begin{theorem}[Corollary 3.2]\nFor all $u\\in\\mathbb{C}$, $X_{-1}(u)^{-1}=X_{-1}(-u)$ in $G(\\mathfrak{m})$.\n\\end{theorem}\n\n\\section{Formalization}\n\nThroughout, $c:\\mathbb{N}\\to\\mathbb{N}$ is an arbitrary function. It is a parameter of every definition, and it replaces the coefficient function of $J$; see the discussion after the target statement.\n\n\\paragraph{The index set.} The index set $E_c$ is the set of triples $(\\ell,j,k)\\in\\mathbb{N}^3$ with\n\\[\n\\ell<j \\quad\\text{and}\\quad 1\\leq k\\leq c(j).\n\\]\nThis is the source's $E$ with $c$ in place of the coefficients of $J$.\n\n\\LeanDecl{Idx}\n\nFor $e=(\\ell,j,k)\\in E_c$ we write $\\ell_e=\\ell$, $j_e=j$ and $k_e=k$ for the three coordinates.\n\n\\LeanDecl{Idx.l}\n\\LeanDecl{Idx.j}\n\\LeanDecl{Idx.k}\n\n\\paragraph{The generating symbols.} The set of symbols $\\cX_c$ is the disjoint union of the following families:\n\\begin{itemize}\n\\item $H_1(s)$ and $H_2(s)$ for $s\\in\\Cx$;\n\\item $X_{-1}(u)$ and $Y_{-1}(u)$ for $u\\in\\mathbb{C}$;\n\\item $X_e(u)$ and $Y_e(u)$ for $e\\in E_c$ and $u\\in\\mathbb{C}$.\n\\end{itemize}\nHere $X_e(u)$ stands for the source's $X_{\\ell,jk}(u)$ when $e=(\\ell,j,k)$, and similarly for $Y_e(u)$.\n\n\\LeanDecl{Gen}\n\nThe next six definitions are the images of these symbols in the free group $F(\\cX_c)$, that is, the corresponding words of length one. We denote them by the same letters $H_1(s)$, $H_2(s)$, $X_{-1}(u)$, $Y_{-1}(u)$, $X_e(u)$, $Y_e(u)$.\n\n\\LeanDecl{fH1}\n\\LeanDecl{fH2}\n\\LeanDecl{fXm}\n\\LeanDecl{fYm}\n\\LeanDecl{fX}\n\\LeanDecl{fY}\n\n\\paragraph{The constants $c_{\\ell j}$.} For $e=(\\ell,j,k)\\in E_c$,\n\\[\nc_e:=(-1)^{\\ell+1}\\binom{j-1}{\\ell}(\\ell+1)(j-\\ell)\\in\\mathbb{C}.\n\\]\nThe differences $j-1$ and $j-\\ell$ are computed in $\\mathbb{N}$ by truncated subtraction. Since $\\ell<j$ forces $j\\geq 1$, both are the true differences. Hence $c_e=c_{\\ell j}$.\n\n\\LeanDecl{cc}\n\n\\paragraph{The elements $\\wt$.} For $s\\in\\Cx$ and $e\\in E_c$, define the words in $F(\\cX_c)$\n\\[\n\\wt_{-1}(s):=X_{-1}(s)\\,Y_{-1}(-s^{-1})\\,X_{-1}(s)\n\\]\nand\n\\[\n\\wt_e(s):=X_e(s)\\,Y_e(-s^{-1}/c_e)\\,X_e(s).\n\\]\nThese are (Re:0) and (Im:0). The source's $\\wt_{-1}$ and $\\wt_{\\ell,jk}$ are $\\wt_{-1}(1)$ and $\\wt_e(1)$.\n\n\\LeanDecl{wm}\n\\LeanDecl{wt}\n\n\\paragraph{Commutator and conjugation.} For $a,b\\in F(\\cX_c)$, the commutator is $(a,b):=aba^{-1}b^{-1}$ and the conjugate is $a\\,b\\,a^{-1}$.\n\n\\LeanDecl{comm}\n\\LeanDecl{conj}\n\n\\paragraph{The relators.} The set $\\cR_c\\subseteq F(\\cX_c)$ consists of the words $L\\,R^{-1}$, one for each source relation $L=R$. For relations of the form $(a,b)=1$ the word is the commutator $(a,b)$ itself. The families are listed below. Here $s,t$ range over $\\Cx$, $u,v$ over $\\mathbb{C}$, and $e,f,e'$ over $E_c$. Powers of $s$ with exponent in $\\mathbb{N}$ or $\\mathbb{Z}$ are taken in $\\Cx$ when they are arguments of $H_i$, and in $\\mathbb{C}$ otherwise. Abbreviate $\\ell=\\ell_e$, $j=j_e$, $k=k_e$.\n\\begin{itemize}\n\\item (H:1a), (H:1b): $H_1(s)H_1(t)H_1(st)^{-1}$ and $H_2(s)H_2(t)H_2(st)^{-1}$.\n\\item (H:2): $H_1(s)H_2(t)\\bigl(H_2(t)H_1(s)\\bigr)^{-1}$.\n\\item (Re:1a), (Re:1b): $X_{-1}(u)X_{-1}(v)X_{-1}(u+v)^{-1}$ and $Y_{-1}(u)Y_{-1}(v)Y_{-1}(u+v)^{-1}$.\n\\item (Re:2): $Y_{-1}(-t)X_{-1}(s)Y_{-1}(t)\\bigl(X_{-1}(-t^{-1})Y_{-1}(-t^2s)X_{-1}(t^{-1})\\bigr)^{-1}$.\n\\item (Re:3): $\\wt_{-1}(s)\\wt_{-1}(1)\\bigl(H_1(-s)H_2(-s^{-1})\\bigr)^{-1}$.\n\\item (Re:4a)--(Re:5b): $\\wt_{-1}(1)\\,g\\,\\wt_{-1}(1)^{-1}\\,h^{-1}$ for the pairs $(g,h)$ equal to $(X_{-1}(u),Y_{-1}(-u))$, $(Y_{-1}(u),X_{-1}(-u))$, $(H_1(s),H_2(s))$ and $(H_2(s),H_1(s))$.\n\\item (Re:6a)--(Re:6d): $H_1(s)X_{-1}(u)H_1(s)^{-1}X_{-1}(su)^{-1}$, together with the analogous words for $X_{-1}(s^{-1}u)$ under $H_2$, for $Y_{-1}(s^{-1}u)$ under $H_1$, and for $Y_{-1}(su)$ under $H_2$.\n\\item (Im:1a), (Im:1b): $X_e(u)X_e(v)X_e(u+v)^{-1}$ and $Y_e(u)Y_e(v)Y_e(u+v)^{-1}$.\n\\item (Im:2): $Y_e(-t)X_e(s)Y_e(t)\\bigl(X_e(-t^{-1}/c_e)\\,Y_e(-c_et^2s)\\,X_e(t^{-1}/c_e)\\bigr)^{-1}$.\n\\item (Im:3): $\\wt_e\\bigl(s^{(\\ell+1)(j-\\ell)}\\bigr)\\wt_e(1)\\bigl(H_1((-s)^{j-\\ell})H_2((-s)^{\\ell+1})\\bigr)^{-1}$.\n\\item (Im:4a), (Im:4b): $\\wt_e(1)X_e(u)\\wt_e(1)^{-1}Y_e(-u/c_e)^{-1}$ and $\\wt_e(1)Y_e(u)\\wt_e(1)^{-1}X_e(-c_eu)^{-1}$.\n\\item (Im:5a), (Im:5b): $\\wt_e(1)H_1(s^{j-\\ell})\\wt_e(1)^{-1}H_2(s^{-(\\ell+1)})^{-1}$ and $\\wt_e(1)H_2(s^{\\ell+1})\\wt_e(1)^{-1}H_1(s^{-(j-\\ell)})^{-1}$. The negative exponents are integer powers in $\\Cx$.\n\\item (Im:6a)--(Im:6d): $H_1(s)X_e(u)H_1(s)^{-1}X_e(s^{\\ell+1}u)^{-1}$, together with the analogous words for $X_e(s^{j-\\ell}u)$ under $H_2$, for $Y_e(s^{-(\\ell+1)}u)$ under $H_1$, and for $Y_e(s^{-(j-\\ell)}u)$ under $H_2$.\n\\item (U:1a), (U:1b): $(X_{-1}(u),X_e(v))$ and $(Y_{-1}(u),Y_e(v))$ for all $e$ with $\\ell_e+1=j_e$, that is, $\\ell_e=j_e-1$.\n\\item (U:1c), (U:1d): $(Y_{-1}(u),X_e(v))$ and $(X_{-1}(u),Y_e(v))$ for all $e$ with $\\ell_e=0$.\n\\item (U:2): $(X_e(u),Y_f(v))$ for all $e,f$ with $j_e\\neq j_f$, or $k_e\\neq k_f$, or $|\\ell_e-\\ell_f|>1$.\n\\item (U:3a): $(X_e(u),Y_f(v))\\,X_{-1}(uv)^{-1}$ for all $e,f\\in E_c$ such that $e=(1,2,k)$ and $f=(0,2,k)$ for some $k\\in\\mathbb{N}$.\n\\item (U:3b): $(X_e(u),Y_f(v))\\,Y_{-1}(uv)^{-1}$ for all $e,f\\in E_c$ such that $e=(0,2,k)$ and $f=(1,2,k)$ for some $k$.\n\\item (U:4a), (U:4b): $\\wt_{-1}(1)X_e(u)\\wt_{-1}(1)^{-1}X_{e'}\\bigl((-1)^{j-\\ell-1}u\\bigr)^{-1}$ and the same word with $Y$ in place of $X$, for all $e,e'$ with $e'=(j-1-\\ell,j,k)$. Because $\\ell<j$, the subtraction $j-1-\\ell$ in $\\mathbb{N}$ is exact, and this triple always lies in $E_c$.\n\\end{itemize}\nThis list is exactly the source's $\\cR$, with $E$ replaced by $E_c$.\n\n\\LeanDecl{Rl}\n\n\\paragraph{The group.} The group $G_c$ is the presented group $\\langle\\cX_c\\mid\\cR_c\\rangle=F(\\cX_c)/N_{\\cR_c}$, where $N_{\\cR_c}$ is the normal closure of $\\cR_c$. We write $\\pi:F(\\cX_c)\\to G_c$ for the quotient map.\n\n\\LeanDecl{G}\n\n\\paragraph{The target statement.}\n\n\\LeanDecl{gsimple_x_inverse}\n\nThe statement reads: for every function $c:\\mathbb{N}\\to\\mathbb{N}$ and every $u\\in\\mathbb{C}$,\n\\[\n\\pi\\bigl(X_{-1}(u)\\bigr)^{-1}=\\pi\\bigl(X_{-1}(-u)\\bigr)\\quad\\text{in } G_c.\n\\]\n\n\\paragraph{Relation to the source.} The source's group $G(\\mathfrak{m})$ is the instance of $G_c$ in which $c(j)$ is the coefficient of $q^j$ in $J$ for $j\\in\\mathbb{N}$.\n\\begin{itemize}\n\\item The values $c(-1)$ and $c(0)$ never enter $E$. For $c(-1)$ this is because $j\\in\\mathbb{N}$. For $c(0)$ it is because no $\\ell$ satisfies $\\ell<0$.\n\\item The formal theorem is stated for every $c$, with no hypothesis. In particular it holds for the coefficient function of $J$, and so it contains the source's corollary.\n\\item The hypothesis $c(2)\\geq 1$ mentioned in the problem set is not needed here.\n\\item The corollary does not depend on $c$ at all, since its proof uses only (Re:1a).\n\\end{itemize}\n\n\\section{Proof}\n\n\\subsection{Overview}\n\nThe source proof has two steps. It reads (Re:1a) as $X_{-1}(u)X_{-1}(v)=X_{-1}(u+v)$ in $G(\\mathfrak{m})$, and it sets $v=-u$ and uses $X_{-1}(0)=1$, which it takes from Lemma 3.1. The formal proof follows the same two steps.\n\\begin{itemize}\n\\item \\cref{lem:Xm_add_in_G} is the reading of (Re:1a) as an identity in $G_c$.\n\\item \\cref{lem:Xm_zero_in_G} is the fact $X_{-1}(0)=1$.\n\\end{itemize}\nThe only deviation is that Lemma 3.1 of the source is not imported. The fact $X_{-1}(0)=1$ is instead derived directly from the instance $u=v=0$ of (Re:1a). \\Cref{lem:mk_rel_eq_one_in_G} records the general fact that every relator becomes trivial in $G_c$. It is not used by the later declarations, which invoke the same fact directly for the specific relators they need.\n\n\\begin{lemma}[\\leanname{mk_rel_eq_one_in_G}]\\label{lem:mk_rel_eq_one_in_G}\nLet $c:\\mathbb{N}\\to\\mathbb{N}$ and let $r\\in F(\\cX_c)$ with $r\\in\\cR_c$. Then $\\pi(r)=1$ in $G_c$.\n\\end{lemma}\n\n\\LeanDecl{mk_rel_eq_one_in_G}\n\n\\begin{proof}\nWe have $r\\in\\cR_c\\subseteq N_{\\cR_c}=\\ker\\pi$.\n\\end{proof}\n\n\\begin{lemma}[\\leanname{Xm_add_in_G}]\\label{lem:Xm_add_in_G}\nLet $c:\\mathbb{N}\\to\\mathbb{N}$ and $u,v\\in\\mathbb{C}$. Then in $G_c$\n\\[\n\\pi(X_{-1}(u))\\,\\pi(X_{-1}(v))=\\pi(X_{-1}(u+v)).\n\\]\n\\end{lemma}\n\n\\LeanDecl{Xm_add_in_G}\n\n\\begin{proof}\nPut $a=X_{-1}(u)X_{-1}(v)$ and $b=X_{-1}(u+v)$ in $F(\\cX_c)$. By (Re:1a), the word $ab^{-1}$ belongs to $\\cR_c$, hence to $N_{\\cR_c}$. Two words whose quotient $ab^{-1}$ lies in $N_{\\cR_c}$ have the same image under $\\pi$, so $\\pi(a)=\\pi(b)$. Since $\\pi$ is a homomorphism, $\\pi(a)=\\pi(X_{-1}(u))\\pi(X_{-1}(v))$, which is the claim.\n\\end{proof}\n\n\\begin{lemma}[\\leanname{Xm_zero_in_G}]\\label{lem:Xm_zero_in_G}\nLet $c:\\mathbb{N}\\to\\mathbb{N}$. Then $\\pi(X_{-1}(0))=1$ in $G_c$.\n\\end{lemma}\n\n\\LeanDecl{Xm_zero_in_G}\n\n\\begin{proof}\nThe instance $u=v=0$ of (Re:1a) is the relator $X_{-1}(0)X_{-1}(0)X_{-1}(0+0)^{-1}\\in\\cR_c$, so its image under $\\pi$ is $1$. Since $0+0=0$, this word equals $X_{-1}(0)X_{-1}(0)X_{-1}(0)^{-1}=X_{-1}(0)$ in $F(\\cX_c)$. Hence $\\pi(X_{-1}(0))=1$.\n\\end{proof}\n\n\\subsection{Proof of the theorem}\n\n\\LeanDecl{solution}\n\n\\begin{theorem}\nFor every $c:\\mathbb{N}\\to\\mathbb{N}$ and every $u\\in\\mathbb{C}$, $\\pi(X_{-1}(u))^{-1}=\\pi(X_{-1}(-u))$ in $G_c$.\n\\end{theorem}\n\n\\begin{proof}\nIn any group, if $xy=1$ then $x^{-1}=y$. So it suffices to show that $\\pi(X_{-1}(u))\\,\\pi(X_{-1}(-u))=1$. By \\cref{lem:Xm_add_in_G} with $v=-u$, then $u+(-u)=0$, then \\cref{lem:Xm_zero_in_G},\n\\[\n\\pi(X_{-1}(u))\\,\\pi(X_{-1}(-u))=\\pi(X_{-1}(u+(-u)))=\\pi(X_{-1}(0))=1.\n\\]\n\\end{proof}\n<\/body>\n\n<discrepancies>\n- **Location:** Formalization, \"The relators\", the sentence on powers of $s$ (\"taken in $\\mathbb{C}^\\times$ when they are arguments of $H_i$, and in $\\mathbb{C}$ otherwise\").\n  - **Problem:** In (Im:3), the power $s^{(\\ell+1)(j-\\ell)}$ is the argument of $\\widetilde w_e$, not of an $H_i$. The Lean code (`wt e (s ^ ((e.l + 1) * (e.j - e.l)))`, where `wt : Idx c → ℂˣ → …`) computes it in $\\mathbb{C}^\\times$, not in $\\mathbb{C}$. This does not change any statement, because the coercion $\\mathbb{C}^\\times\\to\\mathbb{C}$ commutes with powers.\n  - **Correction:** Say that powers of $s$ are taken in $\\mathbb{C}^\\times$ when they are arguments of $H_i$ or of $\\widetilde w_e$, and in $\\mathbb{C}$ when they are coefficients inside the arguments of $X_e$ and $Y_e$.\n\nAll other parts check out:\n- Every `Rl` constructor matches its source relation, including truncated subtraction, which is exact because $\\ell<j$.\n- `Idx` and `cc` match the source's $E$ and $c_{\\ell j}$.\n- The target theorem matches the corollary for every $c$, so in particular for the coefficients of $J$.\n- The lemma proofs are correct accounts of the Lean code, and each cites only earlier results.\n<\/discrepancies>", "response": "<title>The inverse of $X_{-1}(u)$ in the group $G(\\mathfrak{m})$: a machine-checked proof<\/title>\n<abstract>We present a formal verification of Corollary 3.2 (label \\texttt{cor: gsimple x inverse}) from a text on the Monster Lie algebra group $G(\\mathfrak{m})$. The group is defined by generators and relations, and the corollary states that $X_{-1}(u)^{-1}=X_{-1}(-u)$ for every $u\\in\\mathbb{C}$. In the formalization the group is the presented group on the generating symbols $\\mathcal{X}$ modulo the full list of defining relations. The index set $E$ is built from an arbitrary function $c:\\mathbb{N}\\to\\mathbb{N}$ in place of the coefficients of the modular function $J$. The identity is proved in Lean 4 with Mathlib for every such $c$, using only the relation (Re:1a).<\/abstract>\n<macros>\\newcommand{\\Cx}{\\mathbb{C}^\\times}\n\\newcommand{\\wt}{\\widetilde{w}}\n\\newcommand{\\cX}{\\mathcal{X}}\n\\newcommand{\\cR}{\\mathcal{R}}<\/macros>\n<body>\n\\section{Statement}\n\nLet $\\mathbb{C}$ denote the complex numbers and $\\mathbb{N}$ the natural numbers. Let $c(j)$ denote the coefficient of $q^j$ in the modular function\n\\[\nJ(q)=\\sum_{j\\geq -1}c(j)q^j=\\frac{1}{q}+196884\\,q+21493760\\,q^2+864299970\\,q^3+\\cdots,\n\\]\nso that $c(-1)=1$, $c(0)=0$, $c(1)=196884,\\dots$.\n\n\\paragraph{Index set and constants.} The index set is\n\\[\nE=\\{(\\ell,j,k)\\mid j\\in\\mathbb{N},\\ 1\\leq k\\leq c(j),\\ 0\\leq \\ell<j\\}.\n\\]\nFor $(\\ell,j,k)\\in E$ we set\n\\[\nc_{\\ell j}:=(-1)^{\\ell+1}\\binom{j-1}{\\ell}(\\ell+1)(j-\\ell)\\in\\mathbb{C}.\n\\]\n\n\\paragraph{Generators.} Let $\\cX$ be the set of symbols\n\\[\n\\{H_1(s),H_2(s),X_{-1}(u),Y_{-1}(u),X_{\\ell,jk}(u),Y_{\\ell,jk}(u)\\mid s\\in\\Cx,\\ u\\in\\mathbb{C},\\ (\\ell,j,k)\\in E\\},\n\\]\nand let $F(\\cX)$ be the free group on $\\cX$.\n\n\\paragraph{Relations.} The commutator is $(a,b):=aba^{-1}b^{-1}$. The set $\\cR\\subseteq F(\\cX)$ and the auxiliary elements $\\wt_{-1}(s)$, $\\wt_{\\ell,jk}(s)$ are given as follows, for all $s,t\\in\\Cx$, $u,v\\in\\mathbb{C}$ and $(\\ell,j,k),(m,p,q)\\in E$.\n\\begingroup\\allowdisplaybreaks\n\\begin{align*}\n\\tag{Re:0}\n  \\wt_{-1}(s) &:= X_{-1}(s)\\,Y_{-1}(-s^{-1})\\,X_{-1}(s), \\qquad \\wt_{-1}:=\\wt_{-1}(1),\\\\\n\\tag{Im:0}\n  \\wt_{\\ell,jk}(s) &:= X_{\\ell,jk}(s)\\,Y_{\\ell,jk}\\Bigl(\\frac{-s^{-1}}{c_{\\ell j}}\\Bigr)\\,X_{\\ell,jk}(s), \\qquad \\wt_{\\ell,jk}:=\\wt_{\\ell,jk}(1),\\\\\n\\intertext{Relations defining a subgroup $\\mathrm{GL}_2(-1)$:}\n\\tag{H:1a} H_1(s)H_1(t)&=H_1(st),\\\\\n\\tag{H:1b} H_2(s)H_2(t)&=H_2(st),\\\\\n\\tag{H:2} H_1(s)H_2(t)&=H_2(t)H_1(s),\\\\\n\\tag{Re:1a} X_{-1}(u)X_{-1}(v)&=X_{-1}(u+v),\\\\\n\\tag{Re:1b} Y_{-1}(u)Y_{-1}(v)&=Y_{-1}(u+v),\\\\\n\\tag{Re:2} Y_{-1}(-t)X_{-1}(s)Y_{-1}(t)&=X_{-1}(-t^{-1})\\,Y_{-1}(-t^{2}s)\\,X_{-1}(t^{-1}),\\\\\n\\tag{Re:3} \\wt_{-1}(s)\\wt_{-1}&=H_1(-s)H_2(-s^{-1}),\\\\\n\\tag{Re:4a} \\wt_{-1}X_{-1}(u)\\wt_{-1}^{-1}&=Y_{-1}(-u),\\\\\n\\tag{Re:4b} \\wt_{-1}Y_{-1}(u)\\wt_{-1}^{-1}&=X_{-1}(-u),\\\\\n\\tag{Re:5a} \\wt_{-1}H_1(s)\\wt_{-1}^{-1}&=H_2(s),\\\\\n\\tag{Re:5b} \\wt_{-1}H_2(s)\\wt_{-1}^{-1}&=H_1(s),\\\\\n\\tag{Re:6a} H_1(s)X_{-1}(u)H_1(s)^{-1}&=X_{-1}(su),\\\\\n\\tag{Re:6b} H_2(s)X_{-1}(u)H_2(s)^{-1}&=X_{-1}(s^{-1}u),\\\\\n\\tag{Re:6c} H_1(s)Y_{-1}(u)H_1(s)^{-1}&=Y_{-1}(s^{-1}u),\\\\\n\\tag{Re:6d} H_2(s)Y_{-1}(u)H_2(s)^{-1}&=Y_{-1}(su),\\\\\n\\intertext{Relations defining subgroups $\\mathrm{GL}_2(\\ell,j,k)$:}\n\\tag{Im:1a} X_{\\ell,jk}(u)X_{\\ell,jk}(v)&=X_{\\ell,jk}(u+v),\\\\\n\\tag{Im:1b} Y_{\\ell,jk}(u)Y_{\\ell,jk}(v)&=Y_{\\ell,jk}(u+v),\\\\\n\\tag{Im:2} Y_{\\ell,jk}(-t)X_{\\ell,jk}(s)Y_{\\ell,jk}(t)&=X_{\\ell,jk}\\Bigl(\\frac{-t^{-1}}{c_{\\ell j}}\\Bigr)\\,Y_{\\ell,jk}(-c_{\\ell j}t^2s)\\,X_{\\ell,jk}\\Bigl(\\frac{t^{-1}}{c_{\\ell j}}\\Bigr),\\\\\n\\tag{Im:3} \\wt_{\\ell,jk}\\bigl(s^{(\\ell+1)(j-\\ell)}\\bigr)\\wt_{\\ell,jk}&=H_1\\bigl((-s)^{j-\\ell}\\bigr)H_2\\bigl((-s)^{\\ell+1}\\bigr),\\\\\n\\tag{Im:4a} \\wt_{\\ell,jk}X_{\\ell,jk}(u)\\wt_{\\ell,jk}^{-1}&=Y_{\\ell,jk}\\Bigl(\\frac{-u}{c_{\\ell j}}\\Bigr),\\\\\n\\tag{Im:4b} \\wt_{\\ell,jk}Y_{\\ell,jk}(u)\\wt_{\\ell,jk}^{-1}&=X_{\\ell,jk}(-c_{\\ell j}u),\\\\\n\\tag{Im:5a} \\wt_{\\ell,jk}H_1\\bigl(s^{j-\\ell}\\bigr)\\wt_{\\ell,jk}^{-1}&=H_2\\bigl(s^{-(\\ell+1)}\\bigr),\\\\\n\\tag{Im:5b} \\wt_{\\ell,jk}H_2\\bigl(s^{\\ell+1}\\bigr)\\wt_{\\ell,jk}^{-1}&=H_1\\bigl(s^{-(j-\\ell)}\\bigr),\\\\\n\\tag{Im:6a} H_1(s)X_{\\ell,jk}(u)H_1(s)^{-1}&=X_{\\ell,jk}(s^{\\ell+1}u),\\\\\n\\tag{Im:6b} H_2(s)X_{\\ell,jk}(u)H_2(s)^{-1}&=X_{\\ell,jk}(s^{j-\\ell}u),\\\\\n\\tag{Im:6c} H_1(s)Y_{\\ell,jk}(u)H_1(s)^{-1}&=Y_{\\ell,jk}(s^{-(\\ell+1)}u),\\\\\n\\tag{Im:6d} H_2(s)Y_{\\ell,jk}(u)H_2(s)^{-1}&=Y_{\\ell,jk}(s^{-(j-\\ell)}u),\\\\\n\\intertext{Relations between the unipotent generators:}\n\\tag{U:1a} (X_{-1}(u),X_{j-1,jk}(v))&=1,\\\\\n\\tag{U:1b} (Y_{-1}(u),Y_{j-1,jk}(v))&=1,\\\\\n\\tag{U:1c} (Y_{-1}(u),X_{0,jk}(v))&=1,\\\\\n\\tag{U:1d} (X_{-1}(u),Y_{0,jk}(v))&=1,\\\\\n\\tag{U:2} (X_{\\ell,jk}(u),Y_{m,pq}(v))&=1\\quad\\text{for } j\\neq p,\\text{ or } k\\neq q,\\text{ or } |\\ell-m|>1,\\\\\n\\tag{U:3a} (X_{1,2k}(u),Y_{0,2k}(v))&=X_{-1}(uv),\\\\\n\\tag{U:3b} (X_{0,2k}(u),Y_{1,2k}(v))&=Y_{-1}(uv),\\\\\n\\intertext{Action of $\\wt_{-1}$ on the unipotent generators:}\n\\tag{U:4a} \\wt_{-1}X_{\\ell,jk}(u)\\wt_{-1}^{-1}&=X_{j-1-\\ell,jk}\\bigl((-1)^{j-\\ell-1}u\\bigr),\\\\\n\\tag{U:4b} \\wt_{-1}Y_{\\ell,jk}(u)\\wt_{-1}^{-1}&=Y_{j-1-\\ell,jk}\\bigl((-1)^{j-\\ell-1}u\\bigr).\n\\end{align*}\n\\endgroup\n\n\\paragraph{The group.} The group is\n\\[\nG(\\mathfrak{m})=\\langle\\cX\\mid\\cR\\rangle=F(\\cX)/N_\\cR,\n\\]\nwhere $N_\\cR$ is the normal closure of $\\cR$.\n\n\\begin{theorem}[Corollary 3.2]\nFor all $u\\in\\mathbb{C}$, $X_{-1}(u)^{-1}=X_{-1}(-u)$ in $G(\\mathfrak{m})$.\n\\end{theorem}\n\n\\section{Formalization}\n\nThroughout, $c:\\mathbb{N}\\to\\mathbb{N}$ is an arbitrary function. It is a parameter of every definition, and it replaces the coefficient function of $J$; see the discussion after the target statement.\n\n\\paragraph{The index set.} The index set $E_c$ is the set of triples $(\\ell,j,k)\\in\\mathbb{N}^3$ with\n\\[\n\\ell<j \\quad\\text{and}\\quad 1\\leq k\\leq c(j).\n\\]\nThis is the source's $E$ with $c$ in place of the coefficients of $J$.\n\n\\LeanDecl{Idx}\n\nFor $e=(\\ell,j,k)\\in E_c$ we write $\\ell_e=\\ell$, $j_e=j$ and $k_e=k$ for the three coordinates.\n\n\\LeanDecl{Idx.l}\n\\LeanDecl{Idx.j}\n\\LeanDecl{Idx.k}\n\n\\paragraph{The generating symbols.} The set of symbols $\\cX_c$ is the disjoint union of the following families:\n\\begin{itemize}\n\\item $H_1(s)$ and $H_2(s)$ for $s\\in\\Cx$;\n\\item $X_{-1}(u)$ and $Y_{-1}(u)$ for $u\\in\\mathbb{C}$;\n\\item $X_e(u)$ and $Y_e(u)$ for $e\\in E_c$ and $u\\in\\mathbb{C}$.\n\\end{itemize}\nHere $X_e(u)$ stands for the source's $X_{\\ell,jk}(u)$ when $e=(\\ell,j,k)$, and similarly for $Y_e(u)$.\n\n\\LeanDecl{Gen}\n\nThe next six definitions are the images of these symbols in the free group $F(\\cX_c)$, that is, the corresponding words of length one. We denote them by the same letters $H_1(s)$, $H_2(s)$, $X_{-1}(u)$, $Y_{-1}(u)$, $X_e(u)$, $Y_e(u)$.\n\n\\LeanDecl{fH1}\n\\LeanDecl{fH2}\n\\LeanDecl{fXm}\n\\LeanDecl{fYm}\n\\LeanDecl{fX}\n\\LeanDecl{fY}\n\n\\paragraph{The constants $c_{\\ell j}$.} For $e=(\\ell,j,k)\\in E_c$,\n\\[\nc_e:=(-1)^{\\ell+1}\\binom{j-1}{\\ell}(\\ell+1)(j-\\ell)\\in\\mathbb{C}.\n\\]\nThe differences $j-1$ and $j-\\ell$ are computed in $\\mathbb{N}$ by truncated subtraction. Since $\\ell<j$ forces $j\\geq 1$, both are the true differences. Hence $c_e=c_{\\ell j}$.\n\n\\LeanDecl{cc}\n\n\\paragraph{The elements $\\wt$.} For $s\\in\\Cx$ and $e\\in E_c$, define the words in $F(\\cX_c)$\n\\[\n\\wt_{-1}(s):=X_{-1}(s)\\,Y_{-1}(-s^{-1})\\,X_{-1}(s)\n\\]\nand\n\\[\n\\wt_e(s):=X_e(s)\\,Y_e(-s^{-1}/c_e)\\,X_e(s).\n\\]\nThese are (Re:0) and (Im:0). The source's $\\wt_{-1}$ and $\\wt_{\\ell,jk}$ are $\\wt_{-1}(1)$ and $\\wt_e(1)$.\n\n\\LeanDecl{wm}\n\\LeanDecl{wt}\n\n\\paragraph{Commutator and conjugation.} For $a,b\\in F(\\cX_c)$, the commutator is $(a,b):=aba^{-1}b^{-1}$ and the conjugate is $a\\,b\\,a^{-1}$.\n\n\\LeanDecl{comm}\n\\LeanDecl{conj}\n\n\\paragraph{The relators.} The set $\\cR_c\\subseteq F(\\cX_c)$ consists of the words $L\\,R^{-1}$, one for each source relation $L=R$. For relations of the form $(a,b)=1$ the word is the commutator $(a,b)$ itself. The families are listed below. Here $s,t$ range over $\\Cx$, $u,v$ over $\\mathbb{C}$, and $e,f,e'$ over $E_c$. Powers of $s$ with exponent in $\\mathbb{N}$ or $\\mathbb{Z}$ are taken in $\\Cx$ when they are arguments of $H_i$ or of $\\wt_e$, and in $\\mathbb{C}$ when they are coefficients inside the arguments of $X_e$ and $Y_e$. Abbreviate $\\ell=\\ell_e$, $j=j_e$, $k=k_e$.\n\\begin{itemize}\n\\item (H:1a), (H:1b): $H_1(s)H_1(t)H_1(st)^{-1}$ and $H_2(s)H_2(t)H_2(st)^{-1}$.\n\\item (H:2): $H_1(s)H_2(t)\\bigl(H_2(t)H_1(s)\\bigr)^{-1}$.\n\\item (Re:1a), (Re:1b): $X_{-1}(u)X_{-1}(v)X_{-1}(u+v)^{-1}$ and $Y_{-1}(u)Y_{-1}(v)Y_{-1}(u+v)^{-1}$.\n\\item (Re:2): $Y_{-1}(-t)X_{-1}(s)Y_{-1}(t)\\bigl(X_{-1}(-t^{-1})Y_{-1}(-t^2s)X_{-1}(t^{-1})\\bigr)^{-1}$.\n\\item (Re:3): $\\wt_{-1}(s)\\wt_{-1}(1)\\bigl(H_1(-s)H_2(-s^{-1})\\bigr)^{-1}$.\n\\item (Re:4a)--(Re:5b): $\\wt_{-1}(1)\\,g\\,\\wt_{-1}(1)^{-1}\\,h^{-1}$ for the pairs $(g,h)$ equal to $(X_{-1}(u),Y_{-1}(-u))$, $(Y_{-1}(u),X_{-1}(-u))$, $(H_1(s),H_2(s))$ and $(H_2(s),H_1(s))$.\n\\item (Re:6a)--(Re:6d): $H_1(s)X_{-1}(u)H_1(s)^{-1}X_{-1}(su)^{-1}$, together with the analogous words for $X_{-1}(s^{-1}u)$ under $H_2$, for $Y_{-1}(s^{-1}u)$ under $H_1$, and for $Y_{-1}(su)$ under $H_2$.\n\\item (Im:1a), (Im:1b): $X_e(u)X_e(v)X_e(u+v)^{-1}$ and $Y_e(u)Y_e(v)Y_e(u+v)^{-1}$.\n\\item (Im:2): $Y_e(-t)X_e(s)Y_e(t)\\bigl(X_e(-t^{-1}/c_e)\\,Y_e(-c_et^2s)\\,X_e(t^{-1}/c_e)\\bigr)^{-1}$.\n\\item (Im:3): $\\wt_e\\bigl(s^{(\\ell+1)(j-\\ell)}\\bigr)\\wt_e(1)\\bigl(H_1((-s)^{j-\\ell})H_2((-s)^{\\ell+1})\\bigr)^{-1}$.\n\\item (Im:4a), (Im:4b): $\\wt_e(1)X_e(u)\\wt_e(1)^{-1}Y_e(-u/c_e)^{-1}$ and $\\wt_e(1)Y_e(u)\\wt_e(1)^{-1}X_e(-c_eu)^{-1}$.\n\\item (Im:5a), (Im:5b): $\\wt_e(1)H_1(s^{j-\\ell})\\wt_e(1)^{-1}H_2(s^{-(\\ell+1)})^{-1}$ and $\\wt_e(1)H_2(s^{\\ell+1})\\wt_e(1)^{-1}H_1(s^{-(j-\\ell)})^{-1}$. The negative exponents are integer powers in $\\Cx$.\n\\item (Im:6a)--(Im:6d): $H_1(s)X_e(u)H_1(s)^{-1}X_e(s^{\\ell+1}u)^{-1}$, together with the analogous words for $X_e(s^{j-\\ell}u)$ under $H_2$, for $Y_e(s^{-(\\ell+1)}u)$ under $H_1$, and for $Y_e(s^{-(j-\\ell)}u)$ under $H_2$.\n\\item (U:1a), (U:1b): $(X_{-1}(u),X_e(v))$ and $(Y_{-1}(u),Y_e(v))$ for all $e$ with $\\ell_e+1=j_e$, that is, $\\ell_e=j_e-1$.\n\\item (U:1c), (U:1d): $(Y_{-1}(u),X_e(v))$ and $(X_{-1}( pend on $c$ at all, since its proof uses only (Re:1a).\n\\end{itemize}\n\n\\section{Proof}\n\n\\subsection{Overview}\n\nThe source proof has two steps. It reads (Re:1a) as $X_{-1}(u)X_{-1}(v)=X_{-1}(u+v)$ in $G(\\mathfrak{m})$, and it sets $v=-u$ and uses $X_{-1}(0)=1$, which it takes from Lemma 3.1. The formal proof follows the same two steps.\n\\begin{itemize}\n\\item \\cref{lem:Xm_add_in_G} is the reading of (Re:1a) as an identity in $G_c$.\n\\item \\cref{lem:Xm_zero_in_G} is the fact $X_{-1}(0)=1$.\n\\end{itemize}\nThe only deviation is that Lemma 3.1 of the source is not imported. The fact $X_{-1}(0)=1$ is instead derived directly from the instance $u=v=0$ of (Re:1a). \\Cref{lem:mk_rel_eq_one_in_G} records the general fact that every relator becomes trivial in $G_c$. It is not used by the later declarations, which invoke the same fact directly for the specific relators they need.\n\n\\begin{lemma}[\\leanname{mk_rel_eq_one_in_G}]\\label{lem:mk_rel_eq_one_in_G}\nLet $c:\\mathbb{N}\\to\\mathbb{N}$ and let $r\\in F(\\cX_c)$ with $r\\in\\cR_c$. Then $\\pi(r)=1$ in $G_c$.\n\\end{lemma}\n\n\\LeanDecl{mk_rel_eq_one_in_G}\n\n\\begin{proof}\nWe have $r\\in\\cR_c\\subseteq N_{\\cR_c}=\\ker\\pi$.\n\\end{proof}\n\n\\begin{lemma}[\\leanname{Xm_add_in_G}]\\label{lem:Xm_add_in_G}\nLet $c:\\mathbb{N}\\to\\mathbb{N}$ and $u,v\\in\\mathbb{C}$. Then in $G_c$\n\\[\n\\pi(X_{-1}(u))\\,\\pi(X_{-1}(v))=\\pi(X_{-1}(u+v)).\n\\]\n\\end{lemma}\n\n\\LeanDecl{Xm_add_in_G}\n\n\\begin{proof}\nPut $a=X_{-1}(u)X_{-1}(v)$ and $b=X_{-1}(u+v)$ in $F(\\cX_c)$. By (Re:1a), the word $ab^{-1}$ belongs to $\\cR_c$, hence to $N_{\\cR_c}$. Two words whose quotient $ab^{-1}$ lies in $N_{\\cR_c}$ have the same image under $\\pi$, so $\\pi(a)=\\pi(b)$. Since $\\pi$ is a homomorphism, $\\pi(a)=\\pi(X_{-1}(u))\\pi(X_{-1}(v))$, which is the claim.\n\\end{proof}\n\n\\begin{lemma}[\\leanname{Xm_zero_in_G}]\\label{lem:Xm_zero_in_G}\nLet $c:\\mathbb{N}\\to\\mathbb{N}$. Then $\\pi(X_{-1}(0))=1$ in $G_c$.\n\\end{lemm const lemmaWins = new Map(eventsOf("lemma_proved").map(d => [d.lemma, d]));

// Outcome of one solver call, for colouring the timeline and step lists.
function solverOutcome(call) {
  const win = lemmaWins.get(call.lemma);
  const check = checkOfCall.get(call.index);
  const late = win && call.index > win.index;
  if (win && sameAttempt(win, call)) return { state: "win", late: false, check };
  if (late) return { state: "late", late: true, check };
  if (check) return { state: check.ok ? "ok" : "fail", late: false, check };
  if (rejections.some(r => sameAttempt(r, call))) return { state: "rejected", late: false };
  return { state: "pending", late: false };
}

const lemmaName = statement => (statement.match(/(?:theorem|lemma)\s+([^\s(:{\[]+)/) || [])[1];
const sketches = eventsOf("sketch_accepted");
const finalSketch = sketches[sketches.length - 1];
const lemmaOrder = [];
for (const sketch of sketches) {
  for (const statement of sketch.lemmas || []) {
    const name = lemmaName(statement);
    if (name && !lemmaOrder.includes(name)) lemmaOrder.push(name);
  }
}
for (const call of calls) {
  if (call.lemma != null && !lemmaOrder.includes(call.lemma)) lemmaOrder.push(call.lemma);
}

const roleOf = step => step.kind === "lean_check" ? "lean"
  : step.kind === "decision" ? "decision" : step.role;

// Rendering: Lean, math, prompts ----------------------------------------------

const LEAN_KEYWORDS = new Set(("theorem lemma def inductive structure namespace end open by fun "
  + "exact intro intros have show refine unfold match with if then else let in where calc "
  + "rfl simp rw apply constructor cases induction at import set_option noncomputable "
  + "instance class example abbrev private protected obtain rcases use omega decide "
  + "Type Prop").split(" "));
const LEAN_TOKEN = /(\/-[\s\S]*?-\/)|(--[^\n]*)|("(?:[^"\\\n]|\\.)*")|([A-Za-z_À-ɏ][\w'.À-ɏ]*)|([\s\S])/g;

// Lean source as numbered lines; `errorLines` is a set of 1-based line numbers.
function leanHTML(source, errorLines = new Set(), extraClass = "") {
  const lines = [[]];
  let match;
  LEAN_TOKEN.lastIndex = 0;
  while ((match = LEAN_TOKEN.exec(source))) {
    let cls = "";
    if (match[1] || match[2]) cls = "cm";
    else if (match[3]) cls = "st";
    else if (match[4]) cls = match[4] === "sorry" ? "sorry" : LEAN_KEYWORDS.has(match[4]) ? "kw" : "";
    const pieces = match[0].split("\n");
    pieces.forEach((piece, i) => {
      if (i > 0) lines.push([]);
      if (piece) lines[lines.length - 1].push(cls ? `<span class="${cls}">${escapeHTML(piece)}</span>` : escapeHTML(piece));
    });
  }
  while (lines.length > 1 && lines[lines.length - 1].length === 0) lines.pop();
  const body = lines.map((parts, i) => {
    const n = i + 1;
    return `<span class="line${errorLines.has(n) ? " err" : ""}" data-line="${n}"><span class="no">${n}</span>${parts.join("")}</span>`;
  }).join("");
  return `<pre class="lean ${extraClass}"><code>${body}</code></pre>`;
}

const errorLinesOf = errors => new Set((errors || []).flatMap(e =>
  [...String(e).matchAll(/\.lean:(\d+):\d+:/g)].map(m => Number(m[1]))));

const TEX_MACROS = {
  "\\PV": "\\mathsf{PV}", "\\eps": "\\varepsilon", "\\zo": "\\{0,1\\}",
  "\\TR": "\\mathrm{TR}", "\\ITR": "\\mathrm{ITR}", "\\M": "\\mathcal{M}",
  "\\FP": "\\mathsf{FP}", "\\calF": "\\mathcal{F}",
};
// Display environments come first, so that inline math inside them (e.g. in
// \intertext) is rendered as part of the environment.
const MATH_SPAN = new RegExp([
  String.raw`\\begin\{(equation|align|gather|alignat|multline|eqnarray|prooftree)(\*?)\}([\s\S]+?)\\end\{\1\2\}`,
  String.raw`\$\$([\s\S]+?)\$\$`, String.raw`\\\[([\s\S]+?)\\\]`, String.raw`\$((?:[^$\n]|\n(?![ \t]*\n))+?)\$`,
].join("|"));
// KaTeX lacks these environments; each is rendered as the closest one it has.
const KATEX_ENVIRONMENT = { multline: "gather", eqnarray: "align" };

function texHTML(tex, display) {
  if (!window.katex) return `<code>${escapeHTML(display ? tex : "$" + tex + "$")}</code>`;
  try {
    return katex.renderToString(tex.trim(), {
      displayMode: display, output: "mathml", throwOnError: false,
      macros: { ...TEX_MACROS },
    });
  } catch (error) {
    return `<code>${escapeHTML(tex)}</code>`;
  }
}

// Index just past the group that opens at `text[open]` ("{"), or -1.
function closingBrace(text, open) {
  let depth = 0;
  for (let i = open; i < text.length; i++) {
    if (text[i] === "\\") { i++; continue; }
    if (text[i] === "{") depth++;
    else if (text[i] === "}" && --depth === 0) return i + 1;
  }
  return -1;
}

// A display environment; \intertext{...}, which KaTeX lacks, splits it into
// separate environments with the text between them.
function environmentHTML(name, star, body) {
  if (name === "prooftree") return `<pre class="tex"><code>${escapeHTML(body.trim())}</code></pre>`;
  const environment = (KATEX_ENVIRONMENT[name] || name) + star;
  const render = rows => rows.trim()
    ? texHTML(`\\begin{${environment}}${rows.replace(/\\label\{[^}]*\}/g, "")}\\end{${environment}}`, true)
    : "";
  let out = "", start = 0, at;
  while ((at = body.indexOf("\\intertext{", start)) !== -1) {
    const end = closingBrace(body, at + "\\intertext".length);
    if (end === -1) break;
    out += render(body.slice(start, at).replace(/\\\\\s*$/, ""))
      + `<span class="intertext">${mathHTML(body.slice(at + "\\intertext{".length, end - 1))}</span>`;
    start = end;
  }
  return out + render(body.slice(start));
}

function inlineCode(text) {
  return escapeHTML(text).replace(/`([^`\n]+)`/g, "<code>$1</code>");
}

// Text-mode LaTeX of an informal statement (already HTML-escaped), as HTML:
// emphasis, sectioning, lists, theorem environments and spacing commands.
const THEOREM_ENVIRONMENTS = "theorem|lemma|proposition|corollary|definition|remark|example|claim|conjecture";
function textModeHTML(html) {
  const replaceGroups = (text, command, wrap) => {
    let out = "", start = 0, at;
    while ((at = text.indexOf(command + "{", start)) !== -1) {
      const end = closingBrace(text, at + command.length);
      if (end === -1) break;
      out += text.slice(start, at) + wrap(textModeHTML(text.slice(at + command.length + 1, end - 1)));
      start = end;
    }
    return out + text.slice(start);
  };
  for (const [command, wrap] of [
    ["\\textbf", s => `<strong>${s}</strong>`], ["\\emph", s => `<em>${s}</em>`],
    ["\\textit", s => `<em>${s}</em>`], ["\\texttt", s => `<code>${s}</code>`],
    ["\\paragraph", s => `<strong>${s}</strong>`], ["\\subparagraph", s => `<strong>${s}</strong>`],
    ["\\marginnote", s => ` (${s})`],
  ]) html = replaceGroups(html, command, wrap);
  return html
    .replace(/\\label\{[^{}]*\}\s*/g, "")
    .replace(/\\(eq)?ref\{([^{}]*)\}/g, (_, eq, label) => eq ? `(${label})` : label)
    .replace(/\\textcolor\{[^{}]*\}\{([^{}]*)\}/g, "$1")
    .replace(/\{\\(it|em|sl)\s+([^{}]*)\}/g, "<em>$2</em>")
    .replace(/\{\\bf\s+([^{}]*)\}/g, "<strong>$1</strong>")
    .replace(/\\(begingroup|endgroup|allowdisplaybreaks|noindent|medskip|smallskip|bigskip|newline)\b\s*/g, "")
    .replace(/\s*\\begin\{(itemize|compactitem|enumerate|compactenum)\}\s*/g, "<ul>")
    .replace(/\s*\\end\{(itemize|compactitem|enumerate|compactenum)\}\s*/g, "</ul>")
    .replace(/\s*\\item\s*/g, "<li>")
    .replace(new RegExp(String.raw`\\begin\{(${THEOREM_ENVIRONMENTS})\}(?:\[([^\]]*)\])?\s*`, "g"),
             (_, name, note) => `<strong>${name[0].toUpperCase() + name.slice(1)}${note ? ` (${note})` : ""}.</strong> `)
    .replace(new RegExp(String.raw`\s*\\end\{(${THEOREM_ENVIRONMENTS})\}`, "g"), "")
    .replace(/\\begin\{proof\}\s*/g, "<em>Proof.</em> ")
    .replace(/\s*\\end\{proof\}/g, " ∎")
    .replace(/\\\\(\[[^\]]*\])?[ \t]*(\n?)/g, (_, skip, newline) => newline || "\n")
    .replace(/(\S)~(?=\S)/g, "$1&nbsp;");
}

// Prose containing LaTeX math (inline, display and align-like environments),
// text-mode LaTeX and `code`. Math and code are set aside while the text-mode
// commands, which may span them, are converted.
function mathHTML(text) {
  const pieces = [];
  const keep = html => `\u0000${pieces.push(html) - 1}\u0000`;
  // A fresh pattern per call: \intertext renders its text with a nested call.
  const span = new RegExp(MATH_SPAN.source, "g");
  let prose = "", last = 0, match;
  while ((match = span.exec(text))) {
    prose += text.slice(last, match.index);
    prose += keep(match[1] ? environmentHTML(match[1], match[2], match[3])
                           : texHTML(match[4] ?? match[5] ?? match[6], match[6] === undefined));
    last = span.lastIndex;
  }
  prose += text.slice(last);
  const html = escapeHTML(prose.replace(/`([^`\n]+)`/g, (_, code) => keep(`<code>${escapeHTML(code)}</code>`)));
  return textModeHTML(html).replace(/\u0000(\d+)\u0000/g, (_, index) => pieces[index]);
}

// Minimal Markdown for the playbook-derived system prompts.
function markdownHTML(text) {
  const blocks = [];
  let list = null, para = [];
  const inline = s => inlineCode(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<em>$2</em>");
  const flushPara = () => { if (para.length) blocks.push(`<p>${inline(para.join(" "))}</p>`); para = []; };
  const flushList = () => { if (list) blocks.push(`<ul>${list.map(li => `<li>${inline(li)}</li>`).join("")}</ul>`); list = null; };
  for (const line of text.split("\n")) {
    const heading = line.match(/^(#{1,4})\s+(.*)/);
    const item = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (heading) { flushPara(); flushList(); blocks.push(`<h4>${inline(heading[2])}</h4>`); }
    else if (item) { flushPara(); (list ||= []).push(item[1]); }
    else if (!line.trim()) { flushPara(); flushList(); }
    else if (list) { list[list.length - 1] += " " + line.trim(); }
    else para.push(line.trim());
  }
  flushPara(); flushList();
  return `<div class="md">${blocks.join("")}</div>`;
}

const LEAN_TAGS = new Set(["definitions", "preamble", "statement", "lemmas", "main_proof",
  "proof", "helpers", "available_lemmas", "target_lemma", "previous_helpers",
  "previous_proof", "solution", "lean_code", "formal_statement", "previous_definitions",
  "previous_statement", "previous_lemmas", "previous_main_proof"]);
const PLAIN_TAGS = new Set(["lean_errors", "errors", "problems"]);

// A prompt or reply split into free text and <tag>...</tag> blocks.
function taggedHTML(text) {
  const parts = [];
  const pattern = /<([a-z_]+)>([\s\S]*?)<\/\1>/g;
  let last = 0, match;
  while ((match = pattern.exec(text))) {
    if (text.slice(last, match.index).trim()) parts.push({ prose: text.slice(last, match.index).trim() });
    parts.push({ tag: match[1], body: match[2].replace(/^\n+/, "").replace(/\s+$/, "") });
    last = pattern.lastIndex;
  }
  if (text.slice(last).trim()) parts.push({ prose: text.slice(last).trim() });
  return parts.map(part => {
    if (part.prose) return `<div class="prose">${mathHTML(part.prose)}</div>`;
    let body;
    if (!part.body) body = `<div class="muted">(empty)</div>`;
    else if (LEAN_TAGS.has(part.tag)) body = leanHTML(part.body);
    else if (PLAIN_TAGS.has(part.tag)) body = `<pre class="plain errors">${escapeHTML(part.body)}</pre>`;
    else body = `<div class="prose">${mathHTML(part.body)}</div>`;
    return `<div class="tagblock"><span class="tagname">&lt;${part.tag}&gt;</span>${body}</div>`;
  }).join("");
}

function templateHTML(text) {
  return `<pre class="plain">${escapeHTML(text).replace(/\{([a-z_]+)\}/g, '<span class="placeholder">{$1}</span>')}</pre>`;
}

// Step summaries ----------------------------------------------------------------

const EVENT_TEXT = {
  formalization_compiled: "Formalization compiles",
  formalization_rejected: "Formalization rejected",
  audit_verdict: "Audit verdict",
  sketch_accepted: "Sketch accepted",
  sketch_rejected: "Sketch rejected",
  lemma_proved: "Lemma proved",
  solver_attempt_rejected: "Attempt rejected before Lean",
  solver_budget_exhausted: "Solver chain exhausted its budget",
  replan: "Sketch revision requested",
  lemma_reused: "Proved lemma reused",
  lemma_handback: "Lemma handed back to the captain",
  final_verification: "Final verification",
  final_review: "Independent review",
  report: "LaTeX report",
};

function stepTitle(step) {
  if (step.kind === "model_call") {
    if (isJob(step)) return `AIProver job ${jobNumber(step)} · ${step.lemma}`;
    if (step.lemma != null) return `solver ${step.worker} · ${step.lemma} · round ${step.round}`;
    return `${step.role} · ${step.label}`;
  }
  if (step.kind === "lean_check") return `Lean check · ${step.file}`;
  return EVENT_TEXT[step.event] || step.event;
}

function stepResult(step) {
  if (step.kind === "model_call") {
    if (step.error) return `<span class="pill fail">error</span>`;
    if (step.lemma != null) {
      const { state } = solverOutcome(step);
      const label = state === "pending" && isJob(step) ? jobSummary(step)
        : { win: "proof kept", ok: "compiles", fail: "Lean errors",
            late: "after lemma proved", rejected: "rejected", pending: "no proof returned" }[state];
      const tone = { win: "ok", ok: "ok", fail: "fail", late: "neutral", rejected: "warn", pending: "neutral" }[state];
      return `<span class="pill ${tone}">${label}</span>`;
    }
    return `<span class="muted mono">${formatDuration(step.seconds || 0)}</span>`;
  }
  if (step.kind === "lean_check") {
    if (!step.ok) return `<span class="pill fail">${plural((step.errors || []).length, "error")}</span>`;
    return step.sorry_warning
      ? `<span class="pill warn">compiles · sorry</span>`
      : `<span class="pill ok">compiles</span>`;
  }
  if (step.event === "audit_verdict") {
    return `<span class="pill ${step.verdict === "FAITHFUL" ? "ok" : "fail"}">${escapeHTML(step.verdict)}</span>`;
  }
  if (step.event === "final_verification") {
    return `<span class="pill ${step.checks?.verified ? "ok" : "fail"}">${step.checks?.verified ? "verified" : "not verified"}</span>`;
  }
  if (step.event === "lemma_proved") return `<span class="pill ok">${escapeHTML(step.lemma)}</span>`;
  if (step.event === "final_review") {
    return `<span class="pill ${step.verdict === "FAITHFUL" ? "ok" : "fail"}">${escapeHTML(step.verdict)}</span>`;
  }
  if (step.event === "report") return `<span class="pill ${step.pdf ? "ok" : "fail"}">${step.pdf ? "PDF" : "no PDF"}</span>`;
  return "";
}

function stepRow(step) {
  const role = roleOf(step);
  return `<button class="steprow" type="button" data-step="${step.index}">
    <span class="idx">#${step.index}</span>
    <span class="t">${formatClock(step.elapsed_seconds)}</span>
    <span class="dot ${role}" title="${role}"></span>
    <span class="what"><span class="lbl">${escapeHTML(stepTitle(step))}</span></span>
    <span>${stepResult(step)}</span>
  </button>`;
}
const stepList = list => list.length
  ? `<div class="steps">${list.map(stepRow).join("")}</div>`
  : `<p class="muted">No steps of this kind in this run.</p>`;
const stepLink = step => step ? `<button class="steplink" type="button" data-step="${step.index}">#${step.index}</button>` : "";

const cfg = TRACE.config || {};
const outcome = TRACE.outcome || {};
const problem = TRACE.problem || {};
const totalCost = sum(calls.map(c => c.cost_usd));
const callsByRole = role => calls.filter(c => c.role === role);

// The proposition itself, without the shared setting paragraph.
function propositionText() {
  const paragraphs = (problem.informal_statement || "").split(/\n\s*\n/);
  return (paragraphs.length > 1 ? paragraphs.slice(1) : paragraphs).join("\n\n");
}

function lemmaUses(text, self) {
  return lemmaOrder.filter(name => name !== self && new RegExp(`(^|[^\\w'.])${name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![\\w'])`).test(text || ""));
}

// Step drawer --------------------------------------------------------------------------

let openStep = null;
let drawerOpen = false;
let drawerTab = "response";

// Tabs of the step drawer: `panels` is a list of [id, name, html]. The tab
// last chosen stays selected when the next drawer has it.
function tabsHTML(panels) {
  const active = panels.some(([id]) => id === drawerTab) ? drawerTab : panels[0][0];
  return `<div class="tabs" role="tablist">${panels.map(([id, name]) =>
      `<button type="button" role="tab" data-tab="${id}" aria-selected="${active === id}">${name}</button>`).join("")}</div>
    ${panels.map(([id, , html]) => `<div data-panel="${id}" ${active === id ? "" : "hidden"}>${html}</div>`).join("")}`;
}

// Lean output, one message per `file:line:col: severity:` header.
function diagnosticsHTML(text) {
  if (!text) return `<p class="muted">No diagnostics: Lean reported nothing for this file.</p>`;
  const html = escapeHTML(text).replace(/^(\S+\.lean:\d+:\d+: )(error|warning)(:.*)$/gm,
    (_, where, severity, rest) => `${where}<span class="${severity}">${severity}${rest}</span>`);
  return `<pre class="diag">${html}</pre>`;
}
const diagnosticErrorLines = text => new Set([...String(text || "").matchAll(/\.lean:(\d+):\d+: error/g)]
  .map(m => Number(m[1])));
const flagPill = (value, yes, no) => value == null ? ""
  : `<span class="pill ${value ? "ok" : "fail"}">${value ? yes : no}</span>`;

// The harness's Lean check of a sample's whole final file.
function harnessCheckHTML(check) {
  if (!check || !Object.keys(check).length) {
    return `<p class="muted">The harness's check of this sample is not recorded.</p>`;
  }
  return `
    <div class="checkline"><span class="k">AIProver harness · Lean check of the final file</span>
      ${check.verdict ? `<span class="pill ${check.verdict === "PASS" ? "ok" : "fail"}">${escapeHTML(check.verdict)}</span>` : ""}
      ${flagPill(check.compiles, "compiles", "does not compile")}
      ${flagPill(check.complete, "no sorry", "contains sorry")}
      ${check.axioms_used ? `<span class="pill neutral">axioms: ${escapeHTML(check.axioms_used.join(", ") || "none")}</span>` : ""}</div>
    ${(check.problems || []).length ? `<ul class="problems">${check.problems.map(p => `<li>${escapeHTML(p)}</li>`).join("")}</ul>` : ""}
    ${diagnosticsHTML(check.diagnostics)}`;
}

// The pipeline's Lean check of the lemma proof extracted from a sample.
function extractedCheckHTML(outcome) {
  const { check, state } = outcome;
  if (!check) {
    return `<div class="checkline"><span class="k">Pipeline · Lean check of the extracted lemma proof</span>
      <span class="pill neutral">not run</span></div>
      <p class="muted">${state === "late" ? "The lemma was already proved when this sample finished."
        : "The final file holds no sorry-free proof of the lemma, so nothing was extracted to check."}</p>`;
  }
  const errors = check.errors || [];
  return `
    <div class="checkline"><span class="k">Pipeline · Lean check of the extracted lemma proof</span>
      <span class="pill ${check.ok ? "ok" : "fail"}">${check.ok ? (check.sorry_warning ? "compiles · sorry" : "compiles") : plural(errors.length, "error")}</span>
      ${state === "win" ? `<span class="pill ok">proof kept</span>` : ""} ${stepLink(check)}</div>
    ${errors.length ? diagnosticsHTML(errors.join("\n")) : ""}`;
}

// A Lean check of a chat model's code (captain or chat solver).
function chatCheckHTML(check) {
  if (!check) return `<p class="muted">Lean did not check this reply.</p>`;
  const errors = check.errors || [];
  return `<div class="checkline"><span class="k">Lean check ${stepLink(check)}</span>${stepResult(check)}</div>
    ${errors.length ? diagnosticsHTML(errors.join("\n")) : `<p class="muted">No errors.</p>`}
    <div class="tagblock"><span class="tagname">${escapeHTML(check.file || "")}</span>${leanHTML(check.source || "", errorLinesOf(errors), "tall")}</div>`;
}

// The model's reasoning before assistant turn `turn`, from the logging proxy.
const reasoningOfTurn = (sample, turn) => (sample.reasoning || []).filter(r => r.turn === turn);

function reasoningBlock(text, open = false) {
  return `<details class="fold reasoning" ${open ? "open" : ""}><summary><b>Reasoning</b>
    <span class="muted">${plural(text.split(/\s+/).filter(Boolean).length, "word")}</span></summary>
    <div class="body"><pre class="plain wrap">${escapeHTML(text)}</pre></div></details>`;
}

// One tool call: Lean written to a file is shown as Lean, other arguments as JSON.
function toolCallHTML(call) {
  let args = call.arguments || "";
  let lean = "";
  try {
    const parsed = JSON.parse(args);
    if (typeof parsed.content === "string" && /\.lean$/.test(parsed.file_path || parsed.path || "")) {
      lean = parsed.content;
      delete parsed.content;
    }
    args = JSON.stringify(parsed, null, 1);
  } catch { /* arguments cut at the trace limit stay as text */ }
  return `<div class="toolcall"><span class="pill neutral mono">${escapeHTML(call.name || "tool")}</span>
    <pre class="plain wrap">${escapeHTML(args)}</pre>${lean ? leanHTML(lean, new Set(), "tall") : ""}</div>`;
}

// The agent's session: its messages, tool calls, tool results and, where the
// proxy recorded it, its reasoning before each turn.
function sessionHTML(sample) {
  const session = sample.session || [];
  if (!session.length) return `<p class="muted">The session transcript is not recorded for this sample.</p>`;
  let turn = 0;
  return `<div class="session">${session.map(entry => {
    if (entry.role === "tool") {
      return `<details class="fold toolresult"><summary><span class="mono muted">result of ${escapeHTML(entry.name || "tool")}</span>
        <span class="muted">${plural(entry.text.split("\n").length, "line")}</span></summary>
        <div class="body">${/\.lean:\d+:\d+:/.test(entry.text) ? diagnosticsHTML(entry.text) : `<pre class="plain wrap">${escapeHTML(entry.text)}</pre>`}</div></details>`;
    }
    if (entry.role === "assistant") {
      turn += 1;
      const thoughts = reasoningOfTurn(sample, turn).map(r => reasoningBlock(r.reasoning || "")).join("");
      return `<div class="turn"><div class="turnhead"><span class="mono">turn ${turn}</span></div>${thoughts}
        ${entry.text ? `<div class="prose">${mathHTML(entry.text)}</div>` : ""}
        ${(entry.tool_calls || []).map(toolCallHTML).join("")}</div>`;
    }
    return `<details class="fold"><summary><b>${entry.injected ? "Harness message" : turn ? "User message" : "Task"}</b>
      <span class="muted">${plural(entry.text.split("\n").length, "line")}</span></summary>
      <div class="body"><pre class="plain wrap">${escapeHTML(entry.text)}</pre></div></details>`;
  }).join("")}</div>`;
}

function reasoningHTML(sample) {
  const records = sample.reasoning || [];
  if (!records.length) {
    return `<p class="muted">The model's reasoning is not recorded for this sample. The AIProver harness
      discards it; runs started after the reasoning proxy was installed record it per turn.</p>`;
  }
  return records.map(r => `<div class="turn"><div class="turnhead"><span class="mono">turn ${r.turn}</span>
    <span class="muted">${escapeHTML(r.time || "")}</span>${r.truncated ? ` <span class="pill fail">stopped at the reply token cap</span>` : ""}</div>${reasoningBlock(r.reasoning || "", true)}</div>`).join("");
}

// Drawer panels of an AIProver job, for one sample (a solver lane) or all.
function jobPanels(job, sampleIndex) {
  const lanes = sampleIndex == null ? jobLanes(job) : [sampleIndex];
  const per = render => lanes.map(k => {
    const outcome = sampleOutcome(job, k);
    const head = lanes.length > 1 ? `<h4 class="lanehead">solver ${k}</h4>` : "";
    return head + render(outcome.sample || {}, outcome, k);
  }).join("");
  return [
    ["response", "Reply", per(sample => sample.lean
      ? leanHTML(sample.lean, diagnosticErrorLines(sample.check?.diagnostics), "tall")
      : `<p class="muted">The final Lean file is not recorded.</p>`)],
    ["prompt", "Prompt", taggedHTML(job.prompt || "")],
    ["system", "System prompt", job.system_prompt
      ? markdownHTML(TRACE.system_prompts?.[job.system_prompt] || job.system_prompt)
      : `<p class="muted">AIProver composes its own system prompt inside the harness; the task above is
         what the pipeline sends.</p>`],
    ["lean", "Lean returns", per((sample, outcome) => harnessCheckHTML(sample.check) + extractedCheckHTML(outcome))],
    ["session", "Session", per(sample => sessionHTML(sample))],
    ["reasoning", "Reasoning", per(sample => reasoningHTML(sample))],
  ];
}

function stepDetail(step, sampleIndex = null) {
  const meta = [`<span>at <b>${formatClock(step.elapsed_seconds)}</b></span>`, `<span>stage <b>${escapeHTML(step.stage)}</b></span>`];
  let body = "";
  if (isJob(step)) {
    const job = step;
    meta.push(`<span>AIProver job <b>${jobNumber(job)}</b> on <b>${escapeHTML(job.lemma)}</b></span>`);
    if (sampleIndex != null) {
      const o = sampleOutcome(job, sampleIndex);
      meta.push(`<span>solver <b>${sampleIndex}</b></span>`,
        `<span>duration <b>${formatDuration(o.end - o.start)}</b></span>`,
        o.turns != null ? `<span>turns <b>${o.turns}</b></span>` : "",
        o.sample?.ending ? `<span>ended <b>${escapeHTML(o.sample.ending)}</b></span>` : "",
        `<span>result <b>${escapeHTML({ win: "proof kept", ok: "compiles", fail: "Lean errors" }[o.state] || o.text)}</b></span>`);
    } else {
      meta.push(`<span>duration <b>${formatDuration(job.seconds || 0)}</b></span>`, `<span>samples <b>${jobSummary(job)}</b></span>`);
    }
    const previous = (jobsByLemma.get(job.lemma) || [])[jobNumber(job) - 2];
    const note = `<p class="note">${previous ? `Started after a ${escapeHTML(transitionText(previous, job))} (previous job ${stepLink(previous)}).`
      : "First AIProver job on this lemma."} Each job runs ${plural(jobSamples(job), "independent session")}.</p>`;
    body = note + tabsHTML(jobPanels(job, sampleIndex));
  } else if (step.kind === "model_call") {
    meta.push(`<span>model <b>${escapeHTML(step.model)}</b></span>`,
      `<span>duration <b>${formatDuration(step.seconds || 0)}</b></span>`,
      `<span>output tokens <b>${(step.usage?.outputTokens ?? 0).toLocaleString()}</b></span>`,
      `<span>cost <b>${formatUSD(step.cost_usd)}</b></span>`);
    const check = checkOfCall.get(step.index);
    const note = step.role === "auditor"
      ? `<p class="note">The auditor's message contains only Lean code. Its system prompt is the auditor playbook.</p>` : "";
    const linked = check ? `<p class="note">The code in this reply was compiled in ${stepLink(check)}: ${stepResult(check)}</p>` : "";
    const panels = [
      ["response", "Reply", step.error ? `<pre class="plain errors">${escapeHTML(step.error)}</pre>` : taggedHTML(step.response || "")],
      ["prompt", "Prompt", taggedHTML(step.prompt || "")],
      ["system", "System prompt", markdownHTML(TRACE.system_prompts?.[step.system_prompt] || step.system_prompt || "")],
    ];
    if (check) panels.push(["lean", "Lean returns", chatCheckHTML(check)]);
    body = `${note}${linked}${tabsHTML(panels)}`;
  } else if (step.kind === "lean_check") {
    meta.push(`<span>duration <b>${formatDuration(step.seconds || 0)}</b></span>`);
    const call = callOfCheck.get(step.index);
    const axioms = Object.entries(step.axioms || {});
    body = `
      ${call ? `<p class="note">Compiles the code from ${stepLink(call)} (${escapeHTML(stepTitle(call))}).</p>` : ""}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${stepResult(step)}
        ${step.sorry_warning ? `<span class="muted">The file still contains <code>sorry</code>${step.lemma != null ? " (earlier lemmas are included unproved)" : ""}.</span>` : ""}</div>
      ${(step.errors || []).length ? `<div class="tagblock"><span class="tagname">compiler errors</span><pre class="plain errors">${escapeHTML(step.errors.join("\n\n"))}</pre></div>` : ""}
      ${axioms.length ? `<p>Axioms: ${axioms.map(([name, list]) => `<code>${escapeHTML(name)}</code> → ${list.map(a => `<code>${escapeHTML(a)}</code>`).join(", ")}`).join("; ")}</p>` : ""}
      <div class="tagblock"><span class="tagname">${escapeHTML(step.file)}</span>${leanHTML(step.source || "", errorLinesOf(step.errors), "tall")}</div>`;
  } else {
    body = Object.entries(step).filter(([k]) => !["index", "kind", "stage", "elapsed_seconds", "event"].includes(k)).map(([key, value]) => {
      let inner;
      if (typeof value === "string" && (LEAN_TAGS.has(key) || key === "solution")) inner = value ? leanHTML(value, new Set(), "tall") : `<span class="muted">(empty)</span>`;
      else if (Array.isArray(value) && value.every(v => typeof v === "string") && key === "lemmas") inner = leanHTML(value.join("\n\n"));
      else if (typeof value === "string") inner = `<div class="prose">${mathHTML(value)}</div>`;
      else inner = `<pre class="plain">${escapeHTML(JSON.stringify(value, null, 1))}</pre>`;
      return `<div class="tagblock"><span class="tagname">${escapeHTML(key)}</span>${inner}</div>`;
    }).join("");
  }
  const role = roleOf(step);
  return {
    head: `<div class="row"><span class="dot ${role}"></span><span class="mono muted">#${step.index} of ${steps.length - 1}</span>
        <span class="spacer"></span>
        <button class="btn" type="button" data-drawer="prev" ${step.index === 0 ? "disabled" : ""} aria-label="Previous step">←</button>
        <button class="btn" type="button" data-drawer="next" ${step.index === steps.length - 1 ? "disabled" : ""} aria-label="Next step">→</button>
        <button class="btn" type="button" data-drawer="close">Close</button></div>
      <h3>${escapeHTML(stepTitle(step))}</h3>
      <div class="meta">${meta.join("")}</div>`,
    body,
  };
}

// Opens the drawer with arbitrary content; `index` is set for step records only.
function showDrawer(head, body, index = null) {
  openStep = index;
  drawerOpen = true;
  document.getElementById("drawer-head").innerHTML = head;
  const bodyEl = document.getElementById("drawer-body");
  bodyEl.innerHTML = body;
  bodyEl.scrollTop = 0;
  document.getElementById("drawer").hidden = false;
  document.getElementById("scrim").hidden = false;
  // Bring the first compiler error into view inside the Lean listing.
  const errorLine = bodyEl.querySelector(".line.err");
  if (errorLine) {
    const pre = errorLine.closest("pre");
    pre.scrollTop = Math.max(0, errorLine.offsetTop - pre.clientHeight / 3);
  }
  document.querySelector('#drawer [data-drawer="close"]').focus({ preventScroll: true });
}

// Drawer header for content that is not a single step.
function summaryHead(title, meta = "", dotClass = "") {
  return `<div class="row">${dotClass ? `<span class="dot ${dotClass}"></span>` : ""}
      <span class="spacer"></span><button class="btn" type="button" data-drawer="close">Close</button></div>
    <h3>${title}</h3>${meta ? `<div class="meta">${meta}</div>` : ""}`;
}

function showStep(index, sampleIndex = null) {
  const step = steps[index];
  if (!step) return;
  const { head, body } = stepDetail(step, sampleIndex);
  showDrawer(head, body, index);
}

function closeStep() {
  openStep = null;
  drawerOpen = false;
  document.getElementById("drawer").hidden = true;
  document.getElementById("scrim").hidden = true;
}

// Clicks on step links and drawer controls, and keys while the drawer is open.
// Page handlers should ignore keys when `drawerOpen` is true.
function installDrawerHandlers() {
  document.addEventListener("click", event => {
    if (event.target.id === "scrim") return closeStep();
    const target = event.target.closest("[data-step],[data-drawer],[data-tab]");
    if (!target) return;
    const d = target.dataset;
    if (d.step !== undefined) showStep(Number(d.step));
    else if (d.drawer === "close") closeStep();
    else if (d.drawer === "prev") showStep(openStep - 1);
    else if (d.drawer === "next") showStep(openStep + 1);
    else if (d.tab) {
      drawerTab = d.tab;
      document.querySelectorAll("#drawer [data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === d.tab));
      document.querySelectorAll("#drawer [data-panel]").forEach(p => { p.hidden = p.dataset.panel !== d.tab; });
    }
  });
  document.addEventListener("keydown", event => {
    if (!drawerOpen || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === "Escape") closeStep();
    else if (openStep !== null && event.key === "ArrowRight") showStep(Math.min(steps.length - 1, openStep + 1));
    else if (openStep !== null && event.key === "ArrowLeft") showStep(Math.max(0, openStep - 1));
  });
}

function renderHeader() {
  document.getElementById("thm").textContent = TRACE.theorem_name;
  document.getElementById("run").textContent = TRACE.run_id;
  document.getElementById("models").textContent = `${TRACE.models?.orchestrator} + ${TRACE.models?.worker}`;
  const verified = outcome.checks?.verified;

}

function chapterOverview() {

  const roles = ["captain", "auditor", "solver"];
  return `
  <div class="eyebrow">Run ${escapeHTML(TRACE.run_id)} · ${escapeHTML(TRACE.started || "")}</div>
  <h2>Orchestrated formal proof of <code>${escapeHTML(TRACE.theorem_name)}</code></h2>
  <p class="lead">This page reconstructs one run of a multi-model Lean 4 proving pipeline.
  An orchestrator model, the <span class="role captain">captain</span>, translates an informal
  mathematical result into Lean, has the translation checked by a blind
  <span class="role auditor">auditor</span>, splits the proof into lemmas, and delegates each
  lemma to several parallel <span class="role solver">solver</span> models. The
  <span class="role lean">Lean</span> compiler checks every piece of code; a result is accepted
  only when Lean accepts it.</p>
  <div class="stats">
    <div class="stat"><span class="v">${verified ? "Proved" : escapeHTML(outcome.status || "running")}</span><span class="k">${verified ? "all final checks pass" : "final status"}</span></div>
    <div class="stat"><span class="v">${formatDuration(outcome.wall_seconds || steps.at(-1)?.elapsed_seconds || 0)}</span><span class="k">wall-clock time</span></div>
    <div class="stat"><span class="v">${calls.length}</span><span class="k">model calls (${roles.map(r => callsByRole(r).length).join(" / ")} captain / auditor / solver)</span></div>
    <div class="stat"><span class="v">${checks.length}</span><span class="k">Lean checks</span></div>
    <div class="stat"><span class="v">${formatUSD(totalCost)}</span><span class="k">notional API cost</span></div>
  </div>
  ${phaseNames.length ? `
  <div class="panel">
    <h3>Time per phase</h3>
    <div class="phasebar">${phaseNames.map(p => `<div class="ph-${p}" style="width:${(phases[p] / phaseTotal * 100).toFixed(2)}%">${phases[p] / phaseTotal > 0.12 ? p : ""}</div>`).join("")}</div>
    <div class="phaselegend">${phaseNames.map(p => `<span><i class="ph-${p}"></i>${p} ${formatDuration(phases[p])}</span>`).join("")}</div>
  </div>` : ""}
  <div class="panel">
    <h3>Models</h3>
    <table class="kv">
      <tr><th>Role</th><th>Model</th><th>Calls</th><th>Output tokens</th><th>Cost</th></tr>
      ${roles.map(r => {
        const list = callsByRole(r);
        return `<tr><td><span class="role ${r}">${r}</span></td><td class="num">${escapeHTML(list[0]?.model || (r === "captain" ? TRACE.models?.orchestrator : TRACE.models?.worker))}</td>
          <td class="num">${list.length}</td><td class="num">${sum(list.map(c => c.usage?.outputTokens)).toLocaleString()}</td><td class="num">${formatUSD(sum(list.map(c => c.cost_usd)))}</td></tr>`;
      }).join("")}
    </table>
  </div>
  <div class="panel">
    <h3>Reading this page</h3>
    <p>The chapters follow the pipeline in order. Use <b>Next</b>, the chapter list, or the
    <kbd>←</kbd>/<kbd>→</kbd> keys. Every item marked with a step number such as ${stepLink(steps[0])}
    opens the complete record of that step: the exact prompt, the model's reply, the Lean source and
    compiler output. Inside a step record, <kbd>←</kbd>/<kbd>→</kbd> move through the run one step at a time.</p>
  </div>
  <div class="panel">
    <h3>Terms</h3>
    <dl class="gloss">
      <dt>Lean 4</dt><dd>A programming language and proof assistant. A proof written in Lean is checked mechanically by its kernel; if it compiles, it is correct relative to the stated theorem.</dd>
      <dt>Mathlib</dt><dd>The community library of formalized mathematics for Lean.</dd>
      <dt>sorry</dt><dd>A placeholder that closes any goal without proof. Lean accepts it with a warning. The pipeline uses it for statements whose proofs are pending, and the final solution must contain none.</dd>
      <dt>axioms</dt><dd>Foundational assumptions a proof depends on. Only <code>propext</code>, <code>Classical.choice</code> and <code>Quot.sound</code> are admitted.</dd>
      <dt>read-back</dt><dd>A natural-language account of what a piece of Lean code literally asserts, written without knowledge of what it was meant to assert.</dd>
      <dt>faithful</dt><dd>A formal statement is faithful when it asserts exactly the source result: neither weaker, stronger, nor vacuous.</dd>
    </dl>
  </div>`;
}
