// Vertical flow chart of the pipeline; nodes open the matching algorithm entry.
const FLOW_NODES = [
  { id: "problem", title: "Informal problem", actor: "dataset", tone: "data", algorithm: null, chapter: "problem" },
  { id: "formalize", title: "Formalize", actor: "captain", tone: "captain", algorithm: 0, chapter: "formalize" },
  { id: "audit", title: "Blind read-back", actor: "auditor", tone: "auditor", algorithm: 1, chapter: "audit" },
  { id: "judge", title: "Faithfulness verdict", actor: "captain", tone: "captain", algorithm: 2, chapter: "audit" },
  { id: "sketch", title: "Proof sketch", actor: "captain", tone: "captain", algorithm: 3, chapter: "sketch" },
  { id: "prove", title: "Prove lemmas", actor: "solvers, in parallel", tone: "solver", algorithm: 4, chapter: "prove" },
  { id: "assemble", title: "Assemble and verify", actor: "Lean", tone: "lean", algorithm: 6, chapter: "assemble" },
];

function flowCounts(id) {
  const n = {
    formalize: [callsByRole("captain").filter(c => /^formalize/.test(c.label)).length, checks.filter(k => k.label === "formalize").length],
    audit: [callsByRole("auditor").length, 0],
    judge: [callsByRole("captain").filter(c => /^judge/.test(c.label)).length, 0],
    sketch: [callsByRole("captain").filter(c => /^sketch/.test(c.label)).length, checks.filter(k => k.label === "sketch").length],
    prove: [callsByRole("solver").length, checks.filter(k => k.lemma != null).length],
    assemble: [0, checks.filter(k => k.stage === "assemble").length],
  }[id];
  if (!n) return "";
  return [n[0] ? plural(n[0], "call") : "", n[1] ? plural(n[1], "check") : ""].filter(Boolean).join(" · ");
}

function flowSVG() {
  const x = 190, w = 260, h = 74, gap = 30, cx = x + w / 2;
  const y = i => 12 + i * (h + gap);
  const nodes = FLOW_NODES.map((node, i) => `
    <g class="node" tabindex="0" role="button" data-flow="${node.id}" aria-label="${node.title}">
      <rect x="${x}" y="${y(i)}" width="${w}" height="${h}" rx="7"></rect>
      <circle cx="${x + 16}" cy="${y(i) + 20}" r="4.5" class="c-${node.tone}"></circle>
      <text x="${x + 28}" y="${y(i) + 24}" class="title">${node.title}</text>
      <text x="${x + 28}" y="${y(i) + 43}" class="actor c-${node.tone}">${node.actor}${node.id === "prove" ? ` ×${cfg.workers ?? "N"} per lemma` : ""}</text>
      <text x="${x + 28}" y="${y(i) + 61}" class="count">${flowCounts(node.id)}</text>
    </g>`).join("");
  const down = FLOW_NODES.slice(0, -1).map((node, i) =>
    `<path class="edge" d="M${cx},${y(i) + h} V${y(i + 1) - 3}" marker-end="url(#arrow)"></path>`).join("");
  const selfLoop = (i, label) => `
    <path class="edge loop" d="M${x},${y(i) + 22} C${x - 52},${y(i) + 22} ${x - 52},${y(i) + 52} ${x - 3},${y(i) + 52}" marker-end="url(#arrow)"></path>
    <text x="${x - 50}" y="${y(i) + 41}" text-anchor="end" class="elabel">${label}</text>`;
  const backEdge = (from, to, label, id) => `
    <path class="edge loop" d="M${x + w},${y(from) + h / 2} H${x + w + 70} V${y(to) + h / 2} H${x + w + 3}" marker-end="url(#arrow)"></path>
    <text x="${x + w + 76}" y="${(y(from) + y(to)) / 2 + h / 2 + 4}" class="elabel${id ? " hot" : ""}"${id ? ` data-flow="${id}" tabindex="0" role="button"` : ""}>${label}</text>`;
  const height = y(FLOW_NODES.length) - gap + 14;
  return `<svg class="flow" viewBox="0 0 640 ${height}" role="img" aria-label="Pipeline flow chart">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"></path></marker></defs>
    ${down}
    ${selfLoop(1, "Lean errors")}
    ${selfLoop(4, "Lean errors")}
    ${selfLoop(5, "Lean errors, per chain")}
    ${backEdge(3, 1, "REVISE")}
    ${backEdge(5, 4, "replan", "replan")}
    <text x="${cx + 8}" y="${y(4) - 10}" class="elabel">FAITHFUL</text>
    ${nodes}
  </svg>`;
}

  AUDITOR_TEMPLATE: ["auditor", "Audit: the Lean code to read back"],
  JUDGE_READBACK_TEMPLATE: ["captain", "Audit: compare read-back and source"],
  SKETCH_TEMPLATE: ["captain", "Sketch: decompose the proof"],
  SKETCH_REPAIR_TEMPLATE: ["captain", "Sketch: repair after Lean errors"],
  REPLAN_FEEDBACK_TEMPLATE: ["captain", "Sketch: revise after failed lemmas"],
  SOLVER_TEMPLATE: ["solver", "Prove: first attempt at a lemma"],
  SOLVER_REPAIR_TEMPLATE: ["solver", "Prove: repair after Lean errors"],
};

function chapterPrompts() {
  const system = TRACE.system_prompts || {};
  const templates = TRACE.prompt_templates || {};
  const order = Object.keys(TEMPLATE_USE).filter(k => k in templates)
    .concat(Object.keys(templates).filter(k => !(k in TEMPLATE_USE)));
  return `
  <div class="eyebrow">Method</div>
  <h2>Roles and prompts</h2>
  <p class="lead">Each model call consists of a fixed system prompt for the role and a message built
  from a template. Replies use XML-style tags such as <code>&lt;definitions&gt;</code> or
  <code>&lt;proof&gt;</code>, which the orchestrator parses and places into Lean files.</p>
  <div class="panel">
    <h3>Roles</h3>
    <table class="kv">
      <tr><th>Role</th><th>Model</th><th>Task</th></tr>
      <tr><td><span class="role captain">captain</span></td><td class="num">${escapeHTML(TRACE.models?.orchestrator)}</td><td>Formalizes the statement, judges the read-back, writes and revises the proof sketch.</td></tr>
      <tr><td><span class="role auditor">auditor</span></td><td class="num">${escapeHTML(TRACE.models?.worker)}</td><td>Reads the Lean code blind and states what it asserts.</td></tr>
      <tr><td><span class="role solver">solver</span></td><td class="num">${escapeHTML(TRACE.models?.worker)}</td><td>Proves one lemma, repairing its proof from Lean error messages.</td></tr>
    </table>
  </div>
  <h3>System prompts</h3>
  ${Object.entries(system).map(([role, text]) => `
    <details class="fold"><summary><span class="role ${role}">${role}</span><span class="muted">${text.length.toLocaleString()} characters</span></summary>
      <div class="body">${markdownHTML(text)}</div></details>`).join("")}
  <h3>Message templates</h3>
  <p class="muted">Placeholders in <span class="placeholder">{braces}</span> are filled from the problem and from earlier steps.</p>
  ${order.map(name => {
    const [role, use] = TEMPLATE_USE[name] || ["decision", ""];
    return `<details class="fold"><summary><span class="mono">${name}</span><span class="role ${role}">${role}</span><span class="muted">${escapeHTML(use)}</span></summary>
      <div class="body">${templateHTML(templates[name])}</div></details>`;
  }).join("")}`;
}

function chapterFormalize() {
  const stageSteps = steps.filter(s => s.stage === "formalize" && !(s.role === "auditor" || /^judge/.test(s.label || "") || s.event === "audit_verdict"));
  const compiled = eventsOf("formalization_compiled");
  const form = compiled.at(-1);
  const rejected = eventsOf("formalization_rejected");
  return `
  <div class="eyebrow">Stage 1 · captain</div>
  <h2>Formalization</h2>
  <p class="lead">The captain writes Lean definitions for every object in the setting and a theorem
  statement whose proof is left as <code>sorry</code>. The file is compiled; on errors the
  compiler output is returned to the captain for up to ${cfg.max_repairs ?? "N"} repairs. At this stage only
  the statement must be correct, not the proof.</p>
  ${stepList(stageSteps)}
  ${rejected.length ? `<p class="note">${plural(rejected.length, "formalization attempt")} failed to compile and ${rejected.length === 1 ? "was" : "were"} repaired.</p>` : ""}
  ${form ? `
  <div class="panel">
    <h3>Theorem statement</h3>
    ${leanHTML(form.statement || "")}
    <p class="muted">Preamble: <code>${escapeHTML(form.preamble || "")}</code></p>
  </div>
  <div class="panel">
    <h3>Captain's notes on the encoding</h3>
    <div class="prose">${mathHTML(form.notes || "")}</div>
  </div>
  <details class="fold"><summary><b>Definitions</b><span class="muted">${(form.definitions || "").split("\n").length} lines of Lean</span></summary>
    <div class="body">${leanHTML(form.definitions || "", new Set(), "tall")}</div></details>` : ""}`;
}

function chapterAudit() {
  const auditSteps = steps.filter(s => s.role === "auditor" || /^judge/.test(s.label || "") || s.event === "audit_verdict");
  const verdicts = eventsOf("audit_verdict");
  return `
  <div class="eyebrow">Stage 2 · auditor, then captain</div>
  <h2>Blind audit</h2>
  <p class="lead">A formal statement can compile and still say something different from the source:
  a missing hypothesis, a vacuous case, or a weaker theorem. To detect this, a separate auditor
  receives only the Lean code and the auditor playbook, never the source, and writes a read-back of
  what the code asserts. The captain then compares the read-back with the source statement. A
  <b>FAITHFUL</b> verdict continues to the sketch; <b>REVISE</b> returns to formalization
  (at most ${cfg.max_audit_rounds ?? "N"} times).</p>
  ${stepList(auditSteps)}
  ${verdicts.map(v => `
  <div class="two">
    <div class="panel">
      <span class="eyebrow">Source statement · seen by captain only</span>
      <div class="prose">${mathHTML(propositionText())}</div>
    </div>
    <div class="panel">
      <span class="eyebrow">Read-back · round ${v.round} · written blind</span>
      <div class="prose">${mathHTML(v.readback || "")}</div>
    </div>
  </div>
  <div class="panel">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3>Verdict</h3>${stepResult(v)} ${stepLink(v)}</div>
    <div class="prose">${mathHTML(v.issues || "")}</div>
  </div>`).join("")}`;
}

function chapterSketch() {
  const sketchSteps = steps.filter(s => s.stage === "sketch");
  const replans = eventsOf("replan");
  return `
  <div class="eyebrow">Stage 3 · captain</div>
  <h2>Proof sketch</h2>
  <p class="lead">The captain decomposes the proof into lemmas. Each lemma is stated in full but
  proved only by <code>sorry</code>; the main theorem is then proved from the lemmas without
  <code>sorry</code>. Lean compiles the sketch, which confirms that the lemmas suffice for the
  theorem before any lemma is attempted.</p>
  ${stepList(sketchSteps)}
  ${replans.length ? `<p class="note">${plural(replans.length, "revision")} of the sketch followed lemmas that were not proved within budget. Proved lemmas with unchanged statements were reused.</p>` : ""}
  ${finalSketch ? `
  <div class="panel">
    <h3>Main proof, from the lemmas</h3>
    ${leanHTML(finalSketch.main_proof || "")}
    <p class="muted">Uses: ${lemmaUses(finalSketch.main_proof, null).map(n => `<code>${escapeHTML(n)}</code>`).join(", ") || "no lemma by name"}</p>
  </div>
  <h3>Lemmas</h3>
  ${(finalSketch.lemmas || []).map(statement => {
    const name = lemmaName(statement);
    const win = lemmaWins.get(name);
    const uses = lemmaUses(win?.proof, name);
    return `<div class="panel lemma">
      <div class="head"><span class="name">${escapeHTML(name)}</span>
        ${win ? `<span class="pill ok">proved by ${escapeHTML(winnerText(win))}</span> ${stepLink(win)}` : `<span class="pill fail">not proved</span>`}</div>
      ${leanHTML(statement + " := by sorry")}
      ${uses.length ? `<p class="muted">Its proof uses ${uses.map(n => `<code>${escapeHTML(n)}</code>`).join(", ")}, available as an earlier lemma.</p>` : ""}
    </div>`;
  }).join("")}` : ""}`;
}

function gantt() {
  const solverCalls = calls.filter(c => c.lemma != null);
  if (!solverCalls.length) return `<p class="muted">No solver calls in this run.</p>`;
  const endOf = c => checkOfCall.get(c.index)?.elapsed_seconds ?? c.elapsed_seconds;
  const t0 = Math.min(...solverCalls.map(c => c.elapsed_seconds - (c.seconds || 0)));
  const t1 = Math.max(...solverCalls.map(endOf));
  const span = Math.max(1, t1 - t0);
  const pos = t => `${((t - t0) / span * 100).toFixed(3)}%`;
  const step = [15, 30, 60, 120, 300, 600, 1200].find(s => span / s <= 8) || 1800;
  const ticks = [];
  for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) ticks.push(t);
  const workers = [...new Set(solverCalls.map(c => c.worker))].sort((a, b) => a - b);

  const groups = lemmaOrder.filter(name => solverCalls.some(c => c.lemma === name)).map(name => {
    const win = lemmaWins.get(name);
    const winLine = win ? `<span class="winline" style="left:${pos(win.elapsed_seconds)}"></span>` : "";
    const jobs = jobsByLemma.get(name);
    const rows = jobs ? sampleLanes().map(k => {
      const bars = jobs.filter(job => k < jobSamples(job)).map(job => {
        const o = sampleOutcome(job, k);
        const end = o.check ? o.check.elapsed_seconds : o.end;
        const width = (end - o.start) / span * 100;
        const outcome = { win: "proof kept", ok: "compiles", fail: "Lean errors" }[o.state] || o.text;
        const tip = `${name} · solver ${k} · AIProver job ${jobNumber(job)} · ${formatDuration(o.end - o.start)}`
          + `${o.turns != null ? ` · ${o.turns} turns` : ""} · ${outcome}`;
        return `<button class="bar ${o.state}" type="button" data-step="${job.index}" title="${escapeHTML(tip)}" style="left:${pos(o.start)};width:${width.toFixed(3)}%">j${jobNumber(job)}</button>`;
      }).join("");
      return `<div class="g-row"><span class="lab">solver ${k}</span><div class="g-track">${winLine}${bars}</div></div>`;
    }).join("") : workers.map(worker => {
      const bars = solverCalls.filter(c => c.lemma === name && c.worker === worker).map(c => {
        const { state } = solverOutcome(c);
        const start = c.elapsed_seconds - (c.seconds || 0);
        const width = (endOf(c) - start) / span * 100;
        const job = isJob(c);
        const outcome = job && state === "pending" ? jobSummary(c) : state;
        const tip = job ? `${name} · AIProver job ${jobNumber(c)} · ${formatDuration(c.seconds || 0)} · ${outcome}`
          : `${name} · solver ${worker} · round ${c.round} · ${formatDuration(c.seconds || 0)} · ${state}`;
        return `<button class="bar ${state}" type="button" data-step="${c.index}" title="${escapeHTML(tip)}" style="left:${pos(start)};width:${width.toFixed(3)}%">${job ? `job ${jobNumber(c)}` : `r${c.round}`}</button>`;
      }).join("");
      return `<div class="g-row"><span class="lab">${jobsByLemma.has(name) ? "AIProver" : `solver ${worker}`}</span><div class="g-track">${winLine}${bars}</div></div>`;
    }).join("");
    const attempts = solverCalls.filter(c => c.lemma === name).length;
    return `<div class="g-group"><div class="gh"><span class="name">${escapeHTML(name)}</span>
      ${win ? `<span class="pill ok">proved at ${formatClock(win.elapsed_seconds)}</span>` : `<span class="pill fail">not proved</span>`}
      <span class="muted" style="font-size:0.8rem">${plural(attempts, "attempt")}</span></div>${rows}</div>`;
  }).join("");

  return `<div class="gantt-wrap"><div class="gantt">
    ${groups}
    <div class="g-row"><span class="lab">elapsed</span><div class="g-axis">${ticks.map(t => `<span style="left:${pos(t)}">${formatClock(t)}</span>`).join("")}</div></div>
  </div></div>
  <div class="legend">
    <span><i class="sw bar win" style="position:static"></i>proof kept</span>
    <span><i class="sw bar ok" style="position:static"></i>compiled, not needed</span>
    <span><i class="sw bar fail" style="position:static"></i>Lean errors, repaired in next round</span>
    <span><i class="sw bar late" style="position:static"></i>finished after the lemma was proved; discarded</span>
    <span><i class="sw bar pending" style="position:static"></i>no proof to check (AIProver: sorry, no answer or server lost)</span>
    <span><i class="sw" style="border-left:2px solid var(--ok);width:4px;border-radius:0"></i>lemma proved</span>
  </div>`;
}

function chapterProveAIProver(jobs) {
  const solver = TRACE.agents?.solver || {};
  const perJob = cfg.workers ?? 1;
  const concurrency = cfg.aiprover_lemma_concurrency || null;
  const peak = peakInFlight();
  const firstJob = [...lemmaWins.values()].filter(w => jobOf(w) && jobNumber(jobOf(w)) === 1).length;
  return `
  <div class="eyebrow">Stage 4 · solvers</div>
  <h2>Parallel proving with AIProver</h2>
  <p class="lead">Each lemma goes to an AIProver job of ${plural(perJob, "independent session")}
  (samples) that run in parallel. A session is an agentic Lean loop with the lean-lsp tools, limited to
  ${solver.max_turns ?? "N"} turns and ${formatDuration(solver.timeout ?? 0)}. From each sample's final file the
  pipeline extracts the lemma's proof and checks it with Lean; the first proof that compiles is kept.
  ${concurrency ? `Up to ${plural(concurrency, "lemma job")} run at once, so up to ${concurrency * perJob} sessions.`
    : "All pending lemma jobs are submitted at once."} A lemma that is not proved is retried by a new
  job, up to ${plural(cfg.aiprover_attempts_per_lemma ?? 1, "completed job")} per statement, and after a replan.
  Jobs stopped by a lost model server do not count and are not shown.</p>
  <div class="stats">
    <div class="stat"><span class="v">${jobs.length}</span><span class="k">AIProver jobs</span></div>
    <div class="stat"><span class="v">${perJob}</span><span class="k">parallel sessions per job</span></div>
    <div class="stat"><span class="v">${peak.jobs} · ${peak.sessions}</span><span class="k">peak jobs · sessions in flight</span></div>
    <div class="stat"><span class="v">${lemmaWins.size} / ${lemmaOrder.length}</span><span class="k">lemmas proved</span></div>
    <div class="stat"><span class="v">${firstJob}</span><span class="k">proved by the first job</span></div>
  </div>
  <p class="muted">Sessions in flight include those waiting in AIProver: the harness runs at most
  <code>max_parallel</code> sessions on this machine (8) and queues the rest.</p>
  <div class="panel">
    <h3>Solver timeline</h3>
    <p class="muted">One row per solver (AIProver sample). Each bar is that sample's session in one
    AIProver job, labelled with the job number; hover for its turns and how it ended. Select a bar to
    read the job's problem and samples.</p>
  </div>
  ${gantt()}
  <details class="fold"><summary><b>All solver steps</b><span class="muted">${plural(jobs.length, "job")}, with their Lean checks and decisions</span></summary>
    <div class="body">${stepList(steps.filter(s => s.stage === "prove"))}</div></details>
  <h3>Kept proofs</h3>
  ${[...lemmaWins.values()].map(w => `
    <div class="panel lemma">
      <div class="head"><span class="name">${escapeHTML(w.lemma)}</span><span class="muted">${escapeHTML(winnerText(w))}</span>${stepLink(w)}</div>
      ${w.helpers ? leanHTML(w.helpers) : ""}
      ${leanHTML(w.proof || "")}
    </div>`).join("") || `<p class="muted">No lemma was proved.</p>`}`;
}

function chapterProve() {
  const solverCalls = calls.filter(c => c.lemma != null);
  const outcomes = solverCalls.map(solverOutcome);
  const count = state => outcomes.filter(o => o.state === state).length;
  const firstTry = [...lemmaWins.values()].filter(w => jobOf(w) ? jobNumber(jobOf(w)) === 1 : w.round === 0).length;
  if (jobsByLemma.size) return chapterProveAIProver(solverCalls);
  return `
  <div class="eyebrow">Stage 4 · solvers</div>
  <h2>Parallel proving</h2>
  <p class="lead">For each lemma, ${cfg.workers ?? "N"} solver chains start at the same time. A chain
  proposes a proof; Lean compiles it together with the definitions and the earlier lemmas. On
  failure the compiler errors are sent back and the chain tries again, for at most
  ${(cfg.max_repairs ?? 0) + 1} attempts. The first proof that compiles is kept, and the other chains stop.
  Calls already in progress at that moment still finish, but their results are discarded.</p>
  <div class="stats">
    <div class="stat"><span class="v">${solverCalls.length}</span><span class="k">solver calls</span></div>
    <div class="stat"><span class="v">${lemmaWins.size} / ${lemmaOrder.length}</span><span class="k">lemmas proved</span></div>
    <div class="stat"><span class="v">${firstTry}</span><span class="k">proved at the first attempt (round 0)</span></div>
    <div class="stat"><span class="v">${count("fail")}</span><span class="k">attempts with Lean errors</span></div>
    <div class="stat"><span class="v">${count("late")}</span><span class="k">discarded after a win</span></div>
  </div>
  <div class="panel">
    <h3>Solver timeline</h3>
    <p class="muted">Each bar is one model call, from request to Lean result, labelled with its repair round. Select a bar to read the prompt, reply and compiler output.</p>
  </div>
  ${gantt()}
  <details class="fold"><summary><b>All solver steps</b><span class="muted">${plural(solverCalls.length, "call")}, with their Lean checks and decisions</span></summary>
    <div class="body">${stepList(steps.filter(s => s.stage === "prove"))}</div></details>
  <h3>Kept proofs</h3>
  ${[...lemmaWins.values()].map(w => `
    <div class="panel lemma">
      <div class="head"><span class="name">${escapeHTML(w.lemma)}</span><span class="muted">${escapeHTML(winnerText(w))}</span>${stepLink(w)}</div>
      ${w.helpers ? leanHTML(w.helpers) : ""}
      ${leanHTML(w.proof || "")}
    </div>`).join("")}`;
}

const CHECK_TEXT = {
  compiles: "The standalone file with definitions, lemmas and solution compiles.",
  no_sorry: "No sorry placeholder remains.",
  standard_axioms_only: "The solution depends only on propext, Classical.choice and Quot.sound.",
  module_build: "The Definitions, Theorems and Solutions modules build in the Lean project.",
  statement_matches: "A module importing both the theorem and the solution checks that the solution's type equals the audited theorem statement.",
  verified: "All checks above hold.",
};

function chapterAssemble() {
  const final = eventsOf("final_verification").at(-1);
  const checkSteps = steps.filter(s => s.stage === "assemble");
  const result = final?.checks || outcome.checks || {};
  return `
  <div class="eyebrow">Stage 5 · Lean</div>
  <h2>Assembly and verification</h2>
  <p class="lead">The kept lemma proofs replace the <code>sorry</code> placeholders in the sketch,
  producing one standalone file. The file must satisfy every check below. The last check guards
  against a solution that proves a different statement from the one that passed the audit.</p>
  ${stepList(checkSteps)}
  <div class="checks">
    ${Object.keys(CHECK_TEXT).filter(k => k in result).map(k => `
      <div class="check"><span class="mark ${result[k] ? "ok" : "fail"}">${result[k] ? "✓" : "✗"}</span>
        <span class="name">${k}</span><span class="desc">${CHECK_TEXT[k]}</span></div>`).join("")}
  </div>
  ${result.axioms ? `<p>Axioms reported by <code>#print axioms solution</code>: ${result.axioms.map(a => `<code>${escapeHTML(a)}</code>`).join(", ") || "none"}.</p>` : ""}
  ${final?.solution ? `
  <details class="fold" open><summary><b>Final solution file</b><span class="muted">${final.solution.split("\n").length} lines of Lean</span></summary>
    <div class="body">${leanHTML(final.solution, new Set(), "tall")}</div></details>` : ""}`;
}

let logFilter = { kind: "all", stage: "all" };

function chapterLog() {
  const kinds = ["all", "model_call", "lean_check", "decision"];
  const stages = ["all", ...new Set(steps.map(s => s.stage))];
  const label = { all: "All", model_call: "Model calls", lean_check: "Lean checks", decision: "Decisions" };
  return `
  <div class="eyebrow">Reference</div>
  <h2>Complete step log</h2>
  <p class="lead">Every recorded step in order. Times are elapsed since the start of the run; model
  calls are recorded when their reply arrives.</p>
  <div class="filters" role="group" aria-label="Filter by kind">${kinds.map(k => `<button class="chip" type="button" data-filter-kind="${k}" aria-pressed="${logFilter.kind === k}">${label[k]}</button>`).join("")}</div>
  <div class="filters" role="group" aria-label="Filter by stage">${stages.map(s => `<button class="chip" type="button" data-filter-stage="${s}" aria-pressed="${logFilter.stage === s}">${s === "all" ? "All stages" : s}</button>`).join("")}</div>
  ${stepList(steps.filter(s => (logFilter.kind === "all" || s.kind === logFilter.kind) && (logFilter.stage === "all" || s.stage === logFilter.stage)))}`;
}

const CHAPTERS = [
  { id: "overview", title: "Overview", render: chapterOverview },
  { id: "problem", title: "The problem", render: chapterProblem },
  { id: "algorithm", title: "Algorithm", render: chapterAlgorithm, after: () => showFlowDetail("formalize") },
  { id: "prompts", title: "Roles and prompts", render: chapterPrompts },
  { id: "formalize", title: "Formalization", render: chapterFormalize },
  { id: "audit", title: "Blind audit", render: chapterAudit },
  { id: "sketch", title: "Proof sketch", render: chapterSketch },
  { id: "prove", title: "Parallel proving", render: chapterProve },
  { id: "assemble", title: "Verification", render: chapterAssemble },
  { id: "log", title: "Step log", render: chapterLog },
];

// Navigation ---------------------------------------------------------------------------

let current = 0;

function showChapter(index, focus = true) {
  current = Math.max(0, Math.min(CHAPTERS.length - 1, index));
  const chapter = CHAPTERS[current];
  const main = document.getElementById("main");
  main.innerHTML = `<section class="chapter">${chapter.render()}</section>`;
  chapter.after?.();
  document.querySelectorAll("#chapters button").forEach((b, i) => {
    if (i === current) b.setAttribute("aria-current", "step");
    else b.removeAttribute("aria-current");
  });
  document.querySelector("#chapters button[aria-current]")?.scrollIntoView({ block: "nearest", inline: "nearest" });
  document.getElementById("prev").disabled = current === 0;
  document.getElementById("next").disabled = current === CHAPTERS.length - 1;
  document.getElementById("next").textContent = current < CHAPTERS.length - 1 ? `${CHAPTERS[current + 1].title} →` : "End";
  document.getElementById("where").textContent = `${current + 1} of ${CHAPTERS.length}`;
  try { history.replaceState(null, "", "#" + chapter.id); } catch (error) { /* sandboxed frames may refuse */ }
  if (focus) {
    window.scrollTo({ top: 0 });
    main.focus({ preventScroll: true });
  }
}

function init() {
  renderHeader();
  document.getElementById("chapters").innerHTML = CHAPTERS.map((c, i) =>
    `<button type="button" data-chapter="${i}"><span class="n">${String(i + 1).padStart(2, "0")}</span><span>${c.title}</span></button>`).join("");

  installDrawerHandlers();
  document.addEventListener("click", event => {
    const target = event.target.closest("[data-chapter],[data-goto],[data-flow],[data-filter-kind],[data-filter-stage]");
    if (!target) return;
    const d = target.dataset;
    if (d.chapter !== undefined) showChapter(Number(d.chapter));
    else if (d.goto) { closeStep(); showChapter(CHAPTERS.findIndex(c => c.id === d.goto)); }
    else if (d.flow) showFlowDetail(d.flow);
    else if (d.filterKind) { logFilter.kind = d.filterKind; showChapter(current, false); }
    else if (d.filterStage) { logFilter.stage = d.filterStage; showChapter(current, false); }
  });
  document.addEventListener("keydown", event => {
    if (drawerOpen || event.target.closest?.("input, textarea, select")) return;
    if ((event.key === "Enter" || event.key === " ") && event.target.matches?.("svg [data-flow]")) {
      event.preventDefault();
      showFlowDetail(event.target.dataset.flow);
      return;
    }
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === "ArrowRight") showChapter(current + 1);
    else if (event.key === "ArrowLeft") showChapter(current - 1);
  });
  document.getElementById("prev").addEventListener("click", () => showChapter(current - 1));
  document.getElementById("next").addEventListener("click", () => showChapter(current + 1));

  const fromHash = CHAPTERS.findIndex(c => "#" + c.id === location.hash);
  showChapter(fromHash >= 0 ? fromHash : 0, false);
}

init();
</script>
