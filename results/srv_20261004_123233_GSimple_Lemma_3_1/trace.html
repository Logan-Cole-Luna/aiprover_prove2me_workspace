)$ are called the \\emph{unipotent generators}.\n\nThe commutator is $(a,b):=aba^{-1}b^{-1}$. The set $\\cR\\subseteq F(\\cX)$ and the auxiliary elements $\\wt_{-1}(s)$ and $\\wt_{\\ell,jk}(s)$ are defined as follows. The quantifiers range over $s,t\\in\\CC^\\times$, $u,v\\in\\CC$ and $(\\ell,j,k),(m,p,q)\\in E$.\n\n{\\allowdisplaybreaks\n\\begin{align*}\n\\tag{Re:0}\n\\wt_{-1}(s)&:=X_{-1}(s)\\,Y_{-1}(-s^{-1})\\,X_{-1}(s),\\qquad \\wt_{-1}:=\\wt_{-1}(1),\\\\\n\\tag{Im:0}\n\\wt_{\\ell,jk}(s)&:=X_{\\ell,jk}(s)\\,Y_{\\ell,jk}\\Bigl(\\frac{-s^{-1}}{c_{\\ell j}}\\Bigr)\\,X_{\\ell,jk}(s),\\qquad \\wt_{\\ell,jk}:=\\wt_{\\ell,jk}(1),\n\\intertext{relations defining a subgroup $\\mathrm{GL}_2(-1)$:}\n\\tag{H:1a} H_1(s)H_1(t)&=H_1(st),\\\\\n\\tag{H:1b} H_2(s)H_2(t)&=H_2(st),\\\\\n\\tag{H:2} H_1(s)H_2(t)&=H_2(t)H_1(s),\\\\\n\\tag{Re:1a} X_{-1}(u)X_{-1}(v)&=X_{-1}(u+v),\\\\\n\\tag{Re:1b} Y_{-1}(u)Y_{-1}(v)&=Y_{-1}(u+v),\\\\\n\\tag{Re:2} Y_{-1}(-t)X_{-1}(s)Y_{-1}(t)&=X_{-1}(-t^{-1})\\,Y_{-1}(-t^2s)\\,X_{-1}(t^{-1}),\\\\\n\\tag{Re:3} \\wt_{-1}(s)\\wt_{-1}&=H_1(-s)H_2(-s^{-1}),\\\\\n\\tag{Re:4a} \\wt_{-1}X_{-1}(u)\\wt_{-1}^{-1}&=Y_{-1}(-u),\\\\\n\\tag{Re:4b} \\wt_{-1}Y_{-1}(u)\\wt_{-1}^{-1}&=X_{-1}(-u),\\\\\n\\tag{Re:5a} \\wt_{-1}H_1(s)\\wt_{-1}^{-1}&=H_2(s),\\\\\n\\tag{Re:5b} \\wt_{-1}H_2(s)\\wt_{-1}^{-1}&=H_1(s),\\\\\n\\tag{Re:6a} H_1(s)X_{-1}(u)H_1(s)^{-1}&=X_{-1}(su),\\\\\n\\tag{Re:6b} H_2(s)X_{-1}(u)H_2(s)^{-1}&=X_{-1}(s^{-1}u),\\\\\n\\tag{Re:6c} H_1(s)Y_{-1}(u)H_1(s)^{-1}&=Y_{-1}(s^{-1}u),\\\\\n\\tag{Re:6d} H_2(s)Y_{-1}(u)H_2(s)^{-1}&=Y_{-1}(su),\n\\intertext{relations defining subgroups $\\mathrm{GL}_2(\\ell,j,k)$:}\n\\tag{Im:1a} X_{\\ell,jk}(u)X_{\\ell,jk}(v)&=X_{\\ell,jk}(u+v),\\\\\n\\tag{Im:1b} Y_{\\ell,jk}(u)Y_{\\ell,jk}(v)&=Y_{\\ell,jk}(u+v),\\\\\n\\tag{Im:2} Y_{\\ell,jk}(-t)X_{\\ell,jk}(s)Y_{\\ell,jk}(t)&=X_{\\ell,jk}\\Bigl(\\frac{-t^{-1}}{c_{\\ell j}}\\Bigr)\\,Y_{\\ell,jk}(-c_{\\ell j}t^2s)\\,X_{\\ell,jk}\\Bigl(\\frac{t^{-1}}{c_{\\ell j}}\\Bigr),\\\\\n\\tag{Im:3} \\wt_{\\ell,jk}\\bigl(s^{(\\ell+1)(j-\\ell)}\\bigr)\\wt_{\\ell,jk}&=H_1\\bigl((-s)^{j-\\ell}\\bigr)H_2\\bigl((-s)^{\\ell+1}\\bigr),\\\\\n\\tag{Im:4a} \\wt_{\\ell,jk}X_{\\ell,jk}(u)\\wt_{\\ell,jk}^{-1}&=Y_{\\ell,jk}\\Bigl(\\frac{-u}{c_{\\ell j}}\\Bigr),\\\\\n\\tag{Im:4b} \\wt_{\\ell,jk}Y_{\\ell,jk}(u)\\wt_{\\ell,jk}^{-1}&=X_{\\ell,jk}(-c_{\\ell j}u),\\\\\n\\tag{Im:5a} \\wt_{\\ell,jk}H_1(s^{j-\\ell})\\wt_{\\ell,jk}^{-1}&=H_2(s^{-(\\ell+1)}),\\\\\n\\tag{Im:5b} \\wt_{\\ell,jk}H_2(s^{\\ell+1})\\wt_{\\ell,jk}^{-1}&=H_1(s^{-(j-\\ell)}),\\\\\n\\tag{Im:6a} H_1(s)X_{\\ell,jk}(u)H_1(s)^{-1}&=X_{\\ell,jk}(s^{\\ell+1}u),\\\\\n\\tag{Im:6b} H_2(s)X_{\\ell,jk}(u)H_2(s)^{-1}&=X_{\\ell,jk}(s^{j-\\ell}u),\\\\\n\\tag{Im:6c} H_1(s)Y_{\\ell,jk}(u)H_1(s)^{-1}&=Y_{\\ell,jk}(s^{-(\\ell+1)}u),\\\\\n\\tag{Im:6d} H_2(s)Y_{\\ell,jk}(u)H_2(s)^{-1}&=Y_{\\ell,jk}(s^{-(j-\\ell)}u),\n\\intertext{relations between the unipotent generators:}\n\\tag{U:1a} (X_{-1}(u),X_{j-1,jk}(v))&=1,\\\\\n\\tag{U:1b} (Y_{-1}(u),Y_{j-1,jk}(v))&=1,\\\\\n\\tag{U:1c} (Y_{-1}(u),X_{0,jk}(v))&=1,\\\\\n\\tag{U:1d} (X_{-1}(u),Y_{0,jk}(v))&=1,\\\\\n\\tag{U:2} (X_{\\ell,jk}(u),Y_{m,pq}(v))&=1\\qquad\\text{if } j\\ne p \\text{ or } k\\ne q \\text{ or } |\\ell-m|>1,\\\\\n\\tag{U:3a} (X_{1,2k}(u),Y_{0,2k}(v))&=X_{-1}(uv),\\\\\n\\tag{U:3b} (X_{0,2k}(u),Y_{1,2k}(v))&=Y_{-1}(uv),\n\\intertext{action of $\\wt_{-1}$ on the unipotent generators:}\n\\tag{U:4a} \\wt_{-1}X_{\\ell,jk}(u)\\wt_{-1}^{-1}&=X_{j-1-\\ell,jk}\\bigl((-1)^{j-\\ell-1}u\\bigr),\\\\\n\\tag{U:4b} \\wt_{-1}Y_{\\ell,jk}(u)\\wt_{-1}^{-1}&=Y_{j-1-\\ell,jk}\\bigl((-1)^{j-\\ell-1}u\\bigr).\n\\end{align*}\n}\n\nThe group $\\Gm$ is the group with this presentation:\n\\[\n\\Gm=\\langle \\cX\\mid\\cR\\rangle=F(\\cX)/N_{\\cR},\n\\]\nwhere $N_\\cR$ is the normal closure of $\\cR$.\n\n\\begin{theorem}[Lemma 3.1 of the source]\\label{thm:source}\nIn $\\Gm$ we have\n\\begin{enumerate}\n\\item[(a)] $X_{-1}(0)=1$,\n\\item[(b)] $Y_{-1}(0)=1$,\n\\item[(c)] $X_{\\ell,jk}(0)=1$ for all $(\\ell,j,k)\\in E$,\n\\item[(d)] $Y_{\\ell,jk}(0)=1$ for all $(\\ell,j,k)\\in E$.\n\\end{enumerate}\n\\end{theorem}\n\nThe source proof is as follows. From (Re:1a) we get $X_{-1}(u+v)^{-1}X_{-1}(u)X_{-1}(v)=1$. Setting $u=v=0$ gives $X_{-1}(0)^{-1}X_{-1}(0)X_{-1}(0)=1$, hence $X_{-1}(0)=1$. Parts (b), (c) and (d) follow in the same way from (Re:1b), (Im:1a) and (Im:1b).\n\n\\section{Formalization}\n\nThroughout, $c:\\NN\\to\\NN$ is an arbitrary function. It plays the role of the coefficient function $j\\mapsto c(j)$ for $j\\ge 0$. The value $c(-1)$ never enters the definition of $E$ or of the presentation, so it has no counterpart.\n\n\\begin{definition}[Index set]\n$E_c$ is the set of triples $(\\ell,j,k)\\in\\NN^3$ with $1\\le k\\le c(j)$ and $\\ell<j$.\n\\end{definition}\n\\LeanDecl{IdxE}\n\nThis is exactly the source's $E$ once $c$ is the coefficient function of $J$. Since $\\ell<j$, every $(\\ell,j,k)\\in E_c$ has $j\\ge 1$.\n\n\\begin{definition}[Generators]\n$\\cX_c$ is the disjoint union of six families of symbols:\n\\begin{itemize}\n\\item $H_1(s)$ and $H_2(s)$ for $s\\in\\CC^\\times$;\n\\item $X_{-1}(u)$ and $Y_{-1}(u)$ for $u\\in\\CC$;\n\\item $X_e(u)$ and $Y_e(u)$ for $e=(\\ell,j,k)\\in E_c$ and $u\\in\\CC$.\n\\end{itemize}\nWe write $X_{\\ell,jk}(u)$ for $X_e(u)$, and similarly for $Y$.\n\\end{definition}\n\\LeanDecl{Gen}\n\n\\begin{definition}[The constants $c_{\\ell j}$]\nFor $\\ell,j\\in\\NN$,\n\\[\nc_{\\ell j}:=(-1)^{\\ell+1}\\binom{j\\mathbin{\\dot-}1}{\\ell}(\\ell+1)(j\\mathbin{\\dot-}\\ell)\\in\\CC,\n\\]\nwhere $\\dot-$ is truncated subtraction on $\\NN$.\n\\end{definition}\n\\LeanDecl{cc}\n\nFor $(\\ell,j,k)\\in E_c$ we have $\\ell<j$, so both truncated subtractions are ordinary subtractions and $c_{\\ell j}$ is the source's constant. Moreover $c_{\\ell j}\\neq 0$ on $E_c$, because $\\ell\\le j-1$ gives $\\binom{j-1}{\\ell}\\ge 1$, and also $\\ell+1\\ge 1$ and $j-\\ell\\ge 1$. The Lean convention $x/0=0$ is therefore never triggered in the relations below.\n\n\\begin{definition}[Flip of an index]\nFor $e=(\\ell,j,k)\\in E_c$, set $\\bar e:=(j\\mathbin{\\dot-}1\\mathbin{\\dot-}\\ell,\\,j,\\,k)$. This lies in $E_c$, and since $\\ell<j$ its first entry is the genuine difference $j-1-\\ell$.\n\\end{definition}\n\\LeanDecl{flipE}\n\nThe following six maps send each generator symbol to the corresponding generator of the free group $F(\\cX_c)$:\n\\[\ns\\mapsto H_1(s),\\quad s\\mapsto H_2(s),\\quad u\\mapsto X_{-1}(u),\\quad u\\mapsto Y_{-1}(u),\\quad u\\mapsto X_e(u),\\quad u\\mapsto Y_e(u).\n\\]\n\\LeanDecl{h1}\n\\LeanDecl{h2}\n\\LeanDecl{xm}\n\\LeanDecl{ym}\n\\LeanDecl{xx}\n\\LeanDecl{yy}\n\nThe auxiliary elements of (Re:0) are the following words in $F(\\cX_c)$. For $s\\in\\CC^\\times$,\n\\[\n\\wt_{-1}(s):=X_{-1}(s)\\,Y_{-1}(-s^{-1})\\,X_{-1}(s),\n\\]\nand $\\wt_{-1}:=\\wt_{-1}(1)$.\n\\LeanDecl{wm}\n\\LeanDecl{wm1}\n\nThe auxiliary elements of (Im:0) are, for $e=(\\ell,j,k)\\in E_c$ and $s\\in\\CC^\\times$,\n\\[\n\\wt_e(s):=X_e(s)\\,Y_e\\bigl(-s^{-1}/c_{\\ell j}\\bigr)\\,X_e(s),\n\\]\nand $\\wt_e:=\\wt_e(1)$.\n\\LeanDecl{ww}\n\\LeanDecl{ww1}\n\nThree word operations in $F(\\cX_c)$ are used to write the relators:\n\\begin{itemize}\n\\item the commutator $(a,b)=aba^{-1}b^{-1}$;\n\\item the relator $ab^{-1}$ encoding an equation $a=b$;\n\\item the conjugate $aba^{-1}$.\n\\end{itemize}\n\\LeanDecl{comm'}\n\\LeanDecl{eqr}\n\\LeanDecl{conj'}\n\n\\begin{definition}[Relators]\n$\\cR_c\\subseteq F(\\cX_c)$ consists of the following elements.\n\\begin{itemize}\n\\item For every relation $a=b$ among (H:1a)--(Im:6d), (U:3a)--(U:4b), the relator $ab^{-1}$.\n\\item For every commutator relation (U:1a)--(U:2), the commutator itself.\n\\end{itemize}\nEach relator is taken for all parameters $s,t\\in\\CC^\\times$, $u,v\\in\\CC$ and all indices in $E_c$ allowed by the side conditions.\n\\end{definition}\n\nThe left- and right-hand sides are literally those of the source, with the following points of detail.\n\\begin{itemize}\n\\item In (Im:3) the argument of $\\wt_e$ is the unit $s^{(\\ell+1)(j-\\ell)}$.\n\\item In (Im:5a), (Im:5b), (Im:6c) and (Im:6d), the negative powers $s^{-n}$ are written as $(s^n)^{-1}$.\n\\item All exponents $j-\\ell$, $j-\\ell-1$ and $j-1-\\ell$ are truncated differences of natural numbers. These equal the true differences because $\\ell<j$.\n\\item (U:1a) and (U:1b) are imposed for all $e=(\\ell,j,k)\\in E_c$ with $\\ell+1=j$, that is, for $e=(j-1,j,k)$. (U:1c) and (U:1d) are imposed for $e$ with $\\ell=0$.\n\\item (U:2) is imposed for $e=(\\ell,j,k)$ and $f=(m,p,q)$ in $E_c$ with $j\\neq p$, or $k\\neq q$, or $|\\ell-m|>1$, the absolute value taken in $\\ZZ$.\n\\item (U:3a) is imposed for $e=(1,2,k)$ and $f=(0,2,k)$ in $E_c$ with the same $k$. (U:3b) is imposed for $e=(0,2,k)$ and $f=(1,2,k)$.\n\\item (U:4a) and (U:4b) use the flipped index $\\bar e$ and the sign $(-1)^{j-\\ell-1}$.\n\\end{itemize}\n\\LeanDecl{GRel}\n\n\\begin{definition}[The group]\n$G_c:=F(\\cX_c)/N_{\\cR_c}$, the group presented by $\\cX_c$ and $\\cR_c$. Let $\\pi:F(\\cX_c)\\to G_c$ be the canonical surjective homomorphism.\n\\end{definition}\n\\LeanDecl{Gm}\n\nThe source writes relators in the form $b^{-1}a$, for example $X_{-1}(u+v)^{-1}X_{-1}(u)X_{-1}(v)$. The formalization uses $ab^{-1}$ instead. These two words are conjugate, so they have the same normal closure, and $G_c$ is the source's $\\Gm$ when $c$ is the coefficient function of $J$.\n\nThe target statement is the following.\n\n\\LeanDecl{gsimple_zero_generators_trivial}\n\nIn mathematical terms it reads as follows. For every function $c:\\NN\\to\\NN$, in $G_c$ we have\n\\[\n\\pi(X_{-1}(0))=1,\\qquad \\pi(Y_{-1}(0))=1,\n\\]\nand, for every $e\\in E_c$,\n\\[\n\\pi(X_e(0))=1,\\qquad \\pi(Y_e(0))=1.\n\\]\nThese are parts (a)--(d) of \\cref{thm:source}. The statement is proved for all $c$, so it applies in particular to the coefficients of $J$. No hypothesis on $c$, such as $c(2)\\ge 1$, is needed or assumed.\n\n\\section{Proof}\n\n\\subsection{Overview}\n\nThe source proof specializes the relation (Re:1a) at $u=v=0$ and cancels one factor $X_{-1}(0)$. The formal proof organizes this in two steps.\n\\begin{enumerate}\n\\item \\Cref{lem:mk_xm_add,lem:mk_ym_add,lem:mk_xx_add,lem:mk_yy_add} show that the relations (Re:1a), (Re:1b), (Im:1a) and (Im:1b) make each of the maps\n\\[\nu\\mapsto\\pi(X_{-1}(u)),\\quad u\\mapsto\\pi(Y_{-1}(u)),\\quad u\\mapsto\\pi(X_e(u)),\\quad u\\mapsto\\pi(Y_e(u))\n\\]\nturn sums into products, for all $u,v\\in\\CC$.\n\\item \\Cref{lem:add_zero_group_lemma} shows that any map $f$ from $\\CC$ to a group with $f(u+v)=f(u)f(v)$ satisfies $f(0)=1$. Its proof is the source's cancellation $f(0)=f(0)f(0)\\Rightarrow f(0)=1$.\n\\end{enumerate}\n\nThe deviations from the source are purely organizational:\n\\begin{itemize}\n\\item the cancellation step is factored out once as an abstract lemma;\n\\item the four parts are proved explicitly rather than \"in the same way\";\n\\item the relators have the form $ab^{-1}$ rather than $b^{-1}a$.\n\\end{itemize}\nOnly the four additivity relations are used.\n\n\\begin{lemma}[\\leanname{add_zero_group_lemma}]\\label{lem:add_zero_group_lemma}\nLet $G$ be a group and $f:\\CC\\to G$ a map with $f(u+v)=f(u)f(v)$ for all $u,v\\in\\CC$. Then $f(0)=1$.\n\\end{lemma}\n\\LeanDecl{add_zero_group_lemma}\n\\begin{proof}\nTaking $u=v=0$ gives $f(0)=f(0+0)=f(0)f(0)$. Hence\n\\[\nf(0)=f(0)\\bigl(f(0)f(0)^{-1}\\bigr)=\\bigl(f(0)f(0)\\bigr)f(0)^{-1}=f(0)f(0)^{-1}=1.\\qedhere\n\\]\n\\end{proof}\n\n\\begin{lemma}[\\leanname{mk_xm_add}]\\label{lem:mk_xm_add}\nLet $c:\\NN\\to\\NN$ and $u,v\\in\\CC$. In $G_c$,\n\\[\n\\pi(X_{-1}(u+v))=\\pi(X_{-1}(u))\\,\\pi(X_{-1}(v)).\n\\]\n\\end{lemma}\n\\LeanDecl{mk_xm_add}\n\\begin{proof}\nBy (Re:1a) the word $r=X_{-1}(u)X_{-1}(v)X_{-1}(u+v)^{-1}$ lies in $\\cR_c$, so $\\pi(r)=1$. Since $\\pi$ is a homomorphism,\n\\[\n\\pi(X_{-1}(u))\\,\\pi(X_{-1}(v))\\,\\pi(X_{-1}(u+v))^{-1}=1.\n\\]\nFrom $xy^{-1}=1$ we get $x=y$, which gives the claim.\n\\end{proof}\n\n\\begin{lemma}[\\leanname{mk_ym_add}]\\label{lem:mk_ym_add}\nLet $c:\\NN\\to\\NN$ and $u,v\\in\\CC$. In $G_c$,\n\\[\n\\pi(Y_{-1}(u+v))=\\pi(Y_{-1}(u))\\,\\pi(Y_{-1}(v)).\n\\]\n\\end{lemma}\n\\LeanDecl{mk_ym_add}\n\\begin{proof}\nBy (Re:1b) the word $Y_{-1}(u)Y_{-1}(v)\\,Y_{-1}(u+v)^{-1}$ lies in $\\cR_c$, so its image under $\\pi$ is $1$. Hence\n\\[\n\\pi\\bigl(Y_{-1}(u)Y_{-1}(v)\\bigr)\\,\\pi(Y_{-1}(u+v))^{-1}=1.\n\\]\nMultiplying on the right by $\\pi(Y_{-1}(u+v))$ gives $\\pi(Y_{-1}(u)Y_{-1}(v))=\\pi(Y_{-1}(u+v))$. Since $\\pi$ is a homomorphism, the left side equals $\\pi(Y_{-1}(u))\\,\\pi(Y_{-1}(v))$.\n\\end{proof}\n\n\\begin{lemma}[\\leanname{mk_xx_add}]\\label{lem:mk_xx_add}\nLet $c:\\NN\\to\\NN$, $e\\in E_c$ and $u,v\\in\\CC$. In $G_c$,\n\\[\n\\pi(X_e(u+v))=\\pi(X_e(u))\\,\\pi(X_e(v)).\n\\]\n\\end{lemma}\n\\LeanDecl{mk_xx_add}\n\\begin{proof}\nBy (Im:1a) for the index $e$, the element $\\bigl(X_e(u)X_e(v)\\bigr)X_e(u+v)^{-1}$ lies in $\\cR_c$. Two elements $a,b$ of a free group with $ab^{-1}$ a relator have the same image in the presented group, so\n\\[\n\\pi(X_e(u)X_e(v))=\\pi(X_e(u+v)).\n\\]\nSince $\\pi$ is a homomorphism, the left side is $\\pi(X_e(u))\\,\\pi(X_e(v))$.\n\\end{proof}\n\n\\begin{lemma}[\\leanname{mk_yy_add}]\\label{lem:mk_yy_add}\nLet $c:\\NN\\to\\NN$, $e\\in E_c$ and $u,v\\in\\CC$. In $G_c$,\n\\[\n\\pi(Y_e(u+v))=\\pi(Y_e(u))\\,\\pi(Y_e(v)).\n\\]\n\\end{lemma}\n\\LeanDecl{mk_yy_add}\n\\begin{proof}\nThe argument is the same as for \\cref{lem:mk_xx_add}, using (Im:1b). The relator $\\bigl(Y_e(u)Y_e(v)\\bigr)Y_e(u+v)^{-1}\\in\\cR_c$ gives\n\\[\n\\pi(Y_e(u)Y_e(v))=\\pi(Y_e(u+v)).\n\\]\nThe left side equals $\\pi(Y_e(u))\\,\\pi(Y_e(v))$ because $\\pi$ is a homomorphism.\n\\end{proof}\n\n\\subsection{Proof of the theorem}\n\n\\LeanDecl{solution}\n\n\\begin{proof}\nFix $c:\\NN\\to\\NN$. We prove the four parts in turn.\n\\begin{enumerate}\n\\item[(a)] Apply \\cref{lem:add_zero_group_lemma} to $G=G_c$ and $f(u)=\\pi(X_{-1}(u))$. The hypothesis $f(u+v)=f(u)f(v)$ is \\cref{lem:mk_xm_add}. Hence $\\pi(X_{-1}(0))=1$.\n\\item[(b)] Apply \\cref{lem:add_zero_group_lemma} to $f(u)=\\pi(Y_{-1}(u))$. The hypothesis is \\cref{lem:mk_ym_add}. Hence $\\pi(Y_{-1}(0))=1$.\n\\item[(c)] Fix $e\\in E_c$ and apply \\cref{lem:add_zero_group_lemma} to $f(u)=\\pi(X_e(u))$. The hypothesis is \\cref{lem:mk_xx_add}. Hence $\\pi(X_e(0))=1$.\n\\item[(d)] Fix $e\\in E_c$ and apply \\cref{lem:add_zero_group_lemma} to $f(u)=\\pi(Y_e(u))$. The hypothesis is \\cref{lem:mk_yy_add}. Hence $\\pi(Y_e(0))=1$.\n\\end{enumerate}\nThis proves the conjunction of (a)--(d) for every $c$. In particular it holds for the coefficient function of $J$, which is \\cref{thm:source}.\n\\end{proof}\n<\/body>\n\n<discrepancies>\n- **Where:** Statement section, the paragraph \"The source proof is as follows…\", and the later remark in the Formalization section that \"The source writes relators in the form $b^{-1}a$, for example $X_{-1}(u+v)^{-1}X_{-1}(u)X_{-1}(v)$.\"\n- **What is wrong:** The source text supplied contains only the statement of Lemma 3.1, with no proof. It also gives $\\mathcal{R}$ as a list of equations $a=b$, not as relator words of any particular shape. Both the \"source proof\" and the claimed $b^{-1}a$ form are therefore attributed to the source without support. The Statement section should reproduce only what the source states.\n- **Correction:** Remove the \"source proof\" paragraph from the Statement section, or label it as the report's own sketch. Rephrase the relator remark: the source gives relations as equations $a=b$, and the formalization encodes each as the relator $ab^{-1}$, which has the same normal closure as the equation. The mathematical substance is unaffected, since $ab^{-1}$ and $b^{-1}a$ are conjugate.\n\nEverything else checks out:\n- `IdxE`, `cc`, `flipE`, the generator maps and `wm`, `ww` match the source. `cc` is nonzero on $E_c$, and both truncated subtractions are genuine because $\\ell<j$.\n- All 37 constructors of `GRel` match (H:1a)–(U:4b), including the side conditions of (U:1a)–(U:3b), the flipped index and sign in (U:4a)/(U:4b), and $-(s^{-1})=(-s)^{-1}$ in (Re:3).\n- `Gm` is the presented group, so $G_c$ is the source's $G(\\mathfrak{m})$ when $c$ is the coefficient function of $J$.\n- The target theorem states (a)–(d) for every $c:\\mathbb{N}\\to\\mathbb{N}$. This implies the source's lemma, since one need only supply the coefficient function of $J$.\n- The four additivity lemmas and `add_zero_group_lemma` are correctly described and cite only earlier results.\n<\/discrepancies>", "response": "<title>Triviality of the zero-parameter unipotent generators in the group $G(\\mathfrak{m})$<\/title>\n<abstract>The source defines a group $G(\\mathfrak{m})$ by generators and relations, indexed by the coefficients $c(j)$ of the modular function $J(q)$. Its Lemma 3.1 states that every unipotent generator with parameter $0$ is trivial in $G(\\mathfrak{m})$: $X_{-1}(0)=Y_{-1}(0)=X_{\\ell,jk}(0)=Y_{\\ell,jk}(0)=1$. We formalize the presentation in Lean 4 with Mathlib, taking the coefficient function $c:\\mathbb{N}\\to\\mathbb{N}$ as an arbitrary parameter, and prove all four parts for every such $c$. The proof uses only the additivity relations (Re:1a), (Re:1b), (Im:1a) and (Im:1b), together with an abstract fact: a map from $(\\mathbb{C},+)$ to a group that turns sums into products sends $0$ to $1$.<\/abstract>\n<macros>\\newcommand{\\CC}{\\mathbb{C}}\n\\newcommand{\\NN}{\\mathbb{N}}\n\\newcommand{\\ZZ}{\\mathbb{Z}}\n\\newcommand{\\wt}{\\widetilde{w}}\n\\newcommand{\\Gm}{G(\\mathfrak{m})}\n\\newcommand{\\cX}{\\mathcal{X}}\n\\newcommand{\\cR}{\\mathcal{R}}<\/macros>\n<body>\n\\section{Statement}\n\nLet $\\CC$ denote the complex numbers and $\\NN$ the natural numbers. Let $c(j)$ be the coefficient of $q^j$ in the modular function\n\\[\nJ(q)=\\sum_{j\\geq -1}c(j)q^j=\\frac{1}{q}+196884\\,q+21493760\\,q^2+864299970\\,q^3+\\cdots,\n\\]\nso that $c(-1)=1$, $c(0)=0$, $c(1)=196884$, and so on. Define the index set\n\\[\nE=\\{(\\ell,j,k)\\mid j\\in\\NN,\\ 1\\le k\\le c(j),\\ 0\\le \\ell<j\\}\n\\]\nand, for $(\\ell,j,k)\\in E$, the complex number\n\\[\nc_{\\ell j}:=(-1)^{\\ell+1}\\binom{j-1}{\\ell}(\\ell+1)(j-\\ell).\n\\]\nLet $\\cX$ be the set of symbols\n\\[\n\\cX:=\\{H_1(s),\\,H_2(s),\\,X_{-1}(u),\\,Y_{-1}(u),\\,X_{\\ell,jk}(u),\\,Y_{\\ell,jk}(u)\\mid s\\in\\CC^\\times,\\ u\\in\\CC,\\ (\\ell,j,k)\\in E\\},\n\\]\nand let $F(\\cX)$ be the free group on $\\cX$. The symbols $X_{-1}(u)$, $Y_{-1}(u)$, $X_{\\ell,jk}(u)$ and $Y_{\\ell,jk}(u)$ are called the \\emph{unipotent generators}.\n\nThe commutator is $(a,b):=aba^{-1}b^{-1}$. The set $\\cR\\subseteq F(\\cX)$ and the auxiliary elements $\\wt_{-1}(s)$ and $\\wt_{\\ell,jk}(s)$ are defined as follows. The quantifiers range over $s,t\\in\\CC^\\times$, $u,v\\in\\CC$ and $(\\ell,j,k),(m,p,q)\\in E$.\n\n{\\allowdisplaybreaks\n\\begin{align*}\n\\tag{Re:0}\n\\wt_{-1}(s)&:=X_{-1}(s)\\,Y_{-1}(-s^{-1})\\,X_{-1}(s),\\qquad \\wt_{-1}:=\\wt_{-1}(1),\\\\\n\\tag{Im:0}\n\\wt_{\\ell,jk}(s)&:=X_{\\ell,jk}(s)\\,Y_{\\ell,jk}\\Bigl(\\frac{-s^{-1}}{c_{\\ell j}}\\Bigr)\\,X_{\\ell,jk}(s),\\qquad \\wt_{\\ell,jk}:=\\wt_{\\ell,jk}(1),\n\\intertext{relations defining a subgroup $\\mathrm{GL}_2(-1)$:}\n\\tag{H:1a} H_1(s)H_1(t)&=H_1(st),\\\\\n\\tag{H:1b} H_2(s)H_2(t)&=H_2(st),\\\\\n\\tag{H:2} H_1(s)H_2(t)&=H_2(t)H_1(s),\\\\\n\\tag{Re:1a} X_{-1}(u)X_{-1}(v)&=X_{-1}(u+v),\\\\\n\\tag{Re:1b} Y_{-1}(u)Y_{-1}(v)&=Y_{-1}(u+v),\\\\\n\\tag{Re:2} Y_{-1}(-t)X_{-1}(s)Y_{-1}(t)&=X_{-1}(-t^{-1})\\,Y_{-1}(-t^2s)\\,X_{-1}(t^{-1}),\\\\\n\\tag{Re:3} \\wt_{-1}(s)\\wt_{-1}&=H_1(-s)H_2(-s^{-1}),\\\\\n\\tag{Re:4a} \\wt_{-1}X_{-1}(u)\\wt_{-1}^{-1}&=Y_{-1}(-u),\\\\\n\\tag{Re:4b} \\wt_{-1}Y_{-1}(u)\\wt_{-1}^{-1}&=X_{-1}(-u),\\\\\n\\tag{Re:5a} \\wt_{-1}H_1(s)\\wt_{-1}^{-1}&=H_2(s),\\\\\n\\tag{Re:5b} \\wt_{-1}H_2(s)\\wt_{-1}^{-1}&=H_1(s),\\\\\n\\tag{Re:6a} H_1(s)X_{-1}(u)H_1(s)^{-1}&=X_{-1}(su),\\\\\n\\tag{Re:6b} H_2(s)X_{-1}(u)H_2(s)^{-1}&=X_{-1}(s^{-1}u),\\\\\n\\tag{Re:6c} H_1(s)Y_{-1}(u)H_1(s)^{-1}&=Y_{-1}(s^{-1}u),\\\\\n\\tag{Re:6d} H_2(s)Y_{-1}(u)H_2(s)^{-1}&=Y_{-1}(su),\n\\intertext{relations defining subgroups $\\mathrm{GL}_2(\\ell,j,k)$:}\n\\tag{Im:1a} X_{\\ell,jk}(u)X_{\\ell,jk}(v)&=X_{\\ell,jk}(u+v),\\\\\n\\tag{Im:1b} Y_{\\ell,jk}(u)Y_{\\ell,jk}(v)&=Y_{\\ell,jk}(u+v),\\\\\n\\tag{Im:2} Y_{\\ell,jk}(-t)X_{\\ell,jk}(s)Y_{\\ell,jk}(t)&=X_{\\ell,jk}\\Bigl(\\frac{-t^{-1}}{c_{\\ell j}}\\Bigr)\\,Y_{\\ell,jk}(-c_{\\ell j}t^2s)\\,X_{\\ell,jk}\\Bigl(\\frac{t^{-1}}{c_{\\ell j}}\\Bigr),\\\\\n\\tag{Im:3} \\wt_{\\ell,jk}\\bigl(s^{(\\ell+1)(j-\\ell)}\\bigr)\\wt_{\\ell,jk}&=H_1\\bigl((-s)^{j-\\ell}\\bigr)H_2\\bigl((-s)^{\\ell+1}\\bigr),\\\\\n\\tag{Im:4a} \\wt_{\\ell,jk}X_{\\ell,jk}(u)\\wt_{\\ell,jk}^{-1}&=Y_{\\ell,jk}\\Bigl(\\frac{-u}{c_{\\ell j}}\\Bigr),\\\\\n\\tag{Im:4b} \\wt_{\\ell,jk}Y_{\\ell,jk}(u)\\wt_{\\ell,jk}^{-1}&=X_{\\ell,jk}(-c_{\\ell j}u),\\\\\n\\tag{Im:5a} \\wt_{\\ell,jk}H_1(s^{j-\\ell})\\wt_{\\ell,jk}^{-1}&=H_2(s^{-(\\ell+1)}),\\\\\n\\tag{Im:5b} \\wt_{\\ell,jk}H_2(s^{\\ell+1})\\wt_{\\ell,jk}^{-1}&=H_1(s^{-(j-\\ell)}),\\\\\n\\tag{Im:6a} H_1(s)X_{\\ell,jk}(u)H_1(s)^{-1}&=X_{\\ell,jk}(s^{\\ell+1}u),\\\\\n\\tag{Im:6b} H_2(s)X_{\\ell,jk}(u)H_2(s)^{-1}&=X_{\\ell,jk}(s^{j-\\ell}u),\\\\\n\\tag{Im:6c} H_1(s)Y_{\\ell,jk}(u)H_1(s)^{-1}&=Y_{\\ell,jk}(s^{-(\\ell+1)}u),\\\\\n\\tag{Im:6d} H_2(s)Y_{\\ell,jk}(u)H_2(s)^{-1}&=Y_{\\ell,jk}(s^{-(j-\\ell)}u),\n\\intertext{relations between the unipotent generators:}\n\\tag{U:1a} (X_{-1}(u),X_{j-1,jk}(v))&=1,\\\\\n\\tag{U:1b} (Y_{-1}(u),Y_{j-1,jk}(v))&=1,\\\\\n\\tag{U:1c} (Y_{-1}(u),X_{0,jk}(v))&=1,\\\\\n\\tag{U:1d} (X_{-1}(u),Y_{0,jk}(v))&=1,\\\\\n\\tag{U:2} (X_{\\ell,jk}(u),Y_{m,pq}(v))&=1\\qquad\\text{if } j\\ne p \\text{ or } k\\ne q \\text{ or } |\\ell-m|>1,\\\\\n\\tag{U:3a} (X_{1,2k}(u),Y_{0,2k}(v))&=X_{-1}(uv),\\\\\n\\tag{U:3b} (X_{0,2k}(u),Y_{1,2k}(v))&=Y_{-1}(uv),\n\\intertext{action of $\\wt_{-1}$ on the unipotent generators:}\n\\tag{U:4a} \\wt_{-1}X_{\\ell,jk}(u)\\wt_{-1}^{-1}&=X_{j-1-\\ell,jk}\\bigl((-1)^{j-\\ell-1}u\\bigr),\\\\\n\\tag{U:4b} \\wt_{-1}Y_{\\ell,jk}(u)\\wt_{-1}^{-1}&=Y_{j-1-\\ell,jk}\\bigl((-1)^{j-\\ell-1}u\\bigr).\n\\end{align*}\n}\n\nThe group $\\Gm$ is the group with this presentation:\n\\[\n\\Gm=\\langle \\cX\\mid\\cR\\rangle=F(\\cX)/N_{\\cR},\n\\]\nwhere $N_\\cR$ is the normal closure of $\\cR$.\n\n\\begin{theorem}[Lemma 3.1 of the source]\\label{thm:source}\nIn $\\Gm$ we have\n\\begin{enumerate}\n\\item[(a)] $X_{-1}(0)=1$,\n\\item[(b)] $Y_{-1}(0)=1$,\n\\item[(c)] $X_{\\ell,jk}(0)=1$ for all $(\\ell,j,k)\\in E$,\n\\item[(d)] $Y_{\\ell,jk}(0)=1$ for all $(\\ell,j,k)\\in E$.\n\\end{enumerate}\n\\end{theorem}\n\nThe source states this lemma without proof. The following sketch is ours, and the formal proof follows it. By (Re:1a), $X_{-1}(u)X_{-1}(v)=X_{-1}(u+v)$ in $\\Gm$. Setting $u=v=0$ gives $X_{-1}(0)X_{-1}(0)=X_{-1}(0)$, hence $X_{-1}(0)=1$. Parts (b), (c) and (d) follow in the same way from (Re:1b), (Im:1a) and (Im:1b).\n\n\\section{Formalization}\n\nThroughout, $c:\\NN\\to\\NN$ is an arbitrary function. It plays the role of the coefficient function $j\\mapsto c(j)$ for $j\\ge 0$. The value $c(-1)$ never enters the definition of $E$ or of the presentation, so it has no counterpart.\n\n\\begin{definition}[Index set]\n$E_c$ is the set of triples $(\\ell,j,k)\\in\\NN^3$ with $1\\le k\\le c(j)$ and $\\ell<j$.\n\\end{definition}\n\\LeanDecl{IdxE}\n\nThis is exactly the source's $E$ once $c$ is the coefficient function of $J$. Since $\\ell<j$, every $(\\ell,j,k)\\in E_c$ has $j\\ge 1$.\n\n\\begin{definition}[Generators]\n$\\cX_c$ is the disjoint union of six families of symbols:\n\\begin{itemize}\n\\item $H_1(s)$ and $H_2(s)$ for $s\\in\\CC^\\times$;\n\\item $X_{-1}(u)$ and $Y_{-1}(u)$ for $u\\in\\CC$;\n\\item $X_e(u)$ and $Y_e(u)$ for $e=(\\ell,j,k)\\in E_c$ and $u\\in\\CC$.\n\\end{itemize}\nWe write $X_{\\ell,jk}(u)$ for $X_e(u)$, and similarly for $Y$.\n\\end{definition}\n\\LeanDecl{Gen}\n\n\\begin{definition}[The constants $c_{\\ell j}$]\nFor $\\ell,j\\in\\NN$,\n\\[\nc_{\\ell j}:=(-1)^{\\ell+1}\\binom{j\\mathbin{\\dot-}1}{\\ell}(\\ell+1)(j\\mathbin{\\dot-}\\ell)\\in\\CC,\n\\]\nwhere $\\dot-$ is truncated subtraction on $\\NN$.\n\\end{definition}\n\\LeanDecl{cc}\n\nFor $(\\ell,j,k)\\in E_c$ we have $\\ell<j$, so both truncated subtractions are ordinary subtractions and $c_{\\ell j}$ is the source's constant. Moreover $c_{\\ell j}\\neq 0$ on $E_c$, because $\\ell\\le j-1$ gives $\\binom{j-1}{\\ell}\\ge 1$, and also $\\ell+1\\ge 1$ and $j-\\ell\\ge 1$. The Lean convention $x/0=0$ is therefore never triggered in the relations below.\n\n\\begin{definition}[Flip of an index]\nFor $e=(\\ell,j,k)\\in E_c$, set $\\bar e:=(j\\mathbin{\\dot-}1\\mathbin{\\dot-}\\ell,\\,j,\\,k)$. This lies in $E_c$, and since $\\ell<j$ its first entry is the genuine difference $j-1-\\ell$.\n\\end{definition}\n\\LeanDecl{flipE}\n\nThe following six maps send each generator symbol to the corresponding generator of the free group $F(\\cX_c)$:\n\\[\ns\\mapsto H_1(s),\\quad s\\mapsto H_2(s),\\quad u\\mapsto X_{-1}(u),\\quad u\\mapsto Y_{-1}(u),\\quad u\\mapsto X_e(u),\\quad u\\mapsto Y_e(u).\n\\]\n\\LeanDecl{h1}\n\\LeanDecl{h2}\n\\LeanDecl{xm}\n\\LeanDecl{ym}\n\\LeanDecl{xx}\n\\LeanDecl{yy}\n\nThe auxiliary elements of (Re:0) are the following words in $F(\\cX_c)$. For $s\\in\\CC^\\times$,\n\\[\n\\wt_{-1}(s):=X_{-1}(s)\\,Y_{-1}(-s^{-1})\\,X_{-1}(s),\n\\]\nand $\\wt_{-1}:=\\wt_{-1}(1)$.\n\\LeanDecl{wm}\n\\LeanDecl{wm1}\n\nThe auxiliary elements of (Im:0) are, for $e=(\\ell,j,k)\\in E_c$ and $s\\in\\CC^\\times$,\n\\[\n\\wt_e(s):=X_e(s)\\,Y_e\\bigl(-s^{-1}/c_{\\ell j}\\bigr)\\,X_e(s),\n\\]\nand $\\wt_e:=\\wt_e(1)$.\n\\LeanDecl{ww}\n\\LeanDecl{ww1}\n\nThree word operations in $F(\\cX_c)$ are used to write the relators:\n\\begin{itemize}\n\\item the commutator $(a,b)=aba^{-1}b^{-1}$;\n\\item the relator $ab^{-1}$ encoding an equation $a=b$;\n\\item the conjugate $aba^{-1}$.\n\\end{itemize}\n\\LeanDecl{comm'}\n\\LeanDecl{eqr}\n\\LeanDecl{conj'}\n\n\\begin{definition}[Relators]\n$\\cR_c\\subseteq F(\\cX_c)$ consists of the following elements.\n\\begin{itemize}\n\\item For every relation $a=b$ among (H:1a)--(Im:6d), (U:3a)--(U:4b), the relator $ab^{-1}$.\n\\item For every commutator relation (U:1a)--(U:2), the commutator itself.\n\\end{itemize}\nEach relator is taken for all parameters $s,t\\in\\CC^\\times$, $u,v\\in\\CC$ and all indices in $E_c$ allowed by the side conditions.\n\\end{definition}\n\nThe left- and right-hand sides are literally those of the source, with the following points of detail.\n\\begin{itemize}\n\\item In (Im:3) the argument of $\\wt_e$ is the unit $s^{(\\ell+1)(j-\\ell)}$.\n\\item In (Im:5a), (Im:5b), (Im:6c) and (Im:6d), the negative powers $s^{-n}$ are written as $(s^n)^{-1}$.\n\\item All exponents $j-\\ell$, $j-\\ell-1$ and $j-1-\\ell$ are truncated differences of natural numbers. These equal the true differences because $\\ell<j$.\n\\item (U:1a) and (U:1b) are imposed for all $e=(\\ell,j,k)\\in E_c$ with $\\ell+1=j$, that is, for $e=(j-1,j,k)$. (U:1c) and (U:1d) are imposed for $e$ with $\\ell=0$.\n\\item (U:2) is imposed for $e=(\\ell,j,k)$ and $f=(m,p,q)$ in $E_c$ with $j\\neq p$, or $k\\neq q$, or $|\\ell-m|>1$, the absolute value taken in $\\ZZ$.\n\\item (U:3a) is imposed for $e=(1,2,k)$ and $f=(0,2,k)$ in $E_c$ with the same $k$. (U:3b) is imposed for $e=(0,2,k)$ and $f=(1,2,k)$.\n\\item (U:4a) and (U:4b) use the flipped index $\\bar e$ and the sign $(-1)^{j-\\ell-1}$.\n\\end{itemize}\n\\LeanDecl{GRel}\n\n\\begin{definition}[The group]\n$G_c:=F(\\cX_c)/N_{\\cR_c}$, the group presented by $\\cX_c$ and $\\cR_c$. Let $\\pi:F(\\cX_c)\\to G_c$ be the canonical surjective homomorphism.\n\\end{definition}\n\\LeanDecl{Gm}\n\nThe source gives the relations as equations $a=b$ in $F(\\cX)$. The formalization encodes each such equation as the relator $ab^{-1}$. Imposing $ab^{-1}=1$ in the quotient is the same as imposing $a=b$, and any other encoding such as $b^{-1}a$ is conjugate to $ab^{-1}$ and so has the same normal closure. Hence $G_c$ is the source's $\\Gm$ when $c$ is the coefficient function of $J$.\n\nThe target statement is the following.\n\n\\LeanDecl{gsimple_zero_generators_trivial}\n\nIn mathematical terms it reads as follows. For every function $c:\\NN\\to\\NN$, in $G_c$ we have\n\\[\n\\pi(X_{-1}(0))=1,\\qquad \\pi(Y_{-1}(0))=1,\n\\]\nand, for every $e\\in E_c$,\n\\[\n\\pi(X_e(0))=1,\\qquad \\pi(Y_e(0))=1.\n\\]\nThese are parts (a)--(d) of \\cref{thm:source}. The statement is proved for all $c$, so it applies in particular to the coefficients of $J$. No hypothesis on $c$, such as $c(2)\\ge 1$, is needed or assumed.\n\n\\section{Proof}\n\n\\subsection{Overview}\n\nThe sketch following \\cref{thm:source} specializes the relation (Re:1a) at $u=v=0$ and cancels one factor $X_{-1}(0)$. The formal proof organizes this in two steps.\n\\begin{enumerate}\n\\item \\Cref{lem:mk_xm_add,lem:mk_ym_add,lem:mk_xx_add,lem:mk_yy_add} show that the relations (Re:1a), (Re:1b), (Im:1a) and (Im:1b) make each of the maps\n\\[\nu\\mapsto\\pi(X_{-1}(u)),\\quad u\\mapsto\\pi(Y_{-1}(u)),\\quad u\\mapsto\\pi(X_e(u)),\\quad u\\mapsto\\pi(Y_e(u))\n\\]\nturn sums into products, for all $u,v\\in\\CC$.\n\\item \\Cref{lem:add_zero_group_lemma} shows that any map $f$ from $\\CC$ to a group with $f(u+v)=f(u)f(v)$ satisfies $f(0)=1$. Its proof is the cancellation $f(0)=f(0)f(0)\\Rightarrow f(0)=1$ from the sketch.\n\\end{enumerate}\n\nThe differences from the sketch are purely organizational:\n\\begin{itemize}\n\\item the cancellation step is factored out once as an abstract lemma;\n\\item the four parts are proved explicitly rather than \"in the same way\";\n\\item the equations $a=b$ are used in the form of relators $ab^{-1}$.\n\\end{itemize}\nOnly the four additivity relations are used.\n\n\\begin{lemma}[\\leanname{add_zero_group_lemma}]\\label{lem:add_zero_group_lemma}\nLet $G$ be a group and $f:\\CC\\to G$ a map with $f(u+v)=f(u)f(v)$ for all $u,v\\in\\CC$. Then $f(0)=1$.\n\\end{lemma}\n\\LeanDecl{add_zero_group_lemma}\n\\begin{proof}\nTaking $u=v=0$ gives $f(0)=f(0+0)=f(0)f(0)$. Hence\n\\[\nf(0)=f(0)\\bigl(f(0)f(0)^{-1}\\bigr)=\\bigl(f(0)f(0)\\bigr)f(0)^{-1}=f(0)f(0)^{-1}=1.\\qedhere\n\\]\n\\end{proof}\n\n\\begin{lemma}[\\leanname{mk_xm_add}]\\label{lem:mk_xm_add}\nLet $c:\\NN\\to\\NN$ and $u,v\\in\\CC$. In $G_c$,\n\\[\n\\pi(X_{-1}(u+v))=\\pi(X_{-1}(u))\\,\\pi(X_{-1}(v)).\n\\]\n\\end{lemma}\n\\LeanDecl{mk_xm_add}\n\\begin{proof}\nBy (Re:1a) the word $r=X_{-1}(u)X_{-1}(v)X_{-1}(u+v)^{-1}$ lies in $\\cR_c$, so $\\pi(r)=1$. Since $\\pi$ is a homomorphism,\n\\[\n\\pi(X_{-1}(u))\\,\\pi(X_{-1}(v))\\,\\pi(X_{-1}(u+v))^{-1}=1.\n\\]\nFrom $xy^{-1}=1$ we get $x=y$, which gives the claim.\n\\end{proof}\n\n\\begin{lemma}[\\leanname{mk_ym_add}]\\label{lem:mk_ym_add}\nLet $c:\\NN\\to\\NN$ and $u,v\\in\\CC$. In $G_c$,\n\\[\n\\pi(Y_{-1}(u+v))=\\pi(Y_{-1}(u))\\,\\pi(Y_{-1}(v)).\n\\]\n\\end{lemma}\n\\LeanDecl{mk_ym_add}\n\\begin{proof}\nBy (Re:1b) the word $Y_{-1}(u)Y_{-1}(v)\\,Y_{-1}(u+v)^{-1}$ lies in $\\cR_c$, so its image under $\\pi$ is $1$. Hence\n\\[\n\\pi\\bigl(Y_{-1}(u)Y_{-1}(v)\\bigr)\\,\\pi(Y_{-1}(u+v))^{-1}=1.\n\\]\nMultiplying on the right by $\\pi(Y_{-1}(u+v))$ gives $\\pi(Y_{-1}(u)Y_{-1}(v))=\\pi(Y_{-1}(u+v))$. Since $\\pi$ is a homomorphism, the left side equals $\\pi(Y_{-1}(u))\\,\\pi(Y_{-1}(v))$.\n\\end{proof}\n\n\\begin{lemma}[\\leanname{mk_xx_add}]\\label{lem:mk_xx_add}\nLet $c:\\NN\\to\\NN$, $e\\in E_c$ and $u,v\\in\\CC$. In $G_c$,\n\\[\n\\pi(X_e(u+v))=\\pi(X_e(u))\\,\\pi(X_e(v)).\n\\]\n\\end{lemma}\n\\LeanDecl{mk_xx_add}\n\\begin{proof}\nBy (Im:1a) for the index $e$, the element $\\bigl(X_e(u)X_e(v)\\bigr)X_e(u+v)^{-1}$ lies in $\\cR_c$. Two elements $a,b$ of a free group with $ab^{-1}$ a relator have the same image in the presented group, so\n\\[\n\\pi(X_e(u)X_e(v))=\\pi(X_e(u+v)).\n\\]\nSince $\\pi$ is a homomorphism, the left side is $\\pi(X_e(u))\\,\\pi(X_e(v))$.\n   const late = !!win && !kept && job.index > win.index;
  const state = kept ? "win" : late ? "late" : check ? (check.ok ? "ok" : "fail") : "pending";
  const text = sample ? sampleText(sample) : job.error ? "job failed" : "no answer";
  const start = job.elapsed_seconds - (job.seconds || 0);
  const end = Math.min(job.elapsed_seconds, start + (sample?.elapsed_sec ?? job.seconds ?? 0));
  return { sample, check, state, text, start, end, turns: sample?.turns ?? null };
}
const sampleLanes = () => [...Array(Math.max(1, ...calls.filter(isJob).map(jobSamples))).keys()];
// Sessions of one job; jobs may run different numbers of sessions.
const jobLanes = job => [...Array(jobSamples(job)).keys()];
// Captain calls on a lemma the solvers kept failing on, and their decisions.
const handbackLemma = call => (/^handback\/(.+)$/.exec(call.label || "") || [])[1] || null;
const isHandback = step => step?.kind === "model_call" && handbackLemma(step) != null;
const captainCheck = step => step.kind === "lean_check" && (step.worker === "captain" || /_restated$/.test(step.label || ""));

// Who proved a lemma, for the lemma_proved decision `win`.
function winnerText(win) {
  if (win.worker === "captain") return "the captain, after a hand-back";
  const job = jobOf(win);
  return job ? `AIProver job ${jobNumber(job)}, sample ${win.worker}`
    : `solver ${win.worker}, round ${win.round}`;
}
// Why a lemma has a further attempt after `previous`: Lean errors for a chat
// solver; for AIProver a new job, after a replan (a new sketch) or else a
// retry of the same statement (a resumption does not change the attempt).
function transitionText(previous, next) {
  if (!isJob(next)) return solverOutcome(previous).state === "fail" ? "errors" : "";
  const between = decisions.filter(d => d.index > previous.index && d.index < next.index);
  if (between.some(d => d.event === "replan")) return "replan";
  return "retry";
}

// Each model call that produced Lean code is paired with the check of that code.
const checkOfCall = new Map();
const callOfCheck = new Map();
for (const call of calls) {
  let check = null;
  if (call.lemma != null) {
    check = checks.find(k => k.lemma != null && sameAttempt(k, call));
  } else if (/^(formalize|sketch)/.test(call.label || "")) {
    check = checks.find(k => k.index > call.index && k.lemma == null
      && k.stage === call.stage && !callOfCheck.has(k.index));
  }
  if (check) {
    checkOfCall.set(call.index, check);
    callOfCheck.set(check.index, call);
  }
}
const rejections = eventsOf("solver_attempt_rejected");
const lemmaWins = new Map(eventsOf("lemma_proved").map(d => [d.lemma, d]));

// Outcome of one solver call, for colouring the timeline and step lists.
function solverOutcome(call) {
  const win = lemmaWins.get(call.lemma);
  const check = checkOfCall.get(call.index);
  const late = win && call.index > win.index;
  if (win && sameAttempt(win, call)) return { state: "win", late: false, check };
  if (late) return { state: "late", late: true, check };
  if (check) return { state: check.ok ? "ok" : "fail", late: false, check };
  if (rejections.some(r => sameAttempt(r, call))) return { state: "rejected", late: false };
  return { state: "pending", late: false };
}

const lemmaName = statement => (statement.match(/(?:theorem|lemma)\s+([^\s(:{\[]+)/) || [])[1];
const sketches = eventsOf("sketch_accepted");
const finalSketch = sketches[sketches.length - 1];
const lemmaOrder = [];
for (const sketch of sketches) {
  for (const statement of sketch.lemmas || []) {
    const name = lemmaName(statement);
    if (name && !lemmaOrder.includes(name)) lemmaOrder.push(name);
  }
}
for (const call of calls) {
  if (call.lemma != null && !lemmaOrder.includes(call.lemma)) lemmaOrder.push(call.lemma);
}

const roleOf = step => step.kind === "lean_check" ? "lean"
  : step.kind === "decision" ? "decision" : step.role;

// Rendering: Lean, math, prompts ----------------------------------------------

const LEAN_KEYWORDS = new Set(("theorem lemma def inductive structure namespace end open by fun "
  + "exact intro intros have show refine unfold match with if then else let in where calc "
  + "rfl simp rw apply constructor cases induction at import set_option noncomputable "
  + "instance class example abbrev private protected obtain rcases use omega decide "
  + "Type Prop").split(" "));
const LEAN_TOKEN = /(\/-[\s\S]*?-\/)|(--[^\n]*)|("(?:[^"\\\n]|\\.)*")|([A-Za-z_À-ɏ][\w'.À-ɏ]*)|([\s\S])/g;

// Lean source as numbered lines; `errorLines` is a set of 1-based line numbers.
function leanHTML(source, errorLines = new Set(), extraClass = "") {
  const lines = [[]];
  let match;
  LEAN_TOKEN.lastIndex = 0;
  while ((match = LEAN_TOKEN.exec(source))) {
    let cls = "";
    if (match[1] || match[2]) cls = "cm";
    else if (match[3]) cls = "st";
    else if (match[4]) cls = match[4] === "sorry" ? "sorry" : LEAN_KEYWORDS.has(match[4]) ? "kw" : "";
    const pieces = match[0].split("\n");
    pieces.forEach((piece, i) => {
      if (i > 0) lines.push([]);
      if (piece) lines[lines.length - 1].push(cls ? `<span class="${cls}">${escapeHTML(piece)}</span>` : escapeHTML(piece));
    });
  }
  while (lines.length > 1 && lines[lines.length - 1].length === 0) lines.pop();
  const body = lines.map((parts, i) => {
    const n = i + 1;
    return `<span class="line${errorLines.has(n) ? " err" : ""}" data-line="${n}"><span class="no">${n}</span>${parts.join("")}</span>`;
  }).join("");
  return `<pre class="lean ${extraClass}"><code>${body}</code></pre>`;
}

const errorLinesOf = errors => new Set((errors || []).flatMap(e =>
  [...String(e).matchAll(/\.lean:(\d+):\d+:/g)].map(m => Number(m[1]))));

const TEX_MACROS = {
  "\\PV": "\\mathsf{PV}", "\\eps": "\\varepsilon", "\\zo": "\\{0,1\\}",
  "\\TR": "\\mathrm{TR}", "\\ITR": "\\mathrm{ITR}", "\\M": "\\mathcal{M}",
  "\\FP": "\\mathsf{FP}", "\\calF": "\\mathcal{F}",
};
// Display environments come first, so that inline math inside them (e.g. in
// \intertext) is rendered as part of the environment.
const MATH_SPAN = new RegExp([
  String.raw`\\begin\{(equation|align|gather|alignat|multline|eqnarray|prooftree)(\*?)\}([\s\S]+?)\\end\{\1\2\}`,
  String.raw`\$\$([\s\S]+?)\$\$`, String.raw`\\\[([\s\S]+?)\\\]`, String.raw`\$((?:[^$\n]|\n(?![ \t]*\n))+?)\$`,
].join("|"));
// KaTeX lacks these environments; each is rendered as the closest one it has.
const KATEX_ENVIRONMENT = { multline: "gather", eqnarray: "align" };

function texHTML(tex, display) {
  if (!window.katex) return `<code>${escapeHTML(display ? tex : "$" + tex + "$")}</code>`;
  try {
    return katex.renderToString(tex.trim(), {
      displayMode: display, output: "mathml", throwOnError: false,
      macros: { ...TEX_MACROS },
    });
  } catch (error) {
    return `<code>${escapeHTML(tex)}</code>`;
  }
}

// Index just past the group that opens at `text[open]` ("{"), or -1.
function closingBrace(text, open) {
  let depth = 0;
  for (let i = open; i < text.length; i++) {
    if (text[i] === "\\") { i++; continue; }
    if (text[i] === "{") depth++;
    else if (text[i] === "}" && --depth === 0) return i + 1;
  }
  return -1;
}

// A display environment; \intertext{...}, which KaTeX lacks, splits it into
// separate environments with the text between them.
function environmentHTML(name, star, body) {
  if (name === "prooftree") return `<pre class="tex"><code>${escapeHTML(body.trim())}</code></pre>`;
  const environment = (KATEX_ENVIRONMENT[name] || name) + star;
  const render = rows => rows.trim()
    ? texHTML(`\\begin{${environment}}${rows.replace(/\\label\{[^}]*\}/g, "")}\\end{${environment}}`, true)
    : "";
  let out = "", start = 0, at;
  while ((at = body.indexOf("\\intertext{", start)) !== -1) {
    const end = closingBrace(body, at + "\\intertext".length);
    if (end === -1) break;
    out += render(body.slice(start, at).replace(/\\\\\s*$/, ""))
      + `<span class="intertext">${mathHTML(body.slice(at + "\\intertext{".length, end - 1))}</span>`;
    start = end;
  }
  return out + render(body.slice(start));
}

function inlineCode(text) {
  return escapeHTML(text).replace(/`([^`\n]+)`/g, "<code>$1</code>");
}

// Text-mode LaTeX of an informal statement (already HTML-escaped), as HTML:
// emphasis, sectioning, lists, theorem environments and spacing commands.
const THEOREM_ENVIRONMENTS = "theorem|lemma|proposition|corollary|definition|remark|example|claim|conjecture";
function textModeHTML(html) {
  const replaceGroups = (text, command, wrap) => {
    let out = "", start = 0, at;
    while ((at = text.indexOf(command + "{", start)) !== -1) {
      const end = closingBrace(text, at + command.length);
      if (end === -1) break;
      out += text.slice(start, at) + wrap(textModeHTML(text.slice(at + command.length + 1, end - 1)));
      start = end;
    }
    return out + text.slice(start);
  };
  for (const [command, wrap] of [
    ["\\textbf", s => `<strong>${s}</strong>`], ["\\emph", s => `<em>${s}</em>`],
    ["\\textit", s => `<em>${s}</em>`], ["\\texttt", s => `<code>${s}</code>`],
    ["\\paragraph", s => `<strong>${s}</strong>`], ["\\subparagraph", s => `<strong>${s}</strong>`],
    ["\\marginnote", s => ` (${s})`],
  ]) html = replaceGroups(html, command, wrap);
  return html
    .replace(/\\label\{[^{}]*\}\s*/g, "")
    .replace(/\\(eq)?ref\{([^{}]*)\}/g, (_, eq, label) => eq ? `(${label})` : label)
    .replace(/\\textcolor\{[^{}]*\}\{([^{}]*)\}/g, "$1")
    .replace(/\{\\(it|em|sl)\s+([^{}]*)\}/g, "<em>$2</em>")
    .replace(/\{\\bf\s+([^{}]*)\}/g, "<strong>$1</strong>")
    .replace(/\\(begingroup|endgroup|allowdisplaybreaks|noindent|medskip|smallskip|bigskip|newline)\b\s*/g, "")
    .replace(/\s*\\begin\{(itemize|compactitem|enumerate|compactenum)\}\s*/g, "<ul>")
    .replace(/\s*\\end\{(itemize|compactitem|enumerate|compactenum)\}\s*/g, "</ul>")
    .replace(/\s*\\item\s*/g, "<li>")
    .replace(new RegExp(String.raw`\\begin\{(${THEOREM_ENVIRONMENTS})\}(?:\[([^\]]*)\])?\s*`, "g"),
             (_, name, note) => `<strong>${name[0].toUpperCase() + name.slice(1)}${note ? ` (${note})` : ""}.</strong> `)
    .replace(new RegExp(String.raw`\s*\\end\{(${THEOREM_ENVIRONMENTS})\}`, "g"), "")
    .replace(/\\begin\{proof\}\s*/g, "<em>Proof.</em> ")
    .replace(/\s*\\end\{proof\}/g, " ∎")
    .replace(/\\\\(\[[^\]]*\])?[ \t]*(\n?)/g, (_, skip, newline) => newline || "\n")
    .replace(/(\S)~(?=\S)/g, "$1&nbsp;");
}

// Prose containing LaTeX math (inline, display and align-like environments),
// text-mode LaTeX and `code`. Math and code are set aside while the text-mode
// commands, which may span them, are converted.
function mathHTML(text) {
  const pieces = [];
  const keep = html => `\u0000${pieces.push(html) - 1}\u0000`;
  // A fresh pattern per call: \intertext renders its text with a nested call.
  const span = new RegExp(MATH_SPAN.source, "g");
  let prose = "", last = 0, match;
  while ((match = span.exec(text))) {
    prose += text.slice(last, match.index);
    prose += keep(match[1] ? environmentHTML(match[1], match[2], match[3])
                           : texHTML(match[4] ?? match[5] ?? match[6], match[6] === undefined));
    last = span.lastIndex;
  }
  prose += text.slice(last);
  const html = escapeHTML(prose.replace(/`([^`\n]+)`/g, (_, code) => keep(`<code>${escapeHTML(code)}</code>`)));
  return textModeHTML(html).replace(/\u0000(\d+)\u0000/g, (_, index) => pieces[index]);
}

// Minimal Markdown for the playbook-derived system prompts.
function markdownHTML(text) {
  const blocks = [];
  let list = null, para = [];
  const inline = s => inlineCode(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<em>$2</em>");
  const flushPara = () => { if (para.length) blocks.push(`<p>${inline(para.join(" "))}</p>`); para = []; };
  const flushList = () => { if (list) blocks.push(`<ul>${list.map(li => `<li>${inline(li)}</li>`).join("")}</ul>`); list = null; };
  for (const line of text.split("\n")) {
    const heading = line.match(/^(#{1,4})\s+(.*)/);
    const item = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (heading) { flushPara(); flushList(); blocks.push(`<h4>${inline(heading[2])}</h4>`); }
    else if (item) { flushPara(); (list ||= []).push(item[1]); }
    else if (!line.trim()) { flushPara(); flushList(); }
    else if (list) { list[list.length - 1] += " " + line.trim(); }
    else para.push(line.trim());
  }
  flushPara(); flushList();
  return `<div class="md">${blocks.join("")}</div>`;
}

const LEAN_TAGS = new Set(["definitions", "preamble", "statement", "lemmas", "main_proof",
  "proof", "helpers", "available_lemmas", "target_lemma", "previous_helpers",
  "previous_proof", "solution", "lean_code", "formal_statement", "previous_definitions",
  "previous_statement", "previous_lemmas", "previous_main_proof"]);
const PLAIN_TAGS = new Set(["lean_errors", "errors", "problems"]);

// A prompt or reply split into free text and <tag>...</tag> blocks.
function taggedHTML(text) {
  const parts = [];
  const pattern = /<([a-z_]+)>([\s\S]*?)<\/\1>/g;
  let last = 0, match;
  while ((match = pattern.exec(text))) {
    if (text.slice(last, match.index).trim()) parts.push({ prose: text.slice(last, match.index).trim() });
    parts.push({ tag: match[1], body: match[2].replace(/^\n+/, "").replace(/\s+$/, "") });
    last = pattern.lastIndex;
  }
  if (text.slice(last).trim()) parts.push({ prose: text.slice(last).trim() });
  return parts.map(part => {
    if (part.prose) return `<div class="prose">${mathHTML(part.prose)}</div>`;
    let body;
    if (!part.body) body = `<div class="muted">(empty)</div>`;
    else if (LEAN_TAGS.has(part.tag)) body = leanHTML(part.body);
    else if (PLAIN_TAGS.has(part.tag)) body = `<pre class="plain errors">${escapeHTML(part.body)}</pre>`;
    else body = `<div class="prose">${mathHTML(part.body)}</div>`;
    return `<div class="tagblock"><span class="tagname">&lt;${part.tag}&gt;</span>${body}</div>`;
  }).join("");
}

function templateHTML(text) {
  return `<pre class="plain">${escapeHTML(text).replace(/\{([a-z_]+)\}/g, '<span class="placeholder">{$1}</span>')}</pre>`;
}

// Step summaries ----------------------------------------------------------------

const EVENT_TEXT = {
  formalization_compiled: "Formalization compiles",
  formalization_rejected: "Formalization rejected",
  audit_verdict: "Audit verdict",
  sketch_accepted: "Sketch accepted",
  sketch_rejected: "Sketch rejected",
  lemma_proved: "Lemma proved",
  solver_attempt_rejected: "Attempt rejected before Lean",
  solver_budget_exhausted: "Solver chain exhausted its budget",
  replan: "Sketch revision requested",
  lemma_reused: "Proved lemma reused",
  lemma_handback: "Lemma handed back to the captain",
  final_verification: "Final verification",
  final_review: "Independent review",
  report: "LaTeX report",
};

function stepTitle(step) {
  if (step.kind === "model_call") {
    if (isJob(step)) return `AIProver job ${jobNumber(step)} · ${step.lemma}`;
    if (step.lemma != null) return `solver ${step.worker} · ${step.lemma} · round ${step.round}`;
    return `${step.role} · ${step.label}`;
  }
  if (step.kind === "lean_check") return `Lean check · ${step.file}`;
  return EVENT_TEXT[step.event] || step.event;
}

function stepResult(step) {
  if (step.kind === "model_call") {
    if (step.error) return `<span class="pill fail">error</span>`;
    if (step.lemma != null) {
      const { state } = solverOutcome(step);
      const label = state === "pending" && isJob(step) ? jobSummary(step)
        : { win: "proof kept", ok: "compiles", fail: "Lean errors",
            late: "after lemma proved", rejected: "rejected", pending: "no proof returned" }[state];
      const tone = { win: "ok", ok: "ok", fail: "fail", late: "neutral", rejected: "warn", pending: "neutral" }[state];
      return `<span class="pill ${tone}">${label}</span>`;
    }
    return `<span class="muted mono">${formatDuration(step.seconds || 0)}</span>`;
  }
  if (step.kind === "lean_check") {
    if (!step.ok) return `<span class="pill fail">${plural((step.errors || []).length, "error")}</span>`;
    return step.sorry_warning
      ? `<span class="pill warn">compiles · sorry</span>`
      : `<span class="pill ok">compiles</span>`;
  }
  if (step.event === "audit_verdict") {
    return `<span class="pill ${step.verdict === "FAITHFUL" ? "ok" : "fail"}">${escapeHTML(step.verdict)}</span>`;
  }
  if (step.event === "final_verification") {
    return `<span class="pill ${step.checks?.verified ? "ok" : "fail"}">${step.checks?.verified ? "verified" : "not verified"}</span>`;
  }
  if (step.event === "lemma_proved") return `<span class="pill ok">${escapeHTML(step.lemma)}</span>`;
  if (step.event === "final_review") {
    return `<span class="pill ${step.verdict === "FAITHFUL" ? "ok" : "fail"}">${escapeHTML(step.verdict)}</span>`;
  }
  if (step.event === "report") return `<span class="pill ${step.pdf ? "ok" : "fail"}">${step.pdf ? "PDF" : "no PDF"}</span>`;
  return "";
}

function stepRow(step) {
  const role = roleOf(step);
  return `<button class="steprow" type="button" data-step="${step.index}">
    <span class="idx">#${step.index}</span>
    <span class="t">${formatClock(step.elapsed_seconds)}</span>
    <span class="dot ${role}" title="${role}"></span>
    <span class="what"><span class="lbl">${escapeHTML(stepTitle(step))}</span></span>
    <span>${stepResult(step)}</span>
  </button>`;
}
const stepList = list => list.length
  ? `<div class="steps">${list.map(stepRow).join("")}</div>`
  : `<p class="muted">No steps of this kind in this run.</p>`;
const stepLink = step => step ? `<button class="steplink" type="button" data-step="${step.index}">#${step.index}</button>` : "";

const cfg = TRACE.config || {};
const outcome = TRACE.outcome || {};
const problem = TRACE.problem || {};
const totalCost = sum(calls.map(c => c.cost_usd));
const callsByRole = role => calls.filter(c => c.role === role);

// The proposition itself, without the shared setting paragraph.
function propositionText() {
  const paragraphs = (problem.informal_statement || "").split(/\n\s*\n/);
  return (paragraphs.length > 1 ? paragraphs.slice(1) : paragraphs).join("\n\n");
}

function lemmaUses(text, self) {
  return lemmaOrder.filter(name => name !== self && new RegExp(`(^|[^\\w'.])${name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![\\w'])`).test(text || ""));
}

// Step drawer --------------------------------------------------------------------------

let openStep = null;
let drawerOpen = false;
let drawerTab = "response";

// Tabs of the step drawer: `panels` is a list of [id, name, html]. The tab
// last chosen stays selected when the next drawer has it.
function tabsHTML(panels) {
  const active = panels.some(([id]) => id === drawerTab) ? drawerTab : panels[0][0];
  return `<div class="tabs" role="tablist">${panels.map(([id, name]) =>
      `<button type="button" role="tab" data-tab="${id}" aria-selected="${active === id}">${name}</button>`).join("")}</div>
    ${panels.map(([id, , html]) => `<div data-panel="${id}" ${active === id ? "" : "hidden"}>${html}</div>`).join("")}`;
}

// Lean output, one message per `file:line:col: severity:` header.
function diagnosticsHTML(text) {
  if (!text) return `<p class="muted">No diagnostics: Lean reported nothing for this file.</p>`;
  const html = escapeHTML(text).replace(/^(\S+\.lean:\d+:\d+: )(error|warning)(:.*)$/gm,
    (_, where, severity, rest) => `${where}<span class="${severity}">${severity}${rest}</span>`);
  return `<pre class="diag">${html}</pre>`;
}
const diagnosticErrorLines = text => new Set([...String(text || "").matchAll(/\.lean:(\d+):\d+: error/g)]
  .map(m => Number(m[1])));
const flagPill = (value, yes, no) => value == null ? ""
  : `<span class="pill ${value ? "ok" : "fail"}">${value ? yes : no}</span>`;

// The harness's Lean check of a sample's whole final file.
function harnessCheckHTML(check) {
  if (!check || !Object.keys(check).length) {
    return `<p class="muted">The harness's check of this sample is not recorded.</p>`;
  }
  return `
    <div class="checkline"><span class="k">AIProver harness · Lean check of the final file</span>
      ${check.verdict ? `<span class="pill ${check.verdict === "PASS" ? "ok" : "fail"}">${escapeHTML(check.verdict)}</span>` : ""}
      ${flagPill(check.compiles, "compiles", "does not compile")}
      ${flagPill(check.complete, "no sorry", "contains sorry")}
      ${check.axioms_used ? `<span class="pill neutral">axioms: ${escapeHTML(check.axioms_used.join(", ") || "none")}</span>` : ""}</div>
    ${(check.problems || []).length ? `<ul class="problems">${check.problems.map(p => `<li>${escapeHTML(p)}</li>`).join("")}</ul>` : ""}
    ${diagnosticsHTML(check.diagnostics)}`;
}

// The pipeline's Lean check of the lemma proof extracted from a sample.
function extractedCheckHTML(outcome) {
  const { check, state } = outcome;
  if (!check) {
    return `<div class="checkline"><span class="k">Pipeline · Lean check of the extracted lemma proof</span>
      <span class="pill neutral">not run</span></div>
      <p class="muted">${state === "late" ? "The lemma was already proved when this sample finished."
        : "The final file holds no sorry-free proof of the lemma, so nothing was extracted to check."}</p>`;
  }
  const errors = check.errors || [];
  return `
    <div class="checkline"><span class="k">Pipeline · Lean check of the extracted lemma proof</span>
      <span class="pill ${check.ok ? "ok" : "fail"}">${check.ok ? (check.sorry_warning ? "compiles · sorry" : "compiles") : plural(errors.length, "error")}</span>
      ${state === "win" ? `<span class="pill ok">proof kept</span>` : ""} ${stepLink(check)}</div>
    ${errors.length ? diagnosticsHTML(errors.join("\n")) : ""}`;
}

// A Lean check of a chat model's code (captain or chat solver).
function chatCheckHTML(check) {
  if (!check) return `<p class="muted">Lean did not check this reply.</p>`;
  const errors = check.errors || [];
  return `<div class="checkline"><span class="k">Lean check ${stepLink(check)}</span>${stepResult(check)}</div>
    ${errors.length ? diagnosticsHTML(errors.join("\n")) : `<p class="muted">No errors.</p>`}
    <div class="tagblock"><span class="tagname">${escapeHTML(check.file || "")}</span>${leanHTML(check.source || "", errorLinesOf(errors), "tall")}</div>`;
}

// The model's reasoning before assistant turn `turn`, from the logging proxy.
const reasoningOfTurn = (sample, turn) => (sample.reasoning || []).filter(r => r.turn === turn);

function reasoningBlock(text, open = false) {
  return `<details class="fold reasoning" ${open ? "open" : ""}><summary><b>Reasoning</b>
    <span class="muted">${plural(text.split(/\s+/).filter(Boolean).length, "word")}</span></summary>
    <div class="body"><pre class="plain wrap">${escapeHTML(text)}</pre></div></details>`;
}

// One tool call: Lean written to a file is shown as Lean, other arguments as JSON.
function toolCallHTML(call) {
  let args = call.arguments || "";
  let lean = "";
  try {
    const parsed = JSON.parse(args);
    if (typeof parsed.content === "string" && /\.lean$/.test(parsed.file_path || parsed.path || "")) {
      lean = parsed.content;
      delete parsed.content;
    }
    args = JSON.stringify(parsed, null, 1);
  } catch { /* arguments cut at the trace limit stay as text */ }
  return `<div class="toolcall"><span class="pill neutral mono">${escapeHTML(call.name || "tool")}</span>
    <pre class="plain wrap">${escapeHTML(args)}</pre>${lean ? leanHTML(lean, new Set(), "tall") : ""}</div>`;
}

// The agent's session: its messages, tool calls, tool results and, where the
// proxy recorded it, its reasoning before each turn.
function sessionHTML(sample) {
  const session = sample.session || [];
  if (!session.length) return `<p class="muted">The session transcript is not recorded for this sample.</p>`;
  let turn = 0;
  return `<div class="session">${session.map(entry => {
    if (entry.role === "tool") {
      return `<details class="fold toolresult"><summary><span class="mono muted">result of ${escapeHTML(entry.name || "tool")}</span>
        <span class="muted">${plural(entry.text.split("\n").length, "line")}</span></summary>
        <div class="body">${/\.lean:\d+:\d+:/.test(entry.text) ? diagnosticsHTML(entry.text) : `<pre class="plain wrap">${escapeHTML(entry.text)}</pre>`}</div></details>`;
    }
    if (entry.role === "assistant") {
      turn += 1;
      const thoughts = reasoningOfTurn(sample, turn).map(r => reasoningBlock(r.reasoning || "")).join("");
      return `<div class="turn"><div class="turnhead"><span class="mono">turn ${turn}</span></div>${thoughts}
        ${entry.text ? `<div class="prose">${mathHTML(entry.text)}</div>` : ""}
        ${(entry.tool_calls || []).map(toolCallHTML).join("")}</div>`;
    }
    return `<details class="fold"><summary><b>${entry.injected ? "Harness message" : turn ? "User message" : "Task"}</b>
      <span class="muted">${plural(entry.text.split("\n").length, "line")}</span></summary>
      <div class="body"><pre class="plain wrap">${escapeHTML(entry.text)}</pre></div></details>`;
  }).join("")}</div>`;
}

function reasoningHTML(sample) {
  const records = sample.reasoning || [];
  if (!records.length) {
    return `<p class="muted">The model's reasoning is not recorded for this sample. The AIProver harness
      discards it; runs started after the reasoning proxy was installed record it per turn.</p>`;
  }
  return records.map(r => `<div class="turn"><div class="turnhead"><span class="mono">turn ${r.turn}</span>
    <span class="muted">${escapeHTML(r.time || "")}</span>${r.truncated ? ` <span class="pill fail">stopped at the reply token cap</span>` : ""}</div>${reasoningBlock(r.reasoning || "", true)}</div>`).join("");
}

// Drawer panels of an AIProver job, for one sample (a solver lane) or all.
function jobPanels(job, sampleIndex) {
  const lanes = sampleIndex == null ? jobLanes(job) : [sampleIndex];
  const per = render => lanes.map(k => {
    const outcome = sampleOutcome(job, k);
    const head = lanes.length > 1 ? `<h4 class="lanehead">solver ${k}</h4>` : "";
    return head + render(outcome.sample || {}, outcome, k);
  }).join("");
  return [
    ["response", "Reply", per(sample => sample.lean
      ? leanHTML(sample.lean, diagnosticErrorLines(sample.check?.diagnostics), "tall")
      : `<p class="muted">The final Lean file is not recorded.</p>`)],
    ["prompt", "Prompt", taggedHTML(job.prompt || "")],
    ["system", "System prompt", job.system_prompt
      ? markdownHTML(TRACE.system_prompts?.[job.system_prompt] || job.system_prompt)
      : `<p class="muted">AIProver composes its own system prompt inside the harness; the task above is
         what the pipeline sends.</p>`],
    ["lean", "Lean returns", per((sample, outcome) => harnessCheckHTML(sample.check) + extractedCheckHTML(outcome))],
    ["session", "Session", per(sample => sessionHTML(sample))],
    ["reasoning", "Reasoning", per(sample => reasoningHTML(sample))],
  ];
}

function stepDetail(step, sampleIndex = null) {
  const meta = [`<span>at <b>${formatClock(step.elapsed_seconds)}</b></span>`, `<span>stage <b>${escapeHTML(step.stage)}</b></span>`];
  let body = "";
  if (isJob(step)) {
    const job = step;
    meta.push(`<span>AIProver job <b>${jobNumber(job)}</b> on <b>${escapeHTML(job.lemma)}</b></span>`);
    if (sampleIndex != null) {
      const o = sampleOutcome(job, sampleIndex);
      meta.push(`<span>solver <b>${sampleIndex}</b></span>`,
        `<span>duration <b>${formatDuration(o.end - o.start)}</b></span>`,
        o.turns != null ? `<span>turns <b>${o.turns}</b></span>` : "",
        o.sample?.ending ? `<span>ended <b>${escapeHTML(o.sample.ending)}</b></span>` : "",
        `<span>result <b>${escapeHTML({ win: "proof kept", ok: "compiles", fail: "Lean errors" }[o.state] || o.text)}</b></span>`);
    } else {
      meta.push(`<span>duration <b>${formatDuration(job.seconds || 0)}</b></span>`, `<span>samples <b>${jobSummary(job)}</b></span>`);
    }
    const previous = (jobsByLemma.get(job.lemma) || [])[jobNumber(job) - 2];
    const note = `<p class="note">${previous ? `Started after a ${escapeHTML(transitionText(previous, job))} (previous job ${stepLink(previous)}).`
      : "First AIProver job on this lemma."} Each job runs ${plural(jobSamples(job), "independent session")}.</p>`;
    body = note + tabsHTML(jobPanels(job, sampleIndex));
  } else if (step.kind === "model_call") {
    meta.push(`<span>model <b>${escapeHTML(step.model)}</b></span>`,
      `<span>duration <b>${formatDuration(step.seconds || 0)}</b></span>`,
      `<span>output tokens <b>${(step.usage?.outputTokens ?? 0).toLocaleString()}</b></span>`,
      `<span>cost <b>${formatUSD(step.cost_usd)}</b></span>`);
    const check = checkOfCall.get(step.index);
    const note = step.role === "auditor"
      ? `<p class="note">The auditor's message contains only Lean code. Its system prompt is the auditor playbook.</p>` : "";
    const linked = check ? `<p class="note">The code in this reply was compiled in ${stepLink(check)}: ${stepResult(check)}</p>` : "";
    const panels = [
      ["response", "Reply", step.error ? `<pre class="plain errors">${escapeHTML(step.error)}</pre>` : taggedHTML(step.response || "")],
      ["prompt", "Prompt", taggedHTML(step.prompt || "")],
      ["system", "System prompt", markdownHTML(TRACE.system_prompts?.[step.system_prompt] || step.system_prompt || "")],
    ];
    if (check) panels.push(["lean", "Lean returns", chatCheckHTML(check)]);
    body = `${note}${linked}${tabsHTML(panels)}`;
  } else if (step.kind === "lean_check") {
    meta.push(`<span>duration <b>${formatDuration(step.seconds || 0)}</b></span>`);
    const call = callOfCheck.get(step.index);
    const axioms = Object.entries(step.axioms || {});
    body = `
      ${call ? `<p class="note">Compiles the code from ${stepLink(call)} (${escapeHTML(stepTitle(call))}).</p>` : ""}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${stepResult(step)}
        ${step.sorry_warning ? `<span class="muted">The file still contains <code>sorry</code>${step.lemma != null ? " (earlier lemmas are included unproved)" : ""}.</span>` : ""}</div>
      ${(step.errors || []).length ? `<div class="tagblock"><span class="tagname">compiler errors</span><pre class="plain errors">${escapeHTML(step.errors.join("\n\n"))}</pre></div>` : ""}
      ${axioms.length ? `<p>Axioms: ${axioms.map(([name, list]) => `<code>${escapeHTML(name)}</code> → ${list.map(a => `<code>${escapeHTML(a)}</code>`).join(", ")}`).join("; ")}</p>` : ""}
      <div class="tagblock"><span class="tagname">${escapeHTML(step.file)}</span>${leanHTML(step.source || "", errorLinesOf(step.errors), "tall")}</div>`;
  } else {
    body = Object.entries(step).filter(([k]) => !["index", "kind", "stage", "elapsed_seconds", "event"].includes(k)).map(([key, value]) => {
      let inner;
      if (typeof value === "string" && (LEAN_TAGS.has(key) || key === "solution")) inner = value ? leanHTML(value, new Set(), "tall") : `<span class="muted">(empty)</span>`;
      else if (Array.isArray(value) && value.every(v => typeof v === "string") && key === "lemmas") inner = leanHTML(value.join("\n\n"));
      else if (typeof value === "string") inner = `<div class="prose">${mathHTML(value)}</div>`;
      else inner = `<pre class="plain">${escapeHTML(JSON.stringify(value, null, 1))}</pre>`;
      return `<div class="tagblock"><span class="tagname">${escapeHTML(key)}</span>${inner}</div>`;
    }).join("");
  }
  const role = roleOf(step);
  return {
    head: `<div class="row"><span class="dot ${role}"></span><span class="mono muted">#${step.index} of ${steps.length - 1}</span>
        <span class="spacer"></span>
        <button class="btn" type="button" data-drawer="prev" ${step.index === 0 ? "disabled" : ""} aria-label="Previous step">←</button>
        <button class="btn" type="button" data-drawer="next" ${step.index === steps.length - 1 ? "disabled" : ""} aria-label="Next step">→</button>
        <button class="btn" type="button" data-drawer="close">Close</button></div>
      <h3>${escapeHTML(stepTitle(step))}</h3>
      <div class="meta">${meta.join("")}</div>`,
    body,
  };
}

// Opens the drawer with arbitrary content; `index` is set for step records only.
function showDrawer(head, body, index = null) {
  openStep = index;
  drawerOpen = true;
  document.getElementById("drawer-head").innerHTML = head;
  const bodyEl = document.getElementById("drawer-body");
  bodyEl.innerHTML = body;
  bodyEl.scrollTop = 0;
  document.getElementById("drawer").hidden = false;
  document.getElementById("scrim").hidden = false;
  // Bring the first compiler error into view inside the Lean listing.
  const errorLine = bodyEl.querySelector(".line.err");
  if (errorLine) {
    const pre = errorLine.closest("pre");
    pre.scrollTop = Math.max(0, errorLine.offsetTop - pre.clientHeight / 3);
  }
  document.querySelector('#drawer [data-drawer="close"]').focus({ preventScroll: true });
}

// Drawer header for content that is not a single step.
function summaryHead(title, meta = "", dotClass = "") {
  return `<div class="row">${dotClass ? `<span class="dot ${dotClass}"></span>` : ""}
      <span class="spacer"></span><button class="btn" type="button" data-drawer="close">Close</button></div>
    <h3>${title}</h3>${meta ? `<div class="meta">${meta}</div>` : ""}`;
}

function showStep(index, sampleIndex = null) {
  const step = steps[index];
  if (!step) return;
  const { head, body } = stepDetail(step, sampleIndex);
  showDrawer(head, body, index);
}

function closeStep() {
  openStep = null;
  drawerOpen = false;
  document.getElementById("drawer").hidden = true;
  document.getElementById("scrim").hidden = true;
}

// Clicks on step links and drawer controls, and keys while the drawer is open.
// Page handlers should ignore keys when `drawerOpen` is true.
function installDrawerHandlers() {
  document.addEventListener("click", event => {
    if (event.target.id === "scrim") return closeStep();
    const target = event.target.closest("[data-step],[data-drawer],[data-tab]");
    if (!target) return;
    const d = target.dataset;
    if (d.step !== undefined) showStep(Number(d.step));
    else if (d.drawer === "close") closeStep();
    else if (d.drawer === "prev") showStep(openStep - 1);
    else if (d.drawer === "next") showStep(openStep + 1);
    else if (d.tab) {
      drawerTab = d.tab;
      document.querySelectorAll("#drawer [data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === d.tab));
      document.querySelectorAll("#drawer [data-panel]").forEach(p => { p.hidden = p.dataset.panel !== d.tab; });
    }
  });
  document.addEventListener("keydown", event => {
    if (!drawerOpen || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === "Escape") closeStep();
    else if (openStep !== null && event.key === "ArrowRight") showStep(Math.min(steps.length - 1, openStep + 1));
    else if (openStep !== null && event.key === "ArrowLeft") showStep(Math.max(0, openStep - 1));
  });
}

function renderHeader() {
  document.getElementById("thm").textContent = TRACE.theorem_name;
  document.getElementById("run").textContent = TRACE.run_id;
  document.getElementById("models").textContent = `${TRACE.models?.orchestrator} + ${TRACE.models?.worker}`;
  const verified = outcome.checks?.verified;
  const reviewed = outcome.status === "proved";
  document.getElementById("status").innerHTML = `<span class="pill ${reviewed ? "ok" : verified ? "warn" : outcome.status ? "fail" : "neutral"}">${reviewed ? "proved · verified · reviewed" : verified ? `verified · ${escapeHTML(outcome.status || "review pending")}` : escapeHTML(outcome.status || "in progress")}</span>`;
}


// Chapters ------------------------------------------------------------------------

function chapterOverview() {
  const phases = outcome.phase_seconds || {};
  const phaseTotal = sum(Object.values(phases)) || 1;
  const phaseNames = Object.keys(phases);
  const verified = outcome.checks?.verified;
  const roles = ["captain", "auditor", "solver"];
  return `
  <div class="eyebrow">Run ${escapeHTML(TRACE.run_id)} · ${escapeHTML(TRACE.started || "")}</div>
  <h2>Orchestrated formal proof of <code>${escapeHTML(TRACE.theorem_name)}</code></h2>
  <p class="lead">This page reconstructs one run of a multi-model Lean 4 proving pipeline.
  An orchestrator model, the <span class="role captain">captain</span>, translates an informal
  mathematical result into Lean, has the translation checked by a blind
  <span class="role auditor">auditor</span>, splits the proof into lemmas, and delegates each
  lemma to several parallel <span class="role solver">solver</span> models. The
  <span class="role lean">Lean</span> compiler checks every piece of code; a result is accepted
  only when Lean accepts it.</p>
  <div class="stats">
    <div class="stat"><span class="v">${verified ? "Proved" : escapeHTML(outcome.status || "running")}</span><span class="k">${verified ? "all final checks pass" : "final status"}</span></div>
    <div class="stat"><span class="v">${formatDuration(outcome.wall_seconds || steps.at(-1)?.elapsed_seconds || 0)}</span><span class="k">wall-clock time</span></div>
    <div class="stat"><span class="v">${calls.length}</span><span class="k">model calls (${roles.map(r => callsByRole(r).length).join(" / ")} captain / auditor / solver)</span></div>
    <div class="stat"><span class="v">${checks.length}</span><span class="k">Lean checks</span></div>
    <div class="stat"><span class="v">${formatUSD(totalCost)}</span><span class="k">notional API cost</span></div>
  </div>
  ${phaseNames.length ? `
  <div class="panel">
    <h3>Time per phase</h3>
    <div class="phasebar">${phaseNames.map(p => `<div class="ph-${p}" style="width:${(phases[p] / phaseTotal * 100).toFixed(2)}%">${phases[p] / phaseTotal > 0.12 ? p : ""}</div>`).join("")}</div>
    <div class="phaselegend">${phaseNames.map(p => `<span><i class="ph-${p}"></i>${p} ${formatDuration(phases[p])}</span>`).join("")}</div>
  </div>` : ""}
  <div class="panel">
    <h3>Models</h3>
    <table class="kv">
      <tr><th>Role</th><th>Model</th><th>Calls</th><th>Output tokens</th><th>Cost</th></tr>
      ${roles.map(r => {
        const list = callsByRole(r);
        return `<tr><td><span class="role ${r}">${r}</span></td><td class="num">${escapeHTML(list[0]?.model || (r === "captain" ? TRACE.models?.orchestrator : TRACE.models?.worker))}</td>
          <td class="num">${list.length}</td><td class="num">${sum(list.map(c => c.usage?.outputTokens)).toLocaleString()}</td><td class="num">${formatUSD(sum(list.map(c => c.cost_usd)))}</td></tr>`;
      }).join("")}
    </table>
  </div>
  <div class="panel">
    <h3>Reading this page</h3>
    <p>The chapters follow the pipeline in order. Use <b>Next</b>, the chapter list, or the
    <kbd>←</kbd>/<kbd>→</kbd> keys. Every item marked with a step number such as ${stepLink(steps[0])}
    opens the complete record of that step: the exact prompt, the model's reply, the Lean source and
    compiler output. Inside a step record, <kbd>←</kbd>/<kbd>→</kbd> move through the run one step at a time.</p>
  </div>
  <div class="panel">
    <h3>Terms</h3>
    <dl class="gloss">
      <dt>Lean 4</dt><dd>A programming language and proof assistant. A proof written in Lean is checked mechanically by its kernel; if it compiles, it is correct relative to the stated theorem.</dd>
      <dt>Mathlib</dt><dd>The community library of formalized mathematics for Lean.</dd>
      <dt>sorry</dt><dd>A placeholder that closes any goal without proof. Lean accepts it with a warning. The pipeline uses it for statements whose proofs are pending, and the final solution must contain none.</dd>
      <dt>axioms</dt><dd>Foundational assumptions a proof depends on. Only <code>propext</code>, <code>Classical.choice</code> and <code>Quot.sound</code> are admitted.</dd>
      <dt>read-back</dt><dd>A natural-language account of what a piece of Lean code literally asserts, written without knowledge of what it was meant to assert.</dd>
      <dt>faithful</dt><dd>A formal statement is faithful when it asserts exactly the source result: neither weaker, stronger, nor vacuous.</dd>
    </dl>
  </div>`;
}

// Vertical flow chart of the pipeline; nodes open the matching algorithm entry.
const FLOW_NODES = [
  { id: "problem", title: "Informal problem", actor: "dataset", tone: "data", algorithm: null, chapter: "problem" },
  { id: "formalize", title: "Formalize", actor: "captain", tone: "captain", algorithm: 0, chapter: "formalize" },
  { id: "audit", title: "Blind read-back", actor: "auditor", tone: "auditor", algorithm: 1, chapter: "audit" },
  { id: "judge", title: "Faithfulness verdict", actor: "captain", tone: "captain", algorithm: 2, chapter: "audit" },
  { id: "sketch", title: "Proof sketch", actor: "captain", tone: "captain", algorithm: 3, chapter: "sketch" },
  { id: "prove", title: "Prove lemmas", actor: "solvers, in parallel", tone: "solver", algorithm: 4, chapter: "prove" },
  { id: "assemble", title: "Assemble and verify", actor: "Lean", tone: "lean", algorithm: 6, chapter: "assemble" },
];

function flowCounts(id) {
  const n = {
    formalize: [callsByRole("captain").filter(c => /^formalize/.test(c.label)).length, checks.filter(k => k.label === "formalize").length],
    audit: [callsByRole("auditor").length, 0],
    judge: [callsByRole("captain").filter(c => /^judge/.test(c.label)).length, 0],
    sketch: [callsByRole("captain").filter(c => /^sketch/.test(c.label)).length, checks.filter(k => k.label === "sketch").length],
    prove: [callsByRole("solver").length, checks.filter(k => k.lemma != null).length],
    assemble: [0, checks.filter(k => k.stage === "assemble").length],
  }[id];
  if (!n) return "";
  return [n[0] ? plural(n[0], "call") : "", n[1] ? plural(n[1], "check") : ""].filter(Boolean).join(" · ");
}

function flowSVG() {
  const x = 190, w = 260, h = 74, gap = 30, cx = x + w / 2;
  const y = i => 12 + i * (h + gap);
  const nodes = FLOW_NODES.map((node, i) => `
    <g class="node" tabindex="0" role="button" data-flow="${node.id}" aria-label="${node.title}">
      <rect x="${x}" y="${y(i)}" width="${w}" height="${h}" rx="7"></rect>
      <circle cx="${x + 16}" cy="${y(i) + 20}" r="4.5" class="c-${node.tone}"></circle>
      <text x="${x + 28}" y="${y(i) + 24}" class="title">${node.title}</text>
      <text x="${x + 28}" y="${y(i) + 43}" class="actor c-${node.tone}">${node.actor}${node.id === "prove" ? ` ×${cfg.workers ?? "N"} per lemma` : ""}</text>
      <text x="${x + 28}" y="${y(i) + 61}" class="count">${flowCounts(node.id)}</text>
    </g>`).join("");
  const down = FLOW_NODES.slice(0, -1).map((node, i) =>
    `<path class="edge" d="M${cx},${y(i) + h} V${y(i + 1) - 3}" marker-end="url(#arrow)"></path>`).join("");
  const selfLoop = (i, label) => `
    <path class="edge loop" d="M${x},${y(i) + 22} C${x - 52},${y(i) + 22} ${x - 52},${y(i) + 52} ${x - 3},${y(i) + 52}" marker-end="url(#arrow)"></path>
    <text x="${x - 50}" y="${y(i) + 41}" text-anchor="end" class="elabel">${label}</text>`;
  const backEdge = (from, to, label, id) => `
    <path class="edge loop" d="M${x + w},${y(from) + h / 2} H${x + w + 70} V${y(to) + h / 2} H${x + w + 3}" marker-end="url(#arrow)"></path>
    <text x="${x + w + 76}" y="${(y(from) + y(to)) / 2 + h / 2 + 4}" class="elabel${id ? " hot" : ""}"${id ? ` data-flow="${id}" tabindex="0" role="button"` : ""}>${label}</text>`;
  const height = y(FLOW_NODES.length) - gap + 14;
  return `<svg class="flow" viewBox="0 0 640 ${height}" role="img" aria-label="Pipeline flow chart">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"></path></marker></defs>
    ${down}
    ${selfLoop(1, "Lean errors")}
    ${selfLoop(4, "Lean errors")}
    ${selfLoop(5, "Lean errors, per chain")}
    ${backEdge(3, 1, "REVISE")}
    ${backEdge(5, 4, "replan", "replan")}
    <text x="${cx + 8}" y="${y(4) - 10}" class="elabel">FAITHFUL</text>
    ${nodes}
  </svg>`;
}

  ["max_audit_rounds", "Formalization revisions allowed after a REVISE verdict."],
  ["max_replans", "Sketch revisions allowed after a lemma fails."],
  ["lean_parallel", "Lean checks run concurrently."],

  ["cli_timeout", "Seconds allowed per model call."],
];

function chapterAlgorithm() {
  return `
  <div class="eyebrow">Method</div>
  <h2>The orchestration algorithm</h2>
  <p class="lead">The pipeline separates judgement from labour. The stronger orchestrator model

  <div class="algo">

function showFlowDetail(id) {
  const node = FLOW_NODES.find(n => n.id === id);
  const algorithm = TRACE.algorithm || [];
  const entry = id === "replan" ? algorithm[5] : node && node.algorithm != null ? algorithm[node.algorithm] : null;
  const panel = document.getElementById("flow-detail");
  if (!panel) return;
  document.querySelectorAll("svg.flow .node").forEach(g => g.classList.toggle("sel", g.dataset.flow === id));
  const chapter = id === "replan" ? "sketch" : node.chapter;
  panel.innerHTML = id === "problem"
    ? `<span class="eyebrow">Input</span><h3>Informal problem</h3>
       <p>A statement and informal proof from the dataset. See the problem chapter.</p>
       <div><button class="btn" type="button" data-goto="problem">Open chapter</button></div>`
    : `<span class="eyebrow">${escapeHTML(entry?.stage || "")}</span>
       <h3>${id === "replan" ? "Replan" : node.title}</h3>
       <div class="muted">${escapeHTML(entry?.actor || "")}</div>
