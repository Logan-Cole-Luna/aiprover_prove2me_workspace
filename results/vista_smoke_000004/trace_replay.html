<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bounding_ite_base orchestration replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eceef3;
  --ink: #161b26;
  --muted: #586176;
  --line: #d8dce4;
  --accent: #3a46b8;
  --accent-soft: #e4e6f7;
  --captain: #3a46b8;
  --auditor: #9b3f7e;
  --solver: #0b7a70;
  --lean: #8a6a1f;
  --ok: #1e7b45;
  --ok-soft: #dcefe3;
  --fail: #b4322b;
  --fail-soft: #f6dedc;
  --warn: #9a6200;
  --warn-soft: #f5e8cf;
  --code-bg: #f7f8fb;
  --err-line: #fbe6e4;
  --kw: #3a46b8;
  --cm: #6f7788;
  --str: #0b7a70;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-prose: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --font-mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1218; --surface: #171b24; --surface-2: #202533; --ink: #e5e8ef;
    --muted: #9aa3b5; --line: #2d3342; --accent: #939cf3; --accent-soft: #252a4a;
    --captain: #939cf3; --auditor: #da8cc1; --solver: #4fc7b8; --lean: #d4b366;
    --ok: #5cc98a; --ok-soft: #173325; --fail: #f07b71; --fail-soft: #3a1c1b;
    --warn: #e2ab44; --warn-soft: #3a2c12; --code-bg: #12151c; --err-line: #3a1c1b;
    --kw: #a5adf6; --cm: #7d8698; --str: #62cfc1;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1218; --surface: #171b24; --surface-2: #202533; --ink: #e5e8ef;
  --muted: #9aa3b5; --line: #2d3342; --accent: #939cf3; --accent-soft: #252a4a;
  --captain: #939cf3; --auditor: #da8cc1; --solver: #4fc7b8; --lean: #d4b366;
  --ok: #5cc98a; --ok-soft: #173325; --fail: #f07b71; --fail-soft: #3a1c1b;
  --warn: #e2ab44; --warn-soft: #3a2c12; --code-bg: #12151c; --err-line: #3a1c1b;
  --kw: #a5adf6; --cm: #7d8698; --str: #62cfc1;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.55;
  margin: 0;
}
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; }
h2 { font-size: 1.6rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
code, pre, .mono { font-family: var(--font-mono); font-size: 0.84em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; }

/* Page frame ---------------------------------------------------------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
}
.topbar .run { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }
.topbar .thm { font-weight: 600; font-family: var(--font-mono); font-size: 0.95rem; }
.topbar .spacer { flex: 1; }
.frame {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  gap: 32px;
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 28px 96px;
}
nav.chapters {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 2px;
  counter-reset: chapter;
}
nav.chapters button {
  display: grid;
  grid-template-columns: 26px 1fr;
  align-items: baseline;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 6px;
  padding: 7px 10px;
  cursor: pointer;
  color: var(--muted);
}
nav.chapters button .n { font-family: var(--font-mono); font-size: 0.78rem; }
nav.chapters button:hover { background: var(--surface-2); color: var(--ink); }
nav.chapters button[aria-current="step"] {
  background: var(--accent-soft);
  color: var(--ink);
  font-weight: 600;
}
main { min-width: 0; }
.chapter { display: flex; flex-direction: column; gap: 22px; max-width: 900px; }
.eyebrow {
  font-size: 0.74rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
.lead { font-size: 1.05rem; color: var(--ink); }
.muted { color: var(--muted); }
.stepper {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 15;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.stepper .where { font-size: 0.85rem; color: var(--muted); min-width: 12ch; text-align: center; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  padding: 6px 14px;
  cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { color: var(--surface); filter: brightness(1.08); }

/* Building blocks ----------------------------------------------------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 2px 9px;
  border-radius: 999px;
  white-space: nowrap;
}
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.fail { background: var(--fail-soft); color: var(--fail); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.role { font-weight: 600; }
.role.captain { color: var(--captain); }
.role.auditor { color: var(--auditor); }
.role.solver { color: var(--solver); }
.role.lean { color: var(--lean); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.captain { background: var(--captain); }
.dot.auditor { background: var(--auditor); }
.dot.solver { background: var(--solver); }
.dot.lean { background: var(--lean); }
.dot.decision { background: var(--muted); }

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.stat { background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 0.78rem; color: var(--muted); }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.algo { display: grid; grid-template-columns: minmax(0, 620px) minmax(220px, 1fr); gap: 16px; align-items: start; }
.prose { font-family: var(--font-prose); font-size: 1.02rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.prose math[display="block"] { margin: 0.5em 0; overflow-x: auto; }
.prose code { font-size: 0.8em; background: var(--surface-2); padding: 0 4px; border-radius: 3px; }

pre.lean {
  margin: 0;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 0;
  overflow: auto;
  max-height: 460px;
  font-size: 0.8rem;
  line-height: 1.5;
}
pre.lean.tall { max-height: 640px; }
pre.lean .line { display: block; padding-inline: 12px 16px; white-space: pre; }
pre.lean .line .no {
  display: inline-block;
  width: 3.2ch;
  margin-right: 12px;
  text-align: right;
  color: var(--cm);
  user-select: none;
  opacity: 0.7;
}
pre.lean .line.err { background: var(--err-line); }
pre.lean .kw { color: var(--kw); font-weight: 600; }
pre.lean .cm { color: var(--cm); font-style: italic; }
pre.lean .st { color: var(--str); }
pre.lean .sorry { color: var(--warn); font-weight: 600; background: var(--warn-soft); border-radius: 3px; }
pre.plain {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 0.8rem;
  max-height: 460px;
  overflow: auto;
}
pre.plain.errors { border-color: var(--fail); color: var(--fail); }
.placeholder { color: var(--accent); font-weight: 600; }

.tagblock { display: flex; flex-direction: column; gap: 4px; }
.tagname { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }

details.fold { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.fold > summary {
  cursor: pointer;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  align-items: baseline;
  list-style: none;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; color: var(--muted); width: 1ch; }
details.fold[open] > summary::before { content: "▾"; }
details.fold > .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }

.md h1, .md h2, .md h3, .md h4 { font-size: 1rem; margin-top: 0.6em; }
.md p, .md li { max-width: 72ch; }
.md ul { margin: 0; padding-left: 1.3em; }
.md code { background: var(--surface-2); padding: 0 4px; border-radius: 3px; }
.md { display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; }

/* Step list ------------------------------------------------------------ */
.steps { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.steprow {
  display: grid;
  grid-template-columns: 44px 58px 18px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 8px 12px;
  border: 0;
  border-top: 1px solid var(--line);
  background: none;
  text-align: left;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.steprow:first-child { border-top: 0; }
.steprow:hover { background: var(--surface-2); }
.steprow .idx { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.steprow .t { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.steprow .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steprow .what .lbl { font-family: var(--font-mono); font-size: 0.82rem; }
.steplink {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 4px;
  padding: 0 5px;
  cursor: pointer;
  color: var(--accent);
}
.steplink:hover { border-color: var(--accent); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 3px 11px;
  font-size: 0.82rem;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Algorithm diagram ----------------------------------------------------- */
.diagram-wrap { overflow-x: auto; }
svg.flow { width: 100%; max-width: 620px; min-width: 520px; height: auto; display: block; }
svg.flow .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
svg.flow .node { cursor: pointer; }
svg.flow .node:hover rect, svg.flow .node:focus-visible rect { stroke: var(--accent); }
svg.flow .node.sel rect { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
svg.flow .node:focus { outline: none; }
svg.flow text { fill: var(--ink); font-family: var(--font-ui); }
svg.flow .title { font-size: 14px; font-weight: 600; }
svg.flow .actor { font-size: 11.5px; }
svg.flow .count { font-size: 11px; fill: var(--muted); font-family: var(--font-mono); }
svg.flow .edge { stroke: var(--muted); stroke-width: 1.3; fill: none; }
svg.flow .edge.loop { stroke-dasharray: 4 3; }
svg.flow .elabel { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
svg.flow .elabel.hot { cursor: pointer; fill: var(--accent); text-decoration: underline; }
svg.flow .arrowhead { fill: var(--muted); }
svg.flow .c-captain { fill: var(--captain); }
svg.flow .c-auditor { fill: var(--auditor); }
svg.flow .c-solver { fill: var(--solver); }
svg.flow .c-lean { fill: var(--lean); }
svg.flow .c-data { fill: var(--muted); }

table.kv { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.kv th, table.kv td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
table.kv th { font-weight: 500; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; border-top: 0; }
table.kv td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

.phasebar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.phasebar div {
  display: flex; align-items: center; justify-content: center;
  font-size: 0.74rem; font-weight: 500; white-space: nowrap; overflow: hidden;
  color: var(--surface); min-width: 2px;
}
.ph-formalize { background: var(--captain); }
.ph-sketch { background: var(--auditor); }
.ph-prove { background: var(--solver); }
.ph-assemble { background: var(--lean); }
.phaselegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--muted); }
.phaselegend span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.phaselegend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

dl.gloss { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
dl.gloss dt { font-weight: 600; font-family: var(--font-mono); font-size: 0.86rem; }
dl.gloss dd { margin: 0; max-width: 64ch; }

.lemma { display: flex; flex-direction: column; gap: 8px; }
.lemma .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.lemma .head .name { font-family: var(--font-mono); font-weight: 600; }

.checks { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.check { display: grid; grid-template-columns: 22px 170px 1fr; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.check:first-child { border-top: 0; }
.check .mark { font-weight: 700; }
.check .mark.ok { color: var(--ok); }
.check .mark.fail { color: var(--fail); }
.check .name { font-family: var(--font-mono); font-size: 0.85rem; }

/* Solver timeline -------------------------------------------------------- */
.gantt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.gantt { min-width: 680px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 10px; }
.g-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; }
.g-row .lab { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }
.g-track { position: relative; height: 26px; }
.g-track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line); }
.g-group { display: flex; flex-direction: column; gap: 2px; }
.g-group .gh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-bottom: 2px; }
.g-group .gh .name { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; }
.bar {
  position: absolute;
  top: 4px;
  height: 18px;
  border-radius: 3px;
  border: 1px solid transparent;
  padding: 0 4px;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  line-height: 16px;
  color: var(--surface);
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  min-width: 6px;
}
.bar.ok { background: var(--ok); }
.bar.fail { background: var(--fail); }
.bar.rejected { background: var(--warn); }
.bar.pending { background: var(--muted); }
.bar.win { background: var(--ok); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ok); }
.bar.late {
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 4px, var(--surface) 4px 8px);
  border: 1px dashed var(--muted);
  color: var(--muted);
}
.bar:hover, .bar:focus-visible { filter: brightness(1.12); z-index: 2; }
.winline { position: absolute; top: -2px; bottom: -2px; border-left: 2px solid var(--ok); pointer-events: none; }
.g-axis { position: relative; height: 18px; }
.g-axis span {
  position: absolute; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend .sw { width: 18px; height: 10px; border-radius: 2px; display: inline-block; position: relative; }

/* Step drawer ------------------------------------------------------------ */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 18, 0.35); z-index: 40; }
aside.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(780px, 100%);
  z-index: 50;
  background: var(--bg);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  transition: transform 180ms ease;
}
aside.drawer[hidden] { display: none !important; }
.drawer-head {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.drawer-head .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.drawer-head .row .spacer { flex: 1; }
.drawer-head h3 { font-family: var(--font-mono); font-size: 0.98rem; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 500; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.tabs button {
  background: none; border: 0; padding: 7px 12px; cursor: pointer;
  border-bottom: 2px solid transparent; color: var(--muted); font-size: 0.9rem;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.note { font-size: 0.86rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; max-width: 70ch; }

@media (max-width: 900px) {
  .frame { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 14px 96px; }
  nav.chapters {
    position: static;
    flex-direction: row;
    overflow-x: auto;
    gap: 4px;
    padding-bottom: 4px;
  }
  nav.chapters button { grid-template-columns: auto auto; gap: 6px; white-space: nowrap; }
  .two, .algo { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .topbar { padding: 8px 16px; }
  .frame { padding-inline: 16px; }
  .check { grid-template-columns: 22px 1fr; }
  .check .desc { grid-column: 2; }
  .steprow { grid-template-columns: 38px 18px minmax(0, 1fr) auto; }
  .steprow .t { display: none; }
  dl.gloss { grid-template-columns: 1fr; gap: 2px; }
  dl.gloss dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  aside.drawer { transition: none; }
}
a.btn { text-decoration: none; color: var(--ink); font-size: 0.85rem; }


html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
.workspace {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
}
.stage {
  position: relative;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
  background-color: var(--bg);
  background-image: radial-gradient(var(--line) 1px, transparent 1px);
  background-size: 22px 22px;
}
.stage.dragging { cursor: grabbing; }
.stage svg { width: 100%; height: 100%; display: block; }
.stage-tools { position: absolute; top: 12px; right: 14px; display: flex; gap: 6px; z-index: 3; }
.stage-tools .btn { background: var(--surface); font-size: 0.82rem; padding: 4px 10px; }
.stage-tools .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.stage-tools .btn:disabled { opacity: 0.6; cursor: progress; }
.export-status {
  position: absolute; top: 52px; right: 14px; z-index: 3;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 10px; font-size: 0.8rem; color: var(--muted); max-width: 300px;
}
.arrowhead { fill: var(--muted); }
/* Applied while exporting so computed styles are final values, not mid-transition. */
svg.exporting *, svg.exporting { transition: none !important; animation: none !important; }

/* Narration and event log ------------------------------------------------- */
.side {
  border-left: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.narration {
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 190px;
}
.narration .phase { display: flex; align-items: center; gap: 8px; }
.narration h3 { font-size: 1.05rem; }
.narration p { font-size: 0.92rem; color: var(--muted); }
.log { flex: 1; overflow-y: auto; padding: 6px 0; }
.log button {
  display: grid;
  grid-template-columns: 44px 12px minmax(0, 1fr);
  gap: 8px;
  align-items: baseline;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 5px 16px;
  cursor: pointer;
  font-size: 0.82rem;
  color: var(--muted);
}
.log button:hover { background: var(--surface-2); }
.log button.past { color: var(--ink); }
.log button.now { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.log button.future { opacity: 0.45; }
.log .t { font-family: var(--font-mono); font-size: 0.74rem; font-variant-numeric: tabular-nums; }
.log .dot { align-self: center; }

/* Transport ------------------------------------------------------------------- */
.transport {
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
}
.transport .btn { padding: 5px 12px; }
.transport .play { min-width: 92px; }
.transport input[type="range"] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.transport select { font: inherit; font-size: 0.85rem; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.clock { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 12ch; }
.phases { display: flex; gap: 4px; flex-wrap: wrap; }
.phases span { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.phases span.on { background: var(--ink); color: var(--bg); }

/* Graph marks --------------------------------------------------------------------- */
.rnode { cursor: pointer; transition: opacity 350ms ease; }
.rnode.hidden { opacity: 0.13; pointer-events: none; }
.rnode rect.body { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; transition: fill 300ms, stroke 300ms; }
.rnode text { fill: var(--ink); font-family: var(--font-ui); }
.rnode .t1 { font-size: 13px; font-weight: 600; }
.rnode .t1.mono { font-family: var(--font-mono); font-size: 12px; }
.rnode .t2 { font-size: 11px; fill: var(--muted); }
.rnode .t3 { font-size: 10.5px; fill: var(--muted); font-family: var(--font-mono); }
.rnode .progress-track { fill: var(--surface-2); }
.rnode .progress { fill: var(--accent); }
.rnode.r-captain rect.body { stroke: var(--captain); }
.rnode.r-auditor rect.body { stroke: var(--auditor); }
.rnode.r-solver rect.body { stroke: var(--solver); }
.rnode.r-lean rect.body { stroke: var(--lean); }
.rnode.r-captain .progress { fill: var(--captain); }
.rnode.r-auditor .progress { fill: var(--auditor); }
.rnode.r-solver .progress { fill: var(--solver); }
.rnode.r-lean .progress { fill: var(--lean); }
.rnode .chip-role.r-captain { fill: var(--captain); }
.rnode .chip-role.r-auditor { fill: var(--auditor); }
.rnode .chip-role.r-solver { fill: var(--solver); }
.rnode .chip-role.r-lean { fill: var(--lean); }
.rnode.root rect.body { stroke-width: 2.2; fill: var(--accent-soft); }
.rnode.problem rect.body { stroke: var(--muted); stroke-dasharray: 5 3; }
.rnode.final rect.body { stroke-width: 2.4; }
.rnode.running rect.body { stroke-width: 2.4; animation: pulse 1.4s ease-in-out infinite; }
.rnode.compiling rect.body { stroke: var(--lean); stroke-width: 2.4; stroke-dasharray: 6 4; }
.rnode.s-ok rect.body, .rnode.s-win rect.body { fill: var(--ok-soft); stroke: var(--ok); }
.rnode.s-win rect.body { stroke-width: 3; }
.rnode.s-fail rect.body { fill: var(--fail-soft); stroke: var(--fail); }
.rnode.s-late rect.body { fill: url(#hatch); stroke: var(--muted); stroke-dasharray: 4 3; }
.rnode.s-late text { fill: var(--muted); }
.rnode .status.s-ok, .rnode .status.s-win { fill: var(--ok); }
.rnode .status.s-fail { fill: var(--fail); }
.rnode .status.s-run { fill: var(--accent); }
.rnode .status.s-lean { fill: var(--lean); }
.rnode:hover rect.body, .rnode:focus-visible rect.body { stroke: var(--accent); }
.rnode:focus { outline: none; }
@keyframes pulse { 50% { stroke-opacity: 0.35; } }
#hatch-a { fill: var(--surface); }
#hatch-b { stroke: var(--line); }

.redge { fill: none; stroke: var(--muted); stroke-width: 1.6; opacity: 0.55; transition: stroke-dashoffset 700ms ease, opacity 300ms; }
.redge.hidden { opacity: 0; }
.ghost { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 3 4; }
.redge.r-captain { stroke: var(--captain); }
.redge.r-auditor { stroke: var(--auditor); }
.redge.r-solver { stroke: var(--solver); }
.redge.r-lean { stroke: var(--lean); }
.redge.repair { stroke: var(--fail); stroke-width: 1.8; }
.redge.win { stroke: var(--ok); stroke-width: 2.4; opacity: 0.9; }
.rlabel { font-size: 10.5px; fill: var(--muted); font-family: var(--font-ui); transition: opacity 300ms; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.rlabel.hidden { opacity: 0; }
.rlabel.repair { fill: var(--fail); }
.packet { r: 5; transition: opacity 200ms; }
.packet.r-captain { fill: var(--captain); }
.packet.r-auditor { fill: var(--auditor); }
.packet.r-solver { fill: var(--solver); }
.packet.r-lean { fill: var(--lean); }
.packet.r-ok { fill: var(--ok); }
.band { fill: var(--surface-2); opacity: 0.55; }
.band-label { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; fill: var(--muted); font-family: var(--font-ui); }

@media (max-width: 860px) {
  .workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 190px; }
  .side { border-left: 0; border-top: 1px solid var(--line); }

  .log { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .rnode.running rect.body { animation: none; }

}

const TRACE = {"run_id": "vista_smoke_000004", "problem": {"uuid": "JiatuBook_BoundedArithmetic_000004", "source_name": "JiatuBook", "source_subset": "BoundedArithmetic", "raw_source_path": "JiatuBook/Jiatu_s_Book_on_Bounded_Arithmetic/02-PV.tex", "informal_statement": "Setting: Working in Cook's equational theory $\\PV$ (a polynomial-time equational theory). The base sort is finite Boolean strings $\\zo^* = \\{0,1\\}^*$ with constant $\\eps$ (empty string), unary successors $s_0, s_1$ (append a 0 or a 1 to the right), binary concatenation $\\circ$, smash $\\#$, trim-right $\\TR$, and iterated trim $\\ITR$. The defining axioms are $x \\circ \\eps = x$, $x \\circ s_i(y) = s_i(x \\circ y)$, $\\TR(\\eps) = \\eps$, $\\TR(s_i(x)) = x$, $\\ITR(x, \\eps) = x$, $\\ITR(x, s_i(y)) = \\TR(\\ITR(x, y))$, $x \\# \\eps = \\eps$, $x \\# s_i(y) = x \\circ (x \\# y)$ ($i \\in \\{0,1\\}$). New functions are introduced by composition or by limited recursion on notation, the latter requiring an order-$(i-1)$ $\\PV$ proof of $\\ITR(h_i(\\vec x, y, z), z \\circ k_i(\\vec x, y)) = \\eps$. Equations are derived using (L0) reflexivity, (L1) symmetry, (L2) transitivity, (L3) congruence, (L4) substitution, the definition axioms, and the structural-induction rule: from $f_j(\\vec x, \\eps) = g(\\vec x)$ and $f_j(\\vec x, s_i(y)) = h_i(\\vec x, y, f_j(\\vec x, y))$ ($i \\in \\{0,1\\}$, $j \\in \\{1,2\\}$) infer $f_1(\\vec x, y) = f_2(\\vec x, y)$. The standard model is denoted $\\M$; $t^\\M$ is the interpretation of term $t$ in $\\M$. $\\FP$ is the class of polynomial-time computable functions. $\\calF, \\calF'$ are Cobham's class and its variant (with the modified bound $|h_i(\\vec x, y, z)| \\le |z \\circ k_i(\\vec x, y)|$).\n\nProposition (book label `prop: bounding ite base`).\n\n$\\PV\\vdash f_1(z,\\eps) = \\eps$.", "informal_proof": "We need to prove in $\\PV$ that $\\ITR(\\eps,z\\circ \\eps) = \\eps$. Notice that $z\\circ \\eps = z$, and thus by applying (L3) on the function $w\\mapsto \\ITR(\\eps,w\\circ\\eps)$ we know that $\\ITR(\\eps, z\\circ\\eps)=\\ITR(\\eps,z)$. By transitivity, we only need to prove in $\\PV$ that  \n    \\begin{equation}\n        \\ITR(\\eps,x) = \\eps. \n    \\end{equation}\n    It can be proved using the rule of structural induction. Concretely, we will define functions $f_3(x) = \\ITR(\\eps, x)$ and $f_4(x) = \\eps$, and prove that both of them can be constructed by recursion from $g = \\eps$, $h_i(x,z)=\\TR(z)$. The details are omitted and left as an exercise."}, "theorem_name": "bounding_ite_base", "models": {"orchestrator": "claude-sonnet-5-5", "worker": "aiprover"}, "agents": {"captain": {"backend": "claude_cli", "model": "claude-sonnet-5-5", "effort": "", "timeout": 2400}, "auditor": {"backend": "claude_cli", "model": "claude-sonnet-5-5", "effort": "", "timeout": 900}, "solver": {"backend": "aiprover", "model": "aiprover", "config": "aiprover/aiprover_vista.toml", "cli": "AIProver/AIProver_plugin/bin/aiprover", "timeout": 1800, "max_turns": 60, "env": {}}}, "config": {"agents": {"captain": {"backend": "claude_cli", "model": "claude-sonnet-5-5", "timeout": 2400}, "auditor": {"backend": "claude_cli", "model": "claude-sonnet-5-5"}, "solver": {"backend": "aiprover", "model": "aiprover", "config": "aiprover/aiprover_vista.toml", "cli": "AIProver/AIProver_plugin/bin/aiprover", "timeout": 1800, "max_turns": 60}}, "workers": 2, "max_repairs": 4, "max_replans": 1, "max_audit_rounds": 2, "lean_parallel": 4, "lean_timeout": 300}, "algorithm": [{"stage": "formalize", "actor": "captain (orchestrator model)", "description": "Translate the informal statement into Lean 4 definitions and a theorem statement ending in `sorry`. The file is compiled; Lean errors are returned to the captain for repair."}, {"stage": "formalize", "actor": "auditor (worker model)", "description": "Write a blind read-back of the Lean code, seeing only the code and the prove2me auditor playbook, never the source."}, {"stage": "formalize", "actor": "captain (orchestrator model)", "description": "Compare the read-back with the source statement and proof; verdict FAITHFUL continues, REVISE returns to formalization."}, {"stage": "sketch", "actor": "captain (orchestrator model)", "description": "Decompose the proof: lemmas stated in full and left as `sorry`, plus a sorry-free proof of `solution` from them. The sketch must compile."}, {"stage": "prove", "actor": "solvers (worker model, parallel)", "description": "Each lemma is attacked by several independent solver chains. A chain proposes a proof, receives Lean errors, and repairs; the first proof that compiles is kept and the other chains stop."}, {"stage": "sketch", "actor": "captain (orchestrator model)", "description": "If a lemma is not proved within budget, the captain revises the sketch; proved lemmas with unchanged statements are reused."}, {"stage": "assemble", "actor": "Lean", "description": "Splice proofs into the sketch and verify: compiles, no `sorry`, only standard axioms, and the solution's type equals the target theorem's type (checked in a module importing both)."}], "lean_environment": {"toolchain": "leanprover/lean4:v4.23.0", "mathlib": "37df177aaa770670452312393d4e84aaad56e7b6", "file_header": "import Mathlib\nset_option autoImplicit false\n\n"}, "system_prompts": {"captain": "You are the captain of a Lean 4 formalization mission. You formalize mathematics faithfully, audit formalizations against their source, and decompose proofs into lemmas that are delegated to solver agents.\n\nLean environment: Lean 4 v4.23.0 with Mathlib (v4.23.0), `import Mathlib` and `set_option autoImplicit false` are already in the file header. Do not write `import` lines.\n\nFaithfulness principles (from the prove2me captain playbook):\n1. Read the whole setting, not just the theorem. Every standing assumption of the setting is part of the statement or of the definitions.\n2. Match hypotheses and conclusions in both directions. A fact the source proves is never a hypothesis.\n3. Quantify over exactly the source's objects.\n4. Evaluate the statement at edge inputs; a statement that holds only vacuously is wrong even though it is provable.\n5. Definitions first: a wrong definition makes every theorem using it wrong.\n6. Proof difficulty is not your concern when stating a theorem; never weaken a statement to make it easier to prove.\n7. When the source asserts derivability in a formal theory (T ⊢ φ), formalize the theory's proof system as an inductive derivability relation over a syntax of terms or formulas. Proving that φ holds in a model is a different, weaker theorem.\n\nReply only in the tagged format requested by each message. Put Lean code inside the tags without Markdown fences.", "auditor": "# Role: Mission Auditor — Writing Read-backs\n\nA **read-back** is a natural-language rendering of what a Lean 4 declaration *literally asserts* — the artifact's own testimony. A read-back is not a summary and not an explanation. Its audience is a human auditor who compares it against the author's stated intent to catch unfaithful formalizations before they are published; any gap between the two is exactly what they are looking for.\n\nRead-backs are attached to draft theorem/definition items in a mission proposal (see [mission_captain.md](mission_captain.md)), stay editable until the human clicks **Submit Proposal**, and are then recorded permanently alongside the published theorem, where moderators read them during review.\n\n## Independence is the point\n\nA read-back is only useful if it is written blind. If you are the mission captain, do not write your own read-backs — launch an **independent sub-agent** with a fresh context, and give it *only*:\n\n- the Lean code of the declaration: its `formal_statement` (or the definition's code), plus the `preamble` it depends on;\n- this file.\n\nNever give the auditor the informal statement, the source material, the mission pitch, or your own intent. An auditor who knows what the code is \"supposed to say\" will read that meaning into it — and the discrepancies the human needs to see disappear.\n\n## The principles\n\nYou are writing a **read-back** for a Lean 4 declaration: a natural-language rendering of what the code literally asserts. Follow these principles:\n\n1. **Translate the code, not the intent.** State only what the Lean statement actually says. Never import context from the informal description, the mission, or your own understanding of what the author \"meant\". If the code says less than the intent, your read-back must say less.\n\n2. **Account for every binder and hypothesis.** Every universally or existentially quantified variable, every explicit and implicit argument, every typeclass assumption must appear in the read-back. Omitting a hypothesis is the worst failure mode.\n\n3. **Expand non-standard definitions.** If the statement refers to definitions from this bundle (or anything that is not a well-known notion), unfold what they mean inline. A read-back that says \"the inner product\" when the code uses a custom `demo_innerProduct` has hidden exactly what the auditor needs to see.\n\n4. **Surface degenerate and edge cases.** Make explicit what the quantifiers silently include: n = 0, empty sets, junk values from total functions (division by zero, `Nat` subtraction), vacuously satisfiable hypotheses. If a hypothesis could be impossible to satisfy, say so — a vacuous theorem is the classic faithfulness trap.\n\n5. **Preserve logical precision.** Keep the exact strength of every connective: ≤ vs <, ∃ vs ∃!, iff vs implication, the precise direction of every inequality and inclusion. Do not round to the \"morally equivalent\" claim.\n\n6. **Write for a mathematician who does not read Lean.** Plain mathematical English, standard notation where it helps. Try not to mention Lean syntax. Write in **Markdown+KaTex**; use lists and display blocks to make it clear. Avoid using sem-Lean ASCII. More importantly, use real math notation instead of Lean syntax. For example, write $P_i$ instead of P i; write $A^{m, n}$ instead of A m n.\n\n7. **No judgment, no advocacy.** Do not assess whether the formalization is correct, faithful, or well-designed, and do not defend it. Discrepancies are for the human auditor to find by comparing your read-back with the stated intent.\n\n\n## Format of read-back\n\nYour read-back should adhere to the following standard.\n\n1. **One self-contained paragraph per declaration.** The read-back must be understandable without opening the source file. Prefer completeness over elegance; this is fine print, not prose.\n\n2. **Escape every LaTeX backslash in the JSON payload.** JSON forbids a raw backslash in a string, so write `\\\\mu`, `\\\\frac`, `\\\\ge` in the request body; the platform stores and renders them as `\\mu`, `\\frac`, `\\ge`. A single raw backslash (e.g. `\"$\\mu$\"` typed literally) makes the whole request fail with a JSON parse error like `Bad escaped character in JSON`. Every example in this file is written in this payload form (`\\\\ge`, `\\\\nu`); the platform renders them with single backslashes.\n\n3. Use standard mathematical notation and KaTeX. Replace unreadable Lean expressions such as `banditMeasure ν π n` with conventional notation `$B_{\\\\nu,\\\\pi}^n$` and explain their meaning.\n\n4. Give context for every variable and symbol in the theorem.\n\n5. Use display-math block properly to increase readability.\n\n6. Use paragraph breaks properly for readability.\n\n## Attaching the read-back\n\nThe captain attaches the auditor's output to the draft item via the `readback` field, with `readback_model` naming the model that wrote it (e.g. `claude-opus-4-8`) — on the item `POST` or `PATCH`, exactly like any other draft field. See **Read-backs** in [mission_captain.md](mission_captain.md) for the endpoint mechanics. Read-backs apply to draft `theorem`/`definition` items only — `reference` items point at already-published content and take none.\n\nRe-run the auditor after any edit to the Lean statement: a read-back of an older version of the code is worse than none, because it testifies about the wrong artifact.\n", "solver": "You are a Lean 4 proof engineer on a formalization mission. You prove one lemma at a time.\n\nLean environment: Lean 4 v4.23.0 with Mathlib (v4.23.0), `import Mathlib` and `set_option autoImplicit false` are already in the file header. Do not write `import` lines.\n\nRules that gate every submission:\n1. Do not change the lemma statement; you write only its proof.\n2. No `sorry`, `admit`, `axiom`, `opaque`, `native_decide`, macros or other ways of bypassing the kernel.\n3. Helper lemmas are allowed; each helper name must start with the target lemma name followed by `_`.\n\nReply only in the tagged format requested. Put Lean code inside the tags without Markdown fences."}, "prompt_templates": {"AIPROVER_LEMMA_TEMPLATE": "Prove the lemma `{lemma_name}`, whose Lean statement is fixed below. It is one step in the proof of the following result; the Lean definitions in the Setting encode that result's objects and rules, and the earlier lemmas given there may be used as facts.\n\n{informal_statement}", "AUDITOR_TEMPLATE": "Write the read-back for the declaration `{theorem_name}` in the Lean code below. The definitions it depends on are included; expand them inline as the principles require. Reply with the read-back only.\n\n<lean_code>\n{lean_code}\n<\/lean_code>", "FORMALIZE_FEEDBACK_TEMPLATE": "\nYour previous formalization is below, followed by the problems found with it. Fix every problem.\n\n<previous_definitions>\n{definitions}\n<\/previous_definitions>\n<previous_statement>\n{statement}\n<\/previous_statement>\n<problems>\n{problems}\n<\/problems>\n", "FORMALIZE_TEMPLATE": "Formalize the following result in Lean 4.\n\n<informal_statement>\n{informal_statement}\n<\/informal_statement>\n\n<informal_proof>\n{informal_proof}\n<\/informal_proof>\n{feedback}\nProduce:\n- <definitions>: every definition the stateme \\calF, \\calF'$ are Cobham's class and its variant (with the modified bound $|h_i(\\vec x, y, z)| \\le |z \\circ k_i(\\vec x, y)|$).\n\nProposition (book label `prop: bounding ite base`).\n\n$\\PV\\vdash f_1(z,\\eps) = \\eps$.\n<\/informal_statement>\n\n<informal_proof>\nWe need to prove in $\\PV$ that $\\ITR(\\eps,z\\circ \\eps) = \\eps$. Notice that $z\\circ \\eps = z$, and thus by applying (L3) on the function $w\\mapsto \\ITR(\\eps,w\\circ\\eps)$ we know that $\\ITR(\\eps, z\\circ\\eps)=\\ITR(\\eps,z)$. By transitivity, we only need to prove in $\\PV$ that  \n    \\begin{equation}\n        \\ITR(\\eps,x) = \\eps. \n    \\end{equation}\n    It can be proved using the rule of structural induction. Concretely, we will define functions $f_3(x) = \\ITR(\\eps, x)$ and $f_4(x) = \\eps$, and prove that both of them can be constructed by recursion from $g = \\eps$, $h_i(x,z)=\\TR(z)$. The details are omitted and left as an exercise.\n<\/informal_proof>\n\nProduce:\n- <definitions>: every definition the statement needs (syntax, axioms, inference rules, auxiliary functions). Only `inductive`, `structure`, `def`, `abbrev`, `namespace`/`end`, `open` and `notation` declarations; no theorems, no `sorry`, no `axiom`.\n- <statement>: optional `open` lines, then exactly one declaration `theorem bounding_ite_base <binders> : <type> := by sorry`, at top level (not inside a namespace).\n- <notes>: one short paragraph mapping each part of the source statement to the Lean encoding.\n\n<definitions>\n...\n<\/definitions>\n<statement>\n...\n<\/statement>\n<notes>\n...\n<\/notes>", "response": "<definitions>\ninductive PVTerm : Type where\n  | var (n : Nat) : PVTerm\n  | eps : PVTerm\n  | s (b : Bool) (t : PVTerm) : PVTerm\n  | tr (t : PVTerm) : PVTerm\n  | cat (t u : PVTerm) : PVTerm\n  | smash (t u : PVTerm) : PVTerm\n  | itr (t u : PVTerm) : PVTerm\n  /-- function introduced by limited recursion on notation.\n      In g: parameters are var (i+2).  In h b: var 0 = y, var 1 = recursive
