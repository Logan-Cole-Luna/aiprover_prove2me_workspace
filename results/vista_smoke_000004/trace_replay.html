  final: ["eyebrow", "title", "subtitle", "status"],
};
const LINE_HEIGHT = { eyebrow: 16, title: 19, subtitle: 16, status: 16 };
const PAD_TOP = 9, PAD_BOTTOM = 14;   // bottom padding holds the progress bar
const LANE = 160, ROW = 118;

const nodes = [];
const edges = [];
const byId = new Map();

function addNode(node) {
  const lines = NODE_LINES[node.kind];
  const h = PAD_TOP + sum(lines.map(line => LINE_HEIGHT[line])) + PAD_BOTTOM;
  Object.assign(node, { w: NODE_WIDTH[node.kind], h, lines });
  nodes.push(node);
  byId.set(node.id, node);
  return node;
}
function addEdge(from, to, role, extra = {}) {
  edges.push({ from, to, role, ...extra });
}

// State of a node that wraps a model call (and possibly its Lean check).
function callNode(call, fields) {
  const check = checkOfCall.get(call.index) || null;
  return {
    step: call, check, role: call.role,
    start: callStart(call), replied: call.elapsed_seconds,
    end: check ? check.elapsed_seconds : call.elapsed_seconds,
    ...fields,
  };
}

// Each accepted sketch is drawn as a tree: the sketch fans out left to right
// into its lemmas, and the attempts on each lemma stack downward beneath it
// (AIProver: one block per job, its parallel sessions below; chat solvers:
// one lane per chain). A replan starts the next sketch's tree below; lemmas
// it keeps from an earlier sketch appear as single nodes.
const LEMMA_GAP = 90, KEPT_GAP = 30;

function buildLayout() {
  let y = 0;
  const problemNode = addNode({ id: "problem", kind: "problem", x: 0, y, start: 0, end: 0,
    title: TRACE.theorem_name, subtitle: `${problem.source_name} · ${problem.source_subset}`, band: "Input" });
  y += ROW;
  const root = addNode({ id: "captain", kind: "root", role: "captain", x: 0, y, start: 0, end: 0,
    title: "Captain", subtitle: `orchestrator · ${TRACE.models?.orchestrator}` });
  addEdge(problemNode, root, "captain", { label: "statement + proof" });

  const sketchEvents = eventsOf("sketch_accepted");
  const spineCalls = calls.filter(c => (c.role === "captain" || c.role === "auditor") && !isHandback(c))
    .sort((a, b) => a.index - b.index);
  // Captain and auditor calls up to each accepted sketch; the auditor branches right.
  const segments = sketchEvents.map((event, k) => spineCalls.filter(c => c.index < event.index
    && (k === 0 || c.index > sketchEvents[k - 1].index)));
  const tail = spineCalls.filter(c => !sketchEvents.length || c.index > sketchEvents.at(-1).index);
  let previous = root, lastCaptain = root, bypass = null;
  const placeSpine = call => {
    y += ROW;
    const isAuditor = call.role === "auditor";
    const kindText = /^formalize/.test(call.label) ? "Formalize" : /^judge/.test(call.label) ? "Faithfulness verdict"
      : /^sketch/.test(call.label) ? (lastCaptain.sketch ? "Revised sketch" : "Proof sketch") : isAuditor ? "Blind read-back" : call.label;
    const node = addNode({ id: `s${call.index}`, kind: "spine", x: isAuditor ? 300 : 0, y, ...callNode(call, {
      title: kindText, subtitle: `${call.role} · ${call.label}`, sketch: /^sketch/.test(call.label),
      band: /^formalize/.test(call.label) ? "Formalize"
        : isAuditor || /^judge/.test(call.label) ? "Audit" : /^sketch/.test(call.label) ? "Sketch" : null }) });
    // After a sketch's tree, the edge to the replan runs down its left side.
    addEdge(previous, node, call.role, bypass != null ? { route: "bus", bus: bypass, label: "replan" }
      : { label: isAuditor ? "delegates code only" : previous.role === "auditor" ? "read-back" : "" });
    bypass = null;
    previous = node;
    if (!isAuditor) lastCaptain = node;
  };

  const workers = jobsByLemma.size ? sampleLanes()
    : [...new Set(calls.filter(c => c.lemma != null).map(c => c.worker))].sort((a, b) => a - b);
  const blockWidth = Math.max(NODE_WIDTH.lemma, workers.length * LANE);
  const runEndTime = outcome.wall_seconds ?? runEnd;
  let winners = [], keptNodes = [];

  sketchEvents.forEach((event, k) => {
    segments[k].forEach(placeSpine);
    const sketchNode = lastCaptain;
    const next = sketchEvents[k + 1];
    const replanAt = next ? (decisions.find(d => d.event === "replan" && d.index > event.index && d.index < next.index)
      || next).elapsed_seconds : null;
    const inSection = step => step.index > event.index && (!next || step.index < next.index);
    // The sketch's lemmas, with lemmas split off by a hand-back before their parent.
    const splits = decisions.filter(d => d.event === "lemma_handback" && d.action === "split" && inSection(d));
    const statements = [...(event.lemmas || [])];
    for (const split of splits) {
      const at = statements.findIndex(st => lemmaName(st) === split.lemma);
      statements.splice(Math.max(0, at), 0, ...(split.new_lemmas || []));
    }
    const names = statements.map(lemmaName).filter(Boolean);
    const statementOf = name => statements.find(st => lemmaName(st) === name);
    const splitFrom = new Map(splits.flatMap(split => (split.new_lemmas || []).map(st => [lemmaName(st), split])));
    const reused = new Set(decisions.filter(d => d.event === "lemma_reused" && inSection(d)).map(d => d.lemma));
    const earlier = name => sketchEvents.slice(0, k).some(e => (e.lemmas || []).some(st => lemmaName(st) === name));
    winners = []; keptNodes = [];
    const handbackNodes = new Map(), pendingSplitEdges = [];

    // Lemma columns left to right, centred under the sketch.
    const widths = names.map(name => reused.has(name) ? NODE_WIDTH.lemma : blockWidth);
    // Kept lemmas sit closer together than lemmas with attempts beneath them.
    const gaps = names.map((name, i) => !i ? 0 : reused.has(name) && reused.has(names[i - 1]) ? KEPT_GAP : LEMMA_GAP);
    const total = sum(widths) + sum(gaps);
    let cursor = -total / 2;
    const lemmaY = y + ROW + 20, attemptTop = lemmaY + ROW;
    let deepest = lemmaY, minX = 0;
    names.forEach((name, i) => {
      cursor += gaps[i];
      const x = cursor + widths[i] / 2;
      cursor += widths[i];
      minX = Math.min(minX, x - widths[i] / 2);
      const middle = i === Math.floor(names.length / 2);
      if (reused.has(name)) {
        const node = addNode({ id: `lemma:${k}:${name}`, kind: "lemma", role: "solver", x, y: lemmaY,
          start: event.elapsed_seconds, end: event.elapsed_seconds, lemma: name, carried: true,
          statement: statementOf(name), win: lemmaWins.get(name), title: name,
          subtitle: "proved in an earlier sketch", band: i === 0 ? "Prove" : null });
        addEdge(sketchNode, node, "captain", { label: middle ? "kept and delegated lemmas" : "" });
        keptNodes.push(node);
        return;
      }
      const win = lemmaWins.get(name);
      const sectionWin = win && inSection(win) ? win : null;
      const lemmaNode = addNode({ id: `lemma:${k}:${name}`, kind: "lemma", role: "solver", x, y: lemmaY,
        start: splitFrom.get(name)?.elapsed_seconds ?? event.elapsed_seconds,
        end: sectionWin ? sectionWin.elapsed_seconds : (replanAt ?? runEndTime),
        closeAt: sectionWin ? null : (replanAt ?? (outcome.status ? runEndTime : null)), replanned: replanAt != null,
        lemma: name, win: sectionWin, title: name, statement: statementOf(name),
        subtitle: splitFrom.has(name) ? `split from ${splitFrom.get(name).lemma}` : earlier(name) ? "restated after replan" : k ? "new in this sketch" : jobsByLemma.size
          ? `AIProver · ${cfg.workers ?? 1} sessions per job` : `${workers.length} solvers in parallel`,
        band: i === 0 ? "Prove" : null });
      if (splitFrom.has(name)) pendingSplitEdges.push([splitFrom.get(name), lemmaNode]);
      else addEdge(sketchNode, lemmaNode, "captain", { label: middle ? (k ? "kept and delegated lemmas" : "delegates lemmas") : "" });

      if (jobsByLemma.size) {
        // Jobs and hand-backs stack downward; every session of a job feeds
        // the next item.
        let upstream = [lemmaNode], previousItem = null, jy = attemptTop;
        const items = calls.filter(c => inSection(c) && ((isJob(c) && c.lemma === name) || handbackLemma(c) === name))
          .sort((a, b) => a.index - b.index);
        items.forEach(item => {
          if (isHandback(item)) {
            const decision = decisions.find(d => d.event === "lemma_handback" && d.lemma === name && d.index > item.index);
            const node = addNode({ id: `h${item.index}`, kind: "spine", x, y: jy, ...callNode(item, {
              role: "captain", title: "Hand-back to captain",
              subtitle: decision ? `captain · ${decision.action}` : "captain", handback: decision || null, lemma: name }) });
            upstream.forEach((up, u) => addEdge(up, node, "captain",
              u === Math.floor((upstream.length - 1) / 2) ? { label: "hand-back" } : {}));
            if (decision?.action === "proof" || decision?.action === "split") winners.push(node);
            if (decision) handbackNodes.set(decision.index, node);
            upstream = [node]; previousItem = item; jy += ROW;
            deepest = Math.max(deepest, node.y);
            return;
          }
          const job = item;
          const lanes = jobLanes(job);
          const outcomes = lanes.map(w => sampleOutcome(job, w));
          const start = Math.min(...outcomes.map(o => o.start));
          const jobNode = addNode({ id: `j${job.index}`, kind: "job", x, y: jy, step: job, role: "solver",
            start, replied: job.elapsed_seconds, end: job.elapsed_seconds, outcomes, lemma: name,
            title: `AIProver job ${jobNumber(job)}`,
            subtitle: `${formatClock(start)} · ${formatDuration(job.elapsed_seconds - start)} · ${plural(lanes.length, "session")}` });
          const label = !previousItem ? "" : isHandback(previousItem) ? "after hand-back" : transitionText(previousItem, job);
          upstream.forEach((up, u) => addEdge(up, jobNode, "solver",
            label && u === Math.floor((upstream.length - 1) / 2) ? { label } : {}));
          // Sessions spread under the job; many sessions are packed closer.
          const spacing = Math.min(LANE, (blockWidth + LEMMA_GAP - 20) / lanes.length);
          upstream = lanes.map((sampleIndex, w) => {
            const outcome = outcomes[w];
            const ay = jy + ROW;
            deepest = Math.max(deepest, ay);
            const node = addNode({ id: `a${job.index}s${sampleIndex}`, kind: "attempt",
              x: x + (w - (lanes.length - 1) / 2) * spacing, y: ay,
              step: job, check: outcome.check, role: "solver", sample: sampleIndex, outcome,
              start: outcome.start, replied: outcome.end,
              end: outcome.check ? outcome.check.elapsed_seconds : outcome.end,
              title: `session ${sampleIndex}`,
              subtitle: `${formatClock(outcome.start)} · ${formatDuration(outcome.end - outcome.start)}${outcome.turns != null ? ` · ${outcome.turns}t` : ""}`,
              lemma: name, worker: sampleIndex });
            addEdge(jobNode, node, "solver");
            if (outcome.state === "win") winners.push(node);
            return node;
          });
          previousItem = job; jy += 2 * ROW;
        });
        return;
      }
      // Chat solvers: one lane per chain, its repair rounds stacked downward.
      workers.forEach((worker, w) => {
        const laneX = x + (w - (workers.length - 1) / 2) * LANE;
        let upstream = lemmaNode;
        calls.filter(c => c.lemma === name && c.worker === worker && inSection(c))
          .sort((a, b) => a.index - b.index).forEach((call, r) => {
            const ay = attemptTop + r * ROW;
            deepest = Math.max(deepest, ay);
            const node = addNode({ id: `a${call.index}`, kind: "attempt", x: laneX, y: ay, ...callNode(call, {
              title: `solver ${worker} · r${call.round}`, subtitle: `#${call.index} · ${formatClock(callStart(call))}`,
              lemma: name, worker }) });
            const label = upstream.kind === "attempt" ? transitionText(upstream.step, call) : "";
            addEdge(upstream, node, "solver", label ? { repair: label === "errors", label } : {});
            upstream = node;
            if (sectionWin && sameAttempt(sectionWin, call)) winners.push(node);
          });
      });
    });
    // A split lemma hangs from the hand-back that created it.
    for (const [split, lemmaNode] of pendingSplitEdges) {
      const from = handbackNodes.get(split.index);
      if (from) addEdge(from, lemmaNode, "captain", { label: "split" });
      else addEdge(sketchNode, lemmaNode, "captain");
    }
    y = deepest + 30;
    bypass = minX - 40;
  });
  tail.forEach(placeSpine);

  // The lemmas of the final sketch are spliced into it and verified.
  y += ROW;
  const assembleSteps = steps.filter(s => s.stage === "assemble");
  const finalCheck = assembleSteps.find(s => s.kind === "lean_check");
  const verification = eventsOf("final_verification").at(-1);
  if (assembleSteps.length) {
    const assemble = addNode({ id: "assemble", kind: "assemble", role: "lean", x: 0, y,
      start: finalCheck ? finalCheck.elapsed_seconds - (finalCheck.seconds || 0) : assembleSteps[0].elapsed_seconds,
      end: finalCheck ? finalCheck.elapsed_seconds : assembleSteps[0].elapsed_seconds,
      step: finalCheck, title: "Assemble and verify", subtitle: "Lean · proofs spliced into sketch", band: "Verify" });
    [...winners, ...keptNodes].forEach(node => addEdge(node, assemble, "ok", { win: true }));
    if (!winners.length && !keptNodes.length) addEdge(lastCaptain, assemble, "lean");
    if (verification) {
      y += ROW + 6;
      const final = addNode({ id: "final", kind: "final", role: "lean", x: 0, y,
        start: verification.elapsed_seconds, end: verification.elapsed_seconds, step: verification,
        title: verification.checks?.verified ? "Verified Lean proof" : "Verification failed",
        subtitle: `axioms: ${(verification.checks?.axioms || []).join(", ") || "none"}` });
      addEdge(assemble, final, "ok", { win: !!verification.checks?.verified, label: "output" });
    }
  }
}
buildLayout();

// Node status at trace time t --------------------------------------------------------

function nodeState(node, t) {
  if (t < node.start) return { phase: "hidden" };
  if (node.kind === "problem" || node.kind === "root") return { phase: "done", status: "neutral", line: node.kind === "root" ? `${callsByRole("captain").length} calls in this run` : "" };
  if (node.kind === "lemma") {
    if (node.carried) return { phase: "done", status: "ok", line: "kept ✓" };
    if (node.win && t >= node.win.elapsed_seconds) return { phase: "done", status: "ok", line: `proved · ${winnerText(node.win)}` };
    if (node.closeAt != null && t >= node.closeAt)
      return { phase: "done", status: "fail", line: node.replanned ? "not proved · to replan" : "not proved" };
    return { phase: "running", status: "run", line: "solvers working", progress: null };
  }
  if (node.kind === "job") {
    if (t < node.replied) {
      const working = node.outcomes.filter(o => t < o.end).length;
      return { phase: "running", status: "run", line: `${plural(working, "session")} working`,
        progress: (t - node.start) / Math.max(1, node.replied - node.start) };
    }
    const states = node.outcomes.map(o => o.state);
    const status = states.includes("win") ? "win" : states.includes("ok") ? "ok"
      : states.every(state => state === "late") ? "late" : "fail";
    const line = status === "win" ? "proof kept ✓" : status === "late" ? "after lemma proved"
      : status === "ok" ? "compiles" : "no proof kept";
    return { phase: "done", status, line };
  }
  if (node.kind === "final") return { phase: "done", status: node.step.checks?.verified ? "ok" : "fail", line: "no sorry · statement matches" };
  if (node.kind === "assemble") {
    if (t < node.end) return { phase: "compiling", status: "lean", line: "Lean compiling…" };
    return { phase: "done", status: node.step?.ok ? "ok" : "fail", line: node.step?.ok ? "compiles, no sorry" : "Lean errors" };
  }
  // Model-call nodes.
  if (node.handback !== undefined && t >= node.replied) {
    const action = node.handback?.action;
    const line = { proof: "captain's proof kept ✓", split: "split; proof kept ✓", restate: "lemma restated",
      retry: "retry unchanged", rejected: "reply rejected by Lean" }[action] || "reply received";
    return { phase: "done", status: action === "proof" || action === "split" ? "ok" : action === "rejected" ? "fail" : "neutral", line };
  }
  if (t < node.replied) {
    const progress = (t - node.start) / Math.max(1, node.replied - node.start);
    return { phase: "running", status: "run", line: `thinking · ${formatClock(t - node.start)}`, progress };
  }
  if (node.check && t < node.check.elapsed_seconds) return { phase: "compiling", status: "lean", line: "Lean compiling…" };
  if (node.outcome) {
    const { state, check, text } = node.outcome;
    const win = lemmaWins.get(node.step.lemma);
    if (state === "win" && t < win.elapsed_seconds) return { phase: "done", status: "ok", line: "compiles" };
    const line = { win: "proof kept ✓", ok: "compiles", fail: `✗ ${plural((check?.errors || []).length, "error")}`,
      late: `${text} · after lemma proved` }[state] || text;
    const status = { win: "win", ok: "ok", fail: "fail" }[state] || "late";
    return { phase: "done", status, line };
  }
  if (node.step.lemma != null) {
    const state = solverOutcome(node.step).state;
    const win = lemmaWins.get(node.step.lemma);
    if (state === "win" && t < win.elapsed_seconds) return { phase: "done", status: "ok", line: "compiles" };
    const errors = (node.check?.errors || []).length;
    const text = state === "pending" && isJob(node.step) ? jobSummary(node.step)
      : { win: "proof kept ✓", ok: "compiles", fail: `✗ ${plural(errors, "error")}`, late: "discarded", rejected: "rejected", pending: "no proof returned" }[state];
    const status = { late: "late", win: "win", fail: "fail", ok: "ok", rejected: "late", pending: "late" }[state];
    return { phase: "done", status, line: text };
  }
  if (node.check) return { phase: "done", status: node.check.ok ? "ok" : "fail", line: node.check.ok ? (node.check.sorry_warning ? "compiles (sorry)" : "compiles") : `✗ ${plural(node.check.errors.length, "error")}` };
  const verdict = eventsOf("audit_verdict").find(v => v.index > node.step.index);
  if (/^judge/.test(node.step.label) && verdict) return { phase: "done", status: verdict.verdict === "FAITHFUL" ? "ok" : "fail", line: `verdict: ${verdict.verdict}` };
  return { phase: "done", status: "ok", line: "reply received" };
}

// Rendering ---------------------------------------------------------------------------

const clip = (text, max) => text.length > max ? text.slice(0, max - 1) + "…" : text;

// Edges run top to bottom; a `bus` edge leaves a node's left side, runs down a
// vertical line at x = `bus` (left of a sketch's tree) and enters the
// target's left side.
function edgeGeometry(edge) {
  const a = edge.from, b = edge.to;
  if (edge.route === "bus") {
    const x1 = a.x - a.w / 2, x2 = b.x - b.w / 2 - 3, bus = Math.min(edge.bus, x1 - 12);
    const enter = b.y, r = 8;
    return { d: `M${x1},${a.y} H${bus + r} Q${bus},${a.y} ${bus},${a.y + r} V${enter - r} Q${bus},${enter} ${bus + r},${enter} H${x2}`,
      lx: bus + 10, ly: enter - 12 };
  }
  const x1 = a.x, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y - b.h / 2 - 3;
  const mid = (y1 + y2) / 2;
  return { d: `M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}`, lx: (x1 + x2) / 2 + 6, ly: mid };
}

function nodeMarkup(node) {
  const { w, h } = node;
  const left = -w / 2, top = -h / 2;
  const role = node.role || "captain";
  const hasChip = node.kind === "attempt" || node.kind === "spine";
  const eyebrow = { problem: "PROBLEM", root: "ORCHESTRATOR", assemble: "LEAN", final: "OUTPUT" }[node.kind];
  // Characters that fit the node width at each line's font size.
  const fit = { title: Math.floor((w - (hasChip ? 34 : 24)) / (node.kind === "lemma" || node.kind === "problem" ? 7.4 : 7.6)),
    subtitle: Math.floor((w - 24) / 6.4) };
  let cursor = top + PAD_TOP, text = "", statusY = null;
  for (const line of node.lines) {
    cursor += LINE_HEIGHT[line];
    const baseline = cursor - 4;
    if (line === "eyebrow") {
      text += `<text x="${left + 14}" y="${baseline}" class="t2" style="letter-spacing:0.08em">${eyebrow}</text>`;
    } else if (line === "title") {
      const mono = node.kind === "lemma" || node.kind === "problem" || node.kind === "attempt";
      if (hasChip) text += `<circle class="chip-role r-${role}" cx="${left + 16}" cy="${baseline - 4}" r="4"></circle>`;
      text += `<text x="${left + (hasChip ? 26 : 14)}" y="${baseline}" class="t1${mono ? " mono" : ""}">${escapeHTML(clip(node.title || "", fit.title))}</text>`;
    } else if (line === "subtitle") {
      text += `<text x="${left + 14}" y="${baseline}" class="t3">${escapeHTML(clip(node.subtitle || "", fit.subtitle))}</text>`;
    } else if (line === "status") {
      statusY = baseline;
    }
  }
  const status = statusY === null
    ? `<text data-line style="display:none"></text>`
    : `<text x="${left + 14}" y="${statusY}" class="t2 status" data-line></text>`;
  return `<g class="rnode ${node.kind} r-${role} hidden" data-node="${node.id}" transform="translate(${node.x},${node.y})" tabindex="0" role="button" aria-label="${escapeHTML(node.title)}">
    <rect class="body" x="${left}" y="${top}" width="${w}" height="${h}" rx="9"></rect>
    ${text}${status}
    <rect class="progress-track" x="${left + 10}" y="${top + h - 8}" width="${w - 20}" height="3" rx="1.5" data-track></rect>
    <rect class="progress" x="${left + 10}" y="${top + h - 8}" width="0" height="3" rx="1.5" data-progress></rect>
  </g>`;
}

const BANDS = [];
function bandMarkup() {
  // Phase labels to the left of the first node of each phase.
  // A phase that recurs after another (a later sketch) is labelled again.
  return nodes.filter(n => n.band).map(n => {
    if (BANDS.at(-1)?.name === n.band) return "";
    BANDS.push({ name: n.band, y: n.y, start: n.start });
    return `<text class="band-label" x="${n.x - n.w / 2 - 18}" y="${n.y + 4}" text-anchor="end">${n.band.toUpperCase()}</text>`;
  }).join("");
}

function renderGraph() {
  const edgeMarkup = edges.map((edge, i) => {
    const { d, lx, ly } = edgeGeometry(edge);
    const cls = edge.win ? "win" : edge.repair ? "repair" : `r-${edge.role}`;
    return `<path class="ghost" d="${d}"></path><path class="redge ${cls} hidden" data-edge="${i}" d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#arrow)"></path>`
      + (edge.label ? `<text class="rlabel ${edge.repair ? "repair" : ""} hidden" data-edge-label="${i}" x="${lx}" y="${ly}">${edge.label}</text>` : "")
      + `<circle class="packet r-${edge.win ? "ok" : edge.role}" data-packet="${i}" r="5" cx="0" cy="0" opacity="0"></circle>`;
  }).join("");
  document.getElementById("viewport").innerHTML =
    `<g>${bandMarkup()}</g><g>${edgeMarkup}</g><g>${nodes.map(nodeMarkup).join("")}</g>`;
  nodes.forEach(n => {
    n.el = document.querySelector(`[data-node="${CSS.escape(n.id)}"]`);
    n.lineEl = n.el.querySelector("[data-line]");
    n.progressEl = n.el.querySelector("[data-progress]");
    n.trackEl = n.el.querySelector("[data-track]");
    n.shown = null;
  });
  edges.forEach((e, i) => {
    e.el = document.querySelector(`[data-edge="${i}"]`);
    e.labelEl = document.querySelector(`[data-edge-label="${i}"]`);
    e.packetEl = document.querySelector(`[data-packet="${i}"]`);
    e.length = e.el.getTotalLength?.() || 0;
  });
}

// Packets travel along an edge for this many seconds of wall-clock time.
const PACKET_SECONDS = 0.9;

function updateGraph(t) {
  for (const node of nodes) {
    const state = nodeState(node, t);
    const key = `${state.phase}|${state.status}|${state.line}`;
    if (key !== node.shown) {
      node.shown = key;
      node.el.setAttribute("class", `rnode ${node.kind} r-${node.role || "captain"} ${state.phase}${state.phase === "done" ? ` s-${state.status}` : ""}`);
      node.lineEl.textContent = state.line || "";
      node.lineEl.setAttribute("class", `t2 status s-${state.status}`);
    }
    const showBar = state.phase === "running" && state.progress != null;
    node.trackEl.style.display = showBar ? "" : "none";
    node.progressEl.style.display = showBar ? "" : "none";
    if (showBar) node.progressEl.setAttribute("width", Math.max(0, Math.min(1, state.progress)) * (node.w - 20));
    node.state = state;
  }
  const packetSpan = PACKET_SECONDS * speed;
  for (const edge of edges) {
    const shownAt = edge.at ?? edge.to.start;
    const visible = t >= shownAt;
    edge.el.classList.toggle("hidden", !visible);
    edge.el.setAttribute("stroke-dashoffset", visible ? 0 : 1);
    edge.labelEl?.classList.toggle("hidden", !visible);
    const since = t - shownAt;
    const moving = !reducedMotion && playing && since >= 0 && since < packetSpan && edge.length;
    if (moving) {
      const point = edge.el.getPointAtLength(since / packetSpan * edge.length);
      edge.packetEl.setAttribute("cx", point.x);
      edge.packetEl.setAttribute("cy", point.y);
      edge.packetEl.setAttribute("opacity", 1);
    } else {
      edge.packetEl.setAttribute("opacity", 0);
    }
  }
}

// Narration ---------------------------------------------------------------------------

function describe(step) {
  const who = step.lemma == null ? null
    : isJob(jobOf(step)) ? `AIProver job ${jobNumber(jobOf(step))} on ${step.lemma}` : `Solver ${step.worker} on ${step.lemma}`;
  if (step.kind === "model_call") {
    const call = step;
    const started = [callStart(call)];
    if (call.role === "auditor") return { t: started[0], role: "auditor", title: "Captain delegates a blind read-back",
      text: "The auditor receives only the Lean code and the auditor playbook, never the source, and states what the code literally asserts." };
    if (/^formalize/.test(call.label)) return { t: started[0], role: "captain", title: "Captain formalizes the statement",
      text: "The captain writes Lean definitions for the setting and a theorem statement whose proof is left as sorry." };
    if (/^judge/.test(call.label)) return { t: started[0], role: "captain", title: "Captain judges faithfulness",
      text: "The captain compares the auditor's read-back with the source statement: does the Lean code say exactly what the source says?" };
    if (/^sketch/.test(call.label)) return { t: started[0], role: "captain", title: "Captain sketches the proof",
      text: "The captain splits the proof into lemmas, each stated in full but left as sorry, and proves the main theorem from them." };
    if (isHandback(call)) return { t: started[0], role: "captain", title: `${handbackLemma(call)} handed back to the captain`,
      text: "The solvers failed on this lemma repeatedly. The captain reads their attempts and proves the lemma itself, splits it, restates it, or asks for a retry." };
    if (isJob(call)) return { t: started[0], role: "solver", title: who,
      text: `AIProver runs ${plural((call.samples || []).length || (cfg.workers ?? 1), "independent agentic Lean session")} on the lemma; ${jobSummary(call)}.` };
    if (call.lemma != null) return { t: started[0], role: "solver", title: `${who}, round ${call.round}`,
      text: call.round === 0 ? "The solver proposes a proof of the lemma from its statement, the definitions and the informal proof."
        : "The solver receives its previous proof with Lean's error messages and proposes a repair." };
  }
  if (step.kind === "lean_check") {
    if (step.lemma != null) {
      const call = callOfCheck.get(step.index);
      const late = call && solverOutcome(call).state === "late";
      const job = jobOf(step);
      if (captainCheck(step)) return { t: step.elapsed_seconds, role: "lean",
        title: `Lean checks the captain's ${/_restated$/.test(step.label) ? "restated sketch" : "proof"} for ${step.lemma}`,
        text: step.ok ? "It compiles." : `Lean reports ${plural(step.errors.length, "error")}.` };
      return { t: step.elapsed_seconds, role: "lean",
        title: job ? `Lean checks ${step.lemma} (AIProver job ${jobNumber(job)}, sample ${step.worker})`
          : `Lean checks ${step.lemma} (solver ${step.worker}, r${step.round})`,
        text: late ? "This chain replied after the lemma was already proved; its result is discarded."
          : step.ok ? "The proof compiles."
          : job ? `Lean reports ${plural(step.errors.length, "error")} in the proof extracted from this sample.`
          : `Lean reports ${plural(step.errors.length, "error")}; they are sent back to the solver.` };
    }
    if (step.stage === "assemble") return { t: step.elapsed_seconds, role: "lean", title: "Lean compiles the assembled solution",
      text: `The kept proofs replace every sorry in the sketch. ${step.ok ? "The complete file compiles" : "The file fails"}${step.sorry_warning ? "" : " with no sorry"}.` };
    return { t: step.elapsed_seconds, role: "lean", title: `Lean checks the ${step.label === "formalize" ? "formalization" : step.label}`,
      text: step.ok ? (step.label === "sketch" ? "The sketch compiles: the lemmas suffice to prove the theorem." : "The formalization compiles. The sorry placeholder is expected here.")
        : `Lean reports ${plural(step.errors.length, "error")}; they go back to the captain for repair.` };
  }
  if (step.event === "audit_verdict") return { t: step.elapsed_seconds, role: "captain", title: `Verdict: ${step.verdict}`,
    text: step.verdict === "FAITHFUL" ? "The read-back matches the source, so the formal statement is accepted." : "The formalization is sent back for revision." };
  if (step.event === "sketch_accepted") return { t: step.elapsed_seconds, role: "captain", title: `${plural((step.lemmas || []).length, "lemma")} delegated`,
    text: jobsByLemma.size
      ? `Each lemma goes to an AIProver job of ${plural(cfg.workers ?? 1, "sample")}; the first sample whose proof compiles is kept.`
      : `Each lemma goes to ${cfg.workers ?? "several"} independent solver chains running in parallel; the first proof that compiles is kept.` };
  if (step.event === "lemma_proved") return { t: step.elapsed_seconds, role: "solver", title: `${step.lemma} proved`,
    text: jobOf(step) ? `The proof from ${winnerText(step)} is kept.`
      : `Solver ${step.worker}'s round-${step.round} proof is kept. The other chains on this lemma stop.` };
  if (step.event === "final_verification") return { t: step.elapsed_seconds, role: "lean", title: step.checks?.verified ? "Verified" : "Verification failed",
    text: step.checks?.verified ? `The solution compiles without sorry, uses only ${(step.checks.axioms || []).join(", ")}, and its type equals the audited theorem.` : "One or more final checks failed." };
  if (step.event === "lemma_handback") return { t: step.elapsed_seconds, role: "captain",
    title: `Hand-back of ${step.lemma}: ${step.action}`, text: step.diagnosis || "" };
  if (step.event === "replan") return { t: step.elapsed_seconds, role: "captain", title: "Captain revises the sketch",
    text: "Some lemmas were not proved within budget; the captain writes a new decomposition." };
  return null;
}

const events = [{ t: 0, role: "decision", title: "The run begins",
  text: "The captain receives the informal statement and proof. Everything below follows from this input.", step: null }];
for (const step of steps) {
  const entry = describe(step);
  if (entry) events.push({ ...entry, step });
}
const solverStart = e => e.step?.kind === "model_call" && e.step.lemma != null ? 1 : 0;
events.sort((a, b) => a.t - b.t || solverStart(a) - solverStart(b) || (a.step?.index ?? -1) - (b.step?.index ?? -1));

function renderLog() {
  document.getElementById("log").innerHTML = events.map((e, i) =>
    `<button type="button" data-event="${i}"><span class="t">${formatClock(e.t)}</span><span class="dot ${e.role}"></span><span>${escapeHTML(e.title)}</span></button>`).join("");
}

let shownEvent = -1;
function updateNarration(t) {
  let current = 0;
  for (let i = 0; i < events.length; i++) if (events[i].t <= t) current = i;
  if (current === shownEvent) return;
  shownEvent = current;
  const e = events[current];
  document.getElementById("narration-title").textContent = e.title;
  document.getElementById("narration-text").textContent = e.text;
  const band = [...BANDS].reverse().find(b => b.start <= t);
  document.getElementById("phase-name").textContent = band ? band.name : "";
  document.querySelectorAll("#phases span").forEach(s => s.classList.toggle("on", s.textContent === band?.name));
  const buttons = document.querySelectorAll("#log button");
  buttons.forEach((b, i) => b.className = i < current ? "past" : i === current ? "now" : "future");
  buttons[current]?.scrollIntoView({ block: "nearest" });
}

// Camera ------------------------------------------------------------------------------

const view = { x: 0, y: 0, k: 1 };
let follow = true;

function applyView() {
  document.getElementById("viewport").setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
}

function frameFor(list, maxZoom = 1) {
  const stage = document.getElementById("stage").getBoundingClientRect();
  const minX = Math.min(...list.map(n => n.x - n.w / 2)) - 40, maxX = Math.max(...list.map(n => n.x + n.w / 2)) + 40;
  const minY = Math.min(...list.map(n => n.y - n.h / 2)) - 70, maxY = Math.max(...list.map(n => n.y + n.h / 2)) + 50;
  const k = Math.max(0.12, Math.min(maxZoom, stage.width / (maxX - minX), stage.height / (maxY - minY)));
  return { k, x: stage.width / 2 - (minX + maxX) / 2 * k, y: stage.height / 2 - (minY + maxY) / 2 * k };
}

// Nodes the camera keeps in view: those active now, plus the most recent finishers.
function focusNodes(t) {
  const visible = nodes.filter(n => t >= n.start);
  const active = visible.filter(n => n.state?.phase === "running" || n.state?.phase === "compiling");
  const recent = [...visible].sort((a, b) => b.end - a.end).slice(0, active.length ? 1 : 2);
  const list = [...new Set([...active, ...recent])];
  return list.length ? list : [nodes[0]];
}

function updateCamera(t, instant = false) {
  if (!follow) return;
  const target = frameFor(focusNodes(t), 1);
  const rate = instant || reducedMotion ? 1 : 0.07;
  view.x += (target.x - view.x) * rate;
  view.y += (target.y - view.y) * rate;
  view.k += (target.k - view.k) * rate;
  applyView();
}

function setFollow(on) {
  follow = on;
  document.getElementById("follow").setAttribute("aria-pressed", on);
}

function installPanZoom() {
  const stage = document.getElementById("stage");
  const pointers = new Map();
  let drag = null, pinch = null;
  const local = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const zoomAt = (factor, px, py) => {
    const k = Math.min(2.5, Math.max(0.12, view.k * factor));
    view.x = px - (px - view.x) * (k / view.k);
    view.y = py - (py - view.y) * (k / view.k);
    view.k = k;
    applyView();
  };
  stage.addEventListener("wheel", event => {
    event.preventDefault();
    setFollow(false);
    const [px, py] = local(event);
    zoomAt(Math.exp(-event.deltaY * (event.ctrlKey ? 0.01 : 0.0015)), px, py);
  }, { passive: false });
  stage.addEventListener("pointerdown", event => {
    if (event.target.closest(".stage-tools")) return;
    pointers.set(event.pointerId, local(event));
    if (pointers.size === 1) drag = { start: local(event), origin: { x: view.x, y: view.y }, moved: false, target: event.target };
    else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { distance: Math.hypot(a[0] - b[0], a[1] - b[1]), k: view.k };
      drag = null;
    }
  });
  stage.addEventListener("pointermove", event => {
    if (!pointers.has(event.pointerId)) return;
    pointers.set(event.pointerId, local(event));
    if (pinch && pointers.size === 2) {
      setFollow(false);
      const [a, b] = [...pointers.values()];
      zoomAt(pinch.k * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.distance / view.k, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      return;
    }
    if (!drag) return;
    const [x, y] = local(event);
    const dx = x - drag.start[0], dy = y - drag.start[1];
    if (!drag.moved && Math.hypot(dx, dy) > 4) {
      drag.moved = true;
      setFollow(false);
      stage.classList.add("dragging");
      stage.setPointerCapture(event.pointerId);
    }
    if (drag.moved) {
      view.x = drag.origin.x + dx;
      view.y = drag.origin.y + dy;
      applyView();
    }
  });
  const end = event => {
    if (!pointers.has(event.pointerId)) return;
    pointers.delete(event.pointerId);
    if (pointers.size < 2) pinch = null;
    if (drag && !drag.moved && event.type === "pointerup") {
      const g = drag.target.closest?.("[data-node]");
      if (g) openNode(byId.get(g.dataset.node));
    }
    if (pointers.size === 0) { drag = null; stage.classList.remove("dragging"); }
  };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);
}

// Node records ------------------------------------------------------------------------

function openNode(node) {
  if (!node || nodeState(node, time).phase === "hidden") return;
  pause();
  if (node.kind === "problem") {
    return showDrawer(summaryHead("Input problem", `<span><b>${escapeHTML(problem.uuid)}</b></span>`, "decision"),
      `<div class="tagblock"><span class="tagname">informal statement</span><div class="prose">${mathHTML(problem.informal_statement || "")}</div></div>
       <div class="tagblock"><span class="tagname">informal proof</span><div class="prose">${mathHTML(problem.informal_proof || "")}</div></div>`);
  }
  if (node.kind === "root") {
    return showDrawer(summaryHead("Captain", `<span>model <b>${escapeHTML(TRACE.models?.orchestrator)}</b></span>`, "captain"),
      `<p>The orchestrating model. It formalizes, judges, and plans the proof itself, and delegates the
       read-back to the auditor and each lemma to ${cfg.workers ?? "several"} parallel solvers.</p>
       ${stepList(callsByRole("captain"))}`);
  }
  if (node.kind === "lemma") {
    const statement = node.statement || (finalSketch?.lemmas || []).find(l => lemmaName(l) === node.lemma);
    return showDrawer(summaryHead(`<code>${escapeHTML(node.lemma)}</code>`, `<span>${plural(calls.filter(c => c.lemma === node.lemma).length, "solver call")}</span>`, "solver"),
      `${statement ? `<div class="tagblock"><span class="tagname">statement</span>${leanHTML(statement)}</div>` : ""}
       ${node.win ? `<div class="tagblock"><span class="tagname">kept proof · ${winnerText(node.win)}</span>${leanHTML(node.win.proof || "")}</div>` : ""}
       ${stepList(steps.filter(s => s.lemma === node.lemma))}`);
  }
  if (node.kind === "final") {
    return showDrawer(summaryHead("Verified Lean proof", `<span>axioms <b>${escapeHTML((node.step.checks?.axioms || []).join(", "))}</b></span>`, "lean"),
      `<table class="kv">${Object.entries(node.step.checks || {}).filter(([, v]) => typeof v === "boolean")
        .map(([k, v]) => `<tr><td class="num">${k}</td><td>${v ? `<span class="pill ok">pass</span>` : `<span class="pill fail">fail</span>`}</td></tr>`).join("")}</table>
       ${leanHTML(node.step.solution || "", new Set(), "tall")}`);
  }
  if (node.step) showStep(node.step.index, node.sample ?? null);
}

// Export ------------------------------------------------------------------------------
// Renders the completed tree (state at the end of the run) to a JPEG. Styles are
// inlined from the live page because an SVG drawn into a canvas sees no CSS.

const EXPORT_STYLES = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-dasharray",
  "stroke-dashoffset", "stroke-opacity", "opacity", "font-family", "font-size", "font-weight",
  "letter-spacing", "display", "visibility", "paint-order", "stroke-linejoin"];
const EXPORT_SCALE = 2;

function finalTreeSVG() {
  const svg = document.getElementById("graph");
  svg.classList.add("exporting");
  updateGraph(runEnd);
  const clone = svg.cloneNode(true);
  const sources = [svg, ...svg.querySelectorAll("*")];
  const targets = [clone, ...clone.querySelectorAll("*")];
  sources.forEach((source, i) => {
    const computed = getComputedStyle(source);
    targets[i].setAttribute("style", EXPORT_STYLES.map(name => `${name}:${computed.getPropertyValue(name)}`).join(";"));
    targets[i].removeAttribute("class");
  });
  clone.querySelectorAll("[data-packet], [data-track], [data-progress]").forEach(el => el.remove());
  svg.classList.remove("exporting");
  updateGraph(time);

  // Frame every node and phase label, with a header line above the tree.
  const padding = 40, header = 70;
  const minX = Math.min(...nodes.map(n => n.x - n.w / 2)) - 150;
  const maxX = Math.max(...nodes.map(n => n.x + n.w / 2));
  const minY = Math.min(...nodes.map(n => n.y - n.h / 2));
  const maxY = Math.max(...nodes.map(n => n.y + n.h / 2));
  const width = maxX - minX + 2 * padding, height = maxY - minY + 2 * padding + header;
  const root = getComputedStyle(document.documentElement);
  const color = name => root.getPropertyValue(name).trim();
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  clone.setAttribute("width", width);
  clone.setAttribute("height", height);
  clone.setAttribute("viewBox", `0 0 ${width} ${height}`);
  clone.querySelector("#viewport").setAttribute("transform", `translate(${padding - minX},${padding + header - minY})`);
  const verified = outcome.checks?.verified;
  const font = getComputedStyle(document.body).fontFamily.replace(/"/g, "'");
  clone.insertAdjacentHTML("afterbegin", `
    <rect width="${width}" height="${height}" style="fill:${color("--bg")}"></rect>
    <text x="${padding}" y="${padding + 8}" style="font-family:${font};font-size:22px;font-weight:600;fill:${color("--ink")}">${escapeHTML(TRACE.theorem_name)}</text>
    <text x="${padding}" y="${padding + 34}" style="font-family:${font};font-size:14px;fill:${color("--muted")}">${escapeHTML(`${TRACE.run_id} · ${verified ? "proved, verified" : outcome.status || "incomplete"} · ${formatDuration(outcome.wall_seconds || runEnd)} · ${TRACE.models?.orchestrator} + ${TRACE.models?.worker}`)}</text>`);
  return { markup: new XMLSerializer().serializeToString(clone), width, height, background: color("--bg") };
}

function svgToJPEG({ markup, width, height, background }) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([markup], { type: "image/svg+xml;charset=utf-8" }));
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = width * EXPORT_SCALE;
      canvas.height = height * EXPORT_SCALE;
      const context = canvas.getContext("2d");
      context.fillStyle = background;   // JPEG has no transparency
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.scale(EXPORT_SCALE, EXPORT_SCALE);
      context.drawImage(image, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("The browser could not encode the image.")), "image/jpeg", 0.92);
    };
    image.onerror = () => { URL.revokeObjectURL(url); reject(new Error("The browser could not render the tree.")); };
    image.src = url;
  });
}

// In a published artifact the `downloads` capability asks the viewer to confirm;
// opened as a local file, a plain download link does the same job.
async function saveFile(blob, filename) {
  const downloads = window.claude?.use ? await window.claude.use("downloads") : null;
  if (downloads) return downloads.save({ filename, data: blob });
  const url = URL.createObjectURL(blob);
  const link = Object.assign(document.createElement("a"), { href: url, download: filename });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return { status: "saved" };
}

async function exportTree() {
  const button = document.getElementById("export");
  const status = document.getElementById("export-status");
  const report = text => { status.textContent = text; status.hidden = !text; };
  pause();
  button.disabled = true;
  report("Rendering the final tree…");
  try {
    const blob = await svgToJPEG(finalTreeSVG());
    const result = await saveFile(blob, `${TRACE.run_id}_orchestration_tree.jpg`);
    report(result.status === "saved" ? `Saved ${TRACE.run_id}_orchestration_tree.jpg` : "");
  } catch (error) {
    const messages = { declined: "Export cancelled.", rate_limited: "A save prompt is already open.",
      unavailable: "Saving files is not available in this view." };
    report(messages[error?.code] || error?.message || "Export failed.");
  } finally {
    button.disabled = false;
    setTimeout(() => report(""), 4000);
  }
}

// Playback ------------------------------------------------------------------------------

let time = 0, playing = false, speed = 15, lastFrame = null;

function setTime(t, instantCamera = false) {
  time = Math.max(0, Math.min(runEnd, t));
  updateGraph(time);
  updateNarration(time);
  updateCamera(time, instantCamera);
  document.getElementById("scrub").value = Math.round(time / runEnd * 1000);
  document.getElementById("clock").textContent = `${formatClock(time)} / ${formatClock(runEnd)}`;
}

function frame(now) {
  if (lastFrame !== null && playing) {
    setTime(time + (now - lastFrame) / 1000 * speed);
    if (time >= runEnd) pause();
  } else if (!playing) {
    updateCamera(time);
  }
  lastFrame = now;
  requestAnimationFrame(frame);
}

function play() {
  if (time >= runEnd) setTime(0, true);
  playing = true;
  document.getElementById("play").textContent = "❚❚ Pause";
}
function pause() {
  playing = false;
  document.getElementById("play").textContent = time >= runEnd ? "↺ Replay" : "▶ Play";
  updateGraph(time);
}

function jumpEvent(direction) {
  const index = direction > 0
    ? events.findIndex(e => e.t > time + 0.01)
    : events.map(e => e.t).findLastIndex(t => t < time - 0.01);
  if (index >= 0) setTime(events[index].t + (direction > 0 ? 0.01 : 0), false);
  else if (direction > 0) setTime(runEnd);
  else setTime(0);
}

function init() {
  renderHeader();
  installDrawerHandlers();
  renderGraph();
  renderLog();
  document.getElementById("phases").innerHTML = BANDS.map(b => `<span>${b.name}</span>`).join("");
  installPanZoom();

  document.getElementById("play").addEventListener("click", () => playing ? pause() : play());
  document.getElementById("prev-event").addEventListener("click", () => jumpEvent(-1));
  document.getElementById("next-event").addEventListener("click", () => jumpEvent(1));
  document.getElementById("scrub").addEventListener("input", event => setTime(Number(event.target.value) / 1000 * runEnd));
  document.getElementById("speed").addEventListener("change", event => { speed = Number(event.target.value); });
  document.getElementById("follow").addEventListener("click", () => setFollow(!follow));
  document.getElementById("export").addEventListener("click", exportTree);
  document.getElementById("fit").addEventListener("click", () => {
    setFollow(false);
    Object.assign(view, frameFor(nodes, 1));
    applyView();
  });
  document.getElementById("log").addEventListener("click", event => {
    const button = event.target.closest("[data-event]");
    if (button) setTime(events[Number(button.dataset.event)].t + 0.01);
  });
  document.addEventListener("keydown", event => {
    if (drawerOpen || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target.closest?.("input, select")) return;
    const node = event.target.closest?.("[data-node]");
    if (node && event.key === "Enter") return openNode(byId.get(node.dataset.node));
    if (event.key === " ") { event.preventDefault(); playing ? pause() : play(); }
    else if (event.key === "ArrowRight") jumpEvent(1);
    else if (event.key === "ArrowLeft") jumpEvent(-1);
    else if (event.key === "f") setFollow(!follow);
  });

  // Opening frame: the whole orchestration, so the reader sees its shape before playing.
  Object.assign(view, frameFor(nodes, 1));
  applyView();
  setFollow(false);
  setTime(0);
  requestAnimationFrame(frame);
  document.getElementById("play").addEventListener("click", () => setFollow(true), { once: true });
}

init();
</script>
</body>
</html>
