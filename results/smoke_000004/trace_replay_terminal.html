const escapeHTML = value => String(value ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const formatClock = seconds => {
  const s = Math.max(0, Math.round(seconds));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};
const formatDuration = seconds => seconds >= 90
  ? `${(seconds / 60).toFixed(1)} min` : `${seconds.toFixed(1)} s`;
const formatUSD = value => `$${(value || 0).toFixed(value < 0.1 ? 3 : 2)}`;
const sum = values => values.reduce((a, b) => a + (b || 0), 0);
const plural = (n, word, many = word + "s") => `${n} ${n === 1 ? word : many}`;

// Derived views of the trace --------------------------------------------------

const steps = TRACE.steps;
const calls = steps.filter(s => s.kind === "model_call");
const checks = steps.filter(s => s.kind === "lean_check");
const decisions = steps.filter(s => s.kind === "decision");
const eventsOf = name => decisions.filter(d => d.event === name);

// An AIProver call is one job of several samples, not one chat reply. Its Lean
// checks and its lemma_proved decision follow it in the trace and carry the
// sample index as `worker`, so they are attributed to the job by position: the
// job of a step is the last job on the same lemma recorded before it.
const isJob = step => step?.kind === "model_call" && step.backend === "aiprover";
const jobsByLemma = new Map();
for (const call of calls.filter(isJob)) {
  if (!jobsByLemma.has(call.lemma)) jobsByLemma.set(call.lemma, []);
  jobsByLemma.get(call.lemma).push(call);
}
const jobOfStep = new Map();
for (const step of steps) {
  if (step.lemma == null || step.kind === "model_call") continue;
  const job = (jobsByLemma.get(step.lemma) || []).filter(j => j.index < step.index).at(-1);
  if (job) jobOfStep.set(step.index, job);
}
const jobOf = step => (isJob(step) ? step : jobOfStep.get(step.index)) || null;
const jobNumber = job => (jobsByLemma.get(job.lemma) || []).indexOf(job) + 1;

const sameAttempt = (a, b) => {
  const jobA = jobOf(a), jobB = jobOf(b);
  if (jobA || jobB) return jobA === jobB;
  return a.lemma === b.lemma && a.worker === b.worker && a.round === b.round;
};

// Independent sessions (samples) an AIProver job ran in parallel on its lemma.
const jobSamples = job => (job.samples || []).length || TRACE.config?.workers || 1;
// Largest number of AIProver jobs, and of their sessions, in flight at once.
// Sessions beyond the harness's max_parallel wait inside AIProver.
function peakInFlight() {
  const events = [];
  for (const jobs of jobsByLemma.values()) for (const job of jobs) {
    const start = job.elapsed_seconds - (job.seconds || 0);
    events.push([start, 1, jobSamples(job)], [job.elapsed_seconds, -1, -jobSamples(job)]);
  }
  events.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  let jobs = 0, sessions = 0, peakJobs = 0, peakSessions = 0;
  for (const [, dj, ds] of events) {
    jobs += dj; sessions += ds;
    peakJobs = Math.max(peakJobs, jobs); peakSessions = Math.max(peakSessions, sessions);
  }
  return { jobs: peakJobs, sessions: peakSessions };
}

// How each AIProver sample ended, from the harness's status of its Lean file.
// The status is that of the sample's final Lean file; the ending, when known,
// is why its session stopped (timeout, turn limit, server lost, ...).
const SAMPLE_TEXT = { verified: "verified", sorry: "sorry", error: "Lean error",
  empty: "no answer", infra: "server lost", unknown: "no status" };
function sampleText(sample) {
  const status = SAMPLE_TEXT[sample.status] || sample.status;
  const ending = sample.ending && sample.ending !== "finished" ? sample.ending : "";
  return ending && ending !== status ? `${status} · ${ending}` : status;
}
function jobSummary(job) {
  const samples = job.samples || [];
  if (!samples.length) return job.error ? "job failed" : "no answer";
  return samples.map(sampleText).join(", ");
}
// Sample `k` of an AIProver job: how it ended, its Lean check if its proof was
// extracted and checked, and when it finished (job start + its elapsed time).
function sampleOutcome(job, k) {
  const samples = job.samples || [];
  const sample = samples.find(s => s.sample === k) || samples[k] || null;
  const check = checks.find(c => jobOf(c) === job && c.worker === k) || null;
  const win = lemmaWins.get(job.lemma);
  const kept = !!win && jobOf(win) === job && win.worker === k;
  const late = !!win && !kept && job.index > win.index;
  const state = kept ? "win" : late ? "late" : check ? (check.ok ? "ok" : "fail") : "pending";
  const text = sample ? sampleText(sample) : job.error ? "job failed" : "no answer";
  const start = job.elapsed_seconds - (job.seconds || 0);
  const end = Math.min(job.elapsed_seconds, start + (sample?.elapsed_sec ?? job.seconds ?? 0));
  return { sample, check, state, text, start, end, turns: sample?.turns ?? null };
}
const sampleLanes = () => [...Array(Math.max(1, ...calls.filter(isJob).map(jobSamples))).keys()];

// Who proved a lemma, for the lemma_proved decision `win`.
function winnerText(win) {
  const job = jobOf(win);
  return job ? `AIProver job ${jobNumber(job)}, sample ${win.worker}`
    : `solver ${win.worker}, round ${win.round}`;
}
// Why a lemma has a further attempt after `previous`: Lean errors for a chat
// solver; for AIProver a new job, after a replan (a new sketch) or else a
// resumption if one lies between the two calls.
function transitionText(previous, next) {
  if (!isJob(next)) return solverOutcome(previous).state === "fail" ? "errors" : "";
  const between = decisions.filter(d => d.index > previous.index && d.index < next.index);
  if (between.some(d => d.event === "replan")) return "replan";
  if (between.some(d => d.event === "resumed")) return "resumed";
  return "new job";
}

// Each model call that produced Lean code is paired with the check of that code.
const checkOfCall = new Map();
const callOfCheck = new Map();
for (const call of calls) {
  let check = null;
  if (call.lemma != null) {
    check = checks.find(k => k.lemma != null && sameAttempt(k, call));
  } else if (/^(formalize|sketch)/.test(call.label || "")) {
    check = checks.find(k => k.index > call.index && k.lemma == null
      && k.stage === call.stage && !callOfCheck.has(k.index));
  }
  if (check) {
    checkOfCall.set(call.index, check);
    callOfCheck.set(check.index, call);
  }
}
const rejections = eventsOf("solver_attempt_rejected");
const lemmaWins = new Map(eventsOf("lemma_proved").map(d => [d.lemma, d]));

// Outcome of one solver call, for colouring the timeline and step lists.
function solverOutcome(call) {
  const win = lemmaWins.get(call.lemma);
  const check = checkOfCall.get(call.index);
  const late = win && call.index > win.index;
  if (win && sameAttempt(win, call)) return { state: "win", late: false, check };
  if (late) return { state: "late", late: true, check };
  if (check) return { state: check.ok ? "ok" : "fail", late: false, check };
  if (rejections.some(r => sameAttempt(r, call))) return { state: "rejected", late: false };
  return { state: "pending", late: false };
}

const lemmaName = statement => (statement.match(/(?:theorem|lemma)\s+([^\s(:{\[]+)/) || [])[1];
const sketches = eventsOf("sketch_accepted");
const finalSketch = sketches[sketches.length - 1];
const lemmaOrder = [];
for (const sketch of sketches) {
  for (const statement of sketch.lemmas || []) {
    const name = lemmaName(statement);
    if (name && !lemmaOrder.includes(name)) lemmaOrder.push(name);
  }
}
for (const call of calls) {
  if (call.lemma != null && !lemmaOrder.includes(call.lemma)) lemmaOrder.push(call.lemma);
}

const roleOf = step => step.kind === "lean_check" ? "lean"
  : step.kind === "decision" ? "decision" : step.role;

// Rendering: Lean, math, prompts ----------------------------------------------

const LEAN_KEYWORDS = new Set(("theorem lemma def inductive structure namespace end open by fun "
  + "exact intro intros have show refine unfold match with if then else let in where calc "
  + "rfl simp rw apply constructor cases induction at import set_option noncomputable "
  + "instance class example abbrev private protected obtain rcases use omega decide "
  + "Type Prop").split(" "));
const LEAN_TOKEN = /(\/-[\s\S]*?-\/)|(--[^\n]*)|("(?:[^"\\\n]|\\.)*")|([A-Za-z_À-ɏ][\w'.À-ɏ]*)|([\s\S])/g;

// Lean source as numbered lines; `errorLines` is a set of 1-based line numbers.
function leanHTML(source, errorLines = new Set(), extraClass = "") {
  const lines = [[]];
  let match;
  LEAN_TOKEN.lastIndex = 0;
  while ((match = LEAN_TOKEN.exec(source))) {
    let cls = "";
    if (match[1] || match[2]) cls = "cm";
    else if (match[3]) cls = "st";
    else if (match[4]) cls = match[4] === "sorry" ? "sorry" : LEAN_KEYWORDS.has(match[4]) ? "kw" : "";
    const pieces = match[0].split("\n");
    pieces.forEach((piece, i) => {
      if (i > 0) lines.push([]);
      if (piece) lines[lines.length - 1].push(cls ? `<span class="${cls}">${escapeHTML(piece)}</span>` : escapeHTML(piece));
    });
  }
  while (lines.length > 1 && lines[lines.length - 1].length === 0) lines.pop();
  const body = lines.map((parts, i) => {
    const n = i + 1;
    return `<span class="line${errorLines.has(n) ? " err" : ""}" data-line="${n}"><span class="no">${n}</span>${parts.join("")}</span>`;
  }).join("");
  return `<pre class="lean ${extraClass}"><code>${body}</code></pre>`;
}

const errorLinesOf = errors => new Set((errors || []).flatMap(e =>
  [...String(e).matchAll(/\.lean:(\d+):\d+:/g)].map(m => Number(m[1]))));

const TEX_MACROS = {
  "\\PV": "\\mathsf{PV}", "\\eps": "\\varepsilon", "\\zo": "\\{0,1\\}",
  "\\TR": "\\mathrm{TR}", "\\ITR": "\\mathrm{ITR}", "\\M": "\\mathcal{M}",
  "\\FP": "\\mathsf{FP}", "\\calF": "\\mathcal{F}",
};
const MATH_SPAN = /\$\$([\s\S]+?)\$\$|\\begin\{equation\*?\}([\s\S]+?)\\end\{equation\*?\}|\\\[([\s\S]+?)\\\]|\$([^$\n]+?)\$/g;

function texHTML(tex, display) {
  if (!window.katex) return `<code>${escapeHTML(display ? tex : "$" + tex + "$")}</code>`;
  try {
    return katex.renderToString(tex.trim(), {
      displayMode: display, output: "mathml", throwOnError: false,
      macros: { ...TEX_MACROS },
    });
  } catch (error) {
    return `<code>${escapeHTML(tex)}</code>`;
  }
}

function inlineCode(text) {
  return escapeHTML(text).replace(/`([^`\n]+)`/g, "<code>$1</code>");
}

// Prose containing $...$ / $$...$$ / \begin{equation} math and `code`.
function mathHTML(text) {
  let out = "", last = 0, match;
  MATH_SPAN.lastIndex = 0;
  while ((match = MATH_SPAN.exec(text))) {
    out += inlineCode(text.slice(last, match.index));
    const display = match[4] === undefined;
    out += texHTML(match[1] ?? match[2] ?? match[3] ?? match[4], display);
    last = MATH_SPAN.lastIndex;
  }
  return out + inlineCode(text.slice(last));
}

// Minimal Markdown for the playbook-derived system prompts.
function markdownHTML(text) {
  const blocks = [];
  let list = null, para = [];
  const inline = s => inlineCode(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<em>$2</em>");
  const flushPara = () => { if (para.length) blocks.push(`<p>${inline(para.join(" "))}</p>`); para = []; };
  const flushList = () => { if (list) blocks.push(`<ul>${list.map(li => `<li>${inline(li)}</li>`).join("")}</ul>`); list = null; };
  for (const line of text.split("\n")) {
    const heading = line.match(/^(#{1,4})\s+(.*)/);
    const item = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (heading) { flushPara(); flushList(); blocks.push(`<h4>${inline(heading[2])}</h4>`); }
    else if (item) { flushPara(); (list ||= []).push(item[1]); }
    else if (!line.trim()) { flushPara(); flushList(); }
    else if (list) { list[list.length - 1] += " " + line.trim(); }
    else para.push(line.trim());
  }
  flushPara(); flushList();
  return `<div class="md">${blocks.join("")}</div>`;
}

const LEAN_TAGS = new Set(["definitions", "preamble", "statement", "lemmas", "main_proof",
  "proof", "helpers", "available_lemmas", "target_lemma", "previous_helpers",
  "previous_proof", "solution", "lean_code", "formal_statement", "previous_definitions",
  "previous_statement", "previous_lemmas", "previous_main_proof"]);
const PLAIN_TAGS = new Set(["lean_errors", "errors", "problems"]);

// A prompt or reply split into free text and <tag>...</tag> blocks.
function taggedHTML(text) {
  const parts = [];
  const pattern = /<([a-z_]+)>([\s\S]*?)<\/\1>/g;
  let last = 0, match;
  while ((match = pattern.exec(text))) {
    if (text.slice(last, match.index).trim()) parts.push({ prose: text.slice(last, match.index).trim() });
    parts.push({ tag: match[1], body: match[2].replace(/^\n+/, "").replace(/\s+$/, "") });
    last = pattern.lastIndex;
  }
  if (text.slice(last).trim()) parts.push({ prose: text.slice(last).trim() });
  return parts.map(part => {
    if (part.prose) return `<div class="prose">${mathHTML(part.prose)}</div>`;
    let body;
    if (!part.body) body = `<div class="muted">(empty)</div>`;
    else if (LEAN_TAGS.has(part.tag)) body = leanHTML(part.body);
    else if (PLAIN_TAGS.has(part.tag)) body = `<pre class="plain errors">${escapeHTML(part.body)}</pre>`;
    else body = `<div class="prose">${mathHTML(part.body)}</div>`;
    return `<div class="tagblock"><span class="tagname">&lt;${part.tag}&gt;</span>${body}</div>`;
  }).join("");
}

function templateHTML(text) {
  return `<pre class="plain">${escapeHTML(text).replace(/\{([a-z_]+)\}/g, '<span class="placeholder">{$1}</span>')}</pre>`;
}

// Step summaries ----------------------------------------------------------------

const EVENT_TEXT = {
  formalization_compiled: "Formalization compiles",
  formalization_rejected: "Formalization rejected",
  audit_verdict: "Audit verdict",
  sketch_accepted: "Sketch accepted",
  sketch_rejected: "Sketch rejected",
  lemma_proved: "Lemma proved",
  solver_attempt_rejected: "Attempt rejected before Lean",
  solver_budget_exhausted: "Solver chain exhausted its budget",
  replan: "Sketch revision requested",
  lemma_reused: "Proved lemma reused",
  final_verification: "Final verification",
};

function stepTitle(step) {
  if (step.kind === "model_call") {
    if (isJob(step)) return `AIProver job ${jobNumber(step)} · ${step.lemma}`;
    if (step.lemma != null) return `solver ${step.worker} · ${step.lemma} · round ${step.round}`;
    return `${step.role} · ${step.label}`;
  }
  if (step.kind === "lean_check") return `Lean check · ${step.file}`;
  return EVENT_TEXT[step.event] || step.event;
}

function stepResult(step) {
  if (step.kind === "model_call") {
    if (step.error) return `<span class="pill fail">error</span>`;
    if (step.lemma != null) {
      const { state } = solverOutcome(step);
      const label = state === "pending" && isJob(step) ? jobSummary(step)
        : { win: "proof kept", ok: "compiles", fail: "Lean errors",
            late: "after lemma proved", rejected: "rejected", pending: "no proof returned" }[state];
      const tone = { win: "ok", ok: "ok", fail: "fail", late: "neutral", rejected: "warn", pending: "neutral" }[state];
      return `<span class="pill ${tone}">${label}</span>`;
    }
    return `<span class="muted mono">${formatDuration(step.seconds || 0)}</span>`;
  }
  if (step.kind === "lean_check") {
    if (!step.ok) return `<span class="pill fail">${plural((step.errors || []).length, "error")}</span>`;
    return step.sorry_warning
      ? `<span class="pill warn">compiles · sorry</span>`
      : `<span class="pill ok">compiles</span>`;
  }
  if (step.event === "audit_verdict") {
    return `<span class="pill ${step.verdict === "FAITHFUL" ? "ok" : "fail"}">${escapeHTML(step.verdict)}</span>`;
  }
  if (step.event === "final_verification") {
    return `<span class="pill ${step.checks?.verified ? "ok" : "fail"}">${step.checks?.verified ? "verified" : "not verified"}</span>`;
  }
  if (step.event === "lemma_proved") return `<span class="pill ok">${escapeHTML(step.lemma)}</span>`;
  return "";
}

function stepRow(step) {
  const role = roleOf(step);
  return `<button class="steprow" type="button" data-step="${step.index}">
    <span class="idx">#${step.index}</span>
    <span class="t">${formatClock(step.elapsed_seconds)}</span>
    <span class="dot ${role}" title="${role}"></span>
    <span class="what"><span class="lbl">${escapeHTML(stepTitle(step))}</span></span>
    <span>${stepResult(step)}</span>
  </button>`;
}
const stepList = list => list.length
  ? `<div class="steps">${list.map(stepRow).join("")}</div>`
  : `<p class="muted">No steps of this kind in this run.</p>`;
const stepLink = step => step ? `<button class="steplink" type="button" data-step="${step.index}">#${step.index}</button>` : "";

const cfg = TRACE.config || {};
const outcome = TRACE.outcome || {};
const problem = TRACE.problem || {};
const totalCost = sum(calls.map(c => c.cost_usd));
const callsByRole = role => calls.filter(c => c.role === role);

// The proposition itself, without the shared setting paragraph.
function propositionText() {
  const paragraphs = (problem.informal_statement || "").split(/\n\s*\n/);
  return (paragraphs.length > 1 ? paragraphs.slice(1) : paragraphs).join("\n\n");
}

function lemmaUses(text, self) {
  return lemmaOrder.filter(name => name !== self && new RegExp(`(^|[^\\w'.])${name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![\\w'])`).test(text || ""));
}

// Step drawer --------------------------------------------------------------------------

let openStep = null;
let drawerOpen = false;
let drawerTab = "response";

// Tabs of the step drawer: `panels` is a list of [id, name, html]. The tab
// last chosen stays selected when the next drawer has it.
function tabsHTML(panels) {
  const active = panels.some(([id]) => id === drawerTab) ? drawerTab : panels[0][0];
  return `<div class="tabs" role="tablist">${panels.map(([id, name]) =>
      `<button type="button" role="tab" data-tab="${id}" aria-selected="${active === id}">${name}</button>`).join("")}</div>
    ${panels.map(([id, , html]) => `<div data-panel="${id}" ${active === id ? "" : "hidden"}>${html}</div>`).join("")}`;
}

// Lean output, one message per `file:line:col: severity:` header.
function diagnosticsHTML(text) {
  if (!text) return `<p class="muted">No diagnostics: Lean reported nothing for this file.</p>`;
  const html = escapeHTML(text).replace(/^(\S+\.lean:\d+:\d+: )(error|warning)(:.*)$/gm,
    (_, where, severity, rest) => `${where}<span class="${severity}">${severity}${rest}</span>`);
  return `<pre class="diag">${html}</pre>`;
}
const diagnosticErrorLines = text => new Set([...String(text || "").matchAll(/\.lean:(\d+):\d+: error/g)]
  .map(m => Number(m[1])));
const flagPill = (value, yes, no) => value == null ? ""
  : `<span class="pill ${value ? "ok" : "fail"}">${value ? yes : no}</span>`;

// The harness's Lean check of a sample's whole final file.
function harnessCheckHTML(check) {
  if (!check || !Object.keys(check).length) {
    return `<p class="muted">The harness's check of this sample is not recorded.</p>`;
  }
  return `
    <div class="checkline"><span class="k">AIProver harness · Lean check of the final file</span>
      ${check.verdict ? `<span class="pill ${check.verdict === "PASS" ? "ok" : "fail"}">${escapeHTML(check.verdict)}</span>` : ""}
      ${flagPill(check.compiles, "compiles", "does not compile")}
      ${flagPill(check.complete, "no sorry", "contains sorry")}
      ${check.axioms_used ? `<span class="pill neutral">axioms: ${escapeHTML(check.axioms_used.join(", ") || "none")}</span>` : ""}</div>
    ${(check.problems || []).length ? `<ul class="problems">${check.problems.map(p => `<li>${escapeHTML(p)}</li>`).join("")}</ul>` : ""}
    ${diagnosticsHTML(check.diagnostics)}`;
}

// The pipeline's Lean check of the lemma proof extracted from a sample.
function extractedCheckHTML(outcome) {
  const { check, state } = outcome;
  if (!check) {
    return `<div class="checkline"><span class="k">Pipeline · Lean check of the extracted lemma proof</span>
      <span class="pill neutral">not run</span></div>
      <p class="muted">${state === "late" ? "The lemma was already proved when this sample finished."
        : "The final file holds no sorry-free proof of the lemma, so nothing was extracted to check."}</p>`;
  }
  const errors = check.errors || [];
  return `
    <div class="checkline"><span class="k">Pipeline · Lean check of the extracted lemma proof</span>
      <span class="pill ${check.ok ? "ok" : "fail"}">${check.ok ? (check.sorry_warning ? "compiles · sorry" : "compiles") : plural(errors.length, "error")}</span>
      ${state === "win" ? `<span class="pill ok">proof kept</span>` : ""} ${stepLink(check)}</div>
    ${errors.length ? diagnosticsHTML(errors.join("\n")) : ""}`;
}

// A Lean check of a chat model's code (captain or chat solver).
function chatCheckHTML(check) {
  if (!check) return `<p class="muted">Lean did not check this reply.</p>`;
  const errors = check.errors || [];
  return `<div class="checkline"><span class="k">Lean check ${stepLink(check)}</span>${stepResult(check)}</div>
    ${errors.length ? diagnosticsHTML(errors.join("\n")) : `<p class="muted">No errors.</p>`}
    <div class="tagblock"><span class="tagname">${escapeHTML(check.file || "")}</span>${leanHTML(check.source || "", errorLinesOf(errors), "tall")}</div>`;
}

// The model's reasoning before assistant turn `turn`, from the logging proxy.
const reasoningOfTurn = (sample, turn) => (sample.reasoning || []).filter(r => r.turn === turn);

function reasoningBlock(text, open = false) {
  return `<details class="fold reasoning" ${open ? "open" : ""}><summary><b>Reasoning</b>
    <span class="muted">${plural(text.split(/\s+/).filter(Boolean).length, "word")}</span></summary>
    <div class="body"><pre class="plain wrap">${escapeHTML(text)}</pre></div></details>`;
}

// One tool call: Lean written to a file is shown as Lean, other arguments as JSON.
function toolCallHTML(call) {
  let args = call.arguments || "";
  let lean = "";
  try {
    const parsed = JSON.parse(args);
    if (typeof parsed.content === "string" && /\.lean$/.test(parsed.file_path || parsed.path || "")) {
      lean = parsed.content;
      delete parsed.content;
    }
    args = JSON.stringify(parsed, null, 1);
  } catch { /* arguments cut at the trace limit stay as text */ }
  return `<div class="toolcall"><span class="pill neutral mono">${escapeHTML(call.name || "tool")}</span>
    <pre class="plain wrap">${escapeHTML(args)}</pre>${lean ? leanHTML(lean, new Set(), "tall") : ""}</div>`;
}

// The agent's session: its messages, tool calls, tool results and, where the
// proxy recorded it, its reasoning before each turn.
function sessionHTML(sample) {
  const session = sample.session || [];
  if (!session.length) return `<p class="muted">The session transcript is not recorded for this sample.</p>`;
  let turn = 0;
  return `<div class="session">${session.map(entry => {
    if (entry.role === "tool") {
      return `<details class="fold toolresult"><summary><span class="mono muted">result of ${escapeHTML(entry.name || "tool")}</span>
        <span class="muted">${plural(entry.text.split("\n").length, "line")}</span></summary>
        <div class="body">${/\.lean:\d+:\d+:/.test(entry.text) ? diagnosticsHTML(entry.text) : `<pre class="plain wrap">${escapeHTML(entry.text)}</pre>`}</div></details>`;
    }
    if (entry.role === "assistant") {
      turn += 1;
      const thoughts = reasoningOfTurn(sample, turn).map(r => reasoningBlock(r.reasoning || "")).join("");
      return `<div class="turn"><div class="turnhead"><span class="mono">turn ${turn}</span></div>${thoughts}
        ${entry.text ? `<div class="prose">${mathHTML(entry.text)}</div>` : ""}
        ${(entry.tool_calls || []).map(toolCallHTML).join("")}</div>`;
    }
    return `<details class="fold"><summary><b>${entry.injected ? "Harness message" : turn ? "User message" : "Task"}</b>
      <span class="muted">${plural(entry.text.split("\n").length, "line")}</span></summary>
      <div class="body"><pre class="plain wrap">${escapeHTML(entry.text)}</pre></div></details>`;
  }).join("")}</div>`;
}

function reasoningHTML(sample) {
  const records = sample.reasoning || [];
  if (!records.length) {
    return `<p class="muted">The model's reasoning is not recorded for this sample. The AIProver harness
      discards it; runs started after the reasoning proxy was installed record it per turn.</p>`;
  }
  return records.map(r => `<div class="turn"><div class="turnhead"><span class="mono">turn ${r.turn}</span>
    <span class="muted">${escapeHTML(r.time || "")}</span></div>${reasoningBlock(r.reasoning || "", true)}</div>`).join("");
}

// Drawer panels of an AIProver job, for one sample (a solver lane) or all.
function jobPanels(job, sampleIndex) {
  const lanes = sampleIndex == null ? sampleLanes() : [sampleIndex];
  const per = render => lanes.map(k => {
    const outcome = sampleOutcome(job, k);
    const head = lanes.length > 1 ? `<h4 class="lanehead">solver ${k}</h4>` : "";
    return head + render(outcome.sample || {}, outcome, k);
  }).join("");
  return [
    ["response", "Reply", per(sample => sample.lean
      ? leanHTML(sample.lean, diagnosticErrorLines(sample.check?.diagnostics), "tall")
      : `<p class="muted">The final Lean file is not recorded.</p>`)],
    ["prompt", "Prompt", taggedHTML(job.prompt || "")],
    ["system", "System prompt", job.system_prompt
      ? markdownHTML(TRACE.system_prompts?.[job.system_prompt] || job.system_prompt)
      : `<p class="muted">AIProver composes its own system prompt inside the harness; the task above is
         what the pipeline sends.</p>`],
    ["lean", "Lean returns", per((sample, outcome) => harnessCheckHTML(sample.check) + extractedCheckHTML(outcome))],
    ["session", "Session", per(sample => sessionHTML(sample))],
    ["reasoning", "Reasoning", per(sample => reasoningHTML(sample))],
  ];
}

function stepDetail(step, sampleIndex = null) {
  const meta = [`<span>at <b>${formatClock(step.elapsed_seconds)}</b></span>`, `<span>stage <b>${escapeHTML(step.stage)}</b></span>`];
  let body = "";
  if (isJob(step)) {
    const job = step;
    meta.push(`<span>AIProver job <b>${jobNumber(job)}</b> on <b>${escapeHTML(job.lemma)}</b></span>`);
    if (sampleIndex != null) {
      const o = sampleOutcome(job, sampleIndex);
      meta.push(`<span>solver <b>${sampleIndex}</b></span>`,
        `<span>duration <b>${formatDuration(o.end - o.start)}</b></span>`,
        o.turns != null ? `<span>turns <b>${o.turns}</b></span>` : "",
        o.sample?.ending ? `<span>ended <b>${escapeHTML(o.sample.ending)}</b></span>` : "",
        `<span>result <b>${escapeHTML({ win: "proof kept", ok: "compiles", fail: "Lean errors" }[o.state] || o.text)}</b></span>`);
    } else {
      meta.push(`<span>duration <b>${formatDuration(job.seconds || 0)}</b></span>`, `<span>samples <b>${jobSummary(job)}</b></span>`);
    }
    const previous = (jobsByLemma.get(job.lemma) || [])[jobNumber(job) - 2];
    const note = `<p class="note">${previous ? `Started after a ${escapeHTML(transitionText(previous, job))} (previous job ${stepLink(previous)}).`
      : "First AIProver job on this lemma."} Each job runs ${plural(jobSamples(job), "independent session")}.</p>`;
    body = note + tabsHTML(jobPanels(job, sampleIndex));
  } else if (step.kind === "model_call") {
    meta.push(`<span>model <b>${escapeHTML(step.model)}</b></span>`,
      `<span>duration <b>${formatDuration(step.seconds || 0)}</b></span>`,
      `<span>output tokens <b>${(step.usage?.outputTokens ?? 0).toLocaleString()}</b></span>`,
      `<span>cost <b>${formatUSD(step.cost_usd)}</b></span>`);
    const check = checkOfCall.get(step.index);
    const note = step.role === "auditor"
      ? `<p class="note">The auditor's message contains only Lean code. Its system prompt is the auditor playbook.</p>` : "";
    const linked = check ? `<p class="note">The code in this reply was compiled in ${stepLink(check)}: ${stepResult(check)}</p>` : "";
    const panels = [
      ["response", "Reply", step.error ? `<pre class="plain errors">${escapeHTML(step.error)}</pre>` : taggedHTML(step.response || "")],
      ["prompt", "Prompt", taggedHTML(step.prompt || "")],
      ["system", "System prompt", markdownHTML(TRACE.system_prompts?.[step.system_prompt] || step.system_prompt || "")],
    ];
    if (check) panels.push(["lean", "Lean returns", chatCheckHTML(check)]);
    body = `${note}${linked}${tabsHTML(panels)}`;
  } else if (step.kind === "lean_check") {
    meta.push(`<span>duration <b>${formatDuration(step.seconds || 0)}</b></span>`);
    const call = callOfCheck.get(step.index);
    const axioms = Object.entries(step.axioms || {});
    body = `
      ${call ? `<p class="note">Compiles the code from ${stepLink(call)} (${escapeHTML(stepTitle(call))}).</p>` : ""}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${stepResult(step)}
        ${step.sorry_warning ? `<span class="muted">The file still contains <code>sorry</code>${step.lemma != null ? " (earlier lemmas are included unproved)" : ""}.</span>` : ""}</div>
      ${(step.errors || []).length ? `<div class="tagblock"><span class="tagname">compiler errors</span><pre class="plain errors">${escapeHTML(step.errors.join("\n\n"))}</pre></div>` : ""}
      ${axioms.length ? `<p>Axioms: ${axioms.map(([name, list]) => `<code>${escapeHTML(name)}</code> → ${list.map(a => `<code>${escapeHTML(a)}</code>`).join(", ")}`).join("; ")}</p>` : ""}
      <div class="tagblock"><span class="tagname">${escapeHTML(step.file)}</span>${leanHTML(step.source || "", errorLinesOf(step.errors), "tall")}</div>`;
  } else {
    body = Object.entries(step).filter(([k]) => !["index", "kind", "stage", "elapsed_seconds", "event"].includes(k)).map(([key, value]) => {
      let inner;
      if (typeof value === "string" && (LEAN_TAGS.has(key) || key === "solution")) inner = value ? leanHTML(value, new Set(), "tall") : `<span class="muted">(empty)</span>`;
      else if (Array.isArray(value) && value.every(v => typeof v === "string") && key === "lemmas") inner = leanHTML(value.join("\n\n"));
      else if (typeof value === "string") inner = `<div class="prose">${mathHTML(value)}</div>`;
      else inner = `<pre class="plain">${escapeHTML(JSON.stringify(value, null, 1))}</pre>`;
      return `<div class="tagblock"><span class="tagname">${escapeHTML(key)}</span>${inner}</div>`;
    }).join("");
  }
  const role = roleOf(step);
  return {
    head: `<div class="row"><span class="dot ${role}"></span><span class="mono muted">#${step.index} of ${steps.length - 1}</span>
        <span class="spacer"></span>
        <button class="btn" type="button" data-drawer="prev" ${step.index === 0 ? "disabled" : ""} aria-label="Previous step">←</button>
        <button class="btn" type="button" data-drawer="next" ${step.index === steps.length - 1 ? "disabled" : ""} aria-label="Next step">→</button>
        <button class="btn" type="button" data-drawer="close">Close</button></div>
      <h3>${escapeHTML(stepTitle(step))}</h3>
      <div class="meta">${meta.join("")}</div>`,
    body,
  };
}

// Opens the drawer with arbitrary content; `index` is set for step records only.
function showDrawer(head, body, index = null) {
  openStep = index;
  drawerOpen = true;
  document.getElementById("drawer-head").innerHTML = head;
  const bodyEl = document.getElementById("drawer-body");
  bodyEl.innerHTML = body;
  bodyEl.scrollTop = 0;
  document.getElementById("drawer").hidden = false;
  document.getElementById("scrim").hidden = false;
  // Bring the first compiler error into view inside the Lean listing.
  const errorLine = bodyEl.querySelector(".line.err");
  if (errorLine) {
    const pre = errorLine.closest("pre");
    pre.scrollTop = Math.max(0, errorLine.offsetTop - pre.clientHeight / 3);
  }
  document.querySelector('#drawer [data-drawer="close"]').focus({ preventScroll: true });
}

// Drawer header for content that is not a single step.
function summaryHead(title, meta = "", dotClass = "") {
  return `<div class="row">${dotClass ? `<span class="dot ${dotClass}"></span>` : ""}
      <span class="spacer"></span><button class="btn" type="button" data-drawer="close">Close</button></div>
    <h3>${title}</h3>${meta ? `<div class="meta">${meta}</div>` : ""}`;
}

function showStep(index, sampleIndex = null) {
  const step = steps[index];
  if (!step) return;
  const { head, body } = stepDetail(step, sampleIndex);
  showDrawer(head, body, index);
}

function closeStep() {
  openStep = null;
  drawerOpen = false;
  document.getElementById("drawer").hidden = true;
  document.getElementById("scrim").hidden = true;
}

// Clicks on step links and drawer controls, and keys while the drawer is open.
// Page handlers should ignore keys when `drawerOpen` is true.
function installDrawerHandlers() {
  document.addEventListener("click", event => {
    if (event.target.id === "scrim") return closeStep();
    const target = event.target.closest("[data-step],[data-drawer],[data-tab]");
    if (!target) return;
    const d = target.dataset;
    if (d.step !== undefined) showStep(Number(d.step));
    else if (d.drawer === "close") closeStep();
    else if (d.drawer === "prev") showStep(openStep - 1);
    else if (d.drawer === "next") showStep(openStep + 1);
    else if (d.tab) {
      drawerTab = d.tab;
      document.querySelectorAll("#drawer [data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === d.tab));
      document.querySelectorAll("#drawer [data-panel]").forEach(p => { p.hidden = p.dataset.panel !== d.tab; });
    }
  });
  document.addEventListener("keydown", event => {
    if (!drawerOpen || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === "Escape") closeStep();
    else if (openStep !== null && event.key === "ArrowRight") showStep(Math.min(steps.length - 1, openStep + 1));
    else if (openStep !== null && event.key === "ArrowLeft") showStep(Math.max(0, openStep - 1));
  });
}

function renderHeader() {
  document.getElementById("thm").textContent = TRACE.theorem_name;
  document.getElementById("run").textContent = TRACE.run_id;
  document.getElementById("models").textContent = `${TRACE.models?.orchestrator} + ${TRACE.models?.worker}`;
  const verified = outcome.checks?.verified;
  document.getElementById("status").innerHTML = `<span class="pill ${verified ? "ok" : outcome.status ? "fail" : "neutral"}">${verified ? "proved · verified" : escapeHTML(outcome.status || "in progress")}</span>`;
}


// Timing ------------------------------------------------------------------------------
// All times are trace seconds since the start of the run. A model call spans
// [reply time − duration, reply time]; its Lean check ends at the check's time.

// Solver calls cannot start before the sketch hands out the lemmas; the
// trace rounds times to 0.1 s, so the raw difference can be slightly earlier.
const lemmaHandoff = eventsOf("sketch_accepted")[0]?.elapsed_seconds ?? 0;
const callStart = call => Math.max(call.elapsed_seconds - (call.seconds || 0),
  call.lemma != null ? lemmaHandoff : 0);
const runEnd = Math.max(outcome.wall_seconds || 0, ...steps.map(s => s.elapsed_seconds)) + 2;
const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;

// Layout (top → bottom) -----------------------------------------------------------------

// Node widths, and the text lines each kind of node shows, top to bottom.
const NODE_WIDTH = { problem: 250, root: 250, spine: 230, lemma: 230, attempt: 140, assemble: 260, final: 280 };
const NODE_LINES = {
  problem: ["eyebrow", "title", "subtitle"],
  root: ["eyebrow", "title", "subtitle", "status"],
  spine: ["title", "subtitle", "status"],
  lemma: ["title", "subtitle", "status"],
  attempt: ["title", "subtitle", "status"],
  assemble: ["eyebrow", "title", "subtitle", "status"],
  final: ["eyebrow", "title", "subtitle", "status"],
};
const LINE_HEIGHT = { eyebrow: 16, title: 19, subtitle: 16, status: 16 };
const PAD_TOP = 9, PAD_BOTTOM = 14;   // bottom padding holds the progress bar
const LANE = 160, LEMMA_GAP = 90, ROW = 118;

const nodes = [];
const edges = [];
const byId = new Map();

function addNode(node) {
  const lines = NODE_LINES[node.kind];
  const h = PAD_TOP + sum(lines.map(line => LINE_HEIGHT[line])) + PAD_BOTTOM;
  Object.assign(node, { w: NODE_WIDTH[node.kind], h, lines });
  nodes.push(node);
  byId.set(node.id, node);
  return node;
}
function addEdge(from, to, role, extra = {}) {
  edges.push({ from, to, role, ...extra });
}

// State of a node that wraps a model call (and possibly its Lean check).
function callNode(call, fields) {
  const check = checkOfCall.get(call.index) || null;
  return {
    step: call, check, role: call.role,
    start: callStart(call), replied: call.elapsed_seconds,
    end: check ? check.elapsed_seconds : call.elapsed_seconds,
    ...fields,
  };
}

function buildLayout() {
  let y = 0;
  const problemNode = addNode({ id: "problem", kind: "problem", x: 0, y, start: 0, end: 0,
    title: TRACE.theorem_name, subtitle: `${problem.source_name} · ${problem.source_subset}`, band: "Input" });
  y += ROW;
  const root = addNode({ id: "captain", kind: "root", role: "captain", x: 0, y, start: 0, end: 0,
    title: "Captain", subtitle: `orchestrator · ${TRACE.models?.orchestrator}` });
  addEdge(problemNode, root, "captain", { label: "statement + proof" });

  // Captain and auditor work, in time order; the auditor branches to the right.
  const spineCalls = calls.filter(c => c.role === "captain" || c.role === "auditor").sort((a, b) => a.index - b.index);
  let previous = root, lastCaptain = root;
  for (const call of spineCalls) {
    y += ROW;
    const isAuditor = call.role === "auditor";
    const kindText = /^formalize/.test(call.label) ? "Formalize" : /^judge/.test(call.label) ? "Faithfulness verdict"
      : /^sketch/.test(call.label) ? "Proof sketch" : isAuditor ? "Blind read-back" : call.label;
    const node = addNode({ id: `s${call.index}`, kind: "spine", x: isAuditor ? 300 : 0, y, ...callNode(call, {
      title: kindText, subtitle: `${call.role} · ${call.label}`, band: /^formalize/.test(call.label) ? "Formalize"
        : isAuditor || /^judge/.test(call.label) ? "Audit" : /^sketch/.test(call.label) ? "Sketch" : null }) });
    addEdge(previous, node, call.role, { label: isAuditor ? "delegates code only" : previous.role === "auditor" ? "read-back" : "" });
    previous = node;
    if (!isAuditor) lastCaptain = node;
  }

  // Sketch fans out into lemmas; each lemma fans out into solver lanes.
  const lemmaNames = lemmaOrder.filter(name => calls.some(c => c.lemma === name));
  // AIProver traces get one lane per sample; chat solvers one lane per worker.
  const workers = jobsByLemma.size ? sampleLanes()
    : [...new Set(calls.filter(c => c.lemma != null).map(c => c.worker))].sort((a, b) => a - b);
  const blockWidth = workers.length * LANE;
  const sketchTime = (eventsOf("sketch_accepted").at(-1) || {}).elapsed_seconds ?? lastCaptain.end;
  y += ROW + 20;
  const lemmaY = y;
  const attemptTop = lemmaY + ROW;
  let deepest = attemptTop;
  const winners = [];
  lemmaNames.forEach((name, i) => {
    const x = (i - (lemmaNames.length - 1) / 2) * (blockWidth + LEMMA_GAP);
    const win = lemmaWins.get(name);
    const lemmaNode = addNode({ id: `lemma:${name}`, kind: "lemma", role: "solver", x, y: lemmaY,
      start: sketchTime, end: win ? win.elapsed_seconds : runEnd, lemma: name, win,
      title: name, subtitle: (jobsByLemma.get(name) || []).length
        ? `AIProver · ${cfg.workers ?? 1} parallel sessions per job`
        : `${workers.length} solvers in parallel`, band: i === 0 ? "Prove" : null });
    addEdge(lastCaptain, lemmaNode, "captain", { label: i === Math.floor(lemmaNames.length / 2) ? "delegates lemmas" : "" });
    if (jobsByLemma.has(name)) {
      workers.forEach((sampleIndex, k) => {
        const laneX = x + (k - (workers.length - 1) / 2) * LANE;
        let upstream = lemmaNode;
        jobsByLemma.get(name).forEach((job, r) => {
          const ay = attemptTop + r * ROW;
          deepest = Math.max(deepest, ay);
          const outcome = sampleOutcome(job, sampleIndex);
          const node = addNode({ id: `a${job.index}s${sampleIndex}`, kind: "attempt", x: laneX, y: ay,
            step: job, check: outcome.check, role: "solver", sample: sampleIndex, outcome,
            start: outcome.start, replied: outcome.end,
            end: outcome.check ? outcome.check.elapsed_seconds : outcome.end,
            title: `solver ${sampleIndex} · j${jobNumber(job)}`,
            subtitle: `${formatClock(outcome.start)} · ${formatDuration(outcome.end - outcome.start)}${outcome.turns != null ? ` · ${outcome.turns}t` : ""}`,
            lemma: name, worker: sampleIndex });
          const label = upstream.kind === "attempt" ? transitionText(upstream.step, job) : "";
          addEdge(upstream, node, "solver", label ? { label } : {});
          upstream = node;
          if (outcome.state === "win") winners.push(node);
        });
      });
      return;
    }
    workers.forEach((worker, k) => {
      const laneX = x + (k - (workers.length - 1) / 2) * LANE;
      let upstream = lemmaNode;
      calls.filter(c => c.lemma === name && c.worker === worker).sort((a, b) => a.index - b.index)
        .forEach((call, r) => {
          const ay = attemptTop + r * ROW;
          deepest = Math.max(deepest, ay);
          const title = isJob(call) ? `job ${jobNumber(call)} · ${plural(jobSamples(call), "sample")}` : `solver ${worker} · r${call.round}`;
          const node = addNode({ id: `a${call.index}`, kind: "attempt", x: laneX, y: ay, ...callNode(call, {
            title, subtitle: `#${call.index} · ${formatClock(callStart(call))}`, lemma: name, worker }) });
          const label = upstream.kind === "attempt" ? transitionText(upstream.step, call) : "";
          addEdge(upstream, node, "solver", label ? { repair: label === "errors", label } : {});
          upstream = node;
          if (win && sameAttempt(win, call)) winners.push(node);
        });
    });
  });

  // Winning proofs converge on assembly, then on the verified result.
  y = deepest + ROW + 30;
  const assembleSteps = steps.filter(s => s.stage === "assemble");
  const finalCheck = assembleSteps.find(s => s.kind === "lean_check");
  const verification = eventsOf("final_verification").at(-1);
  if (assembleSteps.length) {
    const assemble = addNode({ id: "assemble", kind: "assemble", role: "lean", x: 0, y,
      start: finalCheck ? finalCheck.elapsed_seconds - (finalCheck.seconds || 0) : assembleSteps[0].elapsed_seconds,
      end: finalCheck ? finalCheck.elapsed_seconds : assembleSteps[0].elapsed_seconds,
      step: finalCheck, title: "Assemble and verify", subtitle: "Lean · proofs spliced into sketch", band: "Verify" });
    winners.forEach(w => addEdge(w, assemble, "ok", { win: true }));
    if (!winners.length) addEdge(lastCaptain, assemble, "lean");
    if (verification) {
      y += ROW + 6;
      const final = addNode({ id: "final", kind: "final", role: "lean", x: 0, y,
        start: verification.elapsed_seconds, end: verification.elapsed_seconds, step: verification,
        title: verification.checks?.verified ? "Verified Lean proof" : "Verification failed",
        subtitle: `axioms: ${(verification.checks?.axioms || []).join(", ") || "none"}` });
      addEdge(assemble, final, "ok", { win: !!verification.checks?.verified, label: "output" });
    }
  }
}
buildLayout();

// Node status at trace time t --------------------------------------------------------

function nodeState(node, t) {
  if (t < node.start) return { phase: "hidden" };
  if (node.kind === "problem" || node.kind === "root") return { phase: "done", status: "neutral", line: node.kind === "root" ? `${callsByRole("captain").length} calls in this run` : "" };
  if (node.kind === "lemma") {
    if (node.win && t >= node.win.elapsed_seconds) return { phase: "done", status: "ok", line: `proved · ${winnerText(node.win)}` };
    return { phase: "running", status: "run", line: "solvers working", progress: null };
  }
  if (node.kind === "final") return { phase: "done", status: node.step.checks?.verified ? "ok" : "fail", line: "no sorry · statement matches" };
  if (node.kind === "assemble") {
    if (t < node.end) return { phase: "compiling", status: "lean", line: "Lean compiling…" };
    return { phase: "done", status: node.step?.ok ? "ok" : "fail", line: node.step?.ok ? "compiles, no sorry" : "Lean errors" };
  }
  // Model-call nodes.
  if (t < node.replied) {
    const progress = (t - node.start) / Math.max(1, node.replied - node.start);
    return { phase: "running", status: "run", line: `thinking · ${formatClock(t - node.start)}`, progress };
  }
  if (node.check && t < node.check.elapsed_seconds) return { phase: "compiling", status: "lean", line: "Lean compiling…" };
  if (node.outcome) {
    const { state, check, text } = node.outcome;
    const win = lemmaWins.get(node.step.lemma);
    if (state === "win" && t < win.elapsed_seconds) return { phase: "done", status: "ok", line: "compiles" };
    const line = { win: "proof kept ✓", ok: "compiles", fail: `✗ ${plural((check?.errors || []).length, "error")}`,
      late: `${text} · after lemma proved` }[state] || text;
    const status = { win: "win", ok: "ok", fail: "fail" }[state] || "late";
    return { phase: "done", status, line };
  }
  if (node.step.lemma != null) {
    const state = solverOutcome(node.step).state;
    const win = lemmaWins.get(node.step.lemma);
    if (state === "win" && t < win.elapsed_seconds) return { phase: "done", status: "ok", line: "compiles" };
    const errors = (node.check?.errors || []).length;
    const text = state === "pending" && isJob(node.step) ? jobSummary(node.step)
      : { win: "proof kept ✓", ok: "compiles", fail: `✗ ${plural(errors, "error")}`, late: "discarded", rejected: "rejected", pending: "no proof returned" }[state];
    const status = { late: "late", win: "win", fail: "fail", ok: "ok", rejected: "late", pending: "late" }[state];
    return { phase: "done", status, line: text };
  }
  if (node.check) return { phase: "done", status: node.check.ok ? "ok" : "fail", line: node.check.ok ? (node.check.sorry_warning ? "compiles (sorry)" : "compiles") : `✗ ${plural(node.check.errors.length, "error")}` };
  const verdict = eventsOf("audit_verdict").find(v => v.index > node.step.index);
  if (/^judge/.test(node.step.label) && verdict) return { phase: "done", status: verdict.verdict === "FAITHFUL" ? "ok" : "fail", line: `verdict: ${verdict.verdict}` };
  return { phase: "done", status: "ok", line: "reply received" };
}

// Rendering ---------------------------------------------------------------------------

const clip = (text, max) => text.length > max ? text.slice(0, max - 1) + "…" : text;

function edgeGeometry(edge) {
  const a = edge.from, b = edge.to;
  const x1 = a.x, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y - b.h / 2 - 3;
  const mid = (y1 + y2) / 2;
  return { d: `M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}`, lx: (x1 + x2) / 2 + 6, ly: mid };
}

function nodeMarkup(node) {
  const { w, h } = node;
  const left = -w / 2, top = -h / 2;
  const role = node.role || "captain";
  const hasChip = node.kind === "attempt" || node.kind === "spine";
  const eyebrow = { problem: "PROBLEM", root: "ORCHESTRATOR", assemble: "LEAN", final: "OUTPUT" }[node.kind];
  // Characters that fit the node width at each line's font size.
  const fit = { title: Math.floor((w - (hasChip ? 34 : 24)) / (node.kind === "lemma" || node.kind === "problem" ? 7.4 : 7.6)),
    subtitle: Math.floor((w - 24) / 6.4) };
  let cursor = top + PAD_TOP, text = "", statusY = null;
  for (const line of node.lines) {
    cursor += LINE_HEIGHT[line];
    const baseline = cursor - 4;
    if (line === "eyebrow") {
      text += `<text x="${left + 14}" y="${baseline}" class="t2" style="letter-spacing:0.08em">${eyebrow}</text>`;
    } else if (line === "title") {
      const mono = node.kind === "lemma" || node.kind === "problem" || node.kind === "attempt";
      if (hasChip) text += `<circle class="chip-role r-${role}" cx="${left + 16}" cy="${baseline - 4}" r="4"></circle>`;
      text += `<text x="${left + (hasChip ? 26 : 14)}" y="${baseline}" class="t1${mono ? " mono" : ""}">${escapeHTML(clip(node.title || "", fit.title))}</text>`;
    } else if (line === "subtitle") {
      text += `<text x="${left + 14}" y="${baseline}" class="t3">${escapeHTML(clip(node.subtitle || "", fit.subtitle))}</text>`;
    } else if (line === "status") {
      statusY = baseline;
    }
  }
  const status = statusY === null
    ? `<text data-line style="display:none"></text>`
    : `<text x="${left + 14}" y="${statusY}" class="t2 status" data-line></text>`;
  return `<g class="rnode ${node.kind} r-${role} hidden" data-node="${node.id}" transform="translate(${node.x},${node.y})" tabindex="0" role="button" aria-label="${escapeHTML(node.title)}">
    <rect class="body" x="${left}" y="${top}" width="${w}" height="${h}" rx="9"></rect>
    ${text}${status}
    <rect class="progress-track" x="${left + 10}" y="${top + h - 8}" width="${w - 20}" height="3" rx="1.5" data-track></rect>
    <rect class="progress" x="${left + 10}" y="${top + h - 8}" width="0" height="3" rx="1.5" data-progress></rect>
  </g>`;
}

const BANDS = [];
function bandMarkup() {
  // Phase labels to the left of the first node of each phase.
  return nodes.filter(n => n.band).map(n => {
    if (BANDS.some(b => b.name === n.band)) return "";
    BANDS.push({ name: n.band, y: n.y, start: n.start });
    return `<text class="band-label" x="${n.x - n.w / 2 - 18}" y="${n.y + 4}" text-anchor="end">${n.band.toUpperCase()}</text>`;
  }).join("");
}

function renderGraph() {
  const edgeMarkup = edges.map((edge, i) => {
    const { d, lx, ly } = edgeGeometry(edge);
    const cls = edge.win ? "win" : edge.repair ? "repair" : `r-${edge.role}`;
    return `<path class="ghost" d="${d}"></path><path class="redge ${cls} hidden" data-edge="${i}" d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#arrow)"></path>`
      + (edge.label ? `<text class="rlabel ${edge.repair ? "repair" : ""} hidden" data-edge-label="${i}" x="${lx}" y="${ly}">${edge.label}</text>` : "")
      + `<circle class="packet r-${edge.win ? "ok" : edge.role}" data-packet="${i}" r="5" cx="0" cy="0" opacity="0"></circle>`;
  }).join("");
  document.getElementById("viewport").innerHTML =
    `<g>${bandMarkup()}</g><g>${edgeMarkup}</g><g>${nodes.map(nodeMarkup).join("")}</g>`;
  nodes.forEach(n => {
    n.el = document.querySelector(`[data-node="${CSS.escape(n.id)}"]`);
    n.lineEl = n.el.querySelector("[data-line]");
    n.progressEl = n.el.querySelector("[data-progress]");
    n.trackEl = n.el.querySelector("[data-track]");
    n.shown = null;
  });
  edges.forEach((e, i) => {
    e.el = document.querySelector(`[data-edge="${i}"]`);
    e.labelEl = document.querySelector(`[data-edge-label="${i}"]`);
    e.packetEl = document.querySelector(`[data-packet="${i}"]`);
    e.length = e.el.getTotalLength?.() || 0;
  });
}

// Packets travel along an edge for this many seconds of wall-clock time.
const PACKET_SECONDS = 0.9;

function updateGraph(t) {
  for (const node of nodes) {
    const state = nodeState(node, t);
    const key = `${state.phase}|${state.status}|${state.line}`;
    if (key !== node.shown) {
      node.shown = key;
      node.el.setAttribute("class", `rnode ${node.kind} r-${node.role || "captain"} ${state.phase}${state.phase === "done" ? ` s-${state.status}` : ""}`);
      node.lineEl.textContent = state.line || "";
      node.lineEl.setAttribute("class", `t2 status s-${state.status}`);
    }
    const showBar = state.phase === "running" && state.progress != null;
    node.trackEl.style.display = showBar ? "" : "none";
    node.progressEl.style.display = showBar ? "" : "none";
    if (showBar) node.progressEl.setAttribute("width", Math.max(0, Math.min(1, state.progress)) * (node.w - 20));
    node.state = state;
  }
  const packetSpan = PACKET_SECONDS * speed;
  for (const edge of edges) {
    const visible = t >= edge.to.start;
    edge.el.classList.toggle("hidden", !visible);
    edge.el.setAttribute("stroke-dashoffset", visible ? 0 : 1);
    edge.labelEl?.classList.toggle("hidden", !visible);
    const since = t - edge.to.start;
    const moving = !reducedMotion && playing && since >= 0 && since < packetSpan && edge.length;
    if (moving) {
      const point = edge.el.getPointAtLength(since / packetSpan * edge.length);
      edge.packetEl.setAttribute("cx", point.x);
      edge.packetEl.setAttribute("cy", point.y);
      edge.packetEl.setAttribute("opacity", 1);
    } else {
      edge.packetEl.setAttribute("opacity", 0);
    }
  }
}

// Narration ---------------------------------------------------------------------------

function describe(step) {
  const who = step.lemma == null ? null
    : isJob(jobOf(step)) ? `AIProver job ${jobNumber(jobOf(step))} on ${step.lemma}` : `Solver ${step.worker} on ${step.lemma}`;
  if (step.kind === "model_call") {
    const call = step;
    const started = [callStart(call)];
    if (call.role === "auditor") return { t: started[0], role: "auditor", title: "Captain delegates a blind read-back",
      text: "The auditor receives only the Lean code and the auditor playbook, never the source, and states what the code literally asserts." };
    if (/^formalize/.test(call.label)) return { t: started[0], role: "captain", title: "Captain formalizes the statement",
      text: "The captain writes Lean definitions for the setting and a theorem statement whose proof is left as sorry." };
    if (/^judge/.test(call.label)) return { t: started[0], role: "captain", title: "Captain judges faithfulness",
      text: "The captain compares the auditor's read-back with the source statement: does the Lean code say exactly what the source says?" };
    if (/^sketch/.test(call.label)) return { t: started[0], role: "captain", title: "Captain sketches the proof",
      text: "The captain splits the proof into lemmas, each stated in full but left as sorry, and proves the main theorem from them." };
    if (isJob(call)) return { t: started[0], role: "solver", title: who,
      text: `AIProver runs ${plural((call.samples || []).length || (cfg.workers ?? 1), "independent agentic Lean session")} on the lemma; ${jobSummary(call)}.` };
    if (call.lemma != null) return { t: started[0], role: "solver", title: `${who}, round ${call.round}`,
      text: call.round === 0 ? "The solver proposes a proof of the lemma from its statement, the definitions and the informal proof."
        : "The solver receives its previous proof with Lean's error messages and proposes a repair." };
  }
  if (step.kind === "lean_check") {
    if (step.lemma != null) {
      const call = callOfCheck.get(step.index);
      const late = call && solverOutcome(call).state === "late";
      const job = jobOf(step);
      return { t: step.elapsed_seconds, role: "lean",
        title: job ? `Lean checks ${step.lemma} (AIProver job ${jobNumber(job)}, sample ${step.worker})`
          : `Lean checks ${step.lemma} (solver ${step.worker}, r${step.round})`,
        text: late ? "This chain replied after the lemma was already proved; its result is discarded."
          : step.ok ? "The proof compiles."
          : job ? `Lean reports ${plural(step.errors.length, "error")} in the proof extracted from this sample.`
          : `Lean reports ${plural(step.errors.length, "error")}; they are sent back to the solver.` };
    }
    if (step.stage === "assemble") return { t: step.elapsed_seconds, role: "lean", title: "Lean compiles the assembled solution",
      text: `The kept proofs replace every sorry in the sketch. ${step.ok ? "The complete file compiles" : "The file fails"}${step.sorry_warning ? "" : " with no sorry"}.` };
    return { t: step.elapsed_seconds, role: "lean", title: `Lean checks the ${step.label === "formalize" ? "formalization" : step.label}`,
      text: step.ok ? (step.label === "sketch" ? "The sketch compiles: the lemmas suffice to prove the theorem." : "The formalization compiles. The sorry placeholder is expected here.")
        : `Lean reports ${plural(step.errors.length, "error")}; they go back to the captain for repair.` };
  }
  if (step.event === "audit_verdict") return { t: step.elapsed_seconds, role: "captain", title: `Verdict: ${step.verdict}`,
    text: step.verdict === "FAITHFUL" ? "The read-back matches the source, so the formal statement is accepted." : "The formalization is sent back for revision." };
  if (step.event === "sketch_accepted") return { t: step.elapsed_seconds, role: "captain", title: `${plural((step.lemmas || []).length, "lemma")} delegated`,
    text: jobsByLemma.size
      ? `Each lemma goes to an AIProver job of ${plural(cfg.workers ?? 1, "sample")}; the first sample whose proof compiles is kept.`
      : `Each lemma goes to ${cfg.workers ?? "several"} independent solver chains running in parallel; the first proof that compiles is kept.` };
  if (step.event === "lemma_proved") return { t: step.elapsed_seconds, role: "solver", title: `${step.lemma} proved`,
    text: jobOf(step) ? `The proof from ${winnerText(step)} is kept.`
      : `Solver ${step.worker}'s round-${step.round} proof is kept. The other chains on this lemma stop.` };
  if (step.event === "final_verification") return { t: step.elapsed_seconds, role: "lean", title: step.checks?.verified ? "Verified" : "Verification failed",
    text: step.checks?.verified ? `The solution compiles without sorry, uses only ${(step.checks.axioms || []).join(", ")}, and its type equals the audited theorem.` : "One or more final checks failed." };
  if (step.event === "replan") return { t: step.elapsed_seconds, role: "captain", title: "Captain revises the sketch",
    text: "Some lemmas were not proved within budget; the captain writes a new decomposition." };
  return null;
}

const events = [{ t: 0, role: "decision", title: "The run begins",
  text: "The captain receives the informal statement and proof. Everything below follows from this input.", step: null }];
for (const step of steps) {
  const entry = describe(step);
  if (entry) events.push({ ...entry, step });
}
const solverStart = e => e.step?.kind === "model_call" && e.step.lemma != null ? 1 : 0;
events.sort((a, b) => a.t - b.t || solverStart(a) - solverStart(b) || (a.step?.index ?? -1) - (b.step?.index ?? -1));

function renderLog() {
  document.getElementById("log").innerHTML = events.map((e, i) =>
    `<button type="button" data-event="${i}"><span class="t">${formatClock(e.t)}</span><span class="dot ${e.role}"></span><span>${escapeHTML(e.title)}</span></button>`).join("");
}

let shownEvent = -1;
function updateNarration(t) {
  let current = 0;
  for (let i = 0; i < events.length; i++) if (events[i].t <= t) current = i;
  if (current === shownEvent) return;
  shownEvent = current;
  const e = events[current];
  document.getElementById("narration-title").textContent = e.title;
  document.getElementById("narration-text").textContent = e.text;
  const band = [...BANDS].reverse().find(b => b.start <= t);
  document.getElementById("phase-name").textContent = band ? band.name : "";
  document.querySelectorAll("#phases span").forEach(s => s.classList.toggle("on", s.textContent === band?.name));
  const buttons = document.querySelectorAll("#log button");
  buttons.forEach((b, i) => b.className = i < current ? "past" : i === current ? "now" : "future");
  buttons[current]?.scrollIntoView({ block: "nearest" });
}

// Camera ------------------------------------------------------------------------------

const view = { x: 0, y: 0, k: 1 };
let follow = true;

function applyView() {
  document.getElementById("viewport").setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
}

function frameFor(list, maxZoom = 1) {
  const stage = document.getElementById("stage").getBoundingClientRect();
  const minX = Math.min(...list.map(n => n.x - n.w / 2)) - 40, maxX = Math.max(...list.map(n => n.x + n.w / 2)) + 40;
  const minY = Math.min(...list.map(n => n.y - n.h / 2)) - 70, maxY = Math.max(...list.map(n => n.y + n.h / 2)) + 50;
  const k = Math.max(0.12, Math.min(maxZoom, stage.width / (maxX - minX), stage.height / (maxY - minY)));
  return { k, x: stage.width / 2 - (minX + maxX) / 2 * k, y: stage.height / 2 - (minY + maxY) / 2 * k };
}

// Nodes the camera keeps in view: those active now, plus the most recent finishers.
function focusNodes(t) {
  const visible = nodes.filter(n => t >= n.start);
  const active = visible.filter(n => n.state?.phase === "running" || n.state?.phase === "compiling");
  const recent = [...visible].sort((a, b) => b.end - a.end).slice(0, active.length ? 1 : 2);
  const list = [...new Set([...active, ...recent])];
  return list.length ? list : [nodes[0]];
}

function updateCamera(t, instant = false) {
  if (!follow) return;
  const target = frameFor(focusNodes(t), 1);
  const rate = instant || reducedMotion ? 1 : 0.07;
  view.x += (target.x - view.x) * rate;
  view.y += (target.y - view.y) * rate;
  view.k += (target.k - view.k) * rate;
  applyView();
}

function setFollow(on) {
  follow = on;
  document.getElementById("follow").setAttribute("aria-pressed", on);
}

function installPanZoom() {
  const stage = document.getElementById("stage");
  const pointers = new Map();
  let drag = null, pinch = null;
  const local = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const zoomAt = (factor, px, py) => {
    const k = Math.min(2.5, Math.max(0.12, view.k * factor));
    view.x = px - (px - view.x) * (k / view.k);
    view.y = py - (py - view.y) * (k / view.k);
    view.k = k;
    applyView();
  };
  stage.addEventListener("wheel", event => {
    event.preventDefault();
    setFollow(false);
    const [px, py] = local(event);
    zoomAt(Math.exp(-event.deltaY * (event.ctrlKey ? 0.01 : 0.0015)), px, py);
  }, { passive: false });
  stage.addEventListener("pointerdown", event => {
    if (event.target.closest(".stage-tools")) return;
    pointers.set(event.pointerId, local(event));
    if (pointers.size === 1) drag = { start: local(event), origin: { x: view.x, y: view.y }, moved: false, target: event.target };
    else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { distance: Math.hypot(a[0] - b[0], a[1] - b[1]), k: view.k };
      drag = null;
    }
  });
  stage.addEventListener("pointermove", event => {
    if (!pointers.has(event.pointerId)) return;
    pointers.set(event.pointerId, local(event));
    if (pinch && pointers.size === 2) {
      setFollow(false);
      const [a, b] = [...pointers.values()];
      zoomAt(pinch.k * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.distance / view.k, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      return;
    }
    if (!drag) return;
    const [x, y] = local(event);
    const dx = x - drag.start[0], dy = y - drag.start[1];
    if (!drag.moved && Math.hypot(dx, dy) > 4) {
      drag.moved = true;
      setFollow(false);
      stage.classList.add("dragging");
      stage.setPointerCapture(event.pointerId);
    }
    if (drag.moved) {
      view.x = drag.origin.x + dx;
      view.y = drag.origin.y + dy;
      applyView();
    }
  });
  const end = event => {
    if (!pointers.has(event.pointerId)) return;
    pointers.delete(event.pointerId);
    if (pointers.size < 2) pinch = null;
    if (drag && !drag.moved && event.type === "pointerup") {
      const g = drag.target.closest?.("[data-node]");
      if (g) openNode(byId.get(g.dataset.node));
    }
    if (pointers.size === 0) { drag = null; stage.classList.remove("dragging"); }
  };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);
}

// Node records ------------------------------------------------------------------------

function openNode(node) {
  if (!node || nodeState(node, time).phase === "hidden") return;
  pause();
  if (node.kind === "problem") {
    return showDrawer(summaryHead("Input problem", `<span><b>${escapeHTML(problem.uuid)}</b></span>`, "decision"),
      `<div class="tagblock"><span class="tagname">informal statement</span><div class="prose">${mathHTML(problem.informal_statement || "")}</div></div>
       <div class="tagblock"><span class="tagname">informal proof</span><div class="prose">${mathHTML(problem.informal_proof || "")}</div></div>`);
  }
  if (node.kind === "root") {
    return showDrawer(summaryHead("Captain", `<span>model <b>${escapeHTML(TRACE.models?.orchestrator)}</b></span>`, "captain"),
      `<p>The orchestrating model. It formalizes, judges, and plans the proof itself, and delegates the
       read-back to the auditor and each lemma to ${cfg.workers ?? "several"} parallel solvers.</p>
       ${stepList(callsByRole("captain"))}`);
  }
  if (node.kind === "lemma") {
    const statement = (finalSketch?.lemmas || []).find(l => lemmaName(l) === node.lemma);
    return showDrawer(summaryHead(`<code>${escapeHTML(node.lemma)}</code>`, `<span>${plural(calls.filter(c => c.lemma === node.lemma).length, "solver call")}</span>`, "solver"),
      `${statement ? `<div class="tagblock"><span class="tagname">statement</span>${leanHTML(statement)}</div>` : ""}
       ${node.win ? `<div class="tagblock"><span class="tagname">kept proof · ${winnerText(node.win)}</span>${leanHTML(node.win.proof || "")}</div>` : ""}
       ${stepList(steps.filter(s => s.lemma === node.lemma))}`);
  }
  if (node.kind === "final") {
    return showDrawer(summaryHead("Verified Lean proof", `<span>axioms <b>${escapeHTML((node.step.checks?.axioms || []).join(", "))}</b></span>`, "lean"),
      `<table class="kv">${Object.entries(node.step.checks || {}).filter(([, v]) => typeof v === "boolean")
        .map(([k, v]) => `<tr><td class="num">${k}</td><td>${v ? `<span class="pill ok">pass</span>` : `<span class="pill fail">fail</span>`}</td></tr>`).join("")}</table>
       ${leanHTML(node.step.solution || "", new Set(), "tall")}`);
  }
  if (node.step) showStep(node.step.index, node.sample ?? null);
}

// Export ------------------------------------------------------------------------------
// Renders the completed tree (state at the end of the run) to a JPEG. Styles are
// inlined from the live page because an SVG drawn into a canvas sees no CSS.

const EXPORT_STYLES = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-dasharray",
  "stroke-dashoffset", "stroke-opacity", "opacity", "font-family", "font-size", "font-weight",
  "letter-spacing", "display", "visibility", "paint-order", "stroke-linejoin"];
const EXPORT_SCALE = 2;

function finalTreeSVG() {
  const svg = document.getElementById("graph");
  svg.classList.add("exporting");
  updateGraph(runEnd);
  const clone = svg.cloneNode(true);
  const sources = [svg, ...svg.querySelectorAll("*")];
  const targets = [clone, ...clone.querySelectorAll("*")];
  sources.forEach((source, i) => {
    const computed = getComputedStyle(source);
    targets[i].setAttribute("style", EXPORT_STYLES.map(name => `${name}:${computed.getPropertyValue(name)}`).join(";"));
    targets[i].removeAttribute("class");
  });
  clone.querySelectorAll("[data-packet], [data-track], [data-progress]").forEach(el => el.remove());
  svg.classList.remove("exporting");
  updateGraph(time);

  // Frame every node and phase label, with a header line above the tree.
  const padding = 40, header = 70;
  const minX = Math.min(...nodes.map(n => n.x - n.w / 2)) - 150;
  const maxX = Math.max(...nodes.map(n => n.x + n.w / 2));
  const minY = Math.min(...nodes.map(n => n.y - n.h / 2));
  const maxY = Math.max(...nodes.map(n => n.y + n.h / 2));
  const width = maxX - minX + 2 * padding, height = maxY - minY + 2 * padding + header;
  const root = getComputedStyle(document.documentElement);
  const color = name => root.getPropertyValue(name).trim();
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  clone.setAttribute("width", width);
  clone.setAttribute("height", height);
  clone.setAttribute("viewBox", `0 0 ${width} ${height}`);
  clone.querySelector("#viewport").setAttribute("transform", `translate(${padding - minX},${padding + header - minY})`);
  const verified = outcome.checks?.verified;
  const font = getComputedStyle(document.body).fontFamily.replace(/"/g, "'");
  clone.insertAdjacentHTML("afterbegin", `
    <rect width="${width}" height="${height}" style="fill:${color("--bg")}"></rect>
    <text x="${padding}" y="${padding + 8}" style="font-family:${font};font-size:22px;font-weight:600;fill:${color("--ink")}">${escapeHTML(TRACE.theorem_name)}</text>
    <text x="${padding}" y="${padding + 34}" style="font-family:${font};font-size:14px;fill:${color("--muted")}">${escapeHTML(`${TRACE.run_id} · ${verified ? "proved, verified" : outcome.status || "incomplete"} · ${formatDuration(outcome.wall_seconds || runEnd)} · ${TRACE.models?.orchestrator} + ${TRACE.models?.worker}`)}</text>`);
  return { markup: new XMLSerializer().serializeToString(clone), width, height, background: color("--bg") };
}

function svgToJPEG({ markup, width, height, background }) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([markup], { type: "image/svg+xml;charset=utf-8" }));
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = width * EXPORT_SCALE;
      canvas.height = height * EXPORT_SCALE;
      const context = canvas.getContext("2d");
      context.fillStyle = background;   // JPEG has no transparency
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.scale(EXPORT_SCALE, EXPORT_SCALE);
      context.drawImage(image, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("The browser could not encode the image.")), "image/jpeg", 0.92);
    };
    image.onerror = () => { URL.revokeObjectURL(url); reject(new Error("The browser could not render the tree.")); };
    image.src = url;
  });
}

// In a published artifact the `downloads` capability asks the viewer to confirm;
// opened as a local file, a plain download link does the same job.
async function saveFile(blob, filename) {
  const downloads = window.claude?.use ? await window.claude.use("downloads") : null;
  if (downloads) return downloads.save({ filename, data: blob });
  const url = URL.createObjectURL(blob);
  const link = Object.assign(document.createElement("a"), { href: url, download: filename });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return { status: "saved" };
}

async function exportTree() {
  const button = document.getElementById("export");
  const status = document.getElementById("export-status");
  const report = text => { status.textContent = text; status.hidden = !text; };
  pause();
  button.disabled = true;
  report("Rendering the final tree…");
  try {
    const blob = await svgToJPEG(finalTreeSVG());
    const result = await saveFile(blob, `${TRACE.run_id}_orchestration_tree.jpg`);
    report(result.status === "saved" ? `Saved ${TRACE.run_id}_orchestration_tree.jpg` : "");
  } catch (error) {
    const messages = { declined: "Export cancelled.", rate_limited: "A save prompt is already open.",
      unavailable: "Saving files is not available in this view." };
    report(messages[error?.code] || error?.message || "Export failed.");
  } finally {
    button.disabled = false;
    setTimeout(() => report(""), 4000);
  }
}

// Playback ------------------------------------------------------------------------------

let time = 0, playing = false, speed = 15, lastFrame = null;

function setTime(t, instantCamera = false) {
  time = Math.max(0, Math.min(runEnd, t));
  updateGraph(time);
  updateNarration(time);
  updateCamera(time, instantCamera);
  document.getElementById("scrub").value = Math.round(time / runEnd * 1000);
  document.getElementById("clock").textContent = `${formatClock(time)} / ${formatClock(runEnd)}`;
}

function frame(now) {
  if (lastFrame !== null && playing) {
    setTime(time + (now - lastFrame) / 1000 * speed);
    if (time >= runEnd) pause();
  } else if (!playing) {
    updateCamera(time);
  }
  lastFrame = now;
  requestAnimationFrame(frame);
}

function play() {
  if (time >= runEnd) setTime(0, true);
  playing = true;
  document.getElementById("play").textContent = "❚❚ Pause";
}
function pause() {
  playing = false;
  document.getElementById("play").textContent = time >= runEnd ? "↺ Replay" : "▶ Play";
  updateGraph(time);
}

function jumpEvent(direction) {
  const index = direction > 0
    ? events.findIndex(e => e.t > time + 0.01)
    : events.map(e => e.t).findLastIndex(t => t < time - 0.01);
  if (index >= 0) setTime(events[index].t + (direction > 0 ? 0.01 : 0), false);
  else if (direction > 0) setTime(runEnd);
  else setTime(0);
}

function init() {
  renderHeader();
  installDrawerHandlers();
  renderGraph();
  renderLog();
  document.getElementById("phases").innerHTML = BANDS.map(b => `<span>${b.name}</span>`).join("");
  installPanZoom();

  document.getElementById("play").addEventListener("click", () => playing ? pause() : play());
  document.getElementById("prev-event").addEventListener("click", () => jumpEvent(-1));
  document.getElementById("next-event").addEventListener("click", () => jumpEvent(1));
  document.getElementById("scrub").addEventListener("input", event => setTime(Number(event.target.value) / 1000 * runEnd));
  document.getElementById("speed").addEventListener("change", event => { speed = Number(event.target.value); });
  document.getElementById("follow").addEventListener("click", () => setFollow(!follow));
  document.getElementById("export").addEventListener("click", exportTree);
  document.getElementById("fit").addEventListener("click", () => {
    setFollow(false);
    Object.assign(view, frameFor(nodes, 1));
    applyView();
  });
  document.getElementById("log").addEventListener("click", event => {
    const button = event.target.closest("[data-event]");
    if (button) setTime(events[Number(button.dataset.event)].t + 0.01);
  });
  document.addEventListener("keydown", event => {
    if (drawerOpen || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target.closest?.("input, select")) return;
    const node = event.target.closest?.("[data-node]");
    if (node && event.key === "Enter") return openNode(byId.get(node.dataset.node));
    if (event.key === " ") { event.preventDefault(); playing ? pause() : play(); }
    else if (event.key === "ArrowRight") jumpEvent(1);
    else if (event.key === "ArrowLeft") jumpEvent(-1);
    else if (event.key === "f") setFollow(!follow);
  });

  // Opening frame: the whole orchestration, so the reader sees its shape before playing.
  Object.assign(view, frameFor(nodes, 1));
  applyView();
  setFollow(false);
  setTime(0);
  requestAnimationFrame(frame);
  document.getElementById("play").addEventListener("click", () => setFollow(true), { once: true });
}

init();
</script>
